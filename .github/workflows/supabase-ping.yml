name: Ping Supabase
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Reveiller le projet
        env:
          URL: https://ioqjkssonvrxzymicmlz.supabase.co
          KEY: sb_publishable_N8nnjn5EIZffCKRCcpUASw_dLc0DX6w
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          cat body.txt
          test "$code" = "200"

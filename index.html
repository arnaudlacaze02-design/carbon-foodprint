/* ==================== défis ====================
   Trois types, tous calculés par l'app à partir des données locales puis
   publiés par le participant. Le score est donc déclaratif : c'est le client
   qui écrit ses propres repas, aucun classement ici n'est infalsifiable.
   Assumé comme émulation entre gens qui se connaissent. */

const CHAL = {
  points:     {l:'Le plus de points',  s:'Points de trophée gagnés pendant la période',
               u:'pts', sens:'max'},
  sans_rouge: {l:'Le plus de repas sans viande rouge',
               s:'Part des repas principaux sans bœuf, veau, merguez, cheeseburger ni kebab',
               u:'%',   sens:'max'},
  budget2050: {l:'Le plus proche du budget 2050',
               s:'Total de la période comparé à 1,92 kg par jour écoulé — ni au-dessus, ni en dessous',
               u:'kg',  sens:'proche'},
};
const CHAL_DUREE = [[7,'7 jours'],[14,'2 semaines'],[30,'30 jours']];

/* Mesure locale. On ne compte jamais les jours à venir : la période court,
   la mesure s'arrête à aujourd'hui. */
function chalScore(ch){
  const t = today();
  const fin = ch.ends < t ? ch.ends : t;
  if(fin < ch.starts) return {value:0, meals:0, days:0};
  const days = Math.round((new Date(fin+'T12:00') - new Date(ch.starts+'T12:00')) / 864e5) + 1;
  const es = S.hist.filter(x => x.d >= ch.starts && x.d <= fin);
  if(ch.kind === 'points'){
    const v = scoring().ev.filter(x => x.d >= ch.starts && x.d <= fin).reduce((a,x) => a + x.p, 0);
    return {value:v, meals:es.length, days};
  }
  if(ch.kind === 'sans_rouge'){
    const mains = es.filter(x => x.m === 'dej' || x.m === 'din');
    const sans = mains.filter(x => !hasRed(x)).length;
    return {value: mains.length ? sans / mains.length : 0, meals:mains.length, days};
  }
  return {value: es.reduce((a,x) => a + kgOf(x.l), 0), meals:es.length, days};
}

/* Clé de tri. Pour « le plus proche », l'écart absolu à la cible du jour —
   ce qui a une vertu rare : ne rien saisir affiche zéro, donc un écart maximal.
   Ne pas jouer devient perdant. */
const chalKey = (kind, s) => kind === 'budget2050'
  ? Math.abs((+s.value) - BUDGET_J * (s.days || 1))
  : -(+s.value);

const CHAL_MIN = {points:0, sans_rouge:4, budget2050:0};   /* repas requis pour être classé */

function chalFmt(kind, s){
  if(kind === 'points')     return n0(s.value) + ' pts';
  if(kind === 'sans_rouge') return Math.round(s.value * 100) + ' %';
  const cible = BUDGET_J * (s.days || 1);
  const d = (+s.value) - cible;
  return n1(s.value) + ' kg · ' + (d >= 0 ? '+' : '−') + n1(Math.abs(d));
}

/* Longueur de barre.

   L'ancienne version normalisait entre le meilleur et le pire : le premier
   était toujours au plein, le dernier toujours à 28 %, quel que soit l'écart
   réel. À deux joueurs, 96 % contre 100 % s'affichait comme 28 contre 100 —
   un gouffre visuel pour quatre points d'écart. La barre disait le classement
   en prétendant dire la performance.

   Elle mesure désormais la valeur elle-même, sur une échelle absolue et
   comparable d'un joueur à l'autre. */
function chalBars(kind, rows){
  if(kind === 'sans_rouge')
    return rows.map(r => r.ok ? Math.max(3, Math.round(r.value * 100)) : 6);

  if(kind === 'points'){
    const max = Math.max(1, ...rows.filter(r => r.ok).map(r => +r.value));
    return rows.map(r => r.ok ? Math.max(3, Math.round(r.value / max * 100)) : 6);
  }

  /* Budget 2050 : la barre mesure la proximité de la cible — pleine quand on
     tombe juste, vide à un budget entier d'écart, au-dessus comme en dessous. */
  return rows.map(r => {
    if(!r.ok) return 6;
    const cible = BUDGET_J * (r.days || 1);
    return Math.max(3, Math.round(100 - Math.min(1, Math.abs(r.value - cible) / cible) * 100));
  });
}

/* Le détail qui lève l'ambiguïté : un pourcentage seul ne dit pas sur combien
   de repas il porte, et deux personnes ayant le même nombre de repas sans
   viande rouge n'ont pas le même score si l'une en a saisi davantage. */
function chalDetail(kind, s){
  if(kind !== 'sans_rouge') return s.meals + ' repas';
  return Math.round(s.value * s.meals) + ' sur ' + s.meals + ' repas principaux';
}

async function chalLoad(silent){
  if(!SESS || !SB.ready()) return;
  const c = await SB.rest('challenges?select=id,kind,label,starts,ends,created_by,' +
    'aut:profiles!challenges_created_by_fkey(username)&order=ends.desc&limit=20');
  if(!c.ok){ if(!silent) toast('Défis indisponibles'); S.chal = null; return renderFeed(); }
  const list = c.body || [];
  if(!list.length){ S.chal = []; alerteDefis(); return renderFeed(); }
  const ids = list.map(x => x.id);
  const inList = 'in.(' + ids.join(',') + ')';
  const [pp, ss] = await Promise.all([
    SB.rest('challenge_participants?select=challenge,member,status,' +
      'who:profiles!challenge_participants_member_fkey(username)&challenge=' + inList),
    SB.rest('challenge_scores?select=challenge,member,value,meals,days&challenge=' + inList),
  ]);
  const parts = pp.ok ? (pp.body || []) : [];
  const scores = ss.ok ? (ss.body || []) : [];
  S.chal = list.map(ch => ({...ch,
    parts:  parts.filter(x => x.challenge === ch.id),
    scores: scores.filter(x => x.challenge === ch.id)}));
  await chalPublish();
  alerteDefis();
  paintAlertes();
  renderFeed();
}

/* Publication silencieuse de mon score, à chaque passage sur le feed : le
   classement doit être frais sans demander un geste. */
async function chalPublish(){
  if(!S.chal) return;
  const t = today();
  for(const ch of S.chal){
    const moi = ch.parts.find(x => x.member === SESS.uid);
    if(!moi || moi.status !== 'in') continue;
    if(ch.starts > t) continue;
    const sc = chalScore(ch);
    const ancien = ch.scores.find(x => x.member === SESS.uid);
    if(ancien && Math.abs((+ancien.value) - sc.value) < 1e-6 && ancien.days === sc.days) continue;
    await SB.rest('challenge_scores?on_conflict=challenge,member', {method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({challenge:ch.id, member:SESS.uid, value:+sc.value.toFixed(4),
                            meals:sc.meals, days:sc.days, db_version:'ademe-3.2'})});
    if(ancien) Object.assign(ancien, sc); else ch.scores.push({challenge:ch.id, member:SESS.uid, ...sc});
  }
}

function chalRows(ch){
  const rows = ch.parts.filter(x => x.status === 'in').map(x => {
    const sc = ch.scores.find(y => y.member === x.member) || {value:0, meals:0, days:0};
    return {member:x.member, nom:(x.who||{}).username || '?', value:+sc.value, meals:sc.meals,
            days:sc.days, ok:(sc.meals || 0) >= CHAL_MIN[ch.kind] && (sc.days || 0) > 0};
  });
  rows.sort((a,b) => (a.ok === b.ok) ? chalKey(ch.kind, a) - chalKey(ch.kind, b) : (a.ok ? -1 : 1));
  return rows;
}

function chalNeon(ch){
  const rows = chalRows(ch), bars = chalBars(ch.kind, rows);
  const t = today();
  const reste = Math.round((new Date(ch.ends+'T12:00') - new Date(t+'T12:00')) / 864e5);
  const def = CHAL[ch.kind];
  return `<div class="neon" data-chal="${ch.id}">
    <div class="glow"></div>
    <div class="tt">Défi en cours · ${reste > 0 ? `${reste} jour${reste>1?'s':''} restant${reste>1?'s':''}`
      : reste === 0 ? 'dernier jour' : 'terminé'}</div>
    <div class="nh">${esc(ch.label || def.l)}</div>
    <div class="sub">${esc(def.l)} · du ${dLabel(ch.starts)} au ${dLabel(ch.ends)}</div>
    <div class="lad">
      ${rows.map((r,i) => `
        <div class="rung ${r.member === SESS.uid ? 'me' : ''}${r.ok ? '' : ' wait'}">
          <span class="pos">${r.ok ? i+1 : '–'}</span>
          <span class="who">${esc(r.nom)}</span>
          <span class="tr"><i style="width:${bars[i]}%"></i></span>
          <span class="val">${r.ok ? chalFmt(ch.kind, r) : 'en attente'}</span>
        </div>`).join('')}
      ${rows.length ? '' : `<div class="sub">Aucun participant n’a encore accepté.</div>`}
    </div>
    <div class="foot">${esc(def.s)}${rows.some(r => !r.ok)
      ? ` · « en attente » : moins de ${CHAL_MIN[ch.kind]} repas principaux saisis sur la période.` : ''}</div>
  </div>`;
}

function chalCreate(){
  const amis = S.fr.friends.map(x => ({
    id: x.requester === SESS.uid ? x.addressee : x.requester,
    nom: frAutre(x).username}));
  if(!amis.length) return toast('Il faut au moins un ami accepté');
  S.chalQ = S.chalQ || {kind:'budget2050', jours:14, invites:amis.map(a => a.id)};
  const q = S.chalQ;
  openSheet(`
    <div class="unit">Nouveau défi</div>
    <h3 style="margin:2px 0 10px">Lequel ?</h3>
    ${Object.entries(CHAL).map(([k,v]) => `
      <button class="qopt" data-k="${k}" aria-pressed="${q.kind === k}">
        <span class="qn">${v.l}<span class="qs">${v.s}</span></span><span class="qk">✓</span>
      </button>`).join('')}
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:6px">Durée</div>
    <div class="seg">${CHAL_DUREE.map(([j,l]) =>
      `<button data-j="${j}" aria-pressed="${q.jours === j}">${l}</button>`).join('')}</div>
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:6px">Inviter · ${q.invites.length} sur ${amis.length}</div>
    ${amis.map(a => `
      <button class="qopt" data-inv="${a.id}" aria-pressed="${q.invites.includes(a.id)}">
        <span class="qn">${esc(a.nom)}</span><span class="qk">✓</span>
      </button>`).join('')}
    <div class="actions" style="margin-top:14px">
      <button class="btn btn-1" id="ch_go" ${q.invites.length ? '' : 'disabled'}>Lancer le défi</button>
      <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
    </div>
    <div class="src" style="margin-top:8px">Chaque invité décide s’il participe. Les scores sont calculés
      par l’app depuis vos saisies : entre gens qui se connaissent, personne ne vérifie.</div>`);

  $('#sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { q.kind = b.dataset.k; chalCreate(); });
  $('#sheet').querySelectorAll('[data-j]').forEach(b => b.onclick = () => { q.jours = +b.dataset.j; chalCreate(); });
  $('#sheet').querySelectorAll('[data-inv]').forEach(b => b.onclick = () => {
    const id = b.dataset.inv;
    q.invites = q.invites.includes(id) ? q.invites.filter(x => x !== id) : q.invites.concat(id);
    chalCreate();
  });
  const go = $('#ch_go');
  if(go) go.onclick = async () => {
    go.disabled = true; go.textContent = 'Création…';
    const fin = new Date(); fin.setDate(fin.getDate() + q.jours - 1);
    const c = await SB.rest('challenges?select=id', {method:'POST',
      headers:{Prefer:'return=representation'},
      body: JSON.stringify({kind:q.kind, label:CHAL[q.kind].l, starts:today(), ends:iso(fin),
                            created_by:(await SB.uid()) || SESS.uid})});
    if(!c.ok || !c.body || !c.body.length){
      console.error('chalCreate:', c.status, JSON.stringify(c.body || {}));
      go.disabled = false; go.textContent = 'Lancer le défi';
      const msg = JSON.stringify(c.body || {});
      return toast(/PGRST205|schema cache/i.test(msg)
        ? 'Table des défis absente : schéma non installé'
        : 'Création impossible · ' + c.status);
    }
    const id = c.body[0].id;
    const lignes = [{challenge:id, member:SESS.uid, status:'in', invited_by:SESS.uid}]
      .concat(q.invites.map(m => ({challenge:id, member:m, status:'invited', invited_by:SESS.uid})));
    const r = await SB.rest('challenge_participants', {method:'POST',
      headers:{Prefer:'return=minimal'}, body: JSON.stringify(lignes)});
    closeSheet();
    S.chalQ = null;
    toast(r.ok ? `Défi lancé, ${q.invites.length} invitation${q.invites.length>1?'s':''} envoyée${q.invites.length>1?'s':''}`
               : 'Défi créé mais invitations non envoyées');
    await chalLoad(true);
  };
}

async function chalAnswer(ch, statut){
  const r = await SB.rest('challenge_participants?challenge=eq.' + ch.id +
    '&member=eq.' + SESS.uid, {method:'PATCH', body: JSON.stringify({status:statut})});
  if(!r.ok) return toast('Impossible pour l’instant');
  toast(statut === 'in' ? 'Vous participez' : 'Invitation déclinée');
  await chalLoad(true);
}

async function chalDrop(ch){
  const r = await SB.rest('challenges?id=eq.' + ch.id, {method:'DELETE'});
  if(!r.ok) return toast('Impossible pour l’instant');
  toast('Défi supprimé'); await chalLoad(true);
}

/* ==================== rendu du feed ====================
   Trois sections, comme le tracker. La version précédente empilait tout sur une
   seule page : recherche, demandes, amis, puis — tout en bas et seulement s'il y
   en avait déjà — les publications. Rien n'indiquait donc où regarder tant que
   rien n'avait été partagé, ce qui faisait passer un partage réussi pour une
   panne. */
const FEED_TABS = [['actu','Actu'], ['defis','Défis'], ['amis','Amis']];

/* Un lien tapé dans une recette doit être cliquable sans devenir un vecteur
   d'injection : on échappe d'abord, on transforme ensuite. */
function lien(txt){
  return esc(txt).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)"']/g, u =>
    `<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${
      u.replace(/^https?:\/\/(www\.)?/, '')}</a>`);
}

const recLines = v => (Array.isArray(v) ? v : String(v || '').split('\n'))
  .map(x => String(x).trim()).filter(Boolean);

/* Depuis que les ingrédients sont choisis dans la base, `ing` est une liste de
   couples [slug, grammes] et la recette devient mesurable. Les publications
   antérieures portaient du texte libre : on les reconnaît à la forme et on les
   affiche sans chiffre plutôt que de les perdre. */
const recStruct = b => Array.isArray(b.ing) && b.ing.length && Array.isArray(b.ing[0]);
const recPers   = b => Math.max(1, Math.round(+b.pers || 1));
const recAutres = b => recLines(b.autres);
const recPrep   = b => recLines(b.prep && b.prep.length ? b.prep : b.text);
const recKg     = b => recStruct(b) ? kgOf(b.ing.filter(l => F.get(l[0]))) : null;

function recIng(b){
  if(recStruct(b)) return b.ing.filter(l => F.get(l[0]))
    .map(([s, g]) => ({slug:s, nom:F.get(s).n, g}));
  return recLines(b.ing).map(t => ({slug:null, nom:t, g:null}));
}

function pactBar(x){
  const l = likeList(x.id), mien = SESS && l.includes(SESS.uid), c = comList(x.id);
  const b = x.body || {};
  return `<div class="pact">
    <button class="pa${mien ? ' on' : ''}" data-like="${esc(x.id)}"
      aria-pressed="${!!mien}" aria-label="J’aime">${COEUR(mien)}${l.length ? `<b>${l.length}</b>` : ''}</button>
    <button class="pa" data-popen="${esc(x.id)}" data-ptab="com"
      aria-label="Commentaires">${BULLE}${c.length ? `<b>${c.length}</b>` : ''}</button>
    ${x.kind === 'recipe' && recStruct(b)
      ? `<button class="pa keep" data-psave="${esc(x.id)}">Enregistrer le plat</button>` : ''}
  </div>`;
}

/* Une publication occupe une carte entière, pas une ligne de liste : un badge
   décroché se regarde, il ne se survole pas. */
function postCard(x){
  const b = x.body || {}, moi = x.author === SESS.uid;
  const qui = moi ? (SESS.username || 'Vous') : ((x.aut || {}).username || '—');
  const quand = new Date(x.created_at).toLocaleDateString('fr-FR', {day:'numeric', month:'long'});
  const tete = `<div class="ph">
      <span class="av">${esc((qui[0] || '?').toUpperCase())}</span>
      <span class="pw"><b>${esc(qui)}</b><span>${quand}</span></span>
      ${moi ? `<button class="px" data-pdel="${esc(x.id)}" aria-label="Supprimer">×</button>` : ''}
    </div>`;

  if(x.kind === 'recipe'){
    const ing = recIng(b), prep = recPrep(b), autres = recAutres(b);
    const kg = recKg(b), pers = recPers(b);
    return `<div class="post">${tete}
      <button class="rcard" data-popen="${esc(x.id)}">
        <div class="band">
          <div class="k">Idée de recette${kg != null ? ` · ${n2(kg / pers)} kg CO₂e par personne` : ''}</div>
          <h4>${esc(b.title || 'Sans titre')}</h4>
        </div>
        <div class="rchips">
          ${recStruct(b)   ? `<span class="rchip">pour ${pers} personne${pers>1?'s':''}</span>` : ''}
          ${ing.length     ? `<span class="rchip">${ing.length} ingrédient${ing.length>1?'s':''}</span>` : ''}
          ${prep.length    ? `<span class="rchip">${prep.length} étape${prep.length>1?'s':''}</span>` : ''}
          ${autres.length  ? `<span class="rchip">+ ${autres.length} non mesuré${autres.length>1?'s':''}</span>` : ''}
          ${b.url          ? `<span class="rchip">source liée</span>` : ''}
        </div>
        <div class="rmore">Voir la recette ›</div>
      </button>
      ${pactBar(x)}
    </div>`;
  }

  const t = TROPHIES.find(y => y.s === b.key);
  return `<div class="post">${tete}
    <div class="stage">${t ? medal(t, t.need, 'p' + String(x.id).replace(/[^\w-]/g, ''))
      : `<div style="font-size:66px;line-height:1">${esc(b.emoji || '🏅')}</div>`}</div>
    <div class="cap">
      <h4>${t ? '' : esc(b.emoji || '🏅') + ' '}${esc(b.label || b.key || 'Badge')}</h4>
      <p>${esc(t ? t.d : 'Trophée décroché.')}</p>
    </div>
    ${pactBar(x)}
  </div>`;
}

function comBloc(x){
  const cs = comList(x.id);
  return `
    ${cs.length ? cs.map(c => {
      const nom = c.author === SESS.uid ? (SESS.username || 'Vous') : ((c.aut || {}).username || '—');
      const mien = c.author === SESS.uid || x.author === SESS.uid;
      return `<div class="cmt">
        <span class="av">${esc((nom[0] || '?').toUpperCase())}</span>
        <span class="bd"><b>${esc(nom)}</b><i>${new Date(c.created_at)
          .toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}</i>
          <p>${lien(c.body)}</p></span>
        ${mien ? `<button class="rm" data-cdel="${esc(c.id)}" aria-label="Supprimer">×</button>` : ''}
      </div>`; }).join('')
      : `<div class="empty">Aucun commentaire. Soyez le premier.</div>`}
    <textarea class="search" id="cm_t" rows="2" maxlength="800" style="font-family:inherit;resize:vertical;margin-top:12px"
      placeholder="Écrire un commentaire…"></textarea>
    <button class="btn btn-1" id="cm_go">Publier</button>`;
}

/* Fiche d'une publication. Pour une recette, trois onglets : on ne lit pas une
   liste de courses, une marche à suivre et une conversation de la même façon. */
function postOpen(id, tab){
  const x = (S.posts || []).find(y => y.id === id);
  if(!x) return;
  const b = x.body || {};
  if(tab) S.rtab = tab;
  const rec = x.kind === 'recipe';
  if(!rec) S.rtab = 'com';
  if(!['ing','prep','com'].includes(S.rtab)) S.rtab = 'ing';

  const peint = () => {
    const ing = recIng(b), prep = recPrep(b), autres = recAutres(b);
    const kg = recKg(b), pers = recPers(b);
    const qui = x.author === SESS.uid ? 'vous' : ((x.aut || {}).username || '—');
    const l = likeList(x.id), mien = l.includes(SESS.uid);
    const t = TROPHIES.find(y => y.s === b.key);

    openSheet(`
      <div class="unit">${rec ? 'Idée de recette' : 'Trophée partagé'} · ${esc(qui)}</div>
      <h3 style="margin:2px 0 3px">${esc(rec ? (b.title || 'Sans titre') : (b.label || b.key || 'Badge'))}</h3>
      ${rec
        ? `<div class="small mute">${kg != null
             ? `${n2(kg / pers)} kg CO₂e par personne · ${n2(kg)} kg pour ${pers}`
             : 'Recette en texte libre, antérieure aux ingrédients mesurés'}</div>`
        : (t ? `<div style="margin-top:12px">${medal(t, t.need, 'sh')}</div>
               <p class="small" style="margin-top:10px">${esc(t.d)}</p>` : '')}

      ${rec ? `<div class="rtabs">
        <button data-rt="ing"  aria-pressed="${S.rtab === 'ing'}">Ingrédients</button>
        <button data-rt="prep" aria-pressed="${S.rtab === 'prep'}">Préparation</button>
        <button data-rt="com"  aria-pressed="${S.rtab === 'com'}">Commentaires${
          comList(x.id).length ? ' · ' + comList(x.id).length : ''}</button>
      </div>` : `<div class="hr"></div>`}

      ${!rec || S.rtab === 'com' ? comBloc(x)
        : S.rtab === 'ing'
          ? (ing.length
              ? `<ul class="ring">${ing.map(g => `<li><span>${
                  g.g != null ? `<b style="font-family:var(--mono);font-size:12px">${g.g} g</b> · ` : ''
                }${lien(g.nom)}</span></li>`).join('')}</ul>
             ${autres.length ? `<div class="src" style="margin-top:12px"><b>Autres, non mesurés :</b>
               ${autres.map(a => esc(a)).join(' · ')}. Ils ne comptent pas dans l’empreinte affichée,
               qui est donc minorante.</div>` : ''}`
              : `<div class="empty">Aucun ingrédient renseigné.</div>`)
          : (prep.length
              ? prep.map((y, k) => `<div class="rstep"><span class="no">${k+1}</span><p>${lien(y)}</p></div>`).join('')
              : `<div class="empty">Aucune étape renseignée.</div>`)}

      ${b.url && S.rtab !== 'com' ? `<div class="src" style="margin-top:14px">Source : ${lien(b.url)}</div>` : ''}

      <div class="pact" style="margin-top:14px;border-top:1px solid var(--line-soft)">
        <button class="pa${mien ? ' on' : ''}" id="sh_like">${COEUR(mien)}${
          l.length ? `<b>${l.length}</b>` : ''}</button>
        ${rec && recStruct(b) ? `<button class="pa keep" id="sh_save">Enregistrer le plat</button>` : ''}
      </div>`);

    const sheet = $('#sheet');
    sheet.querySelectorAll('[data-rt]').forEach(btn =>
      btn.onclick = () => { S.rtab = btn.dataset.rt; peint(); });
    $('#sh_like').onclick = () => postLike(x.id, peint);
    const sv = $('#sh_save'); if(sv) sv.onclick = () => recSave(x.id);
    const cg = $('#cm_go');
    if(cg) cg.onclick = async () => {
      const el = $('#cm_t'), v = el.value;
      if(!v.trim()) return;
      cg.disabled = true; cg.textContent = 'Publication…';
      const ok = await comAdd(x.id, v);
      if(!ok){ cg.disabled = false; cg.textContent = 'Publier'; return; }
      peint();
      if(S.tab === 'feed') renderFeed();
    };
    sheet.querySelectorAll('[data-cdel]').forEach(btn => btn.onclick = async () => {
      if(await comDrop(btn.dataset.cdel, x.id)){ peint(); if(S.tab === 'feed') renderFeed(); }
    });
  };
  peint();
}

function renderFeed(){
  if(!SB.ready()){
    view.innerHTML = `<h2 class="sec">Feed</h2>
      <div class="card"><p class="small">Le volet social nécessite la configuration du serveur
        sur cette copie de l’app.</p></div>`;
    return;
  }
  if(!SESS){
    view.innerHTML = `
      <h2 class="sec">Feed</h2>
      <div class="card">
        <p class="lede">Retrouver les autres</p>
        <p class="small">Chercher quelqu’un par son pseudo, lui envoyer une demande, puis partager
          badges, idées de recettes et défis.</p>
        <div class="hr"></div>
        <p class="small mute">Il faut un compte : c’est votre pseudo qui vous rend trouvable.</p>
        <button class="btn btn-1" id="f_login" style="margin-top:4px">Ouvrir mon profil</button>
      </div>`;
    $('#f_login').onclick = profileSheet;
    return;
  }
  if(S.fr.state === 'vide'){ frLoad(); }
  if(S.chal === undefined){ S.chal = null; chalLoad(true); }
  if(S.posts === undefined){ S.posts = null; frPosts(); }

  const t0 = today();
  const chals = S.chal || [];
  const mien = ch => ch.parts.find(x => x.member === SESS.uid);
  const enCours = chals.filter(ch => ch.ends >= t0 && (mien(ch) || {}).status === 'in');
  const invites = chals.filter(ch => ch.ends >= t0 && (mien(ch) || {}).status === 'invited');
  const finis   = chals.filter(ch => ch.ends <  t0 && (mien(ch) || {}).status === 'in');
  const F = S.fr;
  const ctx = {t0, chals, enCours, invites, finis, F};

  /* Une pastille par section : ce qui réclame une réponse doit être visible
     sans changer d'onglet. */
  const attente = attentes();

  view.innerHTML = `
    <div class="seg" style="margin-bottom:12px">${FEED_TABS.map(([k,l]) =>
      `<button data-fv="${k}" aria-pressed="${S.fv === k}"><b>${l}${
        attente[k] ? ' · ' + attente[k] : ''}</b></button>`).join('')}</div>
    ${({actu:feedActu, defis:feedDefis, amis:feedAmis})[S.fv](ctx)}`;

  view.querySelectorAll('[data-fv]').forEach(b => b.onclick = () => {
    S.fv = b.dataset.fv; renderFeed();
  });

  /* ---------- Actu ---------- */
  /* Après le rendu, pas avant : la pastille doit s'être affichée une fois,
     sinon on ne saurait jamais combien il y avait de nouveautés. */
  if(S.fv === 'actu'){ actuLue(); paintFeedCount(); }
  const rec = $('#ac_rec'); if(rec) rec.onclick = recipeSheet;
  const ref = $('#ac_ref'); if(ref) ref.onclick = () => { frPosts(); toast('Actualisé'); };
  view.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => postDrop(b.dataset.pdel));
  view.querySelectorAll('[data-popen]').forEach(b =>
    b.onclick = () => postOpen(b.dataset.popen, b.dataset.ptab));
  view.querySelectorAll('[data-like]').forEach(b => b.onclick = () => postLike(b.dataset.like));
  view.querySelectorAll('[data-psave]').forEach(b => b.onclick = () => recSave(b.dataset.psave));

  /* ---------- Défis ---------- */
  const cn = $('#ch_new');
  if(cn && !cn.disabled) cn.onclick = chalCreate;
  view.querySelectorAll('[data-cyes]').forEach(b => b.onclick = () => chalAnswer(invites[+b.dataset.cyes], 'in'));
  view.querySelectorAll('[data-cno]').forEach(b => b.onclick = () => chalAnswer(invites[+b.dataset.cno], 'out'));
  view.querySelectorAll('[data-chal]').forEach(el => el.onclick = () => {
    const ch = chals.find(x => x.id === el.dataset.chal);
    const rows = chalRows(ch), def = CHAL[ch.kind];
    openSheet(`
      <div class="unit">Défi · ${esc((ch.aut||{}).username || '?')}</div>
      <h3 style="margin:2px 0 4px">${esc(def.l)}</h3>
      <p class="small mute">${esc(def.s)}</p>
      <div class="hr"></div>
      <div class="stagelist">
        ${rows.map((x,i) => `<span class="unit">${x.ok ? i+1 : '–'} · ${esc(x.nom)}</span>
          <span class="small">${x.ok ? chalFmt(ch.kind, x) + ' · ' + chalDetail(ch.kind, x) : 'pas assez de repas saisis'}</span><span></span>`).join('')}
        ${ch.parts.filter(x => x.status === 'invited').map(x =>
          `<span class="unit">invité</span><span class="small mute">${esc((x.who||{}).username || '?')} n’a pas répondu</span><span></span>`).join('')}
      </div>
      <div class="src" style="margin-top:10px">Du ${dLabel(ch.starts)} au ${dLabel(ch.ends)}.
        Les scores sont calculés par chaque app depuis ses propres saisies : ce classement est déclaratif,
        c’est de l’émulation, pas un arbitrage.</div>
      ${ch.created_by === SESS.uid
        ? `<button class="btn btn-2" id="ch_del" style="margin-top:12px;color:var(--brick)">Supprimer ce défi</button>`
        : `<button class="btn btn-2" id="ch_out" style="margin-top:12px">Quitter ce défi</button>`}`);
    const dl = $('#ch_del');
    if(dl) dl.onclick = () => { if(dl.dataset.ok){ closeSheet(); chalDrop(ch); }
      else { dl.dataset.ok = '1'; dl.textContent = 'Confirmer la suppression'; } };
    const ou = $('#ch_out');
    if(ou) ou.onclick = () => { closeSheet(); chalAnswer(ch, 'out'); };
  });

  /* ---------- Amis ---------- */
  const fgo = $('#f_go');
  if(fgo){
    fgo.onclick = feedSearch;
    const fq = $('#fq');
    fq.onkeydown = e => { if(e.key === 'Enter') feedSearch(); };
    fq.oninput = () => { S.fq = fq.value; };
  }
  const ask = $('#f_ask');
  if(ask && !ask.disabled) ask.onclick = () => frAsk(S.fres.id, S.fres.username);

  view.querySelectorAll('[data-yes]').forEach(b => b.onclick = () => frDecide(F.in[+b.dataset.yes], 'accepted'));
  view.querySelectorAll('[data-no]').forEach(b => b.onclick = () => frDecide(F.in[+b.dataset.no], 'declined'));
  view.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => frDrop(F.out[+b.dataset.cancel], 'Demande annulée'));
  view.querySelectorAll('[data-un]').forEach(b => b.onclick = () => frDrop(F.friends[+b.dataset.un], 'Ami retiré'));
  view.querySelectorAll('[data-fiche]').forEach(b => b.onclick = () => {
    const x = F.friends[+b.dataset.fiche], a = frAutre(x);
    tasteSheet(x.requester === SESS.uid ? x.addressee : x.requester, a.username);
  });

  /* migration des anciens contacts locaux : on retrouve l'identifiant par le
     pseudo, puis on envoie une demande en règle */
  view.querySelectorAll('[data-mig]').forEach(b => b.onclick = async () => {
    const pl = S.people[+b.dataset.mig];
    const q = await SB.rest('profiles?select=id,username&username_slug=eq.' +
      encodeURIComponent(pl.slug) + '&limit=1');
    if(!q.ok || !q.body || !q.body.length) return toast('Ce compte n’existe plus');
    await frAsk(q.body[0].id, q.body[0].username);
    S.people.splice(+b.dataset.mig, 1); save(); renderFeed();
  });
  view.querySelectorAll('[data-old]').forEach(b => b.onclick = () => {
    S.people.splice(+b.dataset.old, 1); save(); renderFeed(); toast('Retiré');
  });
}

/* ============================ onglet 1 — En cuisine ============================
   Trois vues sous un même onglet, réunies parce qu'elles répondent à la même
   question — qu'est-ce que je mange. Le frigo part de ce qu'on a, Mes recettes
   de ce qu'on a trouvé ailleurs, la Bibliothèque de ce que pèse chaque
   ingrédient. L'ancien onglet Bibliothèque n'était que la troisième.

   L'identifiant interne de l'onglet reste 'biblio'. Il est écrit dans le
   localStorage de chaque appareil déjà installé, il figure dans TABS et il
   voyage dans les notifications push : le renommer ferait repartir tout le
   monde sur l'onglet par défaut au prochain lancement, pour un gain purement
   cosmétique. Le nom visible, lui, est bien « En cuisine ». */
const CUI_VUES = [['frigo','Mon frigo'], ['recettes','Mes recettes'], ['biblio','Bibliothèque']];

function renderCuisine(){
  if(!CUI_VUES.some(([k]) => k === S.cv)) S.cv = 'frigo';
  const corps  = {frigo:cuiFrigo,   recettes:cuiRecettes,   biblio:cuiBiblio}[S.cv];
  const brancher = {frigo:bindFrigo, recettes:bindRecettes, biblio:bindBiblio}[S.cv];

  view.innerHTML = `
    <div class="seg" style="margin-bottom:12px">${CUI_VUES.map(([k,l]) =>
      `<button data-cv="${k}" aria-pressed="${S.cv === k}"><b>${l}</b></button>`).join('')}</div>
    ${corps()}`;

  view.querySelectorAll('[data-cv]').forEach(b => b.onclick = () => {
    S.cv = b.dataset.cv; renderCuisine();
  });
  brancher();
}
/* L'ancien nom reste appelable : plusieurs écrans ouvrent la bibliothèque par
   son nom historique, et les faire tous pointer ailleurs n'apporterait rien. */
function renderBiblio(){ renderCuisine(); }

/* ==================== Mon frigo ====================
   La recherche est ici inversée par rapport au reste de l'app : on ne part pas
   d'un plat pour en lire les ingrédients, on part des ingrédients pour
   retrouver les plats.

   Le score est un compte d'ingrédients couverts, pas une pondération en
   grammes. C'est ce que l'utilisateur peut vérifier d'un coup d'œil ; une
   pondération invisible ferait remonter des plats sans qu'on comprenne
   pourquoi, et un plat dont il ne manque que les 300 g de tomates n'est pas
   plus « faisable » qu'un plat dont il ne manque que les 5 g d'échalote.

   GARDE est le garde-manger supposé. Compter l'huile, le sel ou les épices
   comme manquants afficherait « il te manque : huile d'olive » sur presque
   chaque plat et noierait les vrais manques. L'ail y figure aussi : une tête
   d'ail se garde des semaines et ne s'achète pas pour une recette. */
const GARDE = new Set(['epices','herbesfraiches','huileolive','matieregrasse','beurre','sucre',
  'vinaigre','saucesoja','moutarde','bouilloncube','ail']);
/* Rayons qu'on ne met pas au frigo : un plat préparé est un repas fini, une
   boisson n'entre dans aucune de ces recettes. */
const FRIGO_HORS = new Set(['Plats préparés','Boissons']);

/* Style de cuisine. Quatre plats seulement portent un champ `cui` — ce sont les
   recettes importées, les seules saisies avec cette métadonnée. Filtrer sur ce
   champ seul rendrait le sélecteur inutilisable : on déduit donc le style du
   nom du plat quand il n'est pas déclaré.

   C'est une heuristique, et elle est assumée comme telle : l'ordre des lignes
   compte, la première qui accroche gagne, et « curry vert » doit être lu avant
   « curry » sans quoi tous les currys thaï deviendraient indiens. La vraie
   correction est de taguer `cui` à la source dans DB.dishes ; en attendant,
   mieux vaut un classement approximatif qu'un filtre mort. */
const CUI_MOTS = [
  /* Marqueurs forts d'abord. « dahl » et « naan » doivent l'emporter sur
     « cajou », et « curry vert » sur « curry » tout court, sinon tous les
     currys thaï deviendraient indiens. D'où deux entrées « indienne », l'une
     en tête pour ses marqueurs propres, l'autre en queue pour le curry seul. */
  ['indienne',  /dahl|dhal|paneer|saag|keema|tikka|masala|naan|curry indien/],
  /* La Thaïlande sort de l'Asie : c'est le gros du référentiel — une carte de
     restaurant thaï entière y a été saisie — et la noyer dans « asiatique »
     donnerait une tuile de cinquante plats à côté de tuiles de cinq. */
  ['thai',      /pad thai|pad kee|thai|galanga|papaye verte|larmes du tigre|pandanus|bananier|riz gluant|bo bun|curry vert|curry rouge|satay|citronnelle|nuoc mam|sriracha/],
  ['asiatique', /wok|nouille|udon|soba|ramen|nasi|butadon|katsu|teriyaki|yakiniku|\bnems?\b|sushi|maki|onigiri|poke|gomasio|korean|germes de soja|sauce soja|miso|pak choi|vermicelle|aigres-douces|riz saute|riz brun|chinois|japonais|indonesien|cajou|coco/],
  ['italienne', /pizza|pates|lasagne|risotto|gnocchi|carbonara|tiramis|panna cotta|pesto|focaccia|caprese|burrata|linguine|tagliatelle|orzo|spaghetti|penne|margherita|mozza|parmesan|spaetzle|toscane|bolognaise|coppa|prosciutto|nduja|conchiglioni|ravioles|italie/],
  ['mexicaine', /taco|burrito|quesadilla|tex-mex|chili|nacho|fajita|mexicaine/],
  ['orientale', /couscous|tajine|kefta|chawarma|falafel|houmous|moutabal|merguez|semoule|chakchouka|levant|libanais|harissa|labneh|taboule|piri-piri|pois chiches/],
  ['mediterraneenne', /grecque|tzatziki|moussaka|feta|paella|gazpacho|ratatouille|caesar|cesar|quinoa|tatin de tomates|patatas|bagnat|sardines|chorizo|boulgour|lentilles/],
  ['indienne',  /curry/],
  ['francaise', /bourguignon|blanquette|coq au vin|hachis|parmentier|quiche|croque|gratin|brandade|flammekueche|aligot|truffade|jambon-beurre|baguette|veloute|soupe|puree|omelette|\bcake\b|tarte|chausson|crudites|jardiniere|magret|canette|camembert|auvergnat|fourme|saint-nectaire|cantal|rustique|tartine|sandwich|steak|frites|roti|galette|\bflan\b|moules|bleu|poireau|betterave|carottes|cidre|bourgui/],
];
/* Le nom est lu normalisé — accents dépliés, œ réduit — comme partout ailleurs
   dans l'app. Le lire brut faisait échouer « Pad thaï » sur le motif « pad
   thai », et donc tomber tous les plats thaï dans le lot des non classés.

   Un plat sans style reconnu n'est jamais rangé d'office dans une catégorie
   fourre-tout : il reste sans étiquette, visible sous « Toutes cuisines » et
   absent des filtres nommés. Mieux vaut ne rien dire que classer à tort. */
function cuiOf(d){
  if(d.cui) return d.cui;
  const n = nrmQ(d.n);
  for(const [k, re] of CUI_MOTS) if(re.test(n)) return k;
  return null;
}

/* Ce qui manque et ce qui est couvert, pour un plat donné. */
function frigoScore(d, sac, legOK){
  const uniq = [...new Set(d.l.map(([s]) => s))].filter(s => !GARDE.has(s));
  const ok = [], miss = [];
  uniq.forEach(s => {
    if(sac.has(s)) return ok.push(s);
    /* « Mix de légumes de saison » et « Fruit de saison » ne désignent aucune
       référence à acheter : ce sont des génériques. Deux fruits ou légumes au
       frigo suffisent à les servir, sinon des dizaines de plats resteraient
       inaccessibles pour un ingrédient qui n'existe pas en rayon. */
    if((s === 'legumesaison' || s === 'fruitsaison') && legOK) return ok.push(s);
    miss.push(s);
  });
  return {ok, miss, need:uniq.length};
}

function frigoRes(sac, mois){
  const legOK = [...sac].filter(s => (F.get(s) || {}).g === 'Fruits & légumes').length >= 2;
  /* Les plats d'enseigne sont écartés : le frigo sert à cuisiner chez soi, et
     proposer un bagel d'une adresse précise à qui ouvre son réfrigérateur n'a
     pas de sens. Même logique que le conseil du Tracker. */
  const base = DISHES()
    .filter(d => !d.src && d.m.some(m => m === 'dej' || m === 'din'))
    .map(d => Object.assign({d, n:d.n, kg:kgOf(d.l), sais:saisPart(d.l, mois), cui:cuiOf(d)},
                            frigoScore(d, sac, legOK)))
    .filter(x => x.ok.length);

  /* Les styles offerts au filtre sont ceux réellement présents dans le
     résultat : un bouton « mexicaine » qui ne ramène rien est un bouton mort. */
  const cuisines = [...new Set(base.map(x => x.cui).filter(Boolean))]
    .sort((a, b) => (CUIS[a] || a).localeCompare(CUIS[b] || b, 'fr'));

  const rows = base
    .filter(x => S.fgCarb !== 'leger'  || x.kg <= 0.7)
    .filter(x => S.fgCarb !== 'budget' || x.kg <= BUDGET_J)
    /* « De saison » exige un verdict, pas seulement l'absence de reproche : un
       plat sans le moindre légume (sais null) n'est pas de saison, il est hors
       sujet. Le laisser passer ferait remonter une carbonara sous ce filtre. */
    .filter(x => !S.fgSais || (x.sais != null && x.sais >= SAIS_MIN))
    .filter(x => !S.fgCui  || x.cui === S.fgCui)
    /* Un plat dont il ne manque rien passe devant tout le reste, même mieux
       couvert : c'est le seul qui soit faisable ce soir sans ressortir. Ensuite
       seulement viennent le nombre d'ingrédients déjà là, puis ce qui manque,
       puis le carbone. */
    .sort((a, b) => (a.miss.length ? 1 : 0) - (b.miss.length ? 1 : 0)
                 || b.ok.length - a.ok.length
                 || a.miss.length - b.miss.length
                 || a.kg - b.kg);

  return {base, rows, cuisines};
}

const FG_CARB = [['','Tout carbone'], ['leger','Léger · ≤ 0,7 kg'], ['budget','Dans le budget du jour']];

function cuiFrigo(){

  const mois = new Date().getMonth();

  /* Suggestions de la barre : on retire ce qui est déjà au frigo, le proposer
     une seconde fois ne peut mener qu'à un doublon. Tri par position du terme
     dans le nom, pour que « tomate » précède « concentré de tomate ». */
  const sugg = !q ? [] : DB.foods
    .filter(f => !FRIGO_HORS.has(f.g) && !sac.has(f.s) &&
                 (nrmQ(f.n).includes(q) || nrmQ(f.g).includes(q)))

     même calendrier que le reste de l'app. Poser une liste en dur ferait vivre

  const amorce = DB.foods
    .filter(f => f.g === 'Fruits & légumes' && f.sais === undefined && saisOf(f.s, mois) === true)

  ${sac.size ? `

      <button class="fchip" data-fdel="${s}">${esc((F.get(s) || {n:s}).n)}<i>✕</i></button>`).join('')}</div>
    <div class="actions" style="margin:-4px 0 14px">

  : `<div class="card" style="margin-bottom:14px">
      <div class="unit">Frigo vide</div>
      <p class="small" style="margin:6px 0 0">Ajoute trois ou quatre aliments et l’app cherche,
        parmi les ${DISHES().filter(d => !d.src && d.m.some(m => m === 'dej' || m === 'din')).length}
        plats du référentiel, ceux qui s’en approchent le plus. Rien n’est envoyé au serveur :

      ${amorce.length ? `<div class="unit" style="margin:14px 0 7px">De saison en ${MOIS_L[mois]}</div>
        <div class="chips">${amorce.map(f => `
          <button class="chip" data-fadd="${f.s}">${esc(f.n)}</button>`).join('')}</div>` : ''}
    </div>`}

  ${R ? `

    <div class="chips">${FG_CARB.map(([k, l]) => `
      <button class="chip" aria-pressed="${S.fgCarb === k}" data-fcarb="${k}">${l}</button>`).join('')}</div>

          <div class="fm"><b>${x.ok.length}/${x.need} au frigo</b>${
            x.miss.length
              ? ' · manque ' + x.miss.slice(0, 4).map(s => esc(((F.get(s) || {n:s}).n).toLowerCase())).join(', ')
                + (x.miss.length > 4 ? ` et ${x.miss.length - 4} autre${x.miss.length - 4 > 1 ? 's' : ''}` : '')
              : ' · il ne manque rien'}${

function bindFrigo(){
  const inp = $('#fgq');

function frigoAdd(slug){
  if(!F.has(slug) || S.frigo.includes(slug)) return;
  S.frigo.push(slug); S.fgq = ''; save(); renderCuisine();
  const n = $('#fgq'); if(n) n.focus();
}
function frigoDel(slug){
  S.frigo = S.frigo.filter(x => x !== slug); save(); renderCuisine();
}

  const ouvrir = mode => {

}

/* ==================== petit-déjeuner habituel ====================
   Le matin se répète plus que le reste de la journée : autant ne pas le
   ressaisir cinq fois par semaine. L'habitude est rangée comme un plat type
   marqué `hab`, ce qui lui donne gratuitement la persistance, l'export et sa
   place dans la liste des plats types du matin. Elle garde son mode de
   préparation, décidé une fois pour toutes à l'enregistrement. */
const HAB_NOM = 'Mon petit-déjeuner habituel';
const pdjHab  = () => S.favs.find(f => f.hab);

function pdjHabSet(lignes, mode){
  const l = lignes.map(x => [x[0], x[1]]);
  const i = S.favs.findIndex(f => f.hab);
  const nom = i >= 0 ? S.favs[i].n : HAB_NOM;
  if(i >= 0) S.favs.splice(i, 1);
  S.favs.unshift({n:nom, m:['pdj'], l, hab:1, hmode:mode || 'frais'});
  save();
}
function pdjHabDrop(){
  const i = S.favs.findIndex(f => f.hab);
  if(i >= 0){ S.favs.splice(i, 1); save(); }
}
/* Proposer « remplacer mon habitude » quand le brouillon est déjà l'habitude
   n'aurait aucun sens. */
function pdjSame(){
  const h = pdjHab();
  if(!h || h.l.length !== S.draft.length) return false;
  const clef = l => l.map(x => x[0] + ':' + x[1]).sort().join('|');
  return clef(h.l) === clef(S.draft);
}

/* ============================ onglet 2 — saisie ============================ */
const MEAL_ORDER = ['pdj','dej','encas','din'];   // ordre demandé pour les quatre blocs
const COURSES = [{k:'entree', l:'Entrée'}, {k:'plat', l:'Plat'}, {k:'dessert', l:'Dessert'}];

const COM_COEF = {boisson:1, entree:0.55, plat:1, dessert:1, cafethe:1};
function comPortion(slug){
  const f = F.get(slug);
  if(S.comCat === 'dessert') return SWEET.has(slug) ? f.p : Math.round(f.p * 0.6);
  if(S.comCat === 'boisson' || S.comCat === 'cafethe') return f.p;
  return Math.round(f.p * COM_COEF[S.comCat] / 5) * 5 || 5;
}
function comLabel(slug){
  const base = F.get(slug).p, q = comPortion(slug);
  if(S.comCat === 'boisson')  return `verre type ${base} ml`;
  if(S.comCat === 'cafethe')  return `tasse type ${base} ml`;
  if(S.comCat === 'plat') return `portion type ${base} g`;
  if(S.comCat === 'dessert') return SWEET.has(slug) ? `dessert, ${q} g` : `hors dessert type, ${q} g`;
  return `entrée, ${q} g (type ${base} g)`;
}

/* étapes du parcours guidé, pour le déjeuner et le dîner */
const WIZ = [
  {k:'boisson', label:'Boisson', q:'Qu’avez-vous bu pendant le repas ?'},
  {k:'entree',  label:'Entrée',  q:'Qu’avez-vous mangé en entrée ?'},
  {k:'plat',    label:'Plat',    q:'Qu’avez-vous mangé en plat ?'},
  {k:'dessert', label:'Dessert', q:'Qu’avez-vous pris en dessert ?'},
  {k:'cafethe', label:'Café ou thé', q:'Un café ou un thé pour finir ?'},
];
const WIZ_KEYS = WIZ.map(w => w.k);
const wizIndex = k => WIZ_KEYS.indexOf(k);
const prevCourse = k => { const i = wizIndex(k); return i > 0 ? WIZ_KEYS[i-1] : null; };
const nextCourse = k => { const i = wizIndex(k); return i >= 0 && i < WIZ_KEYS.length-1 ? WIZ_KEYS[i+1] : null; };

/* ouvre une étape du parcours */
function openCourse(k){
  S.course = k; S.comCat = k; S.step = 'course';
  S.dishQ = ''; S.pickQ = ''; S.pickSlug = null; S.drinkMore = false;
  /* Aucune méthode présélectionnée : l'écran commence par la question. Ouvrir
     d'office sur l'une des deux voies revient à choisir à la place de
     l'utilisateur, et la voie ouverte finit par être la seule utilisée. */
  S.path = null;
  renderSaisie();
}

/* enregistre ou met à jour le repas, puis revient à l'accueil de la saisie */
/* Célébration du jour tenu. Une fois par journée, et seulement quand la journée
   est réellement tenue : au moins deux repas principaux enregistrés, et le total
   sous l'objectif — ou sous le budget si aucun objectif n'est fixé. Sans le
   garde-fou des deux repas, elle se déclencherait chaque matin au premier café,
   quand rester sous le seuil ne veut encore rien dire. */
function dayHeld(){
  const t = today();
  const es = S.hist.filter(e => e.d === t);
  const mains = new Set(es.filter(e => e.m !== 'encas').map(e => e.m));
  /* Déjeuner ET dîner, nommément. L'ancien test `mains.size < 2` comptait deux
     repas principaux quelconques : petit-déjeuner plus déjeuner suffisaient, et
     la journée était fêtée à midi alors que le dîner restait à venir — donc
     avant que le total de la journée veuille dire quoi que ce soit. C'est la
     même règle que dayComplete(), qui l'appliquait déjà correctement pour les
     badges : les deux lectures sont désormais alignées. */
  if(!mains.has('dej') || !mains.has('din')) return null;
  const kg = es.reduce((a,e) => a + kgOf(e.l), 0);
  const obj = objDay();
  return {
    kg,
    budget:   kg <= BUDGET_J ? BUDGET_J : null,
    objectif: (obj != null && kg <= obj) ? obj : null,
  };
}

/* Deux distinctions, deux marques. Le logo pour le budget 2050, la carotte pour
   l'objectif personnel. Chacune est fêtée une fois par jour au plus, et suivie
   séparément : atteindre l'objectif à midi puis le budget au dîner doit donner
   les deux, dans cet ordre.
   Quand les deux tombent d'un coup, seul le logo part. Le budget 2050 est
   presque toujours plus exigeant qu'un objectif personnel — le tenir revient à
   tenir l'objectif — et deux animations consécutives pour une seule journée
   feraient une célébration bavarde. L'objectif est marqué comme absorbé pour ne
   pas ressurgir au repas suivant. */
function celebrate(){
  const h = dayHeld();
  if(!h) return;
  const T = today();
  if(h.budget != null && S.prof.spunBud !== T){
    S.prof.spunBud = T;
    if(h.objectif != null) S.prof.spunObj = T;
    save();
    return spinShow('logo', `Budget 2050 tenu · ${n2(h.kg)} kg pour ${n2(h.budget)}`);
  }
  if(h.objectif != null && S.prof.spunObj !== T){
    S.prof.spunObj = T; save();
    return spinShow('carotte', `Objectif du jour tenu · ${n2(h.kg)} kg pour ${n2(h.objectif)}`);
  }
}

function spinShow(marque, texte){
  const el = document.getElementById('spin');
  if(!el) return;
  el.dataset.mark = marque;
  el.querySelector('.t').textContent = texte;
  el.classList.remove('on');
  void el.offsetWidth;                        /* relance l'animation */
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2200);
}

function commitMeal(){
  if(!S.draft.length){ toast('Rien à enregistrer.'); S.step = 'home'; return renderSaisie(); }
  const label = S.draft.length === 1 ? F.get(S.draft[0][0]).n : `${MEAL[S.meal].l} composé`;
  if(S.editId){
    const e = S.hist.find(x => x.id === S.editId);
    if(e){ e.m = S.meal; e.d = S.entryDate; e.l = S.draft.map(l => [l[0], l[1], l[2]||'plat', l[3]||null]);
           if(e.n.endsWith('composé') || S.draft.length === 1) e.n = label;
           e.c = e.c || CLIENT_ID; e.u = new Date().toISOString(); }
    S.editId = null; S.draft = []; S.wiz = null; S.step = 'home'; save();
    if(SESS) syncNow(true);
    go('tracker'); return toast('Repas mis à jour');
  }
  /* L'habitude est posée à l'enregistrement, jamais avant : elle doit être
     exactement ce qui a été validé, pas ce qui était en cours de composition. */
  const habNouvelle = S.meal === 'pdj' && S.pdjSave && S.draft.length;
  if(habNouvelle) pdjHabSet(S.draft, S.mode);

  S.hist.push({id:'e'+Date.now(), c:CLIENT_ID, u:new Date().toISOString(),
               d:S.entryDate, m:S.meal, n:label,
               l:S.draft.map(l => [l[0], l[1], l[2]||'plat', l[3]||null])});
  const kg = kgOf(S.draft);
  S.draft = []; S.wiz = null; S.step = 'home';
  S.pdjSave = false; S.pdjNew = false; S.pdjEdit = false;
  save(); renderSaisie();
  if(SESS) syncNow(true);
  celebrate();
  troWatch();
  toast(habNouvelle
    ? `Petit-déjeuner enregistré · ${n2(kg)} kg · c’est votre nouvelle habitude`
    : `${MEAL[S.meal].l} enregistré · ${n2(kg)} kg`);
}

function saveCourse(c){
  const lines = S.draft.filter(l => (l[2]||'plat') === c).map(l => [l[0], l[1]]);
  if(lines.length < 2) return;
  const label = (WIZ.find(x => x.k === c) || {label:'Plat'}).label;
  const base = F.get(lines.reduce((a,l) => F.get(l[0]).t*l[1] > F.get(a[0]).t*a[1] ? l : a)[0]).n;
  openSheet(`
    <div class="unit">Nouveau plat type</div>
    <h3>Enregistrer cette ${label.toLowerCase()}</h3>
    <div class="small mute" style="margin-bottom:8px">${lines.length} ingrédients ·
      ${n2(kgOf(lines))} kg CO₂e. Le plat rejoindra vos favoris, en tête de la liste.</div>
    <input class="search" id="cname" value="${esc(label)} ${esc(base.toLowerCase())}">
    <div class="actions">
      <button class="btn btn-1" id="cok">Enregistrer</button>
      <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
    </div>`);
  $('#cok').onclick = () => {
    const nm = $('#cname').value.trim() || `${label} composé`;
    if(S.favs.some(f => f.n === nm)) return toast('Ce nom existe déjà.');
    S.favs.push({n:nm, m:[S.meal], l:lines});
    save(); closeSheet(); renderSaisie(); toast(`${nm} ajouté aux plats types`);
  };
}

/* champ de recherche d'aliment : suggestions, sélection, ajout */
/* bindCompose() a disparu avec le widget qu'il pilotait : l'autocomplétion à
   deux champs — nom puis grammes — du composeur. Elle est remplacée par la
   barre de recherche unifiée de composePanel(), qui ajoute avec la portion de

   de trop. */

/* les quatre services, dans l'ordre d'affichage voulu */
const COURSE_HUB = [
  {k:'boisson', l:'Boisson',  d:'Eau, vin, soda, jus'},
  {k:'entree',  l:'Entrée',   d:'Crudités, taboulé, soupe'},
  {k:'plat',    l:'Plat',     d:'Le cœur du repas'},
  {k:'dessert', l:'Dessert',  d:'Fruit, laitage, gâteau'},
  {k:'cafethe', l:'Café ou thé', d:'Et le digestif'},
];
/* garde-fous de portion, en grammes d'ingrédients */
const CAP = {entree:{max:200}, plat:{normal:500, large:700}};

const gOf = lines => lines.reduce((a,l) => a + l[1], 0);

/* met à l'échelle les grammages d'un service pour que leur somme atteigne la cible */
function rescaleCourse(course, targetG){
  const idx = S.draft.map((l,i) => ({l,i})).filter(x => (x.l[2]||'plat') === course);
  const tot = gOf(idx.map(x => x.l));
  if(!tot) return;
  const k = targetG / tot;
  let acc = 0;
  idx.forEach((x, n) => {
    const v = n === idx.length - 1 ? targetG - acc : Math.max(1, Math.round(x.l[1] * k));
    S.draft[x.i][1] = Math.max(1, v);
    acc += S.draft[x.i][1];
  });
}

/* passe au service suivant, ou à l'écran de fin après le café */
function advanceCourse(course){
  const nx = nextCourse(course);
  if(nx) return openCourse(nx);
  S.step = 'finish'; renderSaisie();
}

/* validation d'un service : applique les garde-fous puis enchaîne */
function validateCourse(course){
  const lines = S.draft.filter(l => (l[2]||'plat') === course);
  const g = gOf(lines);
  if(course === 'entree' && g > CAP.entree.max){
    rescaleCourse('entree', CAP.entree.max);
    toast(`Entrée ramenée à ${CAP.entree.max} g, la portion type`);
    return advanceCourse(course);
  }
  if(course === 'plat' && g > CAP.plat.normal){
    /* Le composeur de plat standard a déjà demandé la taille. Reposer la
       question juste après serait une confirmation en double, et la seule
       réponse possible serait celle qui vient d'être donnée. */
    if(S.platLarge){
      rescaleCourse('plat', Math.min(g, CAP.plat.large));
      if(g > CAP.plat.large) toast(`Portion large, plafonnée à ${CAP.plat.large} g`);
      return advanceCourse('plat');
    }
    openSheet(`
      <div class="unit">Portion du plat</div>
      <h3>${n0(g)} g dans l’assiette</h3>
      <p class="small mute">C’est au-dessus d’une portion type de ${CAP.plat.normal} g.
        Laquelle avez-vous mangée ?</p>
      <div class="drinkgrid" style="grid-template-columns:1fr 1fr">
        <button class="dcard" data-portion="${CAP.plat.normal}">
          <span class="dn2">Normale</span><span class="dk">ramené à ${CAP.plat.normal} g</span></button>
        <button class="dcard done" data-portion="${CAP.plat.large}">
          <span class="dn2">Large</span><span class="dk">plafonné à ${CAP.plat.large} g</span></button>
      </div>`);
    $('#sheet').querySelectorAll('[data-portion]').forEach(b => b.onclick = () => {
      const t = +b.dataset.portion;
      rescaleCourse('plat', Math.min(g, t));
      closeSheet(); advanceCourse('plat');
      toast(t === CAP.plat.normal ? `Plat ramené à ${t} g` : `Portion large, plafonnée à ${Math.min(g,t)} g`);
    });
    return;
  }
  advanceCourse(course);
}

/* carrefour : quatre services libres, le suivant vide est mis en avant */
function renderHub(D, isToday, draftKg){

  const nextEmpty = (COURSE_HUB.find(c => !filled(c.k)) || {}).k;
  view.innerHTML = `
    <button class="backlink" id="sBack">‹ Changer de repas</button>
    <div class="mealhead">
      <span class="mh">${MEAL[S.meal].l}</span>
      <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)}${draftKg ? ` · ${n2(draftKg)} kg` : ''}</span>
    </div>
    <h2 class="sec">Les services du repas</h2>
    <div class="hubgrid">
      ${COURSE_HUB.map(c => {
        const lines = S.draft.filter(l => (l[2]||'plat') === c.k);
        const on = lines.length > 0;
        return `<button class="hub${on ? ' on' : ''}${c.k === nextEmpty ? ' next' : ''}" data-course="${c.k}">
          <span class="hn">${c.l}${on ? ' <i>✓</i>' : ''}</span>
          <span class="hd">${on ? `${lines.length} aliment${lines.length>1?'s':''} · ${n2(kgOf(lines))} kg`
            : (c.k === nextEmpty ? 'à suivre' : c.d)}</span>
        </button>`; }).join('')}
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn btn-1" id="toFinish" ${S.draft.length ? '' : 'disabled'}>Terminer le repas ›</button>
    </div>
    ${!S.draft.length ? `<div class="src" style="margin-top:10px">Touchez un service pour le composer.
      Vous pouvez les remplir dans l’ordre que vous voulez, et n’en remplir qu’un.</div>` : ''}`;
  $('#sBack').onclick = () => { S.step = 'mode'; renderSaisie(); };
  view.querySelectorAll('[data-course]').forEach(b => b.onclick = () => openCourse(b.dataset.course));
  const tf = $('#toFinish');
  if(tf && !tf.disabled) tf.onclick = () => { S.step = 'finish'; renderSaisie(); };
}

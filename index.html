<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0E4D45" id="metaTheme">
<script>
/* appliqué avant le rendu : pas de flash au chargement */
(function(){
  var m; try{ m = localStorage.getItem('carbone.theme'); }catch(e){}
  m = m || 'system';
  var dark = m === 'dark' || (m === 'system' &&
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<title>Carbon FOODprint — l’empreinte carbone de vos repas</title>
<meta name="description" content="Comptabilité carbone alimentaire personnelle, à partir des données ADEME / AGRIBALYSE 3.2.">
<meta name="apple-mobile-web-app-title" content="FOODprint">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
:root{
  /* palette de marque, invariante */
  --forest:#0E4D45; --forest-2:#3A6E5C; --straw:#D9C05B; --brick:#A32E2B;
  --s1:#0E4D45; --s2:#3A6E5C; --s3:#6E9075; --s4:#A8B37A; --s5:#D9C05B; --s6:#E7DCA8;
  --serif:ui-serif,"New York",Iowan Old Style,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;

  /* surfaces et textes — thème CLAIR (défaut) */
  --ink:#16211E; --ink-soft:#42544D; --mute:#7C8C84;
  --paper:#F1F3EF; --card:#FFFFFF; --line:#DCE2D9; --line-soft:#EAEEE7;
  --field:#FFFFFF; --track:#E9EDE7; --seg-bg:#E4E9E1; --active:#F6F8F5;
  --on-forest:#EEF3EE; --on-forest-soft:#CBD9D1; --on-forest-mute:#9FBAAE;
  --topbar:var(--forest); --on-topbar:#F3F6F1; --on-topbar-strong:#fff; --on-topbar-mute:#AFC6BC;
  --note-bg:#FBF4DC; --note-line:#EBDDA6; --note-ink:#6B5B1E; --note-line-2:#E8D89A;
  --kpi-good:#E2EFDA;
  --shell:#20302B;
  --tabbar:rgba(255,255,255,.94);
  --card-2-bg:var(--ink); --card-2-on:#EDF1EE;
  --sheet-scrim:rgba(15,25,21,.42);
  --shadow:0 12px 28px rgba(16,33,28,.16);
  --toast-bg:#16211E;
}
:root[data-theme="dark"]{
  --ink:#E7ECE8; --ink-soft:#AEBCB4; --mute:#7E8F86;
  --paper:#141A18; --card:#1D2523; --line:#313B37; --line-soft:#28312E;
  --field:#232C29; --track:#2C3733; --seg-bg:#262F2C; --active:#232C29;
  --on-forest:#EAF1EC; --on-forest-soft:#C4D4CB; --on-forest-mute:#8FA79B;
  --topbar:#0B3B35; --on-topbar:#EAF1EC; --on-topbar-strong:#fff; --on-topbar-mute:#7FA398;
  --note-bg:#2E2A16; --note-line:#524A26; --note-ink:#D8C88A; --note-line-2:#4A4322;
  --kpi-good:#223324;
  --shell:#0A0E0D;
  --tabbar:rgba(20,26,24,.92);
  --card-2-bg:#0B3B35; --card-2-on:#EAF1EC;
  --sheet-scrim:rgba(0,0,0,.58);
  --shadow:0 12px 28px rgba(0,0,0,.5);
  --toast-bg:#2A3532;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--shell); font-family:var(--sans); color:var(--ink);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.phone{
  max-width:430px; margin:0 auto; min-height:100vh; background:var(--paper);
  position:relative; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 30px 80px rgba(0,0,0,.45);
}
@media(min-width:900px){
  body{padding:26px 0}
  .phone{min-height:calc(100vh - 52px); border-radius:34px; overflow:hidden}
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--forest); outline-offset:2px; border-radius:4px}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--topbar); color:var(--on-topbar);
  padding:14px 18px 12px; display:flex; align-items:baseline; justify-content:space-between;
}
.brand{font-family:var(--serif); font-size:20px; letter-spacing:.005em; line-height:1.1}
.brand em{font-style:normal; font-family:var(--sans); font-weight:700; font-size:17px; letter-spacing:.02em; color:var(--straw)}
.brand .sp{letter-spacing:-.04em}
.today{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--on-topbar-mute); text-align:right}
.today b{display:block; font-family:var(--serif); font-size:17px; color:var(--on-topbar-strong); letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums}

main{flex:1; padding:16px 16px 96px}

/* ---------------- primitives ---------------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card + .card{margin-top:12px}
h2.sec{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--mute); margin:22px 2px 9px; font-weight:600;
}
h2.sec:first-child{margin-top:2px}
.lede{font-family:var(--serif); font-size:19px; line-height:1.3; margin:0 0 10px}
p{margin:0 0 9px}
.small{font-size:12.5px; color:var(--ink-soft)}
.mute{color:var(--mute)}
.num{font-family:var(--serif); font-variant-numeric:tabular-nums}
.unit{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--mute)}
.src{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em}
.hr{height:1px; background:var(--line-soft); margin:13px 0}

/* ---------------- gauge : élément signature ---------------- */
.gauge{position:relative; height:22px; background:var(--track); border-radius:3px; overflow:hidden; display:flex}
.gauge .seg{height:100%}
.gauge .over-zone{position:absolute; top:0; bottom:0; z-index:2; opacity:.62;
  background:repeating-linear-gradient(118deg,var(--brick) 0 4px,rgba(163,46,43,0) 4px 9px)}
.gauge-wrap{position:relative}
.tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); z-index:3}
.tick::after{
  content:attr(data-label); position:absolute; top:-15px; right:4px;
  font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--ink); white-space:nowrap;
}
.gauge-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
.gauge-legend span{font-family:var(--mono); font-size:10px; color:var(--ink-soft); display:flex; align-items:center; gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------------- « tout savoir » ---------------- */
.know{background:var(--forest); color:var(--on-forest); border:0}
.know .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.know .big{font-family:var(--serif); font-size:44px; line-height:1; margin:8px 0 2px; font-variant-numeric:tabular-nums}
.know .big small{font-size:17px; color:var(--on-forest-mute)}
.know p{color:var(--on-forest-soft); font-size:13px}
.know .split{display:flex; gap:14px; margin-top:14px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.know .split div{flex:1}
.know .split .v{font-family:var(--serif); font-size:24px; font-variant-numeric:tabular-nums}
.know .split .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--on-forest-mute); line-height:1.4}
.contrib{margin-top:16px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.contrib .row{display:grid; grid-template-columns:1fr 42px; gap:8px; align-items:center; margin-bottom:9px}
.contrib .lab{font-size:13px}
.contrib .lab i{font-style:normal; color:var(--on-forest-mute); font-size:11.5px}
.contrib .pct{font-family:var(--serif); font-size:16px; text-align:right; font-variant-numeric:tabular-nums}
.contrib .bar{grid-column:1/-1; height:6px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; margin-top:-4px}
.contrib .bar i{display:block; height:100%; background:var(--straw)}
.disclose{
  margin-top:14px; width:100%; text-align:left; border-top:1px solid rgba(255,255,255,.16); padding-top:11px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--straw);
}
.know .more{display:none; margin-top:11px}
.know.open .more{display:block}
.know .more li{font-size:12.5px; color:var(--on-forest-soft); margin-bottom:7px}
.know .more ul{padding-left:18px; margin:0}

/* ---------------- chips / segmented ---------------- */
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 11px; border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft); white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.seg{display:flex; background:var(--seg-bg); border-radius:10px; padding:3px; gap:3px}
.seg button{
  flex:1; padding:8px 4px; border-radius:8px; font-size:13px; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.15;
}
.seg button b{font-weight:600}
.seg button small{font-family:var(--mono); font-size:9px; color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] small{color:var(--forest)}

/* ---------------- listes ---------------- */
.search{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field);
  font-size:15px; margin:2px 0 10px;
}
.list{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.item{
  display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:11px 13px; width:100%;
  text-align:left; border-bottom:1px solid var(--line-soft); align-items:center;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--active)}
.item .nm{font-size:14.5px; line-height:1.25}
.tag{display:inline-block; font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; background:var(--note-bg); color:var(--note-ink); border:1px solid var(--note-line);
  border-radius:3px; padding:0 4px; vertical-align:1px; margin-left:5px}
.note{background:var(--note-bg); border:1px solid var(--note-line); border-radius:10px; padding:11px 12px;
  font-size:12.5px; color:var(--note-ink); margin-top:12px}
.item .gp{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
.item .fe{font-family:var(--serif); font-size:17px; font-variant-numeric:tabular-nums; text-align:right}
.item .fe small{font-family:var(--mono); font-size:9px; color:var(--mute); display:block; letter-spacing:.04em}
.item .track{grid-column:1/-1; height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:3px}
.item .track i{display:block;height:100%;background:var(--forest-2)}
.empty{padding:26px 16px; text-align:center; color:var(--mute); font-size:13px}
.count{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.06em; padding:9px 13px; background:var(--active); border-top:1px solid var(--line-soft)}

/* ---------------- saisie ---------------- */
.paths{display:flex; gap:6px; margin:10px 0 12px}
.paths button{
  flex:1; padding:9px 6px; border:1px solid var(--line); border-radius:10px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft);
}
.paths button[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.dish{padding:11px 13px; border-bottom:1px solid var(--line-soft)}
.dish:last-child{border-bottom:0}
.dish .top{display:flex; align-items:center; gap:10px}
.dish .nm{flex:1; font-size:14.5px}
.dish .kg{font-family:var(--serif); font-size:17px; font-variant-numeric:tabular-nums}
.dish .add{
  padding:6px 12px; border-radius:999px; background:var(--forest); color:#fff;
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
}
.dish .comp{font-family:var(--mono); font-size:10.5px; color:var(--mute); margin-top:5px; letter-spacing:.01em}
.dish .bar{height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:7px}
.dish .bar i{display:block;height:100%}
.pick{position:relative}
.pick input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field); font-size:15px}
.sugg{position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:25; background:var(--card);
  border:1px solid var(--line); border-radius:11px; overflow:hidden auto; max-height:264px;
  box-shadow:var(--shadow)}
.sugg button{display:grid; grid-template-columns:1fr auto; gap:10px; width:100%; text-align:left;
  padding:9px 12px; border-bottom:1px solid var(--line-soft); align-items:center}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus-visible{background:var(--active)}
.sugg .nm{font-size:14px; line-height:1.2}
.sugg i{font-style:normal; display:block; font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); margin-top:1px}
.sugg b{font-family:var(--serif); font-size:15px; font-variant-numeric:tabular-nums; font-weight:400}
.compose{display:grid; grid-template-columns:1fr 74px auto; gap:7px; align-items:center; margin-top:9px}
.chint{font-size:11.5px; color:var(--mute); line-height:1.3}
.compose input[type=number]{width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--field); text-align:right}
.compose .go{padding:10px 13px; border-radius:10px; background:var(--forest); color:#fff; font-size:13px}
.draft-line{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
.draft-line .nm{flex:1; font-size:14px}
.draft-line .q{font-family:var(--mono); font-size:11px; color:var(--mute)}
.draft-line .kg{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px}
.draft-line .rm{color:var(--brick); font-family:var(--mono); font-size:16px; padding:0 4px}
.total{display:flex; align-items:baseline; justify-content:space-between; margin-top:12px}
.total .v{font-family:var(--serif); font-size:30px; font-variant-numeric:tabular-nums}
.actions{display:flex; gap:8px; margin-top:12px}
.btn{flex:1; padding:13px; border-radius:11px; text-align:center; font-size:14px; font-weight:600}
.btn-1{background:var(--forest); color:#fff}
.btn-2{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn[disabled]{opacity:.4}
.toast{
  position:fixed; left:50%; bottom:104px; transform:translate(-50%,14px); z-index:60;
  background:var(--toast-bg); color:#fff; padding:11px 17px; border-radius:999px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------------- tracker ---------------- */
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px}
.kpi .v{font-family:var(--serif); font-size:27px; line-height:1.05; font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em}
.kpi .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); margin-top:4px; line-height:1.35}
.kpi.wide{grid-column:1/-1}
.bars .row{display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin-bottom:11px}
.bars .lab{font-size:13.5px}
.bars .val{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.bars .tr{grid-column:1/-1; height:9px; background:var(--track); border-radius:2px; overflow:hidden}
.bars .tr i{display:block; height:100%}
.days{display:flex; align-items:flex-end; gap:2px; height:78px; margin-top:4px}
.dayscard{background:var(--card)}
.dayscard:active{background:var(--active)}
.budline{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--brick); z-index:2; pointer-events:none}
.dayleg{display:flex; flex-wrap:wrap; gap:9px 12px; margin-top:11px}
.dayleg span{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase}
.dayleg .budkey{width:12px; height:0; border-top:2px dashed var(--brick); display:inline-block}
.wkday{display:grid; grid-template-columns:52px 1fr auto; gap:4px 10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft)}
.wkday:last-child{border-bottom:0}
.wkday .dd{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em; line-height:1.2}
.wkday .dd b{display:block; font-family:var(--serif); font-size:14px; color:var(--ink)}
.wkday .stack2{height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--track)}
.wkday .stack2 i{height:100%}
.wkday .kg2{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.wkhead{display:flex; align-items:baseline; justify-content:space-between; margin:14px 0 4px}
.wkhead .wt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.wkhead .wv{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px}
.days .d{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; min-width:0}
.days .d i{display:block; width:100%}
.days .d.empty{background:var(--track); height:2px}
.axis{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--mute); margin-top:5px}
.journal .j{display:grid; grid-template-columns:auto 1fr auto; gap:3px 10px; padding:10px 0; border-bottom:1px solid var(--line-soft); align-items:center}
.journal .j:last-child{border-bottom:0}
.journal .dt{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em; text-align:center; line-height:1.2}
.journal .dt b{display:block; font-family:var(--serif); font-size:15px; color:var(--ink)}
.journal .nm{font-size:14px}
.journal .nm i{font-style:normal; display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.journal .kg{font-family:var(--serif); font-size:16px; font-variant-numeric:tabular-nums}
svg.spark{width:100%; height:96px; display:block; overflow:visible}
.demo{display:flex; align-items:center; gap:10px; background:var(--note-bg); border:1px solid var(--note-line-2); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--note-ink)}
.demo.edit{background:var(--kpi-good); border-color:var(--forest-2); color:var(--forest)}
.demo.edit button{color:var(--forest)}
.demo button{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--note-ink); text-decoration:underline; white-space:nowrap}

/* ---------------- sheet ---------------- */
.scrim{position:fixed; inset:0; background:var(--sheet-scrim); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; bottom:0; width:100%; max-width:430px; transform:translate(-50%,102%);
  background:var(--paper); z-index:50; border-radius:20px 20px 0 0; padding:18px 18px 30px;
  transition:transform .26s cubic-bezier(.32,.72,0,1); max-height:82vh; overflow-y:auto;
}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-family:var(--serif); font-size:22px; margin:2px 0 2px; font-weight:500}
.sheet .grab{width:38px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 12px}
.stack{display:flex; height:26px; border-radius:3px; overflow:hidden; margin:12px 0 9px}
.stack i{height:100%}
.stagelist{display:grid; grid-template-columns:auto 1fr auto; gap:6px 9px; align-items:center; font-size:12.5px}
.stagelist .sv{font-family:var(--serif); font-variant-numeric:tabular-nums; text-align:right}
.months{display:flex; gap:3px; margin-top:4px}
.months i{flex:1; height:18px; border-radius:2px; background:var(--seg-bg); font-family:var(--mono); font-size:8px; color:var(--mute); display:flex; align-items:center; justify-content:center; font-style:normal}
.months i.on{background:var(--forest); color:#fff}

/* ---------------- tabbar ---------------- */
.tabbar{
  position:sticky; bottom:0; z-index:30; display:flex; background:var(--tabbar);
  border-top:1px solid var(--line); padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:blur(12px);
}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0; color:var(--mute)}
.tabbar svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7}
.tabbar span{font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase}
.tabbar button[aria-current="page"]{color:var(--forest)}

/* ---------------- jeux ---------------- */
.rank{background:var(--card-2-bg); color:var(--card-2-on); border:0}
.rank .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.rank .pts{font-family:var(--serif); font-size:46px; line-height:1; margin:6px 0 0; font-variant-numeric:tabular-nums}
.rank .pts small{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--on-forest-mute); text-transform:uppercase}
.rank .name{font-family:var(--serif); font-size:19px; margin-top:9px}
.rank .prog{height:7px; background:rgba(255,255,255,.16); border-radius:2px; overflow:hidden; margin:9px 0 6px}
.rank .prog i{display:block; height:100%; background:var(--straw)}
.rank .next{font-family:var(--mono); font-size:10px; color:var(--on-forest-mute); letter-spacing:.04em}
.rank .aside{display:flex; gap:14px; border-top:1px solid rgba(255,255,255,.16); margin-top:14px; padding-top:12px}
.rank .aside div{flex:1}
.rank .aside .v{font-family:var(--serif); font-size:22px; font-variant-numeric:tabular-nums}
.rank .aside .l{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--on-forest-mute); line-height:1.4}
.chal{display:grid; grid-template-columns:26px 1fr auto; gap:3px 10px; padding:12px 13px; border-bottom:1px solid var(--line-soft); align-items:baseline}
.chal:last-of-type{border-bottom:0}
.chal .st{font-family:var(--mono); font-size:14px; text-align:center; line-height:1.2}
.chal .st.on{color:var(--forest)}
.chal .st.off{color:var(--line)}
.chal .nm{font-size:14.5px}
.chal .pt{font-family:var(--serif); font-size:16px; font-variant-numeric:tabular-nums; white-space:nowrap}
.chal .rule{grid-column:2/-1; font-size:11.5px; color:var(--mute); line-height:1.35}
.chal .got{grid-column:2/-1; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--forest-2); margin-top:3px}
.wnow{display:grid; grid-template-columns:1fr auto; gap:4px 10px}
.wnow .l{font-size:13.5px}
.wnow .v{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.wnow .tr{grid-column:1/-1; height:8px; background:var(--track); border-radius:2px; overflow:hidden; margin-bottom:6px}
.wnow .tr i{display:block; height:100%}
/* ---------------- réglages / thème ---------------- */
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow .l{font-size:14px}
.setrow .l i{font-style:normal; display:block; font-size:11.5px; color:var(--mute); margin-top:2px}
.themeseg{display:flex; background:var(--seg-bg); border-radius:9px; padding:3px; gap:3px; flex:0 0 auto}
.themeseg button{padding:7px 12px; border-radius:7px; font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px}
.themeseg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.themeseg svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7}
.gear{background:none; border:0; color:var(--on-topbar-mute); padding:4px; margin-right:-2px; display:flex; align-items:center}
.gear svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6}
.gear:active{color:var(--on-topbar-strong)}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

/* jeu de démonstration — 24 jours, tirage déterministe */
function seed(){
  let x = 20260725;
  const rnd = () => (x = (x*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pick = (k, mode) => {
    let p = DB.dishes.filter(d => d.m.includes(k));
    if(mode === 'nored') p = p.filter(d => !d.l.some(([x]) => RED.has(x))) ;
    if(mode === 'veg')   p = p.filter(d => !d.l.some(([x]) => NONVEG.has(x)));
    if(!p.length) p = DB.dishes.filter(d => d.m.includes(k));
    let r = rnd() * p.reduce((a,d) => a + (d.w||1), 0);
    for(const d of p){ r -= (d.w||1); if(r <= 0) return d; }
    return p[p.length-1];
  };
  const h = [];
  for(let i = 23; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const day = iso(d);
    /* le jeu de démonstration raconte une progression : régime courant les dix premiers jours,
       puis arrêt de la viande rouge, puis semaine à dominante végétarienne */
    const mode = i >= 13 ? '' : (i >= 7 ? 'nored' : (rnd() < .7 ? 'veg' : 'nored'));
    ['pdj','dej','din'].forEach(k => {
      const dish = pick(k, mode);
      h.push({id:day+k, d:day, m:k, n:dish.n, l:dish.l});
    });
    if(rnd() < .45){
      const e = pick('encas', mode);
      h.push({id:day+'encas', d:day, m:'encas', n:e.n, l:e.l});
    }
  }
  S.hist = h; S.demo = true; S.favs = [];
  save();
}

/* les repas standard n’entrent dans les favoris qu’une fois : s’ils sont supprimés, ils ne

function addStandards(){
  DB.standards.forEach(d => {
    if(!S.favs.some(f => f.n === d.n)) S.favs.push({n:d.n, m:'dej', l:d.l.map(l => [...l]), std:1});
  });
  S.stdInit = true; save();
}

function gauge(byMeal, total){
  const scale = Math.max(BUDGET_J, total) * 1.02;
  const segs = MEALS.filter(m => byMeal[m.k] > 0)
    .map(m => `<i class="seg" style="width:${(byMeal[m.k]/scale*100).toFixed(2)}%;background:${m.c}"></i>`)
    .join('');
  const ov = Math.max(0, total - BUDGET_J);
  const over = ov > 0
    ? `<span class="over-zone" style="left:${(BUDGET_J/scale*100).toFixed(2)}%;width:${(ov/scale*100).toFixed(2)}%"></span>`
    : '';
  const tick = `<span class="tick" data-label="budget ${n1(BUDGET_J)}" style="left:${clamp(BUDGET_J/scale*100,0,99.4).toFixed(2)}%"></span>`;
  return `<div class="gauge-wrap" style="padding-top:16px">
      <div class="gauge">${segs}${over}</div>${tick}
    </div>
    <div class="gauge-legend">${MEALS.filter(m=>byMeal[m.k]>0)
      .map(m=>`<span><i class="dot" style="background:${m.c}"></i>${m.l} ${n2(byMeal[m.k])}</span>`).join('')
      || '<span>Aucune saisie pour l’instant</span>'}
    </div>`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('on'), 2100);
}

  const f = DB.facts;
  const groups = [...new Set(DB.foods.map(x => x.g))];
  const q = S.q.trim().toLowerCase();
  const rows = DB.foods
    .filter(x => (!S.group || x.g === S.group) && (!q || x.n.toLowerCase().includes(q)))
    .sort((a,b) => b.t - a.t);

  view.innerHTML = `
  <div class="card know" id="know">
    <div class="kicker">Tout savoir</div>
    <div class="big">${n1(f.footprint/1000)} <small>t CO₂e par an</small></div>
    <p>C’est l’empreinte carbone moyenne d’un Français. L’alimentation en représente
       ${Math.round(f.foodShare*100)} %, soit environ ${n1(f.foodAbs/1000)} tonne. Autrement dit :
       nos assiettes pèsent à elles seules le budget annuel total qu’il faudra respecter en 2050.</p>
    <div class="split">
      <div><div class="v">${n1(f.foodAbs/1000)} t</div><div class="l">Alimentation<br>aujourd’hui</div></div>
      <div><div class="v">${n1(f.target2050/1000)} t</div><div class="l">Budget total<br>par personne, 2050</div></div>
      <div><div class="v">${n1(BUDGET_J)}</div><div class="l">kg CO₂e<br>par jour, cible</div></div>
    </div>
    <div class="contrib">
      <div class="kicker" style="margin-bottom:10px">Les trois postes qui décident de tout</div>
      ${f.contrib.map(c => `
        <div class="row">
          <div class="lab">${c.n} <i>${c.d}</i></div>
          <div class="pct">${c.p} %</div>
          <div class="bar"><i style="width:${c.p/f.contrib[0].p*100}%"></i></div>
        </div>`).join('')}
    </div>
    <button class="disclose" onclick="document.getElementById('know').classList.toggle('open')">
      Ce qui compte, ce qui ne compte pas ↓
    </button>
    <div class="more">
      <ul>
        <li><b>L’étape agricole pèse 61 %</b> de l’empreinte alimentaire. Le transport, entre 6 et 14 % selon
            les produits : changer d’aliment pèse bien plus lourd que changer d’origine.</li>
        <li><b>Deux tiers de l’empreinte viennent des produits animaux</b>, et la viande bovine concentre
            l’essentiel des émissions de l’élevage.</li>
        <li><b>Le gaspillage</b> représente environ 4 % de l’empreinte nationale ; 129 kg de déchets
            alimentaires par personne et par an, dont 25 kg encore consommables.</li>
        <li><b>Le bio n’est pas un levier carbone</b> : ses rendements plus faibles compensent la baisse
            d’intrants. La saisonnalité, elle, se lit dans les données.</li>
      </ul>
      <div class="src">Sources : Insee/SDES 2018 · Carbone 4, cité dans le projet de SNBC 3 · ADEME.</div>
    </div>
  </div>

  <h2 class="sec">Les ${DB.foods.length} aliments de référence</h2>
  <input class="search" id="q" placeholder="Chercher un aliment" value="${esc(S.q)}">
  <div class="chips">
    <button class="chip" aria-pressed="${!S.group}" data-g="">Tout</button>
    ${groups.map(g => `<button class="chip" aria-pressed="${S.group===g}" data-g="${esc(g)}">${esc(g)}</button>`).join('')}
  </div>
  <div class="list">
    ${rows.length ? rows.map(x => `
      <button class="item" data-food="${x.s}">
        <div><div class="nm">${esc(x.n)}${x.x?'<span class="tag">estimé</span>':''}</div>
             <div class="gp">${esc(x.g)}</div></div>
        <div class="fe">${n1(x.t)}<small>kg CO₂e / kg</small></div>
        <div class="track"><i style="width:${(x.t/FE_MAX*100).toFixed(1)}%"></i></div>
      </button>`).join('') : `<div class="empty">Aucun aliment ne correspond. Essayez « lentilles » ou « bœuf ».</div>`}
    <div class="count">${rows.length} référence${rows.length>1?'s':''} · échelle commune 0 → ${n0(FE_MAX)} kg CO₂e/kg
      · AGRIBALYSE 3.2, plus ${DB.foods.filter(f=>f.x).length} valeurs estimées signalées</div>
  </div>`;

  $('#q').oninput = e => { S.q = e.target.value; const p = e.target.selectionStart; renderBiblio();
    const q2 = $('#q'); q2.focus(); q2.setSelectionRange(p,p); };
  view.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.group = b.dataset.g; renderBiblio(); });
  view.querySelectorAll('[data-food]').forEach(b => b.onclick = () => foodSheet(b.dataset.food));
}

function foodSheet(slug){
  const x = F.get(slug);
  const st = x.e || [];
  const sum = st.reduce((a,b) => a+b, 0) || x.t;
  openSheet(`
    <div class="gp" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">${esc(x.g)}</div>
    <h3>${esc(x.n)}${x.x?'<span class="tag">estimé</span>':''}</h3>
    <div class="small mute">${n2(x.t)} kg CO₂e par kilo · ${n2(x.t*x.p/1000)} kg pour une portion de ${x.p} g</div>
    ${st.length ? `
      <div class="stack">${st.map((v,i)=>`<i style="width:${(v/sum*100).toFixed(2)}%;background:${SC[i]}"></i>`).join('')}</div>
      <div class="stagelist">
        ${st.map((v,i)=>`<i class="dot" style="background:${SC[i]}"></i>
          <span>${STAGES[i]}</span><span class="sv">${(v/sum*100).toFixed(0)} %</span>`).join('')}
      </div>
      <div class="hr"></div>
      <p class="small">La part agricole atteint ${(st[0]/sum*100).toFixed(0)} % : c’est là que se joue
      l’essentiel, pas dans l’emballage ni le transport.</p>`
    : `<p class="small mute" style="margin-top:12px">Décomposition par étape non publiée pour cet aliment.</p>`}
    ${x.x ? `<div class="note"><b>Valeur estimée, absente de la base ADEME.</b><br>
      Reprise de « ${esc(x.xs)} » : ${esc(x.xn)}. À remplacer par la ligne AGRIBALYSE correspondante
      si l’aliment devient structurant dans vos saisies.</div>` : ''}
    ${x.m ? `<div class="hr"></div><div class="unit">Saison en France</div>
      <div class="months">${MONTHS.map((m,i)=>`<i class="${x.m.includes(i+1)?'on':''}">${m}</i>`).join('')}</div>` : ''}
    <div class="hr"></div>
    <div class="actions">
      <button class="btn btn-1" onclick="quickAdd('${x.s}')">Ajouter à la saisie</button>
      <button class="btn btn-2" onclick="closeSheet()">Fermer</button>
    </div>
    <div class="src" style="margin-top:12px">${x.x ? 'Estimation interne, dérivée d’ADEME / AGRIBALYSE 3.2'
      : 'Source : ADEME / AGRIBALYSE 3.2'} — ${esc(x.s)}</div>`);
}
function quickAdd(slug){
  const x = F.get(slug);
  S.draft.push([slug, x.p]); S.path = 'compose'; closeSheet(); go('saisie');
  toast(`${x.n} ajouté à la saisie`);
}

/* ============================ onglet 2 — saisie ============================ */
const COM_COEF = {entree:0.55, plat:1, dessert:1};
function comPortion(slug){
  const f = F.get(slug);
  if(S.comCat === 'dessert') return SWEET.has(slug) ? f.p : Math.round(f.p * 0.6);
  return Math.round(f.p * COM_COEF[S.comCat] / 5) * 5 || 5;
}
function comLabel(slug){
  const base = F.get(slug).p, q = comPortion(slug);
  if(S.comCat === 'plat') return `portion type ${base} g`;
  if(S.comCat === 'dessert') return SWEET.has(slug) ? `dessert, ${q} g` : `hors dessert type, ${q} g`;
  return `entrée, ${q} g (type ${base} g)`;
}

function renderSaisie(){
  const dayHist = S.hist.filter(e => e.d === today());
  const byMeal = {}; MEALS.forEach(m => byMeal[m.k] = 0);
  dayHist.forEach(e => byMeal[e.m] += kgOf(e.l));
  const dayTot = Object.values(byMeal).reduce((a,b)=>a+b,0);
  const draftKg = kgOf(S.draft);
  const nrm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe');
  const dq = nrm(S.dishQ.trim());
  const dishes = DB.dishes.filter(d => d.m.includes(S.meal))
    .filter(d => !dq || nrm(d.n).includes(dq) || d.l.some(([sl]) => nrm(F.get(sl).n).includes(dq)))
    .map(d => ({...d, kg:kgOf(d.l)})).sort((a,b) => a.kg - b.kg);
  const favs = S.favs.map((f,i) => ({...f, i, kg:kgOf(f.l)}))
    .sort((a,b) => (b.std?1:0)-(a.std?1:0) || a.kg-b.kg);
  const missing = DB.standards.filter(d => !S.favs.some(f => f.n === d.n)).length;

  const editing = S.editId && S.hist.find(x => x.id === S.editId);
  view.innerHTML = `
  ${editing ? `<div class="demo edit">
    Modification d’un repas du ${dLabel(editing.d)}.
    <button id="canceledit">Annuler</button></div><div style="height:12px"></div>` : ''}
  <h2 class="sec">Aujourd’hui — ${n2(dayTot)} kg CO₂e enregistrés</h2>
  <div class="card">${gauge(byMeal, dayTot)}</div>

  <h2 class="sec">1 · Quel repas ?</h2>
  <div class="seg">${MEALS.map(m => `
    <button data-meal="${m.k}" aria-pressed="${S.meal===m.k}">
      <b>${m.l.replace('Petit-déjeuner','Petit-déj')}</b><small>${byMeal[m.k]>0?n2(byMeal[m.k])+' kg':m.s}</small>
    </button>`).join('')}</div>

  <h2 class="sec">2 · Comment le saisir ?</h2>
  <div class="paths">
    <button data-path="types"   aria-pressed="${S.path==='types'}">Plats types</button>
    <button data-path="favs"    aria-pressed="${S.path==='favs'}">Mes favoris</button>
    <button data-path="compose" aria-pressed="${S.path==='compose'}">Composer</button>
  </div>

  ${S.path === 'types' ? `
    <input class="search" id="dq" placeholder="Chercher un plat" value="${esc(S.dishQ)}" style="margin:2px 0 10px">
    <div class="list">
    ${dishes.length ? dishes.map(d => `<div class="dish">
      <div class="top">
        <button class="nm" data-dish="${esc(d.n)}" style="text-align:left">${esc(d.n)}</button>
        <span class="kg">${n2(d.kg)}</span>
        <button class="add" data-adddish="${esc(d.n)}">Ajouter</button>
      </div>
      ${S.openDish === d.n ? `<div class="comp">${d.l.map(([s,g]) => `${F.get(s).n.toLowerCase()} ${g} g`).join(' · ')}</div>` : ''}
      <div class="bar"><i style="width:${clamp(d.kg/(BUDGET_J*1.5)*100,2,100)}%;background:${d.kg>BUDGET_J?'var(--brick)':'var(--forest-2)'}"></i></div>
    </div>`).join('') + `<div class="count">Barre pleine = un repas à lui seul dépasse le budget d’une journée entière.</div>`
    : `<div class="empty">Aucun plat ne correspond${S.dishQ?` à « ${esc(S.dishQ)} »`:''}. Essayez « pâtes » ou « tofu », ou composez librement.</div>`}
  </div>` : ''}

  ${S.path === 'favs' ? `<div class="list">
    ${favs.length ? favs.map(d => `<div class="dish">
      <div class="top">
        <span class="nm">${esc(d.n)}${d.std ? '<span class="tag">standard</span>' : ''}</span>
        <span class="kg">${n2(d.kg)}</span>
        <button class="add" data-addfav="${d.i}">Ajouter</button>
        <button class="rm" data-delfav="${d.i}" aria-label="Supprimer ${esc(d.n)}">×</button>
      </div>
      <div class="comp">${d.l.map(([s,g]) => `${F.get(s).n.toLowerCase()} ${g} g`).join(' · ')}</div>
      <div class="bar"><i style="width:${clamp(d.kg/(BUDGET_J*1.5)*100,2,100)}%;background:${d.kg>BUDGET_J?'var(--brick)':'var(--forest-2)'}"></i></div>
    </div>`).join('')
    : `<div class="empty">Plus aucun favori. Composez un repas puis gardez-le en favori, ou rétablissez les repas standard.</div>`}
    ${missing ? `<div class="count"><button id="restd" style="text-decoration:underline">${missing > 1
      ? `Rétablir les ${missing} repas standard manquants` : 'Rétablir le repas standard manquant'}</button></div>`
      : `<div class="count">Le féculent et le légume sont identiques dans les six standards : seule la
      protéine change, l’écart affiché est donc entièrement le sien.</div>`}
  </div>` : ''}

  ${S.path === 'compose' ? `<div class="card">
    <div class="unit" style="margin-bottom:6px">Type de service</div>
    <div class="seg" style="margin-bottom:11px">
      ${[['entree','Entrée','× 0,55'],['plat','Plat','portion pleine'],['dessert','Dessert','sucré']]
        .map(([k,l,h]) => `<button data-com="${k}" aria-pressed="${S.comCat===k}"><b>${l}</b><small>${h}</small></button>`).join('')}
    </div>
    <div class="pick">
      <input id="cf" type="text" inputmode="search" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="Tapez les premières lettres" value="${esc(S.pickQ)}">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div class="compose">
      <div class="chint" id="chint">${S.pickSlug
        ? `${esc(F.get(S.pickSlug).n)} · ${n1(F.get(S.pickSlug).t)} kg CO₂e/kg · ${comLabel(S.pickSlug)}`
        : `${DB.foods.length} aliments. Le service ajuste la quantité, corrigeable ensuite.`}</div>
      <input type="number" id="cq" inputmode="numeric" min="1" step="5" placeholder="g"
             value="${S.pickSlug ? comPortion(S.pickSlug) : ''}">
      <button class="go" id="cadd">Ajouter</button>
    </div>
  </div>` : ''}

  ${S.draft.length ? `<h2 class="sec">Le repas en cours</h2><div class="card">
    ${S.draft.map(([s,g],i) => `<div class="draft-line">
      <span class="nm">${esc(F.get(s).n)}</span>
      <span class="q">${g} g</span>
      <span class="kg">${n2(F.get(s).t*g/1000)}</span>
      <button class="rm" data-rm="${i}" aria-label="Retirer">×</button>
    </div>`).join('')}
    <div class="total">
      <div><div class="unit">Total — ${MEAL[S.meal].l.toLowerCase()}</div>
        <div class="small mute">${draftKg > BUDGET_J ? 'Ce seul repas dépasse le budget de la journée.'
          : `${Math.round(draftKg/BUDGET_J*100)} % du budget du jour.`}</div></div>
      <div class="v">${n2(draftKg)} <span class="unit">kg</span></div>
    </div>
    <div class="actions">
      <button class="btn btn-1" id="rec">${S.editId ? 'Mettre à jour le repas' : 'Enregistrer le repas'}</button>
      <button class="btn btn-2" id="fav">Garder en favori</button>
    </div>
  </div>` : ''}`;

  const dqEl = $('#dq');
  if(dqEl) dqEl.oninput = e => { S.dishQ = e.target.value; const p = e.target.selectionStart;
    renderSaisie(); const n = $('#dq'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const ce = $('#canceledit');
  if(ce) ce.onclick = () => { S.editId = null; S.draft = []; renderSaisie(); };
  view.querySelectorAll('[data-meal]').forEach(b => b.onclick = () => { S.meal = b.dataset.meal; renderSaisie(); });
  view.querySelectorAll('[data-path]').forEach(b => b.onclick = () => { S.path = b.dataset.path; renderSaisie(); });
  view.querySelectorAll('[data-dish]').forEach(b => b.onclick = () => {
    S.openDish = S.openDish === b.dataset.dish ? null : b.dataset.dish; renderSaisie(); });
  view.querySelectorAll('[data-adddish]').forEach(b => b.onclick = () => {
    const d = DB.dishes.find(x => x.n === b.dataset.adddish);
    d.l.forEach(l => S.draft.push([...l])); renderSaisie(); toast(`${d.n} ajouté`); });
  view.querySelectorAll('[data-addfav]').forEach(b => b.onclick = () => {
    const d = S.favs[+b.dataset.addfav];
    d.l.forEach(l => S.draft.push([...l])); renderSaisie(); toast(`${d.n} ajouté`); });
  view.querySelectorAll('[data-delfav]').forEach(b => b.onclick = () => {
    const d = S.favs.splice(+b.dataset.delfav, 1)[0]; save(); renderSaisie(); toast(`${d.n} supprimé`); });
  const rs = $('#restd');
  if(rs) rs.onclick = () => { addStandards(); renderSaisie(); toast('Repas standard rétablis'); };
  view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    S.draft.splice(+b.dataset.rm, 1); renderSaisie(); });

  const cf = $('#cf'), cq = $('#cq'), sg = $('#sugg');
  if(cf){
    const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                       .replace(/œ/g,'oe').replace(/æ/g,'ae').trim();
    const find = q => {
      const n = norm(q);
      if(!n) return [];
      const pre = [], sub = [], grp = [];
      DB.foods.forEach(f => {
        const fn = norm(f.n);
        if(fn.startsWith(n)) pre.push(f);
        else if(fn.includes(n)) sub.push(f);
        else if(norm(f.g).includes(n)) grp.push(f);
      });
      const byFe = (a,b) => b.t - a.t;
      const named = [...pre.sort(byFe), ...sub.sort(byFe)];
      // le repli par groupe ne sert que si aucun libellé ne correspond (« laitier », « poisson »…)
      return (named.length ? named : grp.sort(byFe)).slice(0, 8);
    };
    const findDish = q => {
      const n = norm(q);
      return n.length < 3 ? [] : DB.dishes.filter(d => norm(d.n).includes(n)).slice(0, 3);
    };
    const choose = slug => {
      const f = F.get(slug);
      S.pickSlug = slug; S.pickQ = f.n;
      cf.value = f.n; cq.value = comPortion(slug);
      sg.hidden = true; sg.innerHTML = '';
      $('#chint').textContent = `${f.n} · ${n1(f.t)} kg CO₂e/kg · ${comLabel(slug)}`;
    };
    const paint = () => {
      const r = find(cf.value), rd = findDish(cf.value);
      if(!r.length && !rd.length){ sg.hidden = true; sg.innerHTML = ''; return; }
      sg.innerHTML =
        r.map(f => `<button type="button" data-pick="${f.s}">
          <span class="nm">${esc(f.n)}${f.x ? '<span class="tag">estimé</span>' : ''}<i>${esc(f.g)}</i></span>
          <b>${n1(f.t)}</b></button>`).join('')
        + rd.map(d => `<button type="button" data-dishpick="${esc(d.n)}">
          <span class="nm">${esc(d.n)}<span class="tag">plat</span><i>${d.l.length} ingrédients</i></span>
          <b>${n2(kgOf(d.l))}</b></button>`).join('');
      sg.hidden = false;
      sg.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => choose(b.dataset.pick));
      sg.querySelectorAll('[data-dishpick]').forEach(b => b.onclick = () => {
        const d = DB.dishes.find(x => x.n === b.dataset.dishpick);
        d.l.forEach(l => S.draft.push([...l]));
        S.pickSlug = null; S.pickQ = '';
        renderSaisie(); toast(`${d.n} ajouté`);
      });
    };
    const add = () => {
      let slug = S.pickSlug;
      if(!slug){ const r = find(cf.value); if(r.length) slug = r[0].s; }
      if(!slug) return toast('Aucun aliment ne correspond.');
      S.draft.push([slug, +cq.value || comPortion(slug)]);
      S.pickSlug = null; S.pickQ = '';
      renderSaisie();
      const nx = $('#cf'); if(nx) nx.focus();
    };
    view.querySelectorAll('[data-com]').forEach(b => b.onclick = () => {
      S.comCat = b.dataset.com;
      if(S.pickSlug){ cq.value = comPortion(S.pickSlug);
        $('#chint').textContent = `${F.get(S.pickSlug).n} · ${n1(F.get(S.pickSlug).t)} kg CO₂e/kg · ${comLabel(S.pickSlug)}`; }
      view.querySelectorAll('[data-com]').forEach(x => x.setAttribute('aria-pressed', x.dataset.com===S.comCat));
    });
    cf.oninput = () => { S.pickSlug = null; S.pickQ = cf.value; paint(); };
    cf.onkeydown = e => {
      if(e.key === 'Enter'){ e.preventDefault(); const r = find(cf.value); if(r.length) choose(r[0].s); }
      if(e.key === 'Escape'){ sg.hidden = true; }
    };
    cf.onfocus = () => paint();
    cq.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } };
    $('#cadd').onclick = add;
    document.addEventListener('click', e => {
      if(sg && !sg.hidden && !e.target.closest('.pick')) sg.hidden = true;
    }, {once:true});
  }

  const rec = $('#rec');
  if(rec){
    rec.onclick = () => {
      const label = S.draft.length === 1 ? F.get(S.draft[0][0]).n : `${MEAL[S.meal].l} composé`;
      if(S.editId){
        const e = S.hist.find(x => x.id === S.editId);
        if(e){ e.m = S.meal; e.l = S.draft.map(l=>[...l]);
               if(e.n.endsWith('composé') || S.draft.length === 1) e.n = label; }
        S.editId = null; S.draft = []; save(); go('tracker'); toast('Repas mis à jour');
      } else {
        S.hist.push({id:'e'+Date.now(), d:today(), m:S.meal, n:label, l:S.draft.map(l=>[...l])});
        S.draft = []; save(); renderSaisie(); toast('Repas enregistré');
      }
    };
    $('#fav').onclick = () => openSheet(`
      <h3>Garder en favori</h3>
      <p class="small mute">Ce repas réapparaîtra dans « Mes favoris », ajoutable en une tape.</p>
      <input class="search" id="favname" value="${esc(MEAL[S.meal].l)} type" style="margin-top:6px">
      <div class="actions">
        <button class="btn btn-1" id="favok">Enregistrer</button>
        <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
      </div>`) || setTimeout(() => {
        $('#favok').onclick = () => {
          const name = $('#favname').value.trim() || 'Repas favori';
          S.favs.push({n:name, m:S.meal, l:S.draft.map(l=>[...l])}); save();
          closeSheet(); S.path = 'favs'; renderSaisie(); toast('Favori enregistré');
        };
      }, 0);
  }
}

/* ============================ onglet 3 — tracker ============================ */
function agg(){
  const days = {};
  S.hist.forEach(e => {
    const kg = kgOf(e.l);
    days[e.d] = days[e.d] || {tot:0, byMeal:{}};
    days[e.d].tot += kg;
    days[e.d].byMeal[e.m] = (days[e.d].byMeal[e.m] || 0) + kg;
  });
  const keys = Object.keys(days).sort();
  const tot = keys.reduce((a,k) => a + days[k].tot, 0);
  return {days, keys, tot, nd:keys.length, avg: keys.length ? tot/keys.length : 0};
}

function weeksSheet(a, last){
  const wBud = 7 * BUDGET_J;
  // regrouper par semaine (lundi)
  const wk = {};
  last.forEach(k => { const w = monday(k); (wk[w] = wk[w] || []).push(k); });
  const weeks = Object.keys(wk).sort().reverse();
  const dmax = Math.max(BUDGET_J * 1.35, ...last.map(k => a.days[k].tot));

  const body = weeks.map(w => {
    const dk = wk[w].sort();
    const wtot = dk.reduce((s,k) => s + a.days[k].tot, 0);
    const over = wtot > wBud;
    const rows = dk.map(k => {
      const d = a.days[k];
      const dd = new Date(k+'T12:00');
      const seg = MEALS.filter(m => d.byMeal[m.k])
        .map(m => `<i style="width:${(d.byMeal[m.k]/dmax*100).toFixed(1)}%;background:${m.c}"></i>`).join('');
      return `<div class="wkday">
        <div class="dd">${dd.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${dd.getDate()}</b></div>
        <div class="stack2">${seg}</div>
        <div class="kg2">${n2(d.tot)}</div>
      </div>`;
    }).join('');
    return `<div class="wkhead">
        <span class="wt">Semaine du ${new Date(w+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span>
        <span class="wv" style="color:${over?'var(--brick)':'var(--ink)'}">${n1(wtot)} / ${n1(wBud)} kg</span>
      </div>${rows}`;
  }).join('');

  openSheet(`
    <h3>Trois dernières semaines</h3>
    <p class="small mute">Chaque barre est une journée, découpée par repas. Le total de la semaine est
    comparé au budget hebdomadaire de ${n1(wBud)} kg.</p>
    <div class="dayleg" style="margin:2px 0 4px">
      ${MEALS.map(m => `<span><i class="dot" style="background:${m.c}"></i>${m.l}</span>`).join('')}
    </div>
    ${body || '<div class="empty">Aucune journée enregistrée.</div>'}`);
}

const RED    = new Set(DB.foods.filter(f => f.r).map(f => f.s));
const LEGU   = new Set(['lentilles','poischiches','haricotsrouges','tofu']);
const SWEET  = new Set(DB.foods.filter(f =>
  f.g === 'En-cas & boulangerie' ||
  ['banane','pomme','fraise','mangue','pasteque','melon','datte','poire','peche','abricot','raisin',

   'confiture','chocolat','glace'].includes(f.s)).map(f => f.s));

const RANKS  = [[0,'Trajectoire de départ'],[150,'Sous la moyenne française'],
                [500,'Trajectoire 2 °C'],[1200,'Trajectoire 1,5 °C'],[2500,'Budget 2050 tenu']];
const isVeg  = e => !e.l.some(([x]) => NONVEG.has(x));
const hasRed = e => e.l.some(([x]) => RED.has(x));
const hasLeg = e => e.l.some(([x]) => LEGU.has(x));
const monday = d => { const t = new Date(d+'T12:00'); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return iso(t); };
const CHALS = [
  {t:'Repas végétarien',        p:5,   r:'Un déjeuner ou un dîner sans viande ni poisson. Le petit-déjeuner ne compte pas : il est déjà végétarien neuf fois sur dix.'},

  {t:'Journée sans viande',     p:10,  r:'Bonus, en plus des repas. Deux repas principaux enregistrés au minimum, sinon la journée ne compte pas.'},
  {t:'Semaine sans viande rouge', p:40, r:'Cinq jours complets enregistrés, aucun bœuf, veau, kebab ni cheeseburger.'},
  {t:'Semaine sans viande',     p:100, r:'Bonus. Cinq jours complets enregistrés, aucune viande ni poisson.'},
  {t:'Semaine parfaite',        p:150, r:'Sept jours sur sept enregistrés et budget hebdomadaire tenu. La seule épreuve qui mesure vraiment l’objectif.'},

];

function scoring(){
  const days = {};
  S.hist.forEach(e => {
    const d = days[e.d] = days[e.d] || {kg:0, main:new Set(), veg:true, red:false};
    d.kg += kgOf(e.l);
    if(e.m !== 'encas') d.main.add(e.m);
    if(!isVeg(e)) d.veg = false;
    if(hasRed(e)) d.red = true;
  });
  const dk = Object.keys(days).sort();
  const ev = [];
  let saved = 0;

  S.hist.forEach(e => {
    if((e.m === 'dej' || e.m === 'din') && isVeg(e)){
      ev.push({d:e.d, t:'Repas végétarien', n:e.n, p:5});
      saved += Math.max(0, REF - kgOf(e.l));
    }
    if(hasLeg(e)) ev.push({d:e.d, t:'Repas de légumineuses', n:e.n, p:8});
  });
  const T = today();
  dk.forEach(d => {
    if(d < T && days[d].main.size >= 2 && days[d].veg) ev.push({d, t:'Journée sans viande', n:'', p:10});
  });

  const weeks = {};
  dk.forEach(d => { const w = monday(d);
    weeks[w] = weeks[w] || {days:[], kg:0}; weeks[w].days.push(d); weeks[w].kg += days[d].kg; });
  const wk = Object.keys(weeks).sort();
  wk.forEach(w => {
    const x = weeks[w];
    x.full = x.days.filter(d => days[d].main.size >= 2).length;
    x.noRed = x.days.every(d => !days[d].red);
    x.noMeat = x.days.every(d => days[d].veg);
    x.closed = w !== monday(T);
    if(!x.closed) return;                      // semaine en cours : rien n’est encore acquis
    if(x.full >= 5 && x.noRed)  ev.push({d:w, t:'Semaine sans viande rouge', n:'', p:40});
    if(x.full >= 5 && x.noMeat) ev.push({d:w, t:'Semaine sans viande', n:'', p:100});
    if(x.full >= 7 && x.kg <= 7*BUDGET_J) ev.push({d:w, t:'Semaine parfaite', n:'budget tenu', p:150});
  });
  const mo = {};
  dk.forEach(d => { const m = d.slice(0,7); mo[m] = mo[m] || {n:0, kg:0}; mo[m].n++; mo[m].kg += days[d].kg; });
  Object.entries(mo).forEach(([m,x]) => {
    if(m !== T.slice(0,7) && x.n >= 28 && x.kg <= x.n*BUDGET_J)
      ev.push({d:m+'-01', t:'Mois dans le budget', n:'', p:500}); });

  let cur = 0, best = 0, prev = null;
  dk.forEach(d => {
    const gap = prev ? (new Date(d) - new Date(prev))/864e5 : 1;
    if(gap > 1) cur = 0;
    if(days[d].main.size >= 2 && !days[d].red){ cur++; best = Math.max(best, cur); } else cur = 0;
    prev = d;
  });
  const total = ev.reduce((a,e) => a + e.p, 0);
  const count = t => ev.filter(e => e.t === t).length;
  return {days, dk, weeks, wk, ev, total, saved, cur, best, count};
}

function renderJeux(){
  const sc = scoring();
  const ri = RANKS.reduce((a,r,i) => sc.total >= r[0] ? i : a, 0);
  const next = RANKS[ri+1];
  const prog = next ? (sc.total - RANKS[ri][0]) / (next[0] - RANKS[ri][0]) : 1;
  const w = monday(today());
  const cw = sc.weeks[w] || {days:[], kg:0, full:0, noRed:true, noMeat:true};
  const wBud = 7 * BUDGET_J;
  const td = sc.days[today()] || {kg:0, main:new Set(), veg:true, red:false};
  const evs = [...sc.ev].sort((a,b) => b.d.localeCompare(a.d) || b.p - a.p).slice(0, 12);

  view.innerHTML = `
  <div class="card rank">
    <div class="kicker">Score</div>
    <div class="pts">${n0(sc.total)} <small>points</small></div>
    <div class="name">${RANKS[ri][1]}</div>
    <div class="prog"><i style="width:${(prog*100).toFixed(1)}%"></i></div>
    <div class="next">${next ? `${n0(next[0]-sc.total)} points avant « ${next[1]} »`
      : 'Dernier palier atteint.'}</div>
    <div class="aside">
      <div><div class="v">${n1(sc.saved)} kg</div><div class="l">CO₂e évités par vos<br>repas végétariens</div></div>
      <div><div class="v">${sc.cur} j</div><div class="l">Série en cours<br>sans viande rouge</div></div>
      <div><div class="v">${sc.best} j</div><div class="l">Meilleure série<br>à ce jour</div></div>
    </div>
  </div>

  <h2 class="sec">Cette semaine</h2>
  <div class="card wnow">
    <div class="l">Jours complets enregistrés</div><div class="v">${cw.full} / 7</div>
    <div class="tr"><i style="width:${(cw.full/7*100).toFixed(0)}%;background:var(--forest-2)"></i></div>
    <div class="l">Budget de la semaine</div>
    <div class="v" style="color:${cw.kg>wBud?'var(--brick)':'var(--ink)'}">${n1(cw.kg)} / ${n1(wBud)}</div>
    <div class="tr"><i style="width:${Math.min(100,cw.kg/wBud*100).toFixed(0)}%;background:${cw.kg>wBud?'var(--brick)':'var(--straw)'}"></i></div>
    <div class="l">Viande rouge</div><div class="v">${cw.noRed ? 'aucune' : 'détectée'}</div>
    <div class="l">Viande ou poisson</div><div class="v">${cw.noMeat ? 'aucun' : 'détecté'}</div>
    <div class="l">Journée en cours</div>
    <div class="v">${td.main.size >= 2 && td.veg ? '+10 à minuit'
      : td.main.size < 2 ? `${td.main.size} / 2 repas` : 'viande enregistrée'}</div>
    <div class="tr" style="background:none;height:0"></div>
    <div class="l small mute" style="grid-column:1/-1">${
      cw.full >= 7 && cw.kg <= wBud ? 'Semaine parfaite acquise : 150 points.'
      : cw.kg > wBud ? `Budget dépassé de ${n1(cw.kg-wBud)} kg : la semaine parfaite est hors d’atteinte, les autres épreuves restent ouvertes.`
      : `Il reste ${n1(wBud-cw.kg)} kg et ${Math.max(0,7-cw.full)} jour(s) à enregistrer pour la semaine parfaite.`}</div>
  </div>

  <h2 class="sec">Le barème</h2>
  <div class="list">
    ${CHALS.map(c => { const n = sc.count(c.t); return `
      <div class="chal">
        <div class="st ${n?'on':'off'}">${n?'●':'○'}</div>
        <div class="nm">${c.t}</div>
        <div class="pt">${c.p} <span class="unit">pts</span></div>
        <div class="rule">${c.r}</div>
        ${n ? `<div class="got">Validé ${n} fois · ${n0(n*c.p)} points</div>` : ''}
      </div>`; }).join('')}
    <div class="count">Les points récompensent la régularité, pas le carbone : un même geste peut valider
      plusieurs épreuves. La colonne carbone reste le tracker.</div>
  </div>

  <h2 class="sec">Derniers points</h2>
  <div class="card journal">
    ${evs.length ? evs.map(e => `<div class="j">
      <div class="dt"><b>${new Date(e.d+'T12:00').getDate()}</b>${new Date(e.d+'T12:00').toLocaleDateString('fr-FR',{month:'short'})}</div>
      <div class="nm">${esc(e.t)}<i>${esc(e.n || '—')}</i></div>
      <div class="kg">+${e.p}</div>
    </div>`).join('') : `<div class="empty">Aucun point pour l’instant. Un déjeuner végétarien en rapporte cinq.</div>`}
  </div>

  <h2 class="sec">La règle du jeu</h2>
  <div class="card">
    <p class="small">Les points d’un repas sont acquis à la saisie. Les bonus de journée, de semaine et de
    mois ne se déclenchent qu’à la clôture de la période : le score ne peut donc jamais reculer parce que
    vous avez enregistré un repas de plus.</p>
    <div class="hr"></div>
    <p class="small">Chaque palier vaut au moins le double de la somme de ce qu’il contient : une journée
    sans viande rapporte 25 points avec ses repas, une semaine sans viande 100 de plus. Aucun point n’est
    jamais retiré, et une série interrompue laisse sa meilleure valeur affichée.</p>
    <div class="hr"></div>
    <div class="src">Référence des kg évités : le repas moyen français à ${n2(REF)} kg CO₂e, calculé sur les
    ${DB.dishes.length} plats types pondérés par leur fréquence. Budget retenu : ${n0(DB.facts.budget)} kg CO₂e
    par an, soit ${n2(BUDGET_J)} kg par jour.</div>
  </div>`;
}

/* ============================ navigation ============================ */
function go(tab){
  if(S.tab === 'saisie' && tab !== 'saisie' && S.editId){ S.editId = null; S.draft = []; }
  S.tab = tab; topbar();
  document.querySelectorAll('#tabbar button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  window.scrollTo(0,0);
  ({biblio:renderBiblio, saisie:renderSaisie, tracker:renderTracker, jeux:renderJeux})[tab]();
}
document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => go(b.dataset.tab));

function themeSheet(){
  const opts = [
    ['light','Clair','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>'],
    ['dark','Sombre','<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>'],
    ['system','Système','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>']
  ];
  openSheet(`
    <h3>Réglages</h3>
    <div class="setrow">
      <div class="l">Apparence<i>« Système » suit le réglage de l’iPhone.</i></div>
      <div class="themeseg" id="tseg">
        ${opts.map(([k,l,ic]) => `<button data-theme-opt="${k}" aria-pressed="${themeMode===k}">${ic}${l}</button>`).join('')}
      </div>
    </div>
    <div class="setrow">
      <div class="l">Version<i>Carbon FOODprint · données ADEME / AGRIBALYSE 3.2</i></div>
    </div>`);
  $('#tseg').querySelectorAll('[data-theme-opt]').forEach(btn => btn.onclick = () => {
    applyTheme(btn.dataset.themeOpt);
    $('#tseg').querySelectorAll('[data-theme-opt]').forEach(x =>
      x.setAttribute('aria-pressed', x.dataset.themeOpt === themeMode));
  });
}

function topbar(){
  const t = S.hist.filter(e => e.d === today()).reduce((a,e) => a + kgOf(e.l), 0);
  $('#topToday').innerHTML = `Aujourd’hui<b>${n2(t)} kg</b>`;
}
themeMode = readTheme(); applyTheme(themeMode);
const gear = document.getElementById('gear');
if(gear) gear.onclick = themeSheet;
if(!load()) seed();
if(!S.stdInit) addStandards();
go('saisie');
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

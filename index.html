    const fallback = () => {
      openSheet(`<h3>Sauvegarde</h3>
        <p class="small mute">Le navigateur a refusé la copie automatique. Sélectionnez tout le texte
        ci-dessous et copiez-le à la main.</p>
        <textarea class="search" rows="8" readonly
          style="width:100%;font-family:var(--mono);font-size:11px">${esc(d)}</textarea>`);
    };
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(d).then(() => toast('Sauvegarde copiée')).catch(fallback);
    else fallback();
  };
  $('#impo').onclick = () => {
    openSheet(`<h3>Restaurer une sauvegarde</h3>
      <p class="small mute">Collez le texte copié depuis un autre appareil. Il remplacera l’historique
      et les favoris présents.</p>
      <textarea id="imp" class="search" rows="6"
        style="width:100%;font-family:var(--mono);font-size:11px"></textarea>
      <div class="actions">
        <button class="btn btn-1" id="impok">Restaurer</button>
        <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
      </div>`);
    $('#impok').onclick = () => {
      try{
        const o = JSON.parse($('#imp').value);
        if(!Array.isArray(o.hist)) throw new Error('format');
        S.hist = o.hist; S.favs = Array.isArray(o.favs) ? o.favs : []; save();
        closeSheet(); renderTracker(); toast(`${S.hist.length} repas restaurés`);
      }catch(e){ toast('Sauvegarde illisible'); }
    };
  };
}

/* ---- conseil de budget ----
   On ne raisonne PAS sur des moyennes de catégorie : elles mentent, parce qu'un poulet rôti
   à 0,96 kg tient là où la moyenne des plats à viande blanche (1,22) ne tiendrait pas.
   On regarde ce qui rentre réellement dans le budget restant. */
function mainDishes(){
  /* On écarte les plats de restaurant : le conseil du soir propose ce qui rentre
     encore dans le budget, et suggérer une pizza d'une enseigne précise à
     quelqu'un qui dîne chez lui n'aurait pas de sens. */
  const mois = new Date().getMonth();
  return DISHES().filter(d => !d.src && d.m.some(m => m === 'dej' || m === 'din'))
    .map(d => ({d, n:d.n, k:kgOf(d.l),
                /* Part de saison au mois courant, et `rec` pour dire si le plat
                   est ouvrable : seul un plat qui porte ses libellés source et
                   son lien mérite d'être cliqué. */
                sais: saisPart(d.l, mois),
                rec: !!(d.lab && d.u),
                veg: !d.l.some(([x]) => NONVEG.has(x)),
                red: d.l.some(([x]) => RED.has(x)),
                /* Viande rouge et crevettes : les deux postes que le conseil du
                   soir dit d'éviter. Il ne peut donc pas les nommer juste après,
                   même s'ils rentrent encore dans le budget restant — les
                   crevettes à 20,3 kg/kg passent souvent, en petite portion. */
                hvy: d.l.some(([x]) => RED.has(x) || x === 'crevettes')}));
}
function whenWord(){
  const h = new Date().getHours();
  return h < 14 ? 'à midi' : h < 21 ? 'ce soir' : 'demain';
}
const kgOrG = x => x >= 1 ? n1(x) + ' kg' : n0(x*1000) + ' g';

function budgetTip(kg){
  const when = whenWord();
  const O = objDay();

  /* Référence du conseil : le plus strict du budget 2050 et de l'objectif
     personnel. Le conseil ne peut ainsi jamais être plus permissif que le seuil
     soutenable, et devient plus exigeant si l'utilisateur l'a voulu. Avec le
     curseur actuel — 700 kg/an au minimum, soit le budget lui-même — c'est
     toujours le budget qui l'emporte : cette garde ne mordra que si cette borne
     descend un jour. */
  const rest = (O != null ? Math.min(BUDGET_J, O) : BUDGET_J) - kg;
  const rang = d => (d.sais == null || d.sais >= SAIS_MIN) ? 0 : 1;
  const ordre = (a, b) => rang(a) - rang(b) || (b.rec?1:0) - (a.rec?1:0) || b.k - a.k;
  /* Ordre de choix, dans cet ordre et pas un autre :
       1. le carbone — ne sont candidats que les plats qui rentrent dans `rest` ;
       2. la saison — à budget tenu, un plat de saison passe devant ;
       3. le poids décroissant — à saison égale, le plus généreux qui rentre
          encore, pour ne pas proposer une soupe quand un vrai plat tenait ;
       4. les plats ouvrables — une recette qu'on peut suivre vaut mieux qu'un
          nom seul. Départage en dernier, jamais en filtre : avec quatre recettes
          en base, filtrer dessus reviendrait à répéter les mêmes quatre noms.
     Un plat sans légume noté (sais null) n'est ni favorisé ni pénalisé. */
  const fits = mainDishes().filter(d => d.k <= rest).sort(ordre);

  /* Budget 2050 dépassé, mais l'objectif personnel garde de la marge. On le dit :
     c'est la cible que l'utilisateur s'est fixée, et la lui taire rendrait la
     journée décourageante alors qu'elle reste tenable de son point de vue.

     Réservé aux objectifs de 1 500 kg/an ou moins. Au-delà, la cible est si lâche —
     jusqu'à 2 500, soit au-dessus de la moyenne française à 2 000 — que
     « c'est encore jouable » serait de la complaisance : on renverrait un
     encouragement à quelqu'un qui n'a presque rien changé. */
  if(rest <= 0 && O != null && S.prof.objKg <= 1500 && kg <= O){
    const marge = O - kg;
    const ok = mainDishes().filter(d => d.k <= marge && !d.hvy).sort(ordre);
    return {cls:'warn', ic:'•',
      tx:`Le budget 2050 est dépassé de <b>${kgOrG(-rest)}</b>, mais ton objectif perso reste
          jouable : il te reste <b>${kgOrG(marge)}</b> dessus.${
        ok.length ? ` ${esc(ok[0].n)} ${when} et c’est tenu.` : ''}`, plat:ok[0]};
  }

  if(rest <= 0) return {cls:'warn', ic:'!',
    tx:`Budget dépassé de <b>${kgOrG(-rest)}</b>. Aucun drame : ${
      when === 'demain' ? 'demain repart de zéro' : `un repas léger ${when} et demain repart de zéro`}.`};

  /* Les plats nommés ici doivent tenir la promesse de la phrase : ni viande
     rouge, ni crevettes. Sans ce filtre le conseil se contredisait d'une
     proposition à l'autre. */
  const meat = fits.filter(d => !d.veg && !d.hvy);
  if(meat.length >= 5) return {cls:'', ic:'→',
    tx:`On se fait plaisir ${when}, évite juste les crevettes et la viande rouge pour rester
        dans le budget. ${esc(meat[0].n)}${
      meat[1] ? ', ' + esc(meat[1].n.toLowerCase()) : ''} : tu as <b>${kgOrG(rest)}</b>.`, plat:meat[0]};

  if(meat.length) return {cls:'', ic:'→',
    tx:`<b>${esc(meat[0].n)}</b>${meat[1] ? ' ou ' + esc(meat[1].n.toLowerCase()) : ''} ${when} ?
        Il te reste ${kgOrG(rest)}, ça rentre pile.`, plat:meat[0]};


  if(fits.length >= 3) return {cls:'', ic:'→',
    tx:`Végé ${when} et c’est dans la poche : ${esc(fits[0].n.toLowerCase())}, ${esc(fits[1].n.toLowerCase())}.
        Il te reste <b>${kgOrG(rest)}</b>.`, plat:fits[0]};

  if(fits.length) return {cls:'', ic:'→',
    tx:`<b>${esc(fits[0].n)}</b> ${when} ? Il te reste ${kgOrG(rest)}, ça rentre pile.`, plat:fits[0]};

  return {cls:'warn', ic:'!',
    tx:`Plus que <b>${kgOrG(rest)}</b>. Une soupe, une compote, et la journée est sauvée.`};
}

/* ---------------- fiche d'une recette du référentiel ----------------
   Le conseil du Tracker nomme un plat ; cliquer dessus doit ouvrir ce plat. On
   réutilise la langue visuelle de la fiche du feed — puces d'ingrédients, chips,
   ligne de source — plutôt que d'inventer un écran.

   Les ingrédients s'affichent avec le libellé de la source quand le plat en
   porte un : « ½ oignon » et non « Oignon · 60 g ». Les grammages restent en
   dessous, en petit, parce que ce sont eux qui font le calcul et qu'on doit
   pouvoir les vérifier. Un plat sans `lab` retombe sur les noms de la base.

   Pas d'onglet Préparation : les étapes d'une recette sont l'œuvre de son
   auteur, on ne les recopie pas. La fiche renvoie à la source. */
function recetteSheet(nom){
  const d = DB.dishes.find(x => x.n === nom);
  if(!d) return;
  const kg = kgOf(d.l), mois = new Date().getMonth();
  const sais = saisPart(d.l, mois);
  const veg = !d.l.some(([s]) => NONVEG.has(s));
  const red = d.l.some(([s]) => RED.has(s));
  const alg = algOf(d.l);
  const alx = (d.alx || []).filter(a => !alg.includes(a));
  const host = d.u ? (d.u.match(/^https?:\/\/(?:www\.)?([^\/]+)/) || [])[1] : null;

  openSheet(`
    <div class="unit">Idée de recette${d.cui ? ' · ' + esc(CUIS[d.cui] || d.cui) : ''}</div>
    <h3 style="margin:2px 0 3px">${esc(d.n)}</h3>
    <div class="small mute">${n2(kg)} kg CO&#8322;e par personne · ${
      n0(kg / BUDGET_J * 100)} % du budget du jour</div>

    <div class="rchips" style="padding-left:0; padding-right:0">
      <span class="rchip">${red ? 'Viande rouge' : veg ? 'Végétarien' : 'Viande blanche'}</span>
      ${sais != null ? `<span class="rchip">${n0(sais)} % de saison en ${MOIS_L[mois]}</span>` : ''}
      ${d.src_n ? `<span class="rchip">${esc(d.src_n)}</span>` : ''}
    </div>

    <div class="hr"></div>
    <div class="unit">Ingrédients pour une personne</div>
    <ul class="ring">
      ${d.l.map(([s, g], i) => {
        const f = F.get(s);
        const lab = (d.lab && d.lab[i]) ? d.lab[i] : (f ? f.n : s);
        return `<li><span>${esc(lab)}
          <span class="small mute" style="display:block; font-family:var(--mono); font-size:10.5px">${
            n0(g)} g · ${f ? esc(f.n) : '?'}</span></span></li>`;
      }).join('')}
    </ul>

    ${nuBlock(d.l)}

    <div class="hr"></div>
    <div class="unit">Allergènes</div>
    <p class="small" style="margin:6px 0 0">${
      alg.length ? alg.map(a => esc(ALG_N[a] || a)).join(' · ') : 'Aucun parmi ceux que la base connaît.'}</p>
    ${alx.length ? `<p class="small" style="margin:6px 0 0; color:var(--brick)">Déclarés en plus par
      la source : ${alx.map(a => esc(ALG_N[a] || a)).join(' · ')}.</p>` : ''}
    <div class="src" style="margin-top:8px">Liste déduite des ingrédients, non de l&#8217;étiquette.
      Les épices détaillées, les additifs et les traces d&#8217;atelier ne sont pas modélisés :
      vérifiez l&#8217;emballage en cas d&#8217;allergie.</div>

    ${d.u ? `<div class="hr"></div>
      <div class="unit">Recette et préparation</div>
      <p class="small" style="margin:6px 0 0">Les étapes sont chez
        ${d.src_n ? esc(d.src_n) : 'la source'}, à qui elles appartiennent :
        ${lien(d.u)}${host ? ` <span class="mute">(${esc(host)})</span>` : ''}</p>` : ''}

    <button class="btn btn-1" id="rc_go" style="margin-top:14px">Saisir ce plat</button>`);

  /* « Saisir ce plat » démarre un repas neuf plutôt que de pousser dans le
     brouillon courant : depuis le Tracker, on ne sait pas à quel repas
     l'utilisateur pense, et déposer des lignes dans une saisie qu'il n'a pas
     ouverte le laisserait devant un écran d'accueil au brouillon mystérieux.
     On le mène donc au choix du repas, le plat prêt à être repris — `dishQ` le
     place en tête de la recherche du composeur. */
  const btn = $('#rc_go');
  if(btn) btn.onclick = () => {
    S.step = 'meal'; S.draft = []; S.wiz = null; S.recPend = d.n;
    closeSheet(); go('saisie');
    toast(`Choisissez le repas, ${d.n.toLowerCase()} vous attend`);
  };
}
const CUIS = {traditionnelle:'Traditionnelle', francaise:'Française',
  mediterraneenne:'Méditerranéenne', italienne:'Italienne', asiatique:'Asiatique',
  indienne:'Indienne', orientale:'Orientale', mexicaine:'Mexicaine',
  thai:'Thaïlandaise'};
const MOIS_L = ['janvier','février','mars','avril','mai','juin',
  'juillet','août','septembre','octobre','novembre','décembre'];

/* ==================== cadrans jour et semaine ====================
   Deux cadrans identiques dans leur construction : l'arc est la consommation
   décomposée par repas, les deux traits radiaux sont le budget soutenable et
   l'objectif du profil. L'échelle englobe toujours les trois, sinon un repère
   sortirait du cadran dès qu'il est dépassé. */

const objDay = () => (S.prof && S.prof.objKg != null) ? S.prof.objKg / 365 : null;

/* semaine courante, lundi en tête */
function weekDays(){
  const now = new Date(today() + 'T12:00');
  const dow = (now.getDay() + 6) % 7;
  const out = [];
  for(let i = 0; i < 7; i++){
    const d = new Date(now); d.setDate(now.getDate() - dow + i); out.push(iso(d));
  }
  return out;
}

function donut(o){
  const R = 40, C = 2 * Math.PI * R, sc = o.scale || 1;
  let acc = 0;
  const arcs = (o.segs || []).filter(x => x.v > 0).map(x => {
    const len = Math.max(0, Math.min(x.v, sc - acc)) / sc * C;
    const off = -acc / sc * C;
    acc += x.v;
    return `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${x.c}" stroke-width="10"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}"
      stroke-dashoffset="${off.toFixed(2)}"/>`;
  }).join('');

  /* Le budget traverse la bande, l'objectif se pose à l'extérieur. La
     distinction est positionnelle et non chromatique, parce que --straw est
     aussi la couleur des en-cas : un repère coloré posé dans la bande
     deviendrait indiscernable d'un segment de repas. */
  const ticks = (o.ticks || []).filter(t => t.v > 0 && t.v <= sc).map(t => {
    const ang = (t.v / sc * 360 - 90) * Math.PI / 180;
    const cx = Math.cos(ang), cy = Math.sin(ang);
    const r1 = t.out ? 46.5 : 33, r2 = t.out ? 49 : 47;
    return `<line x1="${(50 + cx*r1).toFixed(2)}" y1="${(50 + cy*r1).toFixed(2)}"
      x2="${(50 + cx*r2).toFixed(2)}" y2="${(50 + cy*r2).toFixed(2)}"
      stroke="${t.c}" stroke-width="${t.out ? 3.4 : 2.6}" stroke-linecap="round"/>`;
  }).join('');

  return `<svg viewBox="0 0 100 100" class="dnt" aria-hidden="true">
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <g transform="rotate(-90 50 50)">${arcs}</g>
    ${ticks}
    <text x="50" y="50" class="dv" fill="${o.col}">${o.big}</text>
    <text x="50" y="62" class="du">${o.unit}</text>
  </svg>`;
}

/* Les données des deux cadrans, calculées une fois et réutilisées par les
   fiches de détail. */
/* Réglette : barre remplie du réalisé, deux repères nommés. L'échelle englobe
   les trois valeurs, sinon un repère sortirait du cadre. */
/* Réglette : la journée en barre pleine, les repères en traits verticaux.
   Trois repères désormais, dont la moyenne française. Les libellés ne sont plus
   posés au-dessus de leur trait mais rassemblés en légende sous la barre : à deux
   repères ils se croisaient déjà quand les valeurs étaient proches, à trois ils
   se chevaucheraient systématiquement.

   L'échelle englobe la moyenne française, ce qui écrase la partie gauche mais
   raconte l'essentiel : le budget 2050 vaut un peu plus du tiers de ce qu'un
   Français consomme aujourd'hui. C'est le rapport qu'on veut voir. */
function reglette(o){
  const refs = [
    {v:o.bud, l:'Budget 2050', c:'var(--ink)'},
    o.obj != null ? {v:o.obj, l:'Objectif', c:'var(--straw)'} : null,
    o.fr ? {v:o.fr, l:'Français moyen', c:'var(--brick)'} : null,
  ].filter(Boolean);
  const sc = Math.max(o.tot, ...refs.map(r => r.v)) * 1.06;
  const pos = v => Math.max(1.5, Math.min(98.5, v / sc * 100));
  const col = o.tot <= (o.obj != null ? Math.min(o.obj, o.bud) : o.bud) ? 'var(--forest)'
            : o.tot <= Math.max(o.obj || 0, o.bud) ? 'var(--s4)' : 'var(--brick)';
  return `<div class="rgl">
    <div class="wrap">
      <div class="bar"><i style="width:${pos(o.tot)}%;background:${col}"></i></div>
      ${refs.map(r => `<div class="mk" style="left:${pos(r.v)}%;background:${r.c}"></div>`).join('')}
    </div>
    <div class="rgll">${refs.map(r => `<span><i style="background:${r.c}"></i>${
      r.l} <b>${n2(r.v)}</b></span>`).join('')}</div>
    <div class="cap">${o.cap || ''}</div>
  </div>`;
}

function duoData(a){
  const t = today(), od = objDay();

  const dd = a.days[t] || {tot:0, byMeal:{}};
  const day = {tot:dd.tot, byMeal:dd.byMeal, bud:BUDGET_J, obj:od};
  day.scale = Math.max(day.bud, od || 0, day.tot) * 1.06;
  day.over = day.tot > day.bud;

  const wk = weekDays();
  /* Le cadre de référence s'arrête à aujourd'hui. Un jour à venir n'est pas un
     jour manqué : le compter comme tel afficherait « 2 j sur 7 » un mercredi et
     ferait passer quatre jours qui n'existent pas encore pour des oublis. */
  const elapsed = wk.filter(d => d <= t);
  const log = elapsed.filter(d => a.days[d]);
  const miss = elapsed.filter(d => !a.days[d]);
  const byMeal = {};
  log.forEach(d => MEALS.forEach(m => {
    byMeal[m.k] = (byMeal[m.k] || 0) + (a.days[d].byMeal[m.k] || 0);
  }));
  /* Le cadran hebdomadaire est un épuisement de budget, pas une intensité : il
     répond à « suis-je dans les temps pour la semaine ». Ses repères sont donc
     ceux de la semaine pleine, et l'allure attendue à ce stade dit où l'on
     devrait en être. Mettre l'objectif au prorata des jours renseignés en
     faisait une cible mobile : sauter un jour la rétrécissait, si bien qu'on ne
     pouvait jamais être en retard sur son propre engagement.
     L'intensité, elle, reste calculée sur les seuls jours renseignés et vit
     dans la fiche de détail, où elle ne peut pas être confondue. */
  const n = log.length;
  const week = {days:wk, elapsed:elapsed.length, log, n, miss:miss.length,
                tot:log.reduce((x,d) => x + a.days[d].tot, 0), byMeal,
                bud:BUDGET_J * 7,
                obj:od != null ? od * 7 : null,
                budDay:BUDGET_J, objDay:od};
  week.ref   = od != null ? od : BUDGET_J;        /* rythme visé, par jour */
  week.pace  = week.ref * week.elapsed;           /* attendu à ce stade */
  week.rate  = n ? week.tot / n : 0;               /* intensité, jours renseignés */
  week.miss_kg = week.miss * BUDGET_J;
  week.scale = Math.max(week.bud, week.obj || 0, week.tot) * 1.06;
  week.over  = week.tot > week.pace;               /* en avance sur l'allure = mauvais */
  return {day, week, t};
}

/* Verdict du soir. Ne s'affiche qu'une fois le dîner enregistré : avant, la
   journée n'est pas jouée et tout message serait prématuré. La consolation
   hebdomadaire est taboue le dimanche — la semaine est finie, il n'y a plus
   rien à rattraper. */
function dayVerdict(a){
  const t = today();
  const es = S.hist.filter(e => e.d === t);
  if(!es.some(e => e.m === 'din')) return '';
  const kg = es.reduce((x,e) => x + kgOf(e.l), 0);
  const od = objDay(), B = BUDGET_J;
  const g = x => n0(Math.abs(x) * 1000) + ' g';

  /* rattrapage hebdomadaire : où en est la semaine par rapport à l'allure */
  const dow = (new Date(t + 'T12:00').getDay() + 6) % 7;   /* 0 = lundi */
  const w = duoData(a).week;
  const reste = 6 - dow;
  let hebdo = '';
  if(dow < 6 && od != null){
    hebdo = w.tot <= w.pace
      ? ` La semaine reste dans les temps : ${n1(w.tot)} kg pour ${n1(w.pace)} attendus.`
      : ` Il reste ${reste} jour${reste>1?'s':''} pour rattraper ${n1(w.tot - w.pace)} kg sur la semaine.`;
  }

  if(kg <= B) return {c:'good', ic:'✓', tx:`Bravo, journée dans le budget 2050 : ${g(kg)} pour ${g(B)}. C’est le rythme d’une alimentation soutenable — le plus dur des deux seuils.`};
  if(od == null) return {c:'warn', ic:'•', tx:`Journée à ${g(kg)}, soit ${g(kg - B)} au-dessus du budget 2050. Fixe un objectif dans ton profil et ce message te dira où tu en es par rapport à lui.`};
  if(kg <= od) return {c:'good', ic:'✓', tx:`Bravo, objectif du jour tenu : ${g(kg)} pour ${g(od)}. Le budget 2050 est plus exigeant, il demanderait ${g(kg - B)} de moins.${hebdo}`};
  const ecart = kg - od;
  if(ecart <= od * 0.15) return {c:'warn', ic:'≈', tx:`Dommage, il ne manquait que ${g(ecart)} pour tenir l’objectif du jour.${hebdo || ' '}`};
  return {c:'bad', ic:'!', tx:`Journée à ${g(kg)}, soit ${g(ecart)} au-dessus de ton objectif.${hebdo || ' Demain repart de zéro.'}`};
}

function duoCards(a){
  const {day, week, t} = duoData(a);
  const segs = bm => MEALS.map(m => ({v:bm[m.k] || 0, c:m.c}));
  const tk = o => [{v:o.bud, c:'var(--ink)'}]
    .concat(o.obj != null ? [{v:o.obj, c:'var(--straw)', out:1}] : []);

  /* Le cadran du jour a disparu : la carte Carbone juste en dessous affiche déjà
     le cumul du jour en 52 px, c'était la même information deux fois. La place
     libérée va à la saisonnalité, qui n'avait aucune vitrine. */
  const sp = saisStats('tout').pc;
  const spCol = sp == null ? 'var(--mute)'
              : sp >= 70 ? 'var(--forest)' : sp >= 40 ? 'var(--s4)' : 'var(--brick)';

  return `
    <div class="duo">
      <button class="dcell" id="dqWeek" aria-label="Détail du budget de la semaine">
        <span class="dt">Cette semaine</span>
        ${donut({scale:week.scale, segs:segs(week.byMeal), ticks:tk(week),
          big:n1(week.tot), unit:'KG CO₂E',
          col:week.over ? 'var(--brick)' : 'var(--ink)'})}
        <span class="wdots">${week.days.map(d =>
          `<i class="${a.days[d] ? 'on' : d <= t ? 'miss' : 'soon'}${d === t ? ' tdy' : ''}"></i>`).join('')}</span>
        <span class="dc">${week.n === 0 ? 'aucune saisie cette semaine'
          : week.miss === 0 ? `${week.n} j sur ${week.elapsed} · à jour`
          : `${week.n} j sur ${week.elapsed} · ${week.miss} manqué${week.miss>1?'s':''}`}</span>
        <span class="dc">attendu ${n1(week.pace)} · semaine ${n1(week.obj != null ? week.obj : week.bud)}</span>
      </button>

      <button class="dcell" id="dqSais" aria-label="Détail de la saisonnalité">
        <span class="dt">Saisonnalité</span>
        ${donut({scale:100, segs:sp == null ? [] : [{v:sp, c:spCol}], ticks:[],
          big:sp == null ? '—' : n0(sp) + ' %', unit:'DE SAISON', col:spCol})}
        <span class="dc">${sp == null ? 'aucun fruit ni légume enregistré'
          : 'fruits et légumes, à la date du repas'}</span>
        <span class="dc">depuis le début</span>
      </button>
    </div>`;
}

function duoBind(a){
  const {day, week} = duoData(a);
  const lignes = o => MEALS.filter(m => (o.byMeal[m.k] || 0) > 0)

      </div>
      <div class="hr"></div>
      <div class="small">${reste >= 0
        ? `Il reste <b>${n0(reste*1000)} g</b>, soit ${Math.round(reste/o.bud*100)} % du budget.`
        : `Budget dépassé de <b>${n0(-reste*1000)} g</b>, soit ${Math.round(-reste/o.bud*100)} % au-delà.`}</div>
      ${extra || ''}
      ${o.obj == null ? `<button class="btn btn-2" id="dq_obj" style="margin-top:12px">Définir un objectif</button>` : ''}`);

    ${reglette({tot:week.tot, bud:week.bud, obj:week.obj, fr:FR_J * 7,
      cap:'Barre pleine : la semaine. Repères ramenés à sept jours.'})}
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:6px">Où vous devriez en être</div>
    <div class="stagelist">
      <span class="unit">Attendu à ce jour</span><span class="small">${n1(week.pace)} kg
        · ${week.elapsed} j × ${n2(week.ref)}</span><span></span>
      <span class="unit">Réalisé</span><span class="small" style="color:${week.over ? 'var(--brick)' : 'var(--forest)'}">${n1(week.tot)} kg
        · ${week.over ? `${n1(week.tot - week.pace)} kg d'avance sur l'allure` : `${n1(week.pace - week.tot)} kg de marge`}</span><span></span>
    </div>
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:6px">Intensité, sur les jours renseignés</div>
    <div class="stagelist">
      <span class="unit">Votre rythme</span><span class="small" style="color:${week.rate > week.budDay ? 'var(--brick)' : 'var(--forest)'}">${week.n ? n2(week.rate) + ' kg/j sur ' + week.n + ' j' : '—'}</span><span></span>
      <span class="unit">Budget</span><span class="small">${n2(week.budDay)} kg/j</span><span></span>
      ${week.objDay != null ? `<span class="unit">Objectif</span><span class="small">${n2(week.objDay)} kg/j</span><span></span>` : ''}
      <span class="unit">Jours</span><span class="small">${week.elapsed} écoulé${week.elapsed>1?'s':''} · ${week.n} renseigné${week.n>1?'s':''}${week.miss ? ` · ${week.miss} manqué${week.miss>1?'s':''}` : ''}</span><span></span>
    </div>
    <div class="src" style="margin-top:10px">Le cadran mesure l'épuisement du budget de la semaine
      entière : ses deux repères sont le budget soutenable, ${n1(week.bud)} kg${week.obj != null ? `, et votre objectif, ${n1(week.obj)} kg` : ''}.
      ${week.miss
        ? `Attention : ${week.miss > 1 ? `${week.miss} jours n'ont pas été renseignés` : `un jour n'a pas été renseigné`},
           soit environ ${n1(week.miss_kg)} kg absents du total. Le cadran vous flatte d'autant.`
        : `Tous les jours écoulés sont renseignés, le total est complet.`}
      L'intensité ci-dessus, elle, ne porte que sur les jours mesurés : c'est la seule
      grandeur comparable d'une semaine à l'autre.</div>
    ${semaineJeu()}`);
}

/* Le suivi hebdomadaire des épreuves, rapatrié de l'onglet Trophées. Il parlait
   de la même semaine que ce cadran, dans un autre écran : deux endroits pour un
   sujet obligeaient à faire l'aller-retour pour savoir où l'on en était. Il vit
   maintenant sous le cadran qui l'annonce. */
function semaineJeu(){
  const sc = scoring();
  const w = monday(today());
  const cw = sc.weeks[w] || {days:[], kg:0, full:0, noRed:true, noMeat:true};
  const wBud = 7 * BUDGET_J;
  const td = sc.days[today()] || {kg:0, main:new Set(), veg:true, red:false};
  const pc = v => Math.min(100, v).toFixed(0);
  return `
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:8px">Les épreuves de la semaine</div>
    <div class="wnow">
      <div class="l">Jours complets enregistrés</div><div class="v">${cw.full} / 7</div>
      <div class="tr"><i style="width:${pc(cw.full/7*100)}%;background:var(--forest-2)"></i></div>
      <div class="l">Budget de la semaine</div>
      <div class="v" style="color:${cw.kg > wBud ? 'var(--brick)' : 'var(--ink)'}">${n1(cw.kg)} / ${n1(wBud)}</div>
      <div class="tr"><i style="width:${pc(cw.kg/wBud*100)}%;background:${
        cw.kg > wBud ? 'var(--brick)' : 'var(--forest)'}"></i></div>
      <div class="l">Viande rouge</div><div class="v">${cw.noRed ? 'aucune' : 'détectée'}</div>
      <div class="l">Viande ou poisson</div><div class="v">${cw.noMeat ? 'aucun' : 'détecté'}</div>
      <div class="l">Journée en cours</div>
      <div class="v">${dayComplete(td) && td.veg ? '+10 à minuit'
        : !dayComplete(td) ? `${['dej','din'].filter(m => td.main.has(m)).length} / 2 repas`
        : 'viande enregistrée'}</div>
      <div class="tr" style="background:none;height:0"></div>
      <div class="l small mute" style="grid-column:1/-1">${
        cw.full >= 7 && cw.kg <= wBud ? 'Semaine sous budget acquise : 150 points.'
        : cw.kg > wBud ? `Budget dépassé de ${n1(cw.kg - wBud)} kg : la semaine parfaite est hors d’atteinte, les autres épreuves restent ouvertes.`
        : `Il reste ${n1(wBud - cw.kg)} kg et ${Math.max(0, 7 - cw.full)} jour(s) à enregistrer pour la semaine parfaite.`}</div>
    </div>`;
}

/* Macros agrégées par jour. Calculées à part de agg(), qui ne connaît que le
   carbone : y toucher ferait porter à une fonction déjà dense un second sujet.
   Le coût est un parcours de l'historique de plus, négligeable à cette échelle. */
function nuParJour(){
  const out = {};
  S.hist.forEach(e => {
    const n = nuOf(e.l);
    const d = out[e.d] = out[e.d] || {kcal:0, prot:0, lip:0, gluc:0, fib:0};
    d.kcal += n.kcal; d.prot += n.prot; d.lip += n.lip; d.gluc += n.gluc; d.fib += n.fib;
  });
  return out;
}

/* ---------------- Mes objectifs ----------------
   Prend la place de « Moyenne / jour » dans l'onglet Par repas. Deux lignes
   seulement, les deux objectifs que le profil sait retenir : le rythme végétal
   et la cible carbone, tous deux ramenés à la semaine en cours.

   La semaine court du lundi, comme partout ailleurs dans l'app (monday()), sans
   quoi les compteurs de cet écran et ceux des badges se contrediraient.

   Un objectif hebdomadaire lu un mercredi n'a pas de sens brut : trois jours
   consommés sur sept, on est forcément « sous » la cible. D'où le repère de
   prorata, qui dit où l'on devrait en être à ce stade de la semaine, et non
   seulement où l'on en est. */
function objBlock(a){
  const T = today(), W = monday(T);
  const semaine = S.hist.filter(e => monday(e.d) === W);
  const kgSem = semaine.reduce((x, e) => x + kgOf(e.l), 0);
  const vege  = semaine.filter(e => (e.m === 'dej' || e.m === 'din') && isVeg(e)).length;

  /* Jours entamés depuis lundi, le jour en cours compris : c'est la fraction de
     semaine sur laquelle le prorata doit être calculé. */
  const jours = Math.min(7, Math.round((new Date(T + 'T12:00') - new Date(W + 'T12:00')) / 864e5) + 1);

  const cibleVege = S.prof.objVege;
  const cibleKg   = S.prof.objKg != null ? S.prof.objKg / 52 : null;
  /* Les cibles nutritionnelles sont journalières ; on les ramène à la semaine
     pour qu'elles se lisent dans le même cadre que les deux autres lignes.
     Mélanger des échelles dans une même carte est le meilleur moyen de la
     rendre illisible. */
  /* Masquées avec l'interrupteur : laisser les lignes calories et protéines dans
     les objectifs de la semaine alors que le détail du jour ne les montre plus
     serait incohérent. */
  const cibleCal  = (nuOn() && S.prof.objCal  != null) ? S.prof.objCal  * 7 : null;
  const cibleProt = (nuOn() && S.prof.objProt != null) ? S.prof.objProt * 7 : null;
  const nuj = (cibleCal != null || cibleProt != null) ? nuParJour() : null;
  let kcalSem = 0, protSem = 0;
  if(nuj) Object.keys(nuj).forEach(d => {
    if(monday(d) === W){ kcalSem += nuj[d].kcal; protSem += nuj[d].prot; }
  });

  if(cibleVege == null && cibleKg == null && cibleCal == null && cibleProt == null){
    return `<div class="card">
      <div class="small mute">Aucun objectif fixé. Une cible annuelle et un rythme végétal
        hebdomadaire donnent à cet écran de quoi se comparer — et à la carotte de quoi tourner
        quand la journée les tient.</div>
      <div class="actions" style="margin-top:10px">
        <button class="btn btn-1" id="obj_go">Définir mes objectifs</button>
      </div>
      <div class="src" style="margin-top:8px">Ils restent sur l’appareil : ni les objectifs ni
        l’estimation ne traversent le réseau.</div>
    </div>`;
  }

  const barre = (val, cible, couleur, depasse) => {
    const pct = cible > 0 ? Math.min(100, val / cible * 100) : 0;
    const rep = cible > 0 ? Math.min(100, cible * (jours / 7) / cible * 100) : 0;
    return `<div class="tr" style="position:relative">
      <i style="width:${pct.toFixed(1)}%;background:${depasse ? 'var(--brick)' : couleur}"></i>
      ${jours < 7 ? `<span style="position:absolute;top:-2px;bottom:-2px;left:${rep.toFixed(1)}%;
        width:2px;background:var(--ink-soft);opacity:.55"></span>` : ''}
    </div>`;
  };

  const lignes = [];
  if(cibleVege != null){
    const attendu = cibleVege * jours / 7;
    lignes.push({
      lab: 'Repas végétaux',
      val: `${vege} / ${cibleVege}`,
      bar: barre(vege, cibleVege, 'var(--forest)', false),
      note: vege >= cibleVege
        ? `Objectif de la semaine atteint, ${vege} repas sur ${cibleVege}.`
        : vege >= attendu
          ? `Dans le rythme : ${vege} au bout de ${jours} jour${jours > 1 ? 's' : ''}, il en faudrait ${Math.ceil(attendu)} à ce stade.`
          : `En retard de ${Math.ceil(attendu - vege)} repas sur le rythme de la semaine.`,
    });
  }
  if(cibleKg != null){
    const attendu = cibleKg * jours / 7;
    const dep = kgSem > attendu;
    lignes.push({
      lab: 'Carbone de la semaine',
      val: `${n2(kgSem)} / ${n2(cibleKg)}`,
      bar: barre(kgSem, cibleKg, 'var(--straw)', kgSem > cibleKg),
      note: dep
        ? `${n2(kgSem - attendu)} kg au-dessus du rythme au bout de ${jours} jour${jours > 1 ? 's' : ''}.`
        : `${n2(attendu - kgSem)} kg d’avance sur le rythme de la semaine.`,
    });
  }
  /* Calories et protéines : jamais de rouge ni de dépassement signalé comme une
     faute. On dit l'écart au rythme, ce qui informe sans juger — un plafond
     calorique affiché en rouge fabriquerait une dette quotidienne. */
  if(cibleCal != null){
    const attendu = cibleCal * jours / 7;
    lignes.push({
      lab: 'Calories de la semaine',
      val: `${n0(kcalSem)} / ${n0(cibleCal)}`,
      bar: barre(kcalSem, cibleCal, 'var(--s4)', false),
      note: `${n0(Math.abs(kcalSem - attendu))} kcal ${kcalSem >= attendu ? 'au-dessus' : 'en dessous'} du rythme `
          + `au bout de ${jours} jour${jours > 1 ? 's' : ''}, soit ${n0(cibleCal / 7)} kcal/j visés.`,
    });
  }
  if(cibleProt != null){
    const attendu = cibleProt * jours / 7;
    lignes.push({
      lab: 'Protéines de la semaine',
      val: `${n0(protSem)} / ${n0(cibleProt)}`,
      bar: barre(protSem, cibleProt, 'var(--forest-2)', false),
      note: protSem >= attendu
        ? `Dans le rythme : ${n0(protSem)} g au bout de ${jours} jour${jours > 1 ? 's' : ''}, pour ${n0(cibleProt / 7)} g/j visés.`
        : `${n0(attendu - protSem)} g de retard sur le rythme, pour ${n0(cibleProt / 7)} g/j visés.`,
    });
  }

  return `<div class="card">
    <div class="total" style="margin-top:0">
      <div><div class="bt">Semaine du ${dLabel(W)}</div>
        <div class="small mute">${jours} jour${jours > 1 ? 's' : ''} sur 7</div></div>
      ${cibleKg != null
        ? `<div class="v" style="color:${kgSem > cibleKg ? 'var(--brick)' : 'var(--forest)'}">${n2(kgSem)} <span class="unit">kg</span></div>`
        : cibleVege != null
          ? `<div class="v" style="color:var(--accent)">${vege} <span class="unit">végé</span></div>`
          : cibleCal != null
            ? `<div class="v" style="color:var(--accent)">${n0(kcalSem)} <span class="unit">kcal</span></div>`
            : `<div class="v" style="color:var(--accent)">${n0(protSem)} <span class="unit">g prot</span></div>`}
    </div>
    <div class="hr"></div>
    <div class="bars">
      ${lignes.map(l => `<div class="row">
        <div class="lab">${l.lab}</div>
        <div class="val">${l.val}</div>
        ${l.bar}
      </div>`).join('')}
    </div>
    <div class="small" style="margin-top:4px;line-height:1.65">
      ${lignes.map(l => l.note).join('<br>')}</div>
    <div class="src" style="margin-top:8px">Le trait vertical marque où l’on devrait en être à ce
      stade de la semaine, non la cible entière — sans lui, tout mercredi paraîtrait vertueux.
      Modifiable dans Profil.</div>
  </div>`;
}

/* ==================== fenêtre « Mes objectifs » ====================
   Le Profil ne montre plus l'état de la semaine : il ouvre une fenêtre de
   modification. La raison est une répétition — l'avancement hebdomadaire se lit
   déjà dans le Tracker, à l'onglet « Par repas », et le même bloc affiché deux
   fois posait la question de savoir lequel des deux était le vrai. Le Profil est
   l'endroit où l'on règle, le Tracker celui où l'on regarde.

   Quatre cibles, chacune facultative et indépendante : la case décide qu'il y a
   un objectif, le curseur dit lequel. C'est ce que le questionnaire faisait en
   quatre écrans successifs — utile la première fois, pénible pour changer un
   seul chiffre.

   Rien n'est écrit avant « Enregistrer » : l'état de travail vit dans W, et
   fermer la fenêtre au scrim laisse les objectifs exactement où ils étaient. */
const OBJ_ITEMS = [
  {k:'kg', pk:'objKg', nu:false,
   lab:'Cible carbone annuelle',
   sur:'Le trait paille du Tracker, et ce que la carotte fête quand la journée le tient.',
   min:700, max:2500, step:50,
   lo:'budget 700', hi:'moyenne FR 2 000'},
  {k:'vege', pk:'objVege', nu:false,
   lab:'Repas végétaux par semaine',
   sur:'Compté sur les déjeuners et les dîners, du lundi au dimanche.',
   min:0, max:14, step:1,
   lo:'0', hi:'14 · tous'},
  {k:'cal', pk:'objCal', nu:true,
   lab:'Cible calorique',
   sur:'Par jour. À défaut, l’app affiche le besoin estimé sans en faire une cible.',
   min:1200, max:4000, step:50,
   lo:'1 200', hi:'4 000'},
  {k:'prot', pk:'objProt', nu:true,
   lab:'Cible protéinique',
   sur:'Par jour. Seul axe où le manque est en dessous du trait : rien n’y est signalé comme un excès.',
   min:40, max:220, step:5,
   lo:'40 g', hi:'220 g'},
];

/* Valeur de départ d'un curseur jamais réglé. Reprise de profDefault pour les
   trois cibles qu'il connaît, afin qu'une même case proposée ici et dans le
   questionnaire ne s'ouvre pas sur deux chiffres différents. */
function objDefaut(k){
  if(k === 'prot') return Math.round(70 * protGkg() / 5) * 5;
  return profDefault({k: {kg:'objKg', vege:'objVege', cal:'objCal'}[k]});
}

function objSheet(){
  const W = {kg:S.prof.objKg, vege:S.prof.objVege, cal:S.prof.objCal,
             prot:S.prof.objProt, nu:nuOn()};

  const bloc = o => `
    <button class="chk" data-ob="${o.k}" role="checkbox" aria-checked="${W[o.k] != null}"
            style="margin-top:10px">
      <span class="bx">✓</span>
      <span class="tx"><b>${o.lab}</b><span>${o.sur}</span></span>
    </button>
    <div data-rng="${o.k}"${W[o.k] != null ? '' : ' hidden'}>
      <div class="qbig" data-out="${o.k}"></div>
      <input class="qrange" type="range" data-in="${o.k}"
             min="${o.min}" max="${o.max}" step="${o.step}"
             value="${W[o.k] != null ? W[o.k] : objDefaut(o.k)}">
      <div class="qends"><span>${o.lo}</span><span>${o.hi}</span></div>
      <div class="src" data-hint="${o.k}" style="margin-top:6px"></div>
    </div>`;

  const carbone = OBJ_ITEMS.filter(o => !o.nu).map(bloc).join('');
  const nutri   = OBJ_ITEMS.filter(o =>  o.nu).map(bloc).join('');

  openSheet(`
    <div class="unit">Profil</div>
    <h3 style="margin:2px 0 6px">Mes objectifs</h3>
    <p class="small mute" style="margin:0 0 4px">Chaque objectif est facultatif : la case dit s’il
      existe, le curseur dit lequel. Où ils se lisent : le Tracker, onglet « Par repas ».</p>
    ${carbone}

    <div class="hr"></div>
    <div class="unit" style="margin-bottom:2px">Données nutritionnelles</div>
    <button class="chk" data-ob="nu" role="checkbox" aria-checked="${W.nu}">
      <span class="bx">✓</span>
      <span class="tx"><b>Afficher les calories et les protéines</b>
        <span>Détail du jour, fiche de chaque repas, objectifs de la semaine et cumuls. Décochée,
          l’app ne montre plus que le carbone.</span></span>
    </button>
    <div id="ob_nu"${W.nu ? '' : ' hidden'}>${nutri}</div>

    <div class="actions" style="margin-top:16px">
      <button class="btn btn-1" id="ob_save">Enregistrer</button>
      <button class="btn btn-2" id="ob_x">Annuler</button>
    </div>
    <div class="src" style="margin-top:10px">Les objectifs restent sur l’appareil : ni eux ni votre
      estimation ne traversent le réseau. Ils n’apparaissent ni dans le feed, ni dans un défi, ni
      dans un classement.</div>`);

  const sh = $('#sheet');
  const rng = k => sh.querySelector(`[data-in="${k}"]`);

  /* Un seul peintre pour les quatre curseurs : la valeur en gros, puis la phrase
     qui la situe. Les cibles nutritionnelles ne sont jamais commentées comme une
     faute — un plafond calorique présenté en reproche fabriquerait une dette
     quotidienne, ce que cette app n'a pas à faire. */
  const paint = k => {
    const r = rng(k); if(!r) return;
    const v = +r.value;
    const out = sh.querySelector(`[data-out="${k}"]`);
    const hint = sh.querySelector(`[data-hint="${k}"]`);
    if(k === 'kg'){
      const a = agg();
      out.innerHTML = `${n0(v)} <small>kg CO₂e / an</small>`;
      hint.innerHTML = a.nd >= 3
        ? `Soit ${n2(v / 365)} kg par jour. À votre rythme actuel vous êtes sur ${n0(a.avg * 365)} kg par an.`
        : `Soit ${n2(v / 365)} kg par jour. La moyenne française pour l’alimentation est de 2 000 kg, le budget soutenable de 700 kg.`;
    } else if(k === 'vege'){
      out.innerHTML = `${v} <small>repas / semaine</small>`;
      hint.textContent = v === 0
        ? 'Aucun repas végétal visé.'
        : `Soit ${(v / 14 * 100).toFixed(0)} % de vos repas, sur deux repas par jour.`;
    } else if(k === 'cal'){
      const b = besoinCal();
      out.innerHTML = `${n0(v)} <small>kcal / jour</small>`;
      hint.innerHTML = b != null
        ? `Votre besoin ${S.prof.calKnow === 'oui' ? 'déclaré' : 'estimé'} est de ${n0(b)} kcal/jour`
          + (v < b * 0.85
              ? '. Cette cible est nettement en dessous : un écart durable de cette ampleur relève d’un suivi médical, pas d’une app.'
              : v > b * 1.15 ? '. Cette cible est nettement au-dessus.' : '.')
        : 'Référence ANSES : 2 600 kcal/jour pour un homme de 18 à 69 ans, 2 100 pour une femme de 18 à 59 ans, à activité médiane. Renseignez le profil pour une estimation.';
    } else {
      const g = protGkg(), act = ACT_LAB[(S.prof || {}).act] || 'actif';
      out.innerHTML = `${n0(v)} <small>g de protéines / jour</small>`;
      hint.innerHTML = `La référence de l’ANSES est de 0,83 g/kg — soit ${n0(70 * 0.83)} g pour 70 kg ; `
        + `pour un profil ${act} cette app propose ${n1(g)} g/kg, soit ${n0(70 * g)} g.`;
    }
  };

  OBJ_ITEMS.forEach(o => {
    const r = rng(o.k);
    r.oninput = () => { W[o.k] = +r.value; paint(o.k); };
    paint(o.k);
  });

  sh.querySelectorAll('[data-ob]').forEach(b => b.onclick = () => {
    const k = b.dataset.ob;
    if(k === 'nu'){
      W.nu = !W.nu;
      b.setAttribute('aria-checked', W.nu);
      $('#ob_nu').hidden = !W.nu;
      return;
    }
    /* Décocher n'efface pas le curseur : on retrouve son dernier réglage en
       recochant, sans avoir à le refaire. */
    W[k] = W[k] == null ? +rng(k).value : null;
    b.setAttribute('aria-checked', W[k] != null);
    sh.querySelector(`[data-rng="${k}"]`).hidden = W[k] == null;
  });

  $('#ob_x').onclick = closeSheet;
  $('#ob_save').onclick = () => {
    OBJ_ITEMS.forEach(o => { S.prof[o.pk] = W[o.k]; });
    /* Les deux drapeaux que le questionnaire consulte pour savoir s'il doit
       encore poser ses questions de cible. Les laisser en arrière donnerait un
       parcours qui redemande ce qui vient d'être réglé — ou qui saute ce qui
       vient d'être demandé. */
    S.prof.objSet = (W.kg != null || W.vege != null) ? 'oui' : 'non';
    S.prof.objNut = (W.cal != null && W.prot != null) ? 'deux'
                  : W.cal != null ? 'cal' : W.prot != null ? 'prot' : 'non';
    S.prof.at = new Date().toISOString();
    S.nutri = W.nu;
    save();
    closeSheet();
    if(S.tab === 'profil') renderProfil(); else go(S.tab);
    const n = OBJ_ITEMS.filter(o => W[o.k] != null && (!o.nu || W.nu)).length;
    toast(n ? `${n} objectif${n > 1 ? 's' : ''} enregistré${n > 1 ? 's' : ''}` : 'Aucun objectif fixé');
  };
}

/* Ce que le Profil montre à la place du bloc hebdomadaire : une porte, et la
   phrase qui dit ce qu'il y a derrière. Volontairement sans aucun chiffre —
   c'est un écran de réglage, pas un tableau de bord. */
function objProfilBlock(){
  return `
    <p class="small" style="margin:0 0 10px">Une cible carbone annuelle, un rythme végétal
      hebdomadaire, et si vous le souhaitez des cibles nutritionnelles. Tout est facultatif, et
      modifiable à tout moment.</p>
    <button class="btn btn-1" id="pf_obj">Modifier mes objectifs</button>
    <div class="src" style="margin-top:10px">L’avancement de la semaine se lit dans le Tracker, à
      l’onglet « Par repas ». Ici on règle, là-bas on regarde.</div>`;
}

function tvRepas(a){
  const t = today();
  const d = a.days[t] || {tot:0, byMeal:{}};
  const perMeal = MEALS.map(m => {
    const es = S.hist.filter(e => e.m === m.k);
    const s = es.reduce((x,e) => x + kgOf(e.l), 0);
    return {...m, n:es.length, sum:s, avg: es.length ? s/es.length : 0};
  });
  const mx = Math.max(...perMeal.map(p => p.avg), .001);
  const last = [...S.hist].reverse().slice(0, 14);
  $('#tv').innerHTML = `
    ${duoCards(a)}

    <h2 class="sec">Aujourd’hui</h2>
    ${axesDuJour(a, t)}

    <h2 class="sec">Mes objectifs</h2>
    ${objBlock(a)}

    <h2 class="sec">Le mois</h2>
    ${calMini()}`;
  $('#calMiniBtn').onclick = () => calendarSheet();
  /* Les quatre entrées « définir une cible » de cet écran ouvrent toutes la même
     fenêtre de réglage, plutôt que de sauter à une étape du questionnaire : on y
     voit les autres objectifs en même temps, et on en sort par un bouton
     « Enregistrer » au lieu d'un parcours à dérouler jusqu'au bout. */
  const og = $('#obj_go');
  if(og) og.onclick = objSheet;
  /* Les trois jauges portent les mêmes clés de repas : le repas décide de ce qui
     s'ouvre. L'axe cliqué, lui, n'est plus perdu — il sert à préouvrir la bonne
     décomposition par aliment dans la fiche. */
  $('#tv').querySelectorAll('[data-gm]').forEach(b =>
    b.onclick = () => mealSheet(b.dataset.gm, t, b.dataset.ax));
  const cg = $('#cal_go');
  if(cg) cg.onclick = objSheet;
  const pg = $('#prot_go');
  if(pg) pg.onclick = objSheet;
  duoBind(a);
}

/* Les trois cartes du jour. Séparées plutôt qu'empilées dans une seule : chaque
   axe a son repère, son unité et son sens de lecture, et les mêler dans une même
   jauge obligerait à choisir une échelle commune qui n'a aucun sens physique.
   Calories et protéines disparaissent avec l'interrupteur du Profil ; le carbone
   reste, c'est l'objet de l'app. */
function axesDuJour(a, t){
  const j = jourAxes(t);
  const rien = j.n === 0;

  /* --- carbone --- */
  const restCO2 = BUDGET_J - j.kg;
  const pctCO2  = Math.round(Math.abs(restCO2) / BUDGET_J * 100);
  const carbone = carteAxeGrande({
    premier:true, titre:'Carbone', sous:rien ? 'Aucun repas saisi' : whenWord() === 'demain' ? 'journée close' : 'journée en cours',
    total:j.kg, unite:'kg', fmt:n2, par:j.par.kg, axe:'kg',
    repere:BUDGET_J, repLabel:'budget', sens:'plafond',
    couleur:j.kg > BUDGET_J ? 'var(--brick)' : 'var(--forest)',
    mot: rien
      ? `Rien d\u2019enregistré aujourd\u2019hui. Budget du jour : ${n0(BUDGET_J*1000)} g CO\u2082e.`
      : restCO2 >= 0
        ? `Budget restant : <b>${n0(restCO2*1000)} g</b> CO\u2082e, soit <b>${pctCO2} %</b> de la journée.`
        : `Budget dépassé de <b>${n0(-restCO2*1000)} g</b> CO\u2082e, soit <b>${pctCO2} %</b> au-delà de la limite.`,
    suite: (() => {
      /* Le conseil ne sort qu'une fois le déjeuner saisi. Avant, il n'a rien à
         dire d'utile : le budget est presque intact et la phrase se réduirait à
         « tout rentre », ce qui n'aide personne et use la formule. C'est le
         déjeuner qui engage la journée, et c'est à partir de là que « ce qui
         rentre encore » devient une information. Le dîner, lui, clôt la journée
         et passe la parole à dayVerdict(). */
      const midi = S.hist.some(e => e.d === t && e.m === 'dej');
      const tip = (rien || !midi) ? '' : (() => {
        const v = dayVerdict(a);
        if(v) return `<div class="tip ${v.c}"><span class="ic">${v.ic}</span><span class="tx">${v.tx}</span></div>`;
        const b = budgetTip(j.kg);
        /* Le bandeau ne devient cliquable que si le plat nommé porte une recette
           ouvrable — libellés source et lien. Sinon il reste un simple bandeau :
           un bouton qui n'ouvre rien serait pire que pas de bouton. */
        const ouvrable = b.plat && b.plat.rec;
        return ouvrable
          ? `<button class="tip ${b.cls}" data-recette="${esc(b.plat.n)}">
               <span class="ic">${b.ic}</span><span class="tx">${b.tx}</span>
               <span class="go" aria-hidden="true">&#8250;</span></button>`
          : `<div class="tip ${b.cls}"><span class="ic">${b.ic}</span><span class="tx">${b.tx}</span></div>`;
      })();
      return tip + reglette({tot:j.kg, bud:BUDGET_J, obj:objDay(), fr:FR_J,
        cap:'Barre pleine : votre journée. L’échelle va jusqu’à la moyenne française, ' +
            'ce qui donne sa mesure au budget 2050 — un peu plus du tiers.'});
    })(),
  });

  if(!nuOn()) return carbone;

  /* --- calories ---
     La cible déclarée d'abord, l'estimation ANSES à défaut : dire « besoin » là
     où l'utilisateur n'a rien choisi évite de lui prêter un objectif. */
  const bCal   = besoinCal();
  const cCal   = S.prof.objCal != null ? S.prof.objCal : bCal;
  const choisie = S.prof.objCal != null;
  const calories = carteAxeGrande({
    titre:'Calories', unite:'kcal', fmt:n0, total:j.kcal, par:j.par.kcal, axe:'kcal',
    sous: cCal != null ? (choisie ? 'Cible : ' + n0(cCal) + ' kcal/j' : 'Besoin estimé : ' + n0(cCal) + ' kcal/j')
                       : 'Aucune cible renseignée',
    repere:cCal || 0, repLabel:choisie ? 'cible' : 'besoin', sens:'neutre',
    couleur:'var(--s4)',
    mot: rien ? 'Rien d\u2019enregistré aujourd\u2019hui.'
      : cCal == null
        ? `<b>${n0(j.kcal)} kcal</b> sur la journée. <button class="backlink" id="cal_go" style="display:inline;padding:0">Renseigner une cible \u203a</button>`
        : j.kcal <= cCal
          ? `Il reste <b>${n0(cCal - j.kcal)} kcal</b> avant ${choisie ? 'votre cible' : 'le besoin estimé'}.`
          : `<b>${n0(j.kcal - cCal)} kcal</b> au-dessus ${choisie ? 'de votre cible' : 'du besoin estimé'}, soit <b>${Math.round((j.kcal/cCal-1)*100)} %</b>.`,
  });

  /* --- protéines ---
     Seul axe des trois où le manque est en dessous du trait, jamais au-dessus :
     rien n'est signalé comme un excès. */
  const cProt = S.prof.objProt;
  const proteines = carteAxeGrande({
    titre:'Protéines', unite:'g', fmt:n0, total:j.prot, par:j.par.prot, axe:'prot',
    sous: cProt != null ? 'Cible : ' + n0(cProt) + ' g/j' : 'Aucune cible renseignée',
    repere:cProt || 0, repLabel:'cible', sens:'plancher',
    couleur:'var(--forest-2)',
    mot: rien ? 'Rien d\u2019enregistré aujourd\u2019hui.'
      : cProt == null
        ? `<b>${n0(j.prot)} g</b> de protéines sur la journée. <button class="backlink" id="prot_go" style="display:inline;padding:0">Renseigner une cible \u203a</button>`
        : j.prot >= cProt
          ? `Cible atteinte : <b>${n0(j.prot)} g</b> pour ${n0(cProt)} g visés.`
          : `Il manque <b>${n0(cProt - j.prot)} g</b> pour atteindre les ${n0(cProt)} g visés.`,
    /* Plus de note de méthode ici : elle reste dans la fiche repas (nuBlock),
       là où elle qualifie réellement un total qu'on est en train de lire. */
  });

  return carbone + calories + proteines;
}

/* ---------------- décomposition par aliment ----------------
   Les trois vignettes d'une fiche repas donnent un total ; ce total ne dit pas
   d'où il vient. Ces deux fonctions répondent à « qui pèse quoi » sans ouvrir
   chaque saisie une par une.

   Les lignes d'un même aliment sont regroupées : deux tartines de beurre saisies
   dans deux services différents se liraient mal en deux lignes de 10 g.

   Le coefficient de préparation ne joue que sur le carbone, comme partout
   ailleurs (jourAxes) : un plat surgelé coûte 15 % de plus à produire, il ne
   contient pas 15 % de calories de plus. */
const AXES = {
  kg:   {l:'kg CO\u2082e',  u:'kg',   fmt:n2, c:'var(--forest)'},
  kcal: {l:'calories',      u:'kcal', fmt:n0, c:'var(--s4)'},
  prot: {l:'protéines',     u:'g',    fmt:n1, c:'var(--forest-2)'},
};

function splitAliment(lignes, axe){
  const m = new Map();
  lignes.forEach(l => {
    const f = F.get(l[0]);
    if(!f) return;
    let v = 0;
    if(axe === 'kg') v = f.t * l[1] / 1000 * modeK(l[3]);
    else if(f.nu)    v = f.nu[axe === 'kcal' ? 0 : 1] * l[1] / 100;
    const o = m.get(l[0]) || {n:f.n, g:0, v:0};
    o.g += l[1]; o.v += v; m.set(l[0], o);
  });
  return [...m.values()].sort((a, b) => b.v - a.v);
}

function splitHTML(lignes, axe){
  const A = AXES[axe] || AXES.kg;
  const rows = splitAliment(lignes, axe).filter(r => r.v > 0);
  const tot = rows.reduce((a, r) => a + r.v, 0);
  if(!tot) return `<div class="src" style="margin-top:10px">Aucune valeur ${A.l} sur ce repas.</div>`;
  return `<div class="asplit">
    ${rows.map(r => `<div class="row">
      <div class="nm">${esc(r.n)}<i>${n0(r.g)} g</i></div>
      <div class="vv">${A.fmt(r.v)} <span class="unit">${A.u}</span></div>
      <div class="tr"><i style="width:${(r.v / tot * 100).toFixed(1)}%;background:${A.c}"></i></div>
    </div>`).join('')}
    <div class="src">Part de chaque aliment dans les ${A.fmt(tot)} ${A.u} du repas, du plus
      lourd au plus léger. La barre est relative au repas, non à la journée.</div>
  </div>`;
}

/* Fiche d'un repas du jour, ouverte en cliquant sa bande. Trois chiffres d'abord,
   les repas qui les composent ensuite : c'est ce qui manquait pour comprendre
   pourquoi une bande est large sans avoir à ouvrir chaque saisie une par une. */
function mealSheet(mk, d, axe){
  const es = S.hist.filter(e => e.d === d && e.m === mk);
  if(!es.length) return;
  const lignes = es.flatMap(e => e.l);
  const kg = es.reduce((x,e) => x + kgOf(e.l), 0);
  const n  = nuOf(lignes);
  /* Chaque vignette est désormais un bouton : elle ouvre la décomposition par
     aliment de son axe. L'axe d'où l'on vient — la carte cliquée dans le Tracker
     — est préouvert, ce qui évite un clic pour la question la plus probable. */
  const kpi = (k, v, l) => `<button class="nc" data-ax="${k}" aria-pressed="false">
    <b>${v}</b><span>${l}</span><span class="ar">détail \u203a</span></button>`;
  openSheet(`
    <div class="gp" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">
      ${dLabel(d)}</div>
    <h3>${MEAL[mk].l}</h3>
    <div class="small mute" style="margin-bottom:10px">${es.length} repas${es.length>1?'s':''} \u00b7 ${lignes.length} aliment${lignes.length>1?'s':''}</div>
    <div class="nutri" style="grid-template-columns:repeat(${nuOn() ? 3 : 1},1fr)">
      ${kpi('kg', n2(kg), 'kg CO\u2082e')}
      ${nuOn() ? kpi('kcal', n0(n.kcal), 'kcal') + kpi('prot', n0(n.prot), 'protéines <i>g</i>') : ''}
    </div>
    <div id="ms_split"></div>
    <div class="hr"></div>
    <div class="journal">${es.map(e => `<button class="j jrow" data-entry="${esc(e.id)}"
      style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);cursor:pointer">
      <span class="unit">${n2(kgOf(e.l))}</span>
      <span>${esc(e.n)}</span>
      <span class="unit" style="opacity:.45">\u203a</span>
    </button>`).join('')}</div>
    ${nuOn() ? nuBlock(lignes) : ''}`);
  $('#sheet').querySelectorAll('[data-entry]').forEach(b =>
    b.onclick = () => entrySheet(b.dataset.entry));

  /* Un seul axe ouvert à la fois : trois décompositions empilées feraient une
     fiche à dérouler, et l'intérêt de la vignette est justement de comparer. */
  const tuiles = [...$('#sheet').querySelectorAll('.nutri [data-ax]')];
  const boite  = $('#ms_split');
  const montre = k => {
    const meme = tuiles.find(t => t.dataset.ax === k && t.getAttribute('aria-pressed') === 'true');
    tuiles.forEach(t => t.setAttribute('aria-pressed', String(!meme && t.dataset.ax === k)));
    boite.innerHTML = meme ? '' : splitHTML(lignes, k);
  };
  tuiles.forEach(t => t.onclick = () => montre(t.dataset.ax));
  if(axe && AXES[axe] && (axe === 'kg' || nuOn())) montre(axe);
}

function bindEntryRows(){
  document.querySelectorAll('[data-entry]').forEach(b => b.onclick = () => entrySheet(b.dataset.entry));
}

/* Bloc macros de la fiche repas. Volontairement sous les lignes de carbone et
   non au-dessus : l'app mesure une empreinte, les macros sont un complément.
   La ligne de confiance n'est pas décorative — elle empêche de lire une
   estimation comme une mesure. */
function nuBlock(lignes){
  if(!nuOn()) return '';
  const n = nuOf(lignes);
  if(!n.poids) return '';
  const val = {kcal: n0(n.kcal), prot: n1(n.prot), lip: n1(n.lip),
               gluc: n1(n.gluc), fib: n1(n.fib)};
  return `
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:7px">Estimation nutritionnelle</div>
    <div class="nutri">
      ${NUKEYS.map(([k, l]) => `<div class="nc">
        <b>${val[k]}</b><span>${l}${k === 'kcal' ? '' : ' <i>g</i>'}</span></div>`).join('')}
    </div>
    <div class="src" style="margin-top:8px">Pour ${n0(n.poids)} g tels qu’achetés, base
      ${n0(n.part)} % en valeurs propres${n.part < 99 ? ', le reste par recette ou report' : ''}.
      Les poids sont ceux de la saisie : un aliment sec ou cru compte son énergie sèche, la cuisson
      n’ajoutant que de l’eau. Source : table CIQUAL 2025 de l’ANSES, jointe par aliment ; les valeurs
      sans équivalent direct sont déduites de la recette ou reportées d’un aliment proche.</div>`;
}

function entrySheet(id){
  const e = S.hist.find(x => x.id === id);
  if(!e) return;
  const lines = e.l.map(([sl,g]) => `${esc(F.get(sl).n)} · ${g} g · ${n2(F.get(sl).t*g/1000)}`).join('<br>');
  openSheet(`
    <div class="gp" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">
      ${MEAL[e.m].l} · ${dLabel(e.d)}</div>
    <h3>${esc(e.n)}</h3>
    <div class="small mute" style="margin-bottom:10px">${n2(kgOf(e.l))} kg CO₂e · ${e.l.length} aliment${e.l.length>1?'s':''}</div>
    <div class="small" style="line-height:1.7">${lines}</div>
    ${nuBlock(e.l)}
    <div class="hr"></div>
    <div class="actions">
      <button class="btn btn-1" id="e_edit">Modifier</button>
      <button class="btn btn-2" id="e_dup">Dupliquer</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button class="btn btn-2" id="e_del" style="color:var(--brick)">Supprimer</button>
    </div>`);

  $('#e_edit').onclick = () => {
    S.draft = e.l.map(l => [l[0], l[1], l[2] || 'plat']);
    S.meal = e.m; S.path = 'compose'; S.editId = id; S.entryDate = e.d;
    S.step = 'saisie'; S.wiz = null; S.comCat = 'plat';
    closeSheet(); go('saisie');
    toast('Repas ouvert pour modification');
  };
  $('#e_dup').onclick = () => {
    S.hist.push({id:'e'+Date.now(), c:CLIENT_ID, u:new Date().toISOString(),
                 d:today(), m:e.m, n:e.n, l:e.l.map(l => [...l])});
    save(); closeSheet(); renderTracker(); toast('Repas dupliqué sur aujourd’hui');
    if(SESS) syncNow(true);
  };
  $('#e_del').onclick = () => {
    const b = $('#e_del');
    if(b.dataset.ok){
      /* pierre tombale : sans elle, la synchro suivante ferait réapparaître ce
         repas depuis un autre appareil qui l'a encore */
      const del = S.hist.find(x => x.id === id);
      if(del) S.tomb.push({c:del.c || CLIENT_ID, id:del.id, at:new Date().toISOString()});
      S.hist = S.hist.filter(x => x.id !== id);
      save(); closeSheet(); renderTracker(); toast('Repas supprimé');
      if(SESS) syncNow(true);
    }
    else { b.dataset.ok = '1'; b.textContent = 'Confirmer la suppression'; }
  };
}

function tvAn(a){
  const proj = a.avg * 365;
  const f = DB.facts;
  /* Remonté depuis « Par repas » : la moyenne par jour est une lecture de long
     terme, elle appartient à la même famille que l'extrapolation annuelle. */
  const perDay = MEALS.map(m => {
    const sum = S.hist.filter(e => e.m === m.k).reduce((x,e) => x + kgOf(e.l), 0);
    return {...m, perDay: a.nd ? sum / a.nd : 0};
  });
  const mxd = Math.max(...perDay.map(p => p.perDay), .001);
  const rows = [
    {l:'Vous, à ce rythme', v:proj, c:'var(--forest)'},
    {l:'Moyenne française, alimentation', v:f.foodAbs, c:'var(--s4)'},
    {l:'Budget alimentaire cible', v:f.budget, c:'var(--straw)'},
    {l:'Budget total 2050, tous postes', v:f.target2050, c:'var(--ink-soft)'}
  ];
  const mx = Math.max(...rows.map(r => r.v));
  $('#tv').innerHTML = `
    <h2 class="sec">Moyenne / jour</h2>
    <div class="card">
      <div class="total" style="margin-top:0">
        <div><div class="unit">Sur ${a.nd} jour${a.nd>1?'s':''} renseigné${a.nd>1?'s':''}</div>
          <div class="small mute">Budget cible : ${n2(BUDGET_J)} kg/j</div></div>
        <div class="v" style="color:${a.avg > BUDGET_J ? 'var(--brick)' : 'var(--forest)'}">${n2(a.avg)} <span class="unit">kg/j</span></div>
      </div>
      <div class="hr"></div>
      <div class="bars">
        ${perDay.map(p => `<div class="row">
          <div class="lab">${p.l}</div>
          <div class="val">${n2(p.perDay)}</div>
          <div class="tr"><i style="width:${(p.perDay/mxd*100).toFixed(1)}%;background:${p.c}"></i></div>
        </div>`).join('')}
      </div>
      <div class="src">Contribution moyenne de chaque repas à une journée, en kg CO₂e. Le total des

/* Graphe cumulé générique. Extrait du bloc carbone pour que les calories et les
   protéines aient exactement la même lecture : même fenêtre de trois semaines
   ISO, même courbe cumulée, même trait de trajectoire. Trois graphes construits
   séparément finiraient par diverger sur un détail d'axe. */
/* Rangée de tuiles. Une tuile seule prend toute la largeur : la grille est en
   deux colonnes, et un élément unique y laisserait sinon une demi-colonne vide. */
function kpiRow(cells){
  if(!cells.length) return '';
  const seule = cells.length === 1 ? ' wide' : '';
  return `<div class="kpis">${cells.map(([v, u, l]) =>
    `<div class="kpi${seule}"><div class="v">${v} <small>${u}</small></div>
      <div class="l">${l}</div></div>`).join('')}</div>`;
}

function cumulCard(o){
  /* o : {jours, vals, cum, cible, unite, couleur, fond, fmt, legende} */
  const W = 100, H = 96;
  const traj = o.cible ? o.cible * o.cum.length : null;
  /* Échelle COMMUNE à la courbe et à la trajectoire, et c'est tout l'enjeu.
     La courbe était normalisée sur son propre total : elle finissait donc
     toujours en haut du cadre. Dès que le cumul passait sous la cible,
     traj / cmax dépassait 1, la trajectoire était rabattue sur ce même haut de
     cadre, et la courbe paraissait au-dessus des pointillés alors qu'elle était
     dessous. Le diagramme bâtons, lui, comparait correctement au jour : les deux
     lectures d'une même carte se contredisaient. */
  const cmax = Math.max(o.cum[o.cum.length - 1] || 0, traj || 0) || 1;
  const path = o.cum.map((y, i) =>
    `${i ? 'L' : 'M'}${(i / Math.max(1, o.cum.length - 1) * W).toFixed(2)},${(H - y / cmax * H).toFixed(2)}`).join(' ');
  const mx = Math.max(o.cible ? o.cible * 1.35 : 0, ...o.vals, 0.001);
  return `
    <div class="card">
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        ${o.cum.length > 1 ? `<path d="${path} L${W},${H} L0,${H} Z" fill="${o.fond}" opacity=".5"/>
        <path d="${path}" fill="none" stroke="${o.couleur}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>` : ''}
        ${traj ? `<line x1="0" y1="${H}" x2="${W}" y2="${(H - Math.min(1, traj / cmax) * H).toFixed(2)}"
              stroke="var(--brick)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}
      </svg>
      <div class="axis"><span>${o.jours.length ? dLabel(o.jours[0]) : ''}</span>
        <span>${o.cible ? 'tirets = trajectoire cible' : 'aucune cible fixée'}</span>
        <span>${o.fmt(cmax)} ${o.unite}</span></div>
      <div class="daysgrid" style="position:relative;margin-top:12px">
        ${o.cible ? `<div class="budline" style="bottom:${(Math.min(1, o.cible / mx) * 78).toFixed(1)}px"></div>` : ''}
        <div class="days">
          ${o.jours.map((k, i) => o.vals[i] > 0
            ? `<div class="d" title="${dLabel(k)} · ${o.fmt(o.vals[i])} ${o.unite}"><i style="height:${
                (o.vals[i] / mx * 78).toFixed(1)}px;background:${o.couleur}"></i></div>`
            : `<div class="d" title="${dLabel(k)} · aucune saisie"><i style="height:2px;background:var(--line)"></i></div>`).join('')}
        </div>
      </div>
      <div class="axis"><span>${o.jours.length ? dLabel(o.jours[0]) : ''}</span>
        <span>${o.jours.length ? dLabel(o.jours[o.jours.length - 1]) : ''}</span></div>
      <div class="src" style="margin-top:9px">${o.legende}</div>
    </div>`;
}

/* Calories et protéines cumulées, sur la même fenêtre que le carbone. Affiché
   même sans objectif : la donnée existe et se lit seule. Le trait de trajectoire
   n'apparaît en revanche que si une cible a été fixée. */
function nutCumul(a, last){
  const nuj = nuParJour();
  const dates = a.keys;
  if(!dates.length) return '';
  const cumOf = kf => { let c = 0; return dates.map(d => (c += (nuj[d] ? nuj[d][kf] : 0), c)); };
  const valsOf = kf => last.map(d => nuj[d] ? nuj[d][kf] : 0);

  const totK = cumOf('kcal'), totP = cumOf('prot');
  const jK = totK[totK.length - 1], jP = totP[totP.length - 1];

  return `
    <h2 class="sec">Calories cumulées</h2>
    ${kpiRow([
      [n0(jK / a.nd), 'kcal', 'Moyenne par jour renseigné'],
      ...(S.prof.objCal != null ? [[n0(S.prof.objCal), 'kcal', 'Votre cible journalière']] : []),
    ])}
    ${cumulCard({jours:last, vals:valsOf('kcal'), cum:totK, cible:S.prof.objCal || null,
      unite:'kcal', couleur:'var(--s4)', fond:'var(--s6)', fmt:n0,
      legende:'Chaque colonne est une journée. Base « tel qu’acheté », comme le carbone.'
        + (S.prof.objCal != null ? ' Trait horizontal : votre cible journalière.' : '')})}

    <h2 class="sec">Protéines cumulées</h2>
    ${kpiRow([
      [n0(jP / a.nd), 'g', 'Moyenne par jour renseigné'],
      ...(S.prof.objProt != null ? [[n0(S.prof.objProt), 'g', 'Votre cible journalière']] : []),
    ])}
    ${cumulCard({jours:last, vals:valsOf('prot'), cum:totP, cible:S.prof.objProt || null,
      unite:'g', couleur:'var(--forest-2)', fond:'var(--s6)', fmt:n0,
      legende:'Protéines totales, animales et végétales confondues.'
        + (S.prof.objProt != null ? ' Trait horizontal : votre cible journalière.' : '')})}`;
}

function weeksSheet(a, last){
  const wBud = 7 * BUDGET_J;
  // regrouper par semaine (lundi)
  const wk = {};
  last.forEach(k => { const w = monday(k); (wk[w] = wk[w] || []).push(k); });
  const weeks = Object.keys(wk).sort().reverse();
  const dmax = Math.max(BUDGET_J * 1.35, ...last.map(k => a.days[k] ? a.days[k].tot : 0));

  const body = weeks.map(w => {
    const dk = wk[w].sort();
    const wtot = dk.reduce((s,k) => s + (a.days[k] ? a.days[k].tot : 0), 0);
    const over = wtot > wBud;
    const rows = dk.map(k => {
      const d = a.days[k] || {tot:0, byMeal:{}};
      const dd = new Date(k+'T12:00');
      const seg = MEALS.filter(m => d.byMeal[m.k])
        .map(m => `<i style="width:${(d.byMeal[m.k]/dmax*100).toFixed(1)}%;background:${m.c}"></i>`).join('');
      return `<div class="wkday">
        <div class="dd">${dd.toLocaleDateString('fr-FR',{weekday:'short'})}<b>${dd.getDate()}</b></div>
        <div class="stack2">${seg}</div>
        <div class="kg2">${d.tot ? n2(d.tot) : '<s style="color:var(--mute)">—</s>'}</div>
      </div>`;
    }).join('');
    return `<div class="wkhead">
        <span class="wt">Semaine du ${new Date(w+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span>
        <span class="wv" style="color:${over?'var(--brick)':'var(--ink)'}">${n1(wtot)} / ${n1(wBud)} kg</span>
      </div>${rows}`;
  }).join('');

  openSheet(`
    <h3>Trois dernières semaines</h3>
    <p class="small mute">Chaque barre est une journée, découpée par repas. Le total de la semaine est
    comparé au budget hebdomadaire de ${n1(wBud)} kg.</p>
    <div class="dayleg" style="margin:2px 0 4px">
      ${MEALS.map(m => `<span><i class="dot" style="background:${m.c}"></i>${m.l}</span>`).join('')}
    </div>
    ${body || '<div class="empty">Aucune journée enregistrée.</div>'}`);
}

const NONVEG = new Set(DB.foods.filter(f => f.v === 0).map(f => f.s));
const RED    = new Set(DB.foods.filter(f => f.r).map(f => f.s));
const LEGU   = new Set(['lentilles','poischiches','haricotsrouges','tofu']);
const SWEET  = new Set(DB.foods.filter(f =>
  f.g === 'En-cas & boulangerie' ||
  ['banane','pomme','fraise','mangue','pasteque','melon','datte','poire','peche','abricot','raisin',
   'orange','clementine','kiwi','ananas','cerise','myrtille','framboise','yaourt','fromageblanc',
   'confiture','chocolat','glace',
   /* un fruit ou une salade de fruits pris en dessert est un dessert entier :
      sans cette mention, la portion serait rabotée de 40 % comme pour un
      légume servi à la fin du repas */
   'fruitsaison','saladefruits'].includes(f.s)).map(f => f.s));
const REF    = DB.facts.refMeal;              // repas moyen déjeuner/dîner, référence nationale
const RANKS  = [[0,'Trajectoire de départ'],[150,'Sous la moyenne française'],
                [500,'Trajectoire 2 °C'],[1200,'Trajectoire 1,5 °C'],[2500,'Budget 2050 tenu']];
const isVeg  = e => !e.l.some(([x]) => NONVEG.has(x));
const hasRed = e => e.l.some(([x]) => RED.has(x));
const hasLeg = e => e.l.some(([x]) => LEGU.has(x));
const monday = d => { const t = new Date(d+'T12:00'); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return iso(t); };
const CHALS = [
  {t:'Repas végétarien',        p:5,   r:'Un déjeuner ou un dîner sans viande ni poisson. Le petit-déjeuner ne compte pas : il est déjà végétarien neuf fois sur dix.'},
  {t:'Repas de légumineuses',   p:8,   r:'Lentilles, pois chiches, haricots ou tofu dans l’assiette. Le geste le plus efficace du référentiel, et le plus rarement encouragé.'},
  {t:'Journée sans viande',     p:10,  r:'Bonus, en plus des repas. Déjeuner et dîner tous deux enregistrés, sinon la journée ne compte pas.'},
  {t:'Journée dans le budget',  p:8,   r:'Journée révolue sous le budget quotidien, déjeuner et dîner tous deux enregistrés. Se cumule avec les autres : c’est la seule épreuve qui juge la quantité émise, non la composition de l’assiette.'},
  {t:'Semaine sans viande rouge', p:40, r:'Cinq jours complets enregistrés, aucun bœuf, veau, kebab ni cheeseburger.'},
  {t:'Semaine sans viande',     p:100, r:'Bonus. Cinq jours complets enregistrés, aucune viande ni poisson.'},
  {t:'Semaine sous budget',     p:150, r:'Sept jours sur sept enregistrés et budget hebdomadaire tenu. La seule épreuve qui mesure vraiment l’objectif.'},
  {t:'Mois dans le budget',     p:500, r:'Vingt-huit jours enregistrés et moyenne quotidienne sous le budget.'},
];

function scoring(){
  const days = {};
  S.hist.forEach(e => {
    const d = days[e.d] = days[e.d] || {kg:0, main:new Set(), veg:true, red:false, vegMeal:false};
    d.kg += kgOf(e.l);
    if(e.m !== 'encas') d.main.add(e.m);
    if(!isVeg(e)) d.veg = false;
    if(hasRed(e)) d.red = true;
    if((e.m === 'dej' || e.m === 'din') && isVeg(e)) d.vegMeal = true;
  });
  const dk = Object.keys(days).sort();
  const ev = [];
  let saved = 0;

  S.hist.forEach(e => {
    if((e.m === 'dej' || e.m === 'din') && isVeg(e)){
      ev.push({d:e.d, t:'Repas végétarien', n:e.n, p:5});
      saved += Math.max(0, REF - kgOf(e.l));
    }
    if(hasLeg(e)) ev.push({d:e.d, t:'Repas de légumineuses', n:e.n, p:8});
  });
  const T = today();
  dk.forEach(d => {
    if(d < T && dayComplete(days[d]) && days[d].veg) ev.push({d, t:'Journée sans viande', n:'', p:10});
    /* Journée révolue seulement : une journée en cours est sous le budget dès le
       petit-déjeuner. Et deux repas principaux au minimum, sinon une pomme
       déclarée seule rapporterait autant qu'une journée réellement tenue. */
    if(d < T && dayComplete(days[d]) && days[d].kg <= BUDGET_J)
      ev.push({d, t:'Journée dans le budget', n:'', p:8});
  });

  const weeks = {};
  dk.forEach(d => { const w = monday(d);
    weeks[w] = weeks[w] || {days:[], kg:0}; weeks[w].days.push(d); weeks[w].kg += days[d].kg; });
  const wk = Object.keys(weeks).sort();
  wk.forEach(w => {
    const x = weeks[w];
    x.full = x.days.filter(d => days[d].main.size >= 2).length;
    x.noRed = x.days.every(d => !days[d].red);
    x.noMeat = x.days.every(d => days[d].veg);
    x.closed = w !== monday(T);
    if(!x.closed) return;                      // semaine en cours : rien n’est encore acquis
    if(x.full >= 5 && x.noRed)  ev.push({d:w, t:'Semaine sans viande rouge', n:'', p:40});
    if(x.full >= 5 && x.noMeat) ev.push({d:w, t:'Semaine sans viande', n:'', p:100});
    if(x.full >= 7 && x.kg <= 7*BUDGET_J) ev.push({d:w, t:'Semaine sous budget', n:'sept jours tenus', p:150});
  });
  const mo = {};
  dk.forEach(d => { const m = d.slice(0,7); mo[m] = mo[m] || {n:0, kg:0}; mo[m].n++; mo[m].kg += days[d].kg; });
  Object.entries(mo).forEach(([m,x]) => {
    if(m !== T.slice(0,7) && x.n >= 28 && x.kg <= x.n*BUDGET_J)
      ev.push({d:m+'-01', t:'Mois dans le budget', n:'', p:500}); });

  let cur = 0, best = 0, prev = null;
  dk.forEach(d => {
    const gap = prev ? (new Date(d) - new Date(prev))/864e5 : 1;
    if(gap > 1) cur = 0;
    if(days[d].main.size >= 2 && !days[d].red){ cur++; best = Math.max(best, cur); } else cur = 0;
    prev = d;
  });
  const total = ev.reduce((a,e) => a + e.p, 0);
  const count = t => ev.filter(e => e.t === t).length;
  return {days, dk, weeks, wk, ev, total, saved, cur, best, count};
}

function calTitle(m){
  const d = new Date(m + '-01T12:00');
  const t = d.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function shiftMonth(m, n){
  const d = new Date(m + '-01T12:00');
  d.setMonth(d.getMonth() + n);
  return iso(d).slice(0,7);
}
function dayFlags(x){
  /* Même règle que les badges : déjeuner ET dîner saisis. « Deux repas
     principaux » laissait passer un petit-déjeuner suivi d'un déjeuner. */
  const complete = !!(x && dayComplete(x));
  return {
    vegm:  !!(x && x.vegMeal),                      // au moins un repas végé
    nored: !!(complete && !x.red),                  // aucune viande rouge sur la journée
    bud:   !!(complete && x.kg <= BUDGET_J),        // journée dans le budget
  };
}
const DOTS = [

  {k:'bud',   c:'#FF7A1A', l:'Journée dans le budget'},

];
function calCells(sc, month, clickable){
  const first = new Date(month + '-01T12:00');
  const lead = (first.getDay() + 6) % 7;
  const ndays = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const out = [];
  for(let i = 0; i < lead; i++) out.push('<div class="cell void"></div>');
  for(let day = 1; day <= ndays; day++){
    const k = `${month}-${String(day).padStart(2,'0')}`;
    const x = sc.days[k], f = dayFlags(x);
    const tag = clickable && x ? 'button' : 'div';
    const attr = clickable && x ? ` data-day="${k}"` : '';
    out.push(`<${tag} class="cell${k === today() ? ' today' : ''}"${attr}
        title="${dLabel(k)}${x ? ' · ' + n2(x.kg) + ' kg' : ' · aucune saisie'}">
        <span class="dn">${day}</span>
        <span class="dots">${DOTS.map(d => `<i class="${f[d.k] ? 'on' : ''}"
          style="${f[d.k] ? `background:${d.c};border-color:${d.c}` : ''}"></i>`).join('')}</span>
      </${tag}>`);
  }
  return out.join('');
}
function calLegend(){
  return `<div class="callegend">${DOTS.map(d =>
    `<span><i class="dot" style="background:${d.c}"></i>${d.l}</span>`).join('')}</div>`;
}

/* meilleur total de repas végétariens sur une même semaine civile */
function bestVegWeek(){
  const w = {};
  S.hist.forEach(e => {
    if((e.m === 'dej' || e.m === 'din') && isVeg(e)){ const k = monday(e.d); w[k] = (w[k]||0) + 1; }
  });
  const v = Object.values(w);
  return v.length ? Math.max(...v) : 0;
}
/* Journée complète. « Au moins deux repas principaux » ne suffisait pas :
   un petit-déjeuner suivi d'un déjeuner passait le test, et une journée dont
   le dîner manque est mécaniquement sous le budget. Le badge se décrochait
   donc sur une journée à moitié saisie. Il faut le déjeuner ET le dîner. */
const dayComplete = x => x.main.has('dej') && x.main.has('din');

function vegDayCount(sc){
  return Object.values(sc.days).filter(x => dayComplete(x) && x.veg).length;
}

/* Repas principaux végétariens, tous cumulés. */
function vegMealCount(){
  return S.hist.filter(e => (e.m === 'dej' || e.m === 'din') && isVeg(e)).length;
}

/* Journées entières sous le budget quotidien. Deux garde-fous : déjeuner et
   dîner tous deux saisis, sinon une journée à moitié renseignée décroche le
   badge sans rien prouver, et la journée doit être révolue — une journée en
   cours est toujours sous le budget au petit-déjeuner. */
function budgetDayCount(sc){
  const T = today();
  return Object.entries(sc.days)
    .filter(([d, x]) => d < T && dayComplete(x) && x.kg <= BUDGET_J).length;
}

/* Reprise après rupture : trois jours de saisie d'affilée qui suivent une
   interruption d'au moins sept jours. Récompenser le retour plutôt que de ne
   compter que la série perdue — une série cassée n'est pas un échec, c'est une
   vie normale, et l'app n'a rien à gagner à le faire sentir. */
function comebackCount(){
  const d = logDays();
  let n = 0;
  for(let i = 1; i < d.length; i++){
    if((new Date(d[i]) - new Date(d[i-1])) / 864e5 < 8) continue;
    let run = 1;
    while(i + run < d.length &&
          (new Date(d[i+run]) - new Date(d[i+run-1])) / 864e5 === 1) run++;
    if(run >= 3){ n++; i += run - 1; }
  }
  return n;
}

/* Semaine intégralement végétarienne : sept jours civils, déjeuner et dîner
   saisis chaque jour, aucun repas avec viande ni poisson. Exigeant à dessein —
   une semaine où l'on n'aurait saisi que trois repas végé ne prouverait rien. */
function vegWeek100(sc){
  const T = today(), sem = {};
  Object.keys(sc.days).forEach(d => { const w = monday(d); (sem[w] = sem[w] || []).push(d); });
  return Object.entries(sem).filter(([w, jours]) =>
    w !== monday(T) && jours.length === 7 &&
    jours.every(d => dayComplete(sc.days[d]) && sc.days[d].veg)).length;
}

/* Journées sans viande rouge. Le poulet et le poisson y sont admis : c'est un
   badge distinct du végé, atteignable presque tous les jours. Journée révolue
   et complète, comme les autres badges de journée. */
function noRedDayCount(sc){
  const T = today();
  return Object.entries(sc.days)
    .filter(([d, x]) => d < T && dayComplete(x) && !x.red).length;
}

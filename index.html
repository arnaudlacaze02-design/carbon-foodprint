<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0E4D45" id="metaTheme">
<script>
/* appliqué avant le rendu : pas de flash au chargement */
(function(){
  var m; try{ m = localStorage.getItem('carbone.theme'); }catch(e){}
  m = m || 'system';
  var dark = m === 'dark' || (m === 'system' &&
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<title>Carbon FOODprint — l’empreinte carbone de vos repas</title>
<meta name="description" content="Comptabilité carbone alimentaire personnelle, à partir des données ADEME / AGRIBALYSE 3.2.">
<meta name="apple-mobile-web-app-title" content="FOODprint">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
:root{
  /* palette de marque, invariante */
  --forest:#0E4D45; --forest-2:#3A6E5C; --straw:#D9C05B; --brick:#A32E2B;
  --s1:#0E4D45; --s2:#3A6E5C; --s3:#6E9075; --s4:#A8B37A; --s5:#D9C05B; --s6:#E7DCA8;
  --serif:ui-serif,"New York",Iowan Old Style,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --round:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",var(--sans);
  --r:14px;

  /* surfaces et textes — thème CLAIR (défaut) */
  --ink:#16211E; --ink-soft:#42544D; --mute:#7C8C84;
  --paper:#F1F3EF; --card:#FFFFFF; --line:#DCE2D9; --line-soft:#EAEEE7;
  --field:#FFFFFF; --track:#E9EDE7; --seg-bg:#E4E9E1; --active:#F6F8F5;
  --on-forest:#EEF3EE; --on-forest-soft:#CBD9D1; --on-forest-mute:#9FBAAE;
  --topbar:var(--forest); --on-topbar:#F3F6F1; --on-topbar-strong:#fff; --on-topbar-mute:#AFC6BC;
  --note-bg:#FBF4DC; --note-line:#EBDDA6; --note-ink:#6B5B1E; --note-line-2:#E8D89A;
  --kpi-good:#E2EFDA;
  --shell:#20302B;
  --tabbar:rgba(255,255,255,.94);
  --card-2-bg:var(--ink); --card-2-on:#EDF1EE;
  --sheet-scrim:rgba(15,25,21,.42);
  --shadow:0 12px 28px rgba(16,33,28,.16);
  --toast-bg:#16211E;
}
:root[data-theme="dark"]{
  --ink:#E7ECE8; --ink-soft:#AEBCB4; --mute:#7E8F86;
  --paper:#141A18; --card:#1D2523; --line:#313B37; --line-soft:#28312E;
  --field:#232C29; --track:#2C3733; --seg-bg:#262F2C; --active:#232C29;
  --on-forest:#EAF1EC; --on-forest-soft:#C4D4CB; --on-forest-mute:#8FA79B;
  --topbar:#0B3B35; --on-topbar:#EAF1EC; --on-topbar-strong:#fff; --on-topbar-mute:#7FA398;
  --note-bg:#2E2A16; --note-line:#524A26; --note-ink:#D8C88A; --note-line-2:#4A4322;
  --kpi-good:#223324;
  --shell:#0A0E0D;
  --tabbar:rgba(20,26,24,.92);
  --card-2-bg:#0B3B35; --card-2-on:#EAF1EC;
  --sheet-scrim:rgba(0,0,0,.58);
  --shadow:0 12px 28px rgba(0,0,0,.5);
  --toast-bg:#2A3532;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--shell); font-family:var(--sans); color:var(--ink);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.phone{
  max-width:430px; margin:0 auto; min-height:100vh; background:var(--paper);
  position:relative; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 30px 80px rgba(0,0,0,.45);
}
@media(min-width:900px){
  body{padding:26px 0}
  .phone{min-height:calc(100vh - 52px); border-radius:34px; overflow:hidden}
  .tabbar{bottom:calc(36px + env(safe-area-inset-bottom))}
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--forest); outline-offset:2px; border-radius:4px}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--topbar); color:var(--on-topbar);
  padding:12px 18px 11px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.wordmark{display:flex; flex-direction:column; font-family:var(--round); font-weight:700;
  font-size:17px; letter-spacing:-.005em; line-height:1.1; white-space:nowrap}
.mark{width:29px; height:29px; flex:0 0 auto; background:#000; border-radius:7px; padding:2.5px;
  box-sizing:border-box; display:block}

/* pastille de profil : hexagone bordé, silhouette grisée par défaut.
   Point d'entrée du compte, et plus tard de l'avatar. */
.ava{background:none; border:0; padding:0; flex:0 0 auto; display:flex; align-items:center;
  width:32px; height:36px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.ava svg{width:32px; height:36px; display:block; overflow:visible}
.ava .hex{fill:rgba(0,0,0,.18); stroke:var(--on-topbar-mute); stroke-width:5; vector-effect:non-scaling-stroke}
.ava .who{fill:var(--on-topbar-mute)}
.ava:active{transform:scale(.94)}
.ava[data-on="1"] .hex{stroke:var(--straw); stroke-width:6.5}
.ava[data-on="1"] .who{fill:var(--on-topbar-strong)}

/* ---------------- questionnaire de profil ---------------- */
.qbar{display:flex; gap:4px; margin:2px 0 12px}
.qbar i{flex:1; height:3px; border-radius:2px; background:var(--line)}
.qbar i.on{background:var(--forest)}
.qbar i.now{background:var(--straw)}
.qopt{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:12px 14px; margin-top:7px; font-size:14.5px; color:var(--ink);
  font-family:inherit; cursor:pointer}
.qopt:active{background:var(--active)}
.qopt[aria-pressed="true"]{border-color:var(--forest); background:var(--active)}
.qopt .qn{flex:1; min-width:0}
.qopt .qs{display:block; font-family:var(--mono); font-size:10px; color:var(--mute); margin-top:2px}
.qopt .qk{font-family:var(--mono); font-size:13px; color:var(--forest); opacity:0}
.qopt[aria-pressed="true"] .qk{opacity:1}
.qrange{width:100%; margin:16px 0 4px; -webkit-appearance:none; appearance:none;
  background:transparent; height:26px}
.qrange::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--line)}
.qrange::-moz-range-track{height:4px; border-radius:2px; background:var(--line)}
.qrange::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px;
  border-radius:50%; background:var(--forest); border:3px solid var(--card); margin-top:-9px;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.qrange::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--forest);
  border:3px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.25)}
.qends{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; color:var(--mute)}
.qbig{font-family:var(--serif); font-size:34px; font-variant-numeric:tabular-nums; text-align:center;
  line-height:1.1; margin:6px 0 0}
.qbig small{font-family:var(--mono); font-size:12px; color:var(--mute)}
.wordmark em{font-style:normal; font-family:var(--round); font-weight:900; font-size:17px;
  letter-spacing:0; color:var(--straw)}
.wordmark .sp{letter-spacing:-.04em}
.today{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--on-topbar-mute); text-align:right}
.today b{display:block; font-family:var(--serif); font-size:17px; color:var(--on-topbar-strong); letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums}

main{flex:1; padding:16px 16px 104px}

/* ---------------- primitives ---------------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card + .card{margin-top:12px}
h2.sec{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--mute); margin:22px 2px 9px; font-weight:600;
}
h2.sec:first-child{margin-top:2px}
.lede{font-family:var(--serif); font-size:19px; line-height:1.3; margin:0 0 10px}
p{margin:0 0 9px}
.small{font-size:12.5px; color:var(--ink-soft)}
.mute{color:var(--mute)}
.num{font-family:var(--serif); font-variant-numeric:tabular-nums}
.unit{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--mute)}
.src{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em}
.hr{height:1px; background:var(--line-soft); margin:13px 0}

/* ---------------- gauge : élément signature ---------------- */
.gauge{position:relative; height:22px; background:var(--track); border-radius:3px; overflow:hidden; display:flex}
.gauge .seg{height:100%}
.gauge .over-zone{position:absolute; top:0; bottom:0; z-index:2; opacity:.62;
  background:repeating-linear-gradient(118deg,var(--brick) 0 4px,rgba(163,46,43,0) 4px 9px)}
.gauge-wrap{position:relative}
.tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); z-index:3}
.tick::after{
  content:attr(data-label); position:absolute; top:-15px; right:4px;
  font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--ink); white-space:nowrap;
}
.gauge-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
.gauge-legend span{font-family:var(--mono); font-size:10px; color:var(--ink-soft); display:flex; align-items:center; gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------------- « tout savoir » ---------------- */
.know{background:var(--forest); color:var(--on-forest); border:0}
.know .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.know .big{font-family:var(--serif); font-size:44px; line-height:1; margin:8px 0 2px; font-variant-numeric:tabular-nums}
.know .big small{font-size:17px; color:var(--on-forest-mute)}
.know p{color:var(--on-forest-soft); font-size:13px}
.know .split{display:flex; gap:14px; margin-top:14px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.know .split div{flex:1}
.know .split .v{font-family:var(--serif); font-size:24px; font-variant-numeric:tabular-nums}
.know .split .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--on-forest-mute); line-height:1.4}
.contrib{margin-top:16px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.contrib .row{display:grid; grid-template-columns:1fr 42px; gap:8px; align-items:center; margin-bottom:9px}
.contrib .lab{font-size:13px}
.contrib .lab i{font-style:normal; color:var(--on-forest-mute); font-size:11.5px}
.contrib .pct{font-family:var(--serif); font-size:16px; text-align:right; font-variant-numeric:tabular-nums}
.contrib .bar{grid-column:1/-1; height:6px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; margin-top:-4px}
.contrib .bar i{display:block; height:100%; background:var(--straw)}
.know{position:relative}
.expand{position:absolute; top:13px; right:13px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff;
  font-family:var(--serif); font-size:17px; line-height:1; display:flex; align-items:center;
  justify-content:center; padding-bottom:2px}
.know .teaser{color:var(--on-forest-soft); font-size:13px; margin-bottom:0}
.know.open .teaser{margin-bottom:9px}
.know ul{padding-left:18px; margin:0}
.know li{font-size:12.5px; color:var(--on-forest-soft); margin-bottom:7px}
.reco{margin-top:12px}
.rhead{display:flex; align-items:center; gap:12px}
.reco .ri{width:38px; height:38px; border-radius:10px; background:var(--seg-bg); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center}
.reco .ri svg{width:19px; height:19px; stroke:var(--forest); fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.reco .rt{flex:1; min-width:0}
.reco .rn{display:block; font-size:14.5px}
.reco .rd{display:block; font-size:11.5px; color:var(--mute); line-height:1.35; margin-top:2px}
.rbtns{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:12px}
.rbtns a{display:flex; align-items:center; justify-content:center; gap:4px; padding:10px 4px;
  border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
  font-size:13px; text-decoration:none; white-space:nowrap}
.rbtns a:active{background:var(--forest); border-color:var(--forest); color:#fff}
.rbtns a span{font-family:var(--mono); font-size:11px; color:var(--forest)}
.rbtns a:active span{color:#fff}
.disclose{
  margin-top:14px; width:100%; text-align:left; border-top:1px solid rgba(255,255,255,.16); padding-top:11px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--straw);
}
.know .more{display:none; margin-top:11px}
.know.open .more{display:block}
.know .more li{font-size:12.5px; color:var(--on-forest-soft); margin-bottom:7px}
.know .more ul{padding-left:18px; margin:0}

/* ---------------- chips / segmented ---------------- */
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 11px; border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft); white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.seg{display:flex; background:var(--seg-bg); border-radius:10px; padding:3px; gap:3px}
.seg button{
  flex:1; padding:8px 4px; border-radius:8px; font-size:13px; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.15;
}
.seg button b{font-weight:600}
.seg button small{font-family:var(--mono); font-size:9px; color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] small{color:var(--forest)}

/* ---------------- listes ---------------- */
.search{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field);
  font-size:15px; margin:2px 0 10px;
}
.list{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.item{
  display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:11px 13px; width:100%;
  text-align:left; border-bottom:1px solid var(--line-soft); align-items:center;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--active)}
.item .nm{font-size:14.5px; line-height:1.25}
.tag{display:inline-block; font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; background:var(--note-bg); color:var(--note-ink); border:1px solid var(--note-line);
  border-radius:3px; padding:0 4px; vertical-align:1px; margin-left:5px}
.note{background:var(--note-bg); border:1px solid var(--note-line); border-radius:10px; padding:11px 12px;
  font-size:12.5px; color:var(--note-ink); margin-top:12px}
.item .gp{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
.item .fe{font-family:var(--serif); font-size:17px; font-variant-numeric:tabular-nums; text-align:right}
.item .fe small{font-family:var(--mono); font-size:9px; color:var(--mute); display:block; letter-spacing:.04em}
.item .track{grid-column:1/-1; height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:3px}
.item .track i{display:block;height:100%;background:var(--forest-2)}
.empty{padding:26px 16px; text-align:center; color:var(--mute); font-size:13px}
.count{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.06em; padding:9px 13px; background:var(--active); border-top:1px solid var(--line-soft)}

/* ---------------- saisie ---------------- */
.paths{display:flex; gap:6px; margin:10px 0 12px}
.paths button{
  flex:1; padding:9px 6px; border:1px solid var(--line); border-radius:10px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft);
}
.paths button[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.dish{padding:11px 13px; border-bottom:1px solid var(--line-soft)}
.dish:last-child{border-bottom:0}
.dish .top{display:flex; align-items:center; gap:10px}
.dish .nm{flex:1; font-size:14.5px}
.dish .kg{font-family:var(--serif); font-size:17px; font-variant-numeric:tabular-nums}
.dish .add{
  padding:6px 12px; border-radius:999px; background:var(--forest); color:#fff;
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
}
.dish .comp{font-family:var(--mono); font-size:10.5px; color:var(--mute); margin-top:5px; letter-spacing:.01em}
.dish .bar{height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:7px}
.dish .bar i{display:block;height:100%}
.pick{position:relative}
.pick input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field); font-size:15px}
.sugg{position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:25; background:var(--card);
  border:1px solid var(--line); border-radius:11px; overflow:hidden auto; max-height:264px;
  box-shadow:var(--shadow)}
.sugg button{display:grid; grid-template-columns:1fr auto; gap:10px; width:100%; text-align:left;
  padding:9px 12px; border-bottom:1px solid var(--line-soft); align-items:center}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus-visible{background:var(--active)}
.sugg .nm{font-size:14px; line-height:1.2}
.sugg i{font-style:normal; display:block; font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); margin-top:1px}
.sugg b{font-family:var(--serif); font-size:15px; font-variant-numeric:tabular-nums; font-weight:400}
.compose{display:grid; grid-template-columns:1fr 74px auto; gap:7px; align-items:center; margin-top:9px}
.chint{font-size:11.5px; color:var(--mute); line-height:1.3}
.compose input[type=number]{width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--field); text-align:right}
.compose .go{padding:10px 13px; border-radius:10px; background:var(--forest); color:#fff; font-size:13px}
.draft-line{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
.draft-line .nm{flex:1; font-size:14px}
.draft-line .q{font-family:var(--mono); font-size:11px; color:var(--mute)}
.draft-line .kg{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px}
.draft-line .rm{color:var(--brick); font-family:var(--mono); font-size:16px; padding:0 4px}
.total{display:flex; align-items:baseline; justify-content:space-between; margin-top:12px}
.total .v{font-family:var(--serif); font-size:30px; font-variant-numeric:tabular-nums}
.actions{display:flex; gap:8px; margin-top:12px}
.btn{flex:1; padding:13px; border-radius:11px; text-align:center; font-size:14px; font-weight:600}
.btn-1{background:var(--forest); color:#fff}
.btn-2{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn[disabled]{opacity:.4}
.toast{
  position:fixed; left:50%; bottom:104px; transform:translate(-50%,14px); z-index:60;
  background:var(--toast-bg); color:#fff; padding:11px 17px; border-radius:999px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------------- tracker ---------------- */
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px}
.kpi .v{font-family:var(--serif); font-size:27px; line-height:1.05; font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em}
.kpi .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); margin-top:4px; line-height:1.35}
.kpi.wide{grid-column:1/-1}
.bars .row{display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin-bottom:11px}
.bars .lab{font-size:13.5px}
.bars .val{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.bars .tr{grid-column:1/-1; height:9px; background:var(--track); border-radius:2px; overflow:hidden}
.bars .tr i{display:block; height:100%}
.days{display:flex; align-items:flex-end; gap:2px; height:78px; margin-top:4px}
.dayscard{background:var(--card)}
.dayscard:active{background:var(--active)}
.budline{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--brick); z-index:2; pointer-events:none}
.dayleg{display:flex; flex-wrap:wrap; gap:9px 12px; margin-top:11px}
.dayleg span{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase}
.dayleg .budkey{width:12px; height:0; border-top:2px dashed var(--brick); display:inline-block}
.wkday{display:grid; grid-template-columns:52px 1fr auto; gap:4px 10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft)}
.wkday:last-child{border-bottom:0}
.wkday .dd{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em; line-height:1.2}
.wkday .dd b{display:block; font-family:var(--serif); font-size:14px; color:var(--ink)}
.wkday .stack2{height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--track)}
.wkday .stack2 i{height:100%}
.wkday .kg2{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.wkhead{display:flex; align-items:baseline; justify-content:space-between; margin:14px 0 4px}
.wkhead .wt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.wkhead .wv{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px}
.days .d{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; min-width:0}
.days .d i{display:block; width:100%}
.days .d.empty{background:var(--track); height:2px}
.axis{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--mute); margin-top:5px}
.journal .j{display:grid; grid-template-columns:auto 1fr auto; gap:3px 10px; padding:10px 0; border-bottom:1px solid var(--line-soft); align-items:center}
.journal .j:last-child{border-bottom:0}
.journal .dt{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em; text-align:center; line-height:1.2}
.journal .dt b{display:block; font-family:var(--serif); font-size:15px; color:var(--ink)}
.journal .nm{font-size:14px}
.journal .nm i{font-style:normal; display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.journal .kg{font-family:var(--serif); font-size:16px; font-variant-numeric:tabular-nums}
svg.spark{width:100%; height:96px; display:block; overflow:visible}
.demo{display:flex; align-items:center; gap:10px; background:var(--note-bg); border:1px solid var(--note-line-2); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--note-ink)}
.demo.edit{background:var(--kpi-good); border-color:var(--forest-2); color:var(--forest)}
.demo.edit button{color:var(--forest)}
.demo button{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--note-ink); text-decoration:underline; white-space:nowrap}

/* ---------------- sheet ---------------- */
.scrim{position:fixed; inset:0; background:var(--sheet-scrim); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; bottom:0; width:100%; max-width:430px; transform:translate(-50%,102%);
  background:var(--paper); z-index:50; border-radius:20px 20px 0 0; padding:18px 18px 30px;
  transition:transform .26s cubic-bezier(.32,.72,0,1); max-height:82vh; overflow-y:auto;
}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-family:var(--serif); font-size:22px; margin:2px 0 2px; font-weight:500}
.sheet .grab{width:38px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 12px}
.stack{display:flex; height:26px; border-radius:3px; overflow:hidden; margin:12px 0 9px}
.stack i{height:100%}
.stagelist{display:grid; grid-template-columns:auto 1fr auto; gap:6px 9px; align-items:center; font-size:12.5px}
.stagelist .sv{font-family:var(--serif); font-variant-numeric:tabular-nums; text-align:right}
.months{display:flex; gap:3px; margin-top:4px}
.months i{flex:1; height:18px; border-radius:2px; background:var(--seg-bg); font-family:var(--mono); font-size:8px; color:var(--mute); display:flex; align-items:center; justify-content:center; font-style:normal}
.months i.on{background:var(--forest); color:#fff}

/* ---------------- tabbar ---------------- */
.tabbar{
  /* fixée au cadre, pas au flux : elle ne bouge plus d'un pixel au défilement */
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:calc(min(430px, 100%) - 20px);
  z-index:30; display:flex; gap:2px;
  padding:7px 6px; border-radius:26px; border:1px solid var(--line);
  background:var(--tabbar); backdrop-filter:blur(16px); box-shadow:var(--shadow);
}
.tabbar button{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:2px 0; color:var(--mute);
}
.tabbar .ic{
  display:flex; align-items:center; justify-content:center; width:100%; max-width:54px; height:29px;
  border-radius:999px; transition:background .18s ease;
}
.tabbar svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7}
.tabbar span:not(.ic){font-family:var(--mono); font-size:8px; letter-spacing:.03em; text-transform:uppercase;
  overflow:hidden; text-overflow:ellipsis; max-width:100%; white-space:nowrap}
.tabbar button[aria-current="page"]{color:var(--forest)}
.tabbar button[aria-current="page"] .ic{background:var(--forest)}
.tabbar button[aria-current="page"] .ic svg{stroke:#fff}
.tabbar button:active .ic{background:var(--seg-bg)}
.tabbar button[aria-current="page"]:active .ic{background:var(--forest)}
/* ---------------- carte de score (Trophées) ---------------- */
.rank{background:var(--card-2-bg); color:var(--card-2-on); border:0; position:relative}
.rank .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.detaillink{font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:0;
  text-transform:none; color:var(--straw); margin-left:8px; text-decoration:underline;
  text-underline-offset:2px; vertical-align:baseline}
.rank .pts{font-family:var(--serif); font-size:46px; line-height:1; margin:6px 0 0; font-variant-numeric:tabular-nums}
.rank .pts small{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--on-forest-mute); text-transform:uppercase}
.rank .name{font-family:var(--serif); font-size:19px; margin-top:9px}
.rank .prog{height:7px; background:rgba(255,255,255,.16); border-radius:2px; overflow:hidden; margin:9px 0 6px}
.rank .prog i{display:block; height:100%; background:var(--straw)}
.rank .next{font-family:var(--mono); font-size:10px; color:var(--on-forest-mute); letter-spacing:.04em}
.rank .aside{display:flex; gap:14px; border-top:1px solid rgba(255,255,255,.16); margin-top:14px; padding-top:12px}
.rank .aside div{flex:1}
.rank .aside .v{font-family:var(--serif); font-size:22px; font-variant-numeric:tabular-nums}
.rank .aside .l{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--on-forest-mute); line-height:1.4}
.qmark{position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35); color:#fff; font-family:var(--serif); font-size:14px;
  display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08)}

/* ---------------- barème ---------------- */
.chal{display:grid; grid-template-columns:24px 1fr auto; gap:3px 9px; align-items:baseline; padding:12px 13px;
  border-bottom:1px solid var(--line-soft)}
.chal:last-of-type{border-bottom:0}
.chal .st{font-family:var(--mono); font-size:14px; text-align:center; line-height:1.2}
.chal .st.on{color:var(--forest)}
.chal .st.off{color:var(--line)}
.chal .nm{font-size:14.5px}
.chal .pt{font-family:var(--serif); font-size:16px; font-variant-numeric:tabular-nums; white-space:nowrap}
.chal .rule{grid-column:2/-1; font-size:11.5px; color:var(--mute); line-height:1.35}
.chal .got{grid-column:2/-1; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--forest-2); margin-top:3px}

/* ---------------- semaine en cours ---------------- */
.wnow{display:grid; grid-template-columns:1fr auto; gap:4px 10px}
.wnow .l{font-size:13.5px}
.wnow .v{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.wnow .tr{grid-column:1/-1; height:8px; background:var(--track); border-radius:2px; overflow:hidden; margin-bottom:6px}
.wnow .tr i{display:block; height:100%}

/* ---------------- trophées ---------------- */
.bgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 6px; margin-top:2px}
.badge{display:flex; flex-direction:column; align-items:center; text-align:center; padding:4px 2px; cursor:pointer}
.badge svg{width:100%; height:auto; max-width:86px; display:block}
.badge .be{font-size:13px; line-height:1; margin-bottom:-4px}
.badge .bt{font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-soft); margin-top:8px; line-height:1.3; overflow-wrap:anywhere}
.badge .bp{font-family:var(--serif); font-size:15px; font-variant-numeric:tabular-nums; margin-top:2px}
.badge .bp s{text-decoration:none; color:var(--mute)}
.badge.locked .bt,.badge.locked .bp{color:var(--mute)}
.bfamttl{font-size:15px; margin-bottom:1px}
.bfamsub{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); margin-bottom:11px}
.seemore{width:100%; margin-top:14px; padding:11px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--forest); font-size:13px}
.trodet{display:flex; align-items:baseline; gap:9px; margin:12px 0 2px}
.trodet .tn{font-family:var(--serif); font-size:21px}
.trodet .te{font-size:20px}

/* ---------------- conseil contextuel (Tracker) ---------------- */
.tip{display:flex; gap:10px; align-items:flex-start; background:var(--kpi-good);
  border:1px solid var(--forest-2); border-radius:10px; padding:11px 12px; margin-top:12px}
.tip.warn{background:var(--note-bg); border-color:var(--note-line-2)}
.tip .ic{font-family:var(--mono); font-size:13px; line-height:1.3}
.tip .tx{font-size:12.5px; line-height:1.45; color:var(--ink)}
.tip .tx b{font-weight:600}

/* ---------------- date de saisie ---------------- */
.daterow{display:flex; gap:7px; align-items:center; margin-bottom:2px}
.daterow input[type=date]{flex:1; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--field); font-size:14px; color:var(--ink); min-width:0}
.daterow button{padding:10px 12px; border-radius:10px; background:var(--seg-bg); color:var(--ink-soft);
  font-size:12.5px; white-space:nowrap}
.daterow button[aria-pressed="true"]{background:var(--forest); color:#fff}
.pastwarn{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--note-ink); background:var(--note-bg); border:1px solid var(--note-line);
  border-radius:7px; padding:5px 9px; margin-top:7px; display:inline-block}
.backlink{font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--forest); margin-bottom:8px; display:block}

/* ---------------- calendrier ---------------- */
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
.calnav .m{font-family:var(--serif); font-size:16px}
.calnav button{width:30px; height:30px; border-radius:8px; background:var(--seg-bg); color:var(--ink);
  font-size:15px; display:flex; align-items:center; justify-content:center}
.calnav button[disabled]{opacity:.3}
.calhead,.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.calhead span{font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); text-align:center; padding-bottom:3px}
.cell{border-radius:9px; background:var(--track); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; padding:6px 0 5px; min-height:44px}
.cell.void{background:none}
.cell.today{outline:1.5px solid var(--forest); outline-offset:-1.5px}
.cell .dn{font-family:var(--serif); font-size:12.5px; font-variant-numeric:tabular-nums; line-height:1}
.dots{display:flex; gap:4px}
.dots i{width:7px; height:7px; border-radius:50%; box-sizing:border-box;
  border:1.4px solid var(--line); display:block}
.dots i.on{border-width:0}
.calwrap.mini{max-width:284px; margin:0 auto}
.calwrap.mini .cell{min-height:0; aspect-ratio:1; gap:2px; padding:0; border-radius:7px}
.calwrap.mini .cell .dn{font-size:10px}
.calwrap.mini .dots i{width:5px; height:5px; border-width:1.2px}
.calwrap.mini .calhead span{font-size:7.5px; padding-bottom:2px}
.calmini{text-align:left; cursor:pointer}
.calmini:active{background:var(--active)}
.mininav{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px}
.mininav span{font-family:var(--serif); font-size:15px}
.mininav .op{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--forest)}
.callegend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px}
.callegend span{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.03em; text-transform:uppercase; color:var(--ink-soft)}

/* ---------------- trois dernières semaines ---------------- */
.daysgrid{position:relative}
.budline{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--brick); z-index:2; pointer-events:none}
.dayleg{display:flex; flex-wrap:wrap; gap:9px 12px; margin-top:11px}
.dayleg span{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase}
.dayleg .budkey{width:12px; height:0; border-top:2px dashed var(--brick); display:inline-block}
.dayscard{background:var(--card)}
.dayscard:active{background:var(--active)}
.wkday{display:grid; grid-template-columns:52px 1fr auto; gap:4px 10px; align-items:center; padding:8px 0;
  border-bottom:1px solid var(--line-soft)}
.wkday:last-child{border-bottom:0}
.wkday .dd{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em; line-height:1.2}
.wkday .dd b{display:block; font-family:var(--serif); font-size:14px; color:var(--ink)}
.wkday .stack2{height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--track)}
.wkday .stack2 i{height:100%}
.wkday .kg2{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.wkhead{display:flex; align-items:baseline; justify-content:space-between; margin:14px 0 4px}
.wkhead .wt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.wkhead .wv{font-family:var(--serif); font-variant-numeric:tabular-nums; font-size:14px}

/* ---------------- saisie : accueil et blocs repas ---------------- */
.homegrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:4px}
.hcard{aspect-ratio:1; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:14px 12px; text-align:center}
.hcard:active{background:var(--active)}
.hcard .hi{width:44px; height:44px; border-radius:50%; background:var(--forest);
  display:flex; align-items:center; justify-content:center}
.hcard .hi svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.hcard .ht{font-family:var(--serif); font-size:17px; line-height:1.15}
.hcard .hs{font-family:var(--mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.35; overflow-wrap:anywhere; max-width:100%}
.mealblocks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.mblock{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 12px;
  display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center}
.mblock .ml{font-size:14.5px}
.mblock .mv{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--mute)}
.mblock[aria-pressed="true"]{background:var(--forest); border-color:var(--forest)}
.mblock[aria-pressed="true"] .ml{color:#fff}
.mblock[aria-pressed="true"] .mv{color:var(--on-topbar-mute)}
.star{flex:0 0 auto; padding:2px; margin-right:2px; display:flex; align-items:center}
.star svg{width:17px; height:17px; fill:none; stroke:var(--mute); stroke-width:1.6; stroke-linejoin:round}
.star.on svg{fill:var(--straw); stroke:var(--straw)}

/* ---------------- carrefour des services ---------------- */
.hubgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:2px}
.hub{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 13px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; min-height:78px}
.hub:active{background:var(--active)}
.hub .hn{font-family:var(--serif); font-size:17px}
.hub .hn i{font-style:normal; color:var(--forest); font-size:14px}
.hub .hd{font-family:var(--mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.35}
.hub.on{border-color:var(--forest-2); background:var(--kpi-good)}
.hub.next{border-color:var(--forest); border-width:1.5px}
.hub.next .hd{color:var(--forest)}
.wizbar span[data-jump]{cursor:pointer}
/* ---------------- parcours guidé ---------------- */
.mealhead{display:flex; align-items:baseline; gap:9px; margin:2px 0 4px}
.mealhead .mh{font-family:var(--serif); font-size:22px}
.mealhead .md{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
.wizbar{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin:8px 0 2px}
.wizbar span{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mute); padding:4px 8px; border-radius:999px; background:var(--seg-bg)}
.wizbar span.on{background:var(--forest); color:#fff}
.wizbar span.done{background:var(--kpi-good); color:var(--forest)}
.wizbar i{font-style:normal; color:var(--line); font-size:11px}
.drinkgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:2px}
.dcard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 8px;
  display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center}
.dcard:active{background:var(--active)}
.dcard .dn2{font-family:var(--serif); font-size:16px}
.dcard .dk{font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.3}
.dcard.done{background:var(--forest); border-color:var(--forest)}
.dcard.done .dn2{color:#fff}
.dcard.done .dk{color:var(--on-topbar-mute)}
/* ---------------- composition par services ---------------- */
.course{border:1.5px dashed var(--line); border-radius:12px; padding:10px 12px 8px; margin-top:10px}
.course.filled{border-color:var(--forest-2)}
.course.target{border-color:var(--forest); background:var(--active)}
.chd{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.chd .ct{flex:1; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--mute)}
.chd .ct b{color:var(--forest); font-weight:400}
.chd .ck{font-family:var(--serif); font-size:14px; font-variant-numeric:tabular-nums}
.chd .plus{width:23px; height:23px; border-radius:50%; background:var(--forest); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; flex:0 0 auto}
.cempty{font-size:11.5px; color:var(--mute); padding:3px 0 4px}
.course .draft-line{padding:7px 0}
.course .draft-line:last-child{border-bottom:0}

/* ---------------- éclair de série et réglages ---------------- */
.streak{display:flex; align-items:center; gap:3px; padding:4px 8px 4px 6px; border-radius:999px;
  background:rgba(255,255,255,.13); flex:0 0 auto; cursor:pointer}
.streak svg{width:13px; height:13px; fill:var(--straw); stroke:none}
.streak b{font-family:var(--serif); font-size:15px; color:#fff; font-variant-numeric:tabular-nums; line-height:1}
.streak.off{opacity:.45}
.streak.off svg{fill:var(--on-topbar-mute)}
.aside2{display:flex; gap:14px; margin-top:12px}
.aside2 div{flex:1}
.aside2 .v{font-family:var(--serif); font-size:26px; font-variant-numeric:tabular-nums; line-height:1}
.aside2 .l{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mute); line-height:1.4; margin-top:4px}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow .l{font-size:14px}
.setrow .l i{font-style:normal; display:block; font-size:11.5px; color:var(--mute); margin-top:2px}
.themeseg{display:flex; background:var(--seg-bg); border-radius:9px; padding:3px; gap:3px; flex:0 0 auto}
.themeseg button{padding:7px 12px; border-radius:7px; font-size:12.5px; color:var(--ink-soft);
  display:flex; align-items:center; gap:5px}
.themeseg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.themeseg svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7}
.gear{background:none; border:0; color:var(--on-topbar-mute); padding:4px; margin-right:-2px;
  display:flex; align-items:center}
.gear svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6}
.gear:active{color:var(--on-topbar-strong)}
.jrow{cursor:pointer}
.jrow:active{background:var(--active)}

@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* surcharges petits écrans — placées en fin de feuille pour primer dans la cascade */
@media(max-width:359px){
  .wordmark{font-size:15px}
  .wordmark em{font-size:15px}
  .mark{width:26px; height:26px}
  .tabbar span:not(.ic){font-size:7.5px}
}
</style>

/* ========================= stockage cloisonné =========================
   Une clé par compte, plus un réservoir anonyme pour tout ce qui est saisi
   avant la moindre connexion. Sans ce cloisonnement, un second compte ouvert
   sur le même navigateur hériterait de l'historique du premier — et on
   croirait à une fuite serveur alors que tout se passe en local. */
const KEY_ANON = 'carbone.v1';
const SKEY = 'carbone.session';
const CKEY = 'carbone.client';

/* Identifiant d'installation. Les ids locaux 'e'+Date.now() ne sont uniques
   que sur un appareil ; le couple (installation, id) l'est partout, ce qui
   rend les remontées idempotentes sans avoir à réécrire les ids existants. */
const CLIENT_ID = (() => {
  try{
    let c = localStorage.getItem(CKEY);
    if(!c){
      c = 'i' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
      localStorage.setItem(CKEY, c);
    }
    return c;
  }catch(e){ return 'i-volatile-0000'; }
})();

let SESS = null;    /* {uid, slug, username, access_token, refresh_token, expires_at} */
const dataKey = () => SESS ? KEY_ANON + '.' + SESS.uid : KEY_ANON;

let S = {tab:'saisie', group:'', q:'', meal:'dej', path:'types', draft:[], favs:[], hist:[],
         tv:'repas', openDish:null, pickQ:'', pickSlug:null, stdInit:false,
         dishQ:'', comCat:'plat', editId:null, calMonth:null, entryDate:null,
         step:'home', starred:[], knowOpen:false, troAll:false, wiz:null,
         tomb:[], lastSync:null, prof:{}};

function save(){
  try{ localStorage.setItem(dataKey(), JSON.stringify({favs:S.favs, hist:S.hist,
        tomb:S.tomb, stdInit:S.stdInit, starred:S.starred, lastSync:S.lastSync,
        prof:S.prof})); }catch(e){}
}
function load(){
  S.favs=[]; S.hist=[]; S.tomb=[]; S.starred=[]; S.stdInit=false; S.lastSync=null; S.prof={};
  try{
    const raw = localStorage.getItem(dataKey());
    if(raw){ const o = JSON.parse(raw);
      S.favs=o.favs||[]; S.hist=o.hist||[]; S.tomb=o.tomb||[];
      S.stdInit=!!o.stdInit; S.starred=o.starred||[]; S.lastSync=o.lastSync||null;
      S.prof=o.prof||{};
      stamp(); return true; }
  }catch(e){}
  return false;
}

/* Les repas antérieurs à la synchro n'ont ni horodatage de modification ni
   installation d'origine. On les leur attribue une fois, en datant du midi de
   leur propre journée : c'est stable d'un appareil à l'autre, alors qu'un
   Date.now() donnerait deux valeurs différentes pour le même repas. */
function stamp(){
  let n = 0;
  S.hist.forEach(e => {
    if(!e.c){ e.c = CLIENT_ID; n++; }
    if(!e.u){ e.u = new Date(e.d + 'T12:00:00Z').toISOString(); n++; }
  });
  if(n) save();
}

SB.keepSess = () => {
  try{ SESS ? localStorage.setItem(SKEY, JSON.stringify(SESS)) : localStorage.removeItem(SKEY); }catch(e){}

SB.readSess = () => {

/* Un seul point de sortie réseau : status 0 signifie « pas joignable »,
   ce qui doit toujours être traité comme un report, jamais comme un refus. */
SB.call = async (path, opts) => {
  opts = opts || {};
  try{
    const r = await fetch(SB.url + path, {...opts, headers:{...SB.h(), ...(opts.headers||{})}});
    const txt = await r.text();
    let body = null;
    try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = {raw:txt}; }
    return {ok:r.ok, status:r.status, body};
  }catch(e){ return {ok:false, status:0, body:{error:'reseau'}}; }
};

SB.fn = (action, extra, token) => SB.call('/functions/v1/account', {
  method:'POST',
  headers: token ? {Authorization:'Bearer ' + token} : {},
  body: JSON.stringify({action, ...(extra||{})}),
});

/* Le pseudo suffit : l'identifiant technique s'en déduit, aucune table de
   correspondance n'est consultée, donc rien à énumérer. La normalisation doit
   rester identique à celle de l'Edge Function. */
SB.slugify = p => (p||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^[-._]+|[-._]+$/g,'').slice(0,24);

SB.signIn = async (pseudo, password) => {
  const slug = SB.slugify(pseudo);
  const r = await SB.call('/auth/v1/token?grant_type=password', {method:'POST',
    body: JSON.stringify({email: slug + '@' + SB.domain, password})});
  if(!r.ok || !r.body || !r.body.access_token) return r;
  SESS = {uid:r.body.user.id, slug,
          username:(r.body.user.user_metadata||{}).username || pseudo,
          access_token:r.body.access_token, refresh_token:r.body.refresh_token,
          expires_at: Date.now() + ((r.body.expires_in||3600) * 1000)};
  SB.keepSess();
  return r;
};

/* Renouvellement silencieux. Hors ligne il échoue, et c'est sans gravité :
   seule la synchro attend, l'app continue de fonctionner sur sa copie locale.
   Un 400 ou 401, en revanche, signifie un jeton définitivement mort — on
   oublie la session sans jamais toucher aux données. */
SB.fresh = async () => {
  if(!SESS) return null;
  if(Date.now() < SESS.expires_at - 60000) return SESS.access_token;
  const r = await SB.call('/auth/v1/token?grant_type=refresh_token', {method:'POST',
    body: JSON.stringify({refresh_token:SESS.refresh_token})});
  if(r.ok && r.body && r.body.access_token){
    SESS.access_token = r.body.access_token;
    SESS.refresh_token = r.body.refresh_token || SESS.refresh_token;
    SESS.expires_at = Date.now() + ((r.body.expires_in||3600) * 1000);
    SB.keepSess();
    return SESS.access_token;
  }
  if(r.status === 400 || r.status === 401){ SESS = null; SB.keepSess(); }
  return null;
};

SB.rest = async (path, opts) => {
  const t = await SB.fresh();
  if(!t) return {ok:false, status:0, body:{error:'hors_session'}};
  opts = opts || {};
  return SB.call('/rest/v1/' + path, {...opts,
    headers:{Authorization:'Bearer ' + t, ...(opts.headers||{})}});
};

SB.signOut = () => { SESS = null; SB.keepSess(); };

      return false;
    }
    const tomb = new Map(S.tomb.map(t => [tKey(t), t]));
    (got.body || []).forEach(r => {
      const k = r.client_id + '|' + r.entry_id;
      const loc = S.hist.find(x => eKey(x) === k);
      if(r.deleted_at){
        if(loc) S.hist = S.hist.filter(x => eKey(x) !== k);
        if(!tomb.has(k)){ const t = {c:r.client_id, id:r.entry_id, at:r.deleted_at};
                          S.tomb.push(t); tomb.set(k, t); }
        return;
      }
      /* supprimé ici plus récemment que modifié là-bas : la suppression gagne */
      if(tomb.has(k) && tomb.get(k).at > r.updated_at) return;
      const inc = {id:r.entry_id, c:r.client_id, d:r.d, m:r.meal, n:r.name, l:r.lines, u:r.updated_at};
      if(!loc) S.hist.push(inc);
      else if(r.updated_at > loc.u) Object.assign(loc, inc);
    });

    /* 2. remonter — un seul appel, la clé composite rend le rejeu inoffensif */
    if(S.hist.length){
      const up = await SB.rest('entries?on_conflict=user_id,client_id,entry_id',
        {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
         body: JSON.stringify(S.hist.map(rowOf))});
      if(!up.ok){ if(!silent) toast('Envoi refusé par le serveur'); return false; }
    }

    /* 3. pierres tombales — on marque la ligne existante, on ne la recrée pas :
       les colonnes obligatoires ne sont plus disponibles après suppression */
    for(const t of S.tomb){
      await SB.rest('entries?client_id=eq.' + encodeURIComponent(t.c) +
                    '&entry_id=eq.' + encodeURIComponent(t.id),
        {method:'PATCH', body: JSON.stringify({deleted_at:t.at, updated_at:t.at})});
    }

    S.lastSync = new Date().toISOString();
    save();
    if(!silent) toast('Synchronisé · ' + S.hist.length + ' repas');
    return true;
  } finally { syncing = false; }
}

function gauge(byMeal, total){
  const scale = Math.max(BUDGET_J, total) * 1.02;
  const segs = MEALS.filter(m => byMeal[m.k] > 0)
    .map(m => `<i class="seg" style="width:${(byMeal[m.k]/scale*100).toFixed(2)}%;background:${m.c}"></i>`)
    .join('');
  const ov = Math.max(0, total - BUDGET_J);
  const over = ov > 0
    ? `<span class="over-zone" style="left:${(BUDGET_J/scale*100).toFixed(2)}%;width:${(ov/scale*100).toFixed(2)}%"></span>`
    : '';
  const tick = `<span class="tick" data-label="budget ${n1(BUDGET_J)}" style="left:${clamp(BUDGET_J/scale*100,0,99.4).toFixed(2)}%"></span>`;
  return `<div class="gauge-wrap" style="padding-top:16px">
      <div class="gauge">${segs}${over}</div>${tick}
    </div>
    <div class="gauge-legend">${MEALS.filter(m=>byMeal[m.k]>0)
      .map(m=>`<span><i class="dot" style="background:${m.c}"></i>${m.l} ${n2(byMeal[m.k])}</span>`).join('')
      || '<span>Aucune saisie pour l’instant</span>'}
    </div>`;
}

const COM_COEF = {boisson:1, entree:0.55, plat:1, dessert:1, cafethe:1};
function comPortion(slug){
  const f = F.get(slug);
  if(S.comCat === 'dessert') return SWEET.has(slug) ? f.p : Math.round(f.p * 0.6);
  if(S.comCat === 'boisson' || S.comCat === 'cafethe') return f.p;
  return Math.round(f.p * COM_COEF[S.comCat] / 5) * 5 || 5;
}
function comLabel(slug){
  const base = F.get(slug).p, q = comPortion(slug);
  if(S.comCat === 'boisson')  return `verre type ${base} ml`;
  if(S.comCat === 'cafethe')  return `tasse type ${base} ml`;
  if(S.comCat === 'plat') return `portion type ${base} g`;
  if(S.comCat === 'dessert') return SWEET.has(slug) ? `dessert, ${q} g` : `hors dessert type, ${q} g`;
  return `entrée, ${q} g (type ${base} g)`;
}

/* champ de recherche d'aliment : suggestions, sélection, ajout */
function bindCompose(){
  const cf = $('#cf'), cq = $('#cq'), sg = $('#sugg');
  if(!cf) return;
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                     .replace(/œ/g,'oe').replace(/æ/g,'ae').trim();
  const find = q => {
    const n = norm(q);
    if(!n) return [];
    const pre = [], sub = [], grp = [];
    DB.foods.forEach(f => {
      const fn = norm(f.n);
      if(fn.startsWith(n)) pre.push(f);
      else if(fn.includes(n)) sub.push(f);
      else if(norm(f.g).includes(n)) grp.push(f);
    });
    const byFe = (a,b) => b.t - a.t;
    const named = [...pre.sort(byFe), ...sub.sort(byFe)];
    return (named.length ? named : grp.sort(byFe)).slice(0, 8);
  };
  const findDish = q => {
    const n = norm(q);
    return n.length < 3 ? [] : DB.dishes.filter(d => norm(d.n).includes(n)).slice(0, 3);
  };
  const choose = slug => {
    const f = F.get(slug);
    S.pickSlug = slug; S.pickQ = f.n;
    cf.value = f.n; cq.value = comPortion(slug);
    sg.hidden = true; sg.innerHTML = '';
    $('#chint').textContent = `${f.n} · ${n1(f.t)} kg CO₂e/kg · ${comLabel(slug)}`;
  };
  const paint = () => {
    const r = find(cf.value), rd = findDish(cf.value);
    if(!r.length && !rd.length){ sg.hidden = true; sg.innerHTML = ''; return; }
    sg.innerHTML =
      r.map(f => `<button type="button" data-pick="${f.s}">
        <span class="nm">${esc(f.n)}${f.x ? '<span class="tag">estimé</span>' : ''}<i>${esc(f.g)}</i></span>
        <b>${n1(f.t)}</b></button>`).join('')
      + rd.map(d => `<button type="button" data-dishpick="${esc(d.n)}">
        <span class="nm">${esc(d.n)}<span class="tag">plat</span><i>${d.l.length} ingrédients</i></span>
        <b>${n2(kgOf(d.l))}</b></button>`).join('');
    sg.hidden = false;
    sg.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => choose(b.dataset.pick));
    sg.querySelectorAll('[data-dishpick]').forEach(b => b.onclick = () => {
      const d = DB.dishes.find(x => x.n === b.dataset.dishpick);
      d.l.forEach(l => S.draft.push([l[0], l[1], S.comCat]));
      S.pickSlug = null; S.pickQ = '';
      renderSaisie(); toast(`${d.n} ajouté`);
    });
  };
  const add = () => {
    let slug = S.pickSlug;
    if(!slug){ const r = find(cf.value); if(r.length) slug = r[0].s; }
    if(!slug) return toast('Aucun aliment ne correspond.');
    S.draft.push([slug, +cq.value || comPortion(slug), S.comCat]);
    S.pickSlug = null; S.pickQ = '';
    renderSaisie();
    const nx = $('#cf'); if(nx) nx.focus();
  };
  cf.oninput = () => { S.pickSlug = null; S.pickQ = cf.value; paint(); };
  cf.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); const r = find(cf.value); if(r.length) choose(r[0].s); }
    if(e.key === 'Escape'){ sg.hidden = true; }
  };
  cf.onfocus = () => paint();
  cq.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); add(); } };
  $('#cadd').onclick = add;
}

/* les quatre services, dans l'ordre d'affichage voulu */
const COURSE_HUB = [
  {k:'boisson', l:'Boisson',  d:'Eau, vin, soda, jus'},
  {k:'entree',  l:'Entrée',   d:'Crudités, taboulé, soupe'},
  {k:'plat',    l:'Plat',     d:'Le cœur du repas'},
  {k:'dessert', l:'Dessert',  d:'Fruit, laitage, gâteau'},
  {k:'cafethe', l:'Café ou thé', d:'Et le digestif'},
];
/* garde-fous de portion, en grammes d'ingrédients */
const CAP = {entree:{max:200}, plat:{normal:500, large:700}};

const gOf = lines => lines.reduce((a,l) => a + l[1], 0);

/* met à l'échelle les grammages d'un service pour que leur somme atteigne la cible */
function rescaleCourse(course, targetG){
  const idx = S.draft.map((l,i) => ({l,i})).filter(x => (x.l[2]||'plat') === course);
  const tot = gOf(idx.map(x => x.l));
  if(!tot) return;
  const k = targetG / tot;
  let acc = 0;
  idx.forEach((x, n) => {
    const v = n === idx.length - 1 ? targetG - acc : Math.max(1, Math.round(x.l[1] * k));
    S.draft[x.i][1] = Math.max(1, v);
    acc += S.draft[x.i][1];
  });
}

/* passe au service suivant, ou à l'écran de fin après le café */
function advanceCourse(course){
  const nx = nextCourse(course);
  if(nx) return openCourse(nx);
  S.step = 'finish'; renderSaisie();
}

/* validation d'un service : applique les garde-fous puis enchaîne */
function validateCourse(course){
  const lines = S.draft.filter(l => (l[2]||'plat') === course);
  const g = gOf(lines);
  if(course === 'entree' && g > CAP.entree.max){
    rescaleCourse('entree', CAP.entree.max);
    toast(`Entrée ramenée à ${CAP.entree.max} g, la portion type`);
    return advanceCourse(course);
  }
  if(course === 'plat' && g > CAP.plat.normal){
    openSheet(`
      <div class="unit">Portion du plat</div>
      <h3>${n0(g)} g dans l’assiette</h3>
      <p class="small mute">C’est au-dessus d’une portion type de ${CAP.plat.normal} g.
        Laquelle avez-vous mangée ?</p>
      <div class="drinkgrid" style="grid-template-columns:1fr 1fr">
        <button class="dcard" data-portion="${CAP.plat.normal}">
          <span class="dn2">Normale</span><span class="dk">ramené à ${CAP.plat.normal} g</span></button>
        <button class="dcard done" data-portion="${CAP.plat.large}">
          <span class="dn2">Large</span><span class="dk">plafonné à ${CAP.plat.large} g</span></button>
      </div>`);
    $('#sheet').querySelectorAll('[data-portion]').forEach(b => b.onclick = () => {
      const t = +b.dataset.portion;
      rescaleCourse('plat', Math.min(g, t));
      closeSheet(); advanceCourse('plat');
      toast(t === CAP.plat.normal ? `Plat ramené à ${t} g` : `Portion large, plafonnée à ${Math.min(g,t)} g`);
    });
    return;
  }
  advanceCourse(course);
}

/* carrefour : quatre services libres, le suivant vide est mis en avant */
function renderHub(D, isToday, draftKg){
  const filled = c => S.draft.some(l => (l[2]||'plat') === c);
  const nextEmpty = (COURSE_HUB.find(c => !filled(c.k)) || {}).k;
  view.innerHTML = `
    <button class="backlink" id="sBack">‹ Changer de repas</button>
    <div class="mealhead">
      <span class="mh">${MEAL[S.meal].l}</span>
      <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)}${draftKg ? ` · ${n2(draftKg)} kg` : ''}</span>
    </div>
    <h2 class="sec">Les services du repas</h2>
    <div class="hubgrid">
      ${COURSE_HUB.map(c => {
        const lines = S.draft.filter(l => (l[2]||'plat') === c.k);
        const on = lines.length > 0;
        return `<button class="hub${on ? ' on' : ''}${c.k === nextEmpty ? ' next' : ''}" data-course="${c.k}">
          <span class="hn">${c.l}${on ? ' <i>✓</i>' : ''}</span>
          <span class="hd">${on ? `${lines.length} aliment${lines.length>1?'s':''} · ${n2(kgOf(lines))} kg`
            : (c.k === nextEmpty ? 'à suivre' : c.d)}</span>
        </button>`; }).join('')}
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn btn-1" id="toFinish" ${S.draft.length ? '' : 'disabled'}>Terminer le repas ›</button>
    </div>
    ${!S.draft.length ? `<div class="src" style="margin-top:10px">Touchez un service pour le composer.
      Vous pouvez les remplir dans l’ordre que vous voulez, et n’en remplir qu’un.</div>` : ''}`;
  $('#sBack').onclick = () => { S.step = 'meal'; renderSaisie(); };
  view.querySelectorAll('[data-course]').forEach(b => b.onclick = () => openCourse(b.dataset.course));
  const tf = $('#toFinish');
  if(tf && !tf.disabled) tf.onclick = () => { S.step = 'finish'; renderSaisie(); };
}

/* écran de fin : boisson chaude, digestif, ou rien */
function renderFinish(D, isToday, draftKg){
  view.innerHTML = `
    <button class="backlink" id="sBack">‹ Retour au café</button>
    <div class="mealhead">
      <span class="mh">${MEAL[S.meal].l}</span>
      <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)} · ${n2(draftKg)} kg</span>
    </div>
    <h2 class="sec">Le repas est-il complet ?</h2>
    <div class="card">
      ${WIZ.map(w => {
        const lines = S.draft.filter(l => (l[2]||'plat') === w.k);
        if(!lines.length) return '';
        return `<div class="draft-line">
          <span class="nm">${w.label}<i class="small mute" style="font-style:normal">  ·  ${
            lines.map(l => F.get(l[0]).n.toLowerCase()).join(', ')}</i></span>

      <div class="total">

          <div class="small mute">${draftKg > BUDGET_J ? 'Ce repas dépasse le budget de la journée.'
            : `${Math.round(draftKg/BUDGET_J*100)} % du budget du jour.`}</div></div>

    <div class="actions" style="margin-top:12px">

    </div>
    <button class="backlink" id="toHub" style="margin-top:10px">Reprendre un service ›</button>
    <div class="src" style="margin-top:4px">Le fil des services reste ouvert : vous pouvez revenir sur
      la boisson, l’entrée, le plat, le dessert ou le café avant d’enregistrer.</div>`;
  $('#sBack').onclick = () => openCourse('cafethe');
  $('#toHub').onclick = () => { S.step = 'hub'; renderSaisie(); };
  $('#fin').onclick = commitMeal;
  $('#favMeal').onclick = () => openSheet(`
    <h3>Garder en favori</h3>
    <p class="small mute">Ce repas réapparaîtra dans la liste, étoilé et en tête.</p>
    <input class="search" id="favname" value="${esc(MEAL[S.meal].l)} type" style="margin-top:6px">
    <div class="actions">
      <button class="btn btn-1" id="favok">Enregistrer</button>
      <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
    </div>`) || setTimeout(() => {
      $('#favok').onclick = () => {
        const name = $('#favname').value.trim() || 'Repas favori';

}

function renderSaisie(){
  topbar();
  if(!S.entryDate) S.entryDate = today();
  const D = S.entryDate, isToday = D === today();
  const editing = S.editId && S.hist.find(x => x.id === S.editId);
  const hasCourses = S.meal === 'dej' || S.meal === 'din';

  const dayHist = S.hist.filter(e => e.d === D);
  const byMeal = {}; MEALS.forEach(m => byMeal[m.k] = 0);
  dayHist.forEach(e => byMeal[e.m] += kgOf(e.l));
  const dayTot = Object.values(byMeal).reduce((a,b) => a+b, 0);
  const draftKg = kgOf(S.draft);

  /* ================= 1. accueil : deux fenêtres carrées ================= */
  if(S.step === 'home' && !editing){
    view.innerHTML = `
      <div class="homegrid">
        <button class="hcard" id="hNew">
          <span class="hi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="ht">Nouveau repas</span>
          <span class="hs">Petit-déj · déj · en-cas · dîner</span>
        </button>
        <button class="hcard" id="hEdit">
          <span class="hi"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg></span>
          <span class="ht">Modifier un repas</span>
          <span class="hs">${S.hist.length} repas enregistré${S.hist.length>1?'s':''}</span>
        </button>
      </div>`;
    $('#hNew').onclick = () => { S.step = 'meal'; S.draft = []; S.wiz = null; renderSaisie(); };
    $('#hEdit').onclick = editSheet;
    return;
  }

  /* ================= 2. choix du repas ================= */
  if(S.step === 'meal' && !editing){
    view.innerHTML = `
      <button class="backlink" id="sBack">‹ Retour</button>
      <div class="daterow">
        <input type="date" id="edate" value="${D}" max="${today()}">
        <button id="dToday" aria-pressed="${isToday}">Aujourd’hui</button>
        <button id="dYest" aria-pressed="${D === yesterday()}">Hier</button>
      </div>
      ${!isToday ? `<div class="pastwarn">Saisie antidatée · ${dLabel(D)}</div>` : ''}
      <h2 class="sec">Quel repas ?</h2>
      <div class="mealblocks">${MEAL_ORDER.map(k => { const m = MEAL[k]; return `
        <button class="mblock" data-meal="${k}">
          <span class="ml">${m.l}</span>
          <span class="mv">${m.s}</span>
        </button>`; }).join('')}</div>
      <div class="src" style="margin-top:14px">Déjeuner et dîner se composent service par service,
        dans l’ordre : boisson, entrée, plat, dessert, café ou thé.
        Petit-déjeuner et en-cas vont droit à la saisie.</div>`;
    bindDateRow();
    $('#sBack').onclick = () => { S.step = 'home'; renderSaisie(); };
    view.querySelectorAll('[data-meal]').forEach(b => b.onclick = () => {
      S.meal = b.dataset.meal;
      const wiz = S.meal === 'dej' || S.meal === 'din';
      if(wiz) return openCourse('boisson');
      S.comCat = 'plat'; S.path = 'types'; S.dishQ = '';
      S.step = 'saisie';
      renderSaisie();
    });
    return;
  }

  /* ================= 3. carrefour des services ================= */
  if(hasCourses && !editing && S.step === 'hub') return renderHub(D, isToday, draftKg);
  if(hasCourses && !editing && S.step === 'finish') return renderFinish(D, isToday, draftKg);

  /* ================= 4. saisie d'un service, ou saisie libre ================= */
  const step = hasCourses && !editing && S.step === 'course'
    ? WIZ.find(w => w.k === S.course) : null;
  if(step) S.comCat = step.k;

  /* liste unifiée : compositions personnelles puis plats types, favoris en tête */
  const nrm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe');
  const dq = nrm(S.dishQ.trim());
  const favMeals = f => Array.isArray(f.m) ? f.m : [f.m || 'dej'];
  const match = d => !dq || nrm(d.n).includes(dq) || d.l.some(([sl]) => nrm(F.get(sl).n).includes(dq));
  /* desserts et boissons vivent dans la catégorie « en-cas » : sans cela, le service Dessert
     d'un déjeuner n'afficherait que des plats principaux. */
  const listMeals = step && (step.k === 'boisson' || step.k === 'cafethe') ? ['encas']
    : step && step.k === 'dessert' ? ['encas', S.meal] : [S.meal];
  const items = [
    ...S.favs.map((f,i) => ({...f, i, fav:true, custom:true, kg:kgOf(f.l)}))
      .filter(f => favMeals(f).some(m => listMeals.includes(m))),
    ...DB.dishes.filter(d => d.m.some(m => listMeals.includes(m)))
      .map(d => ({...d, fav:S.starred.includes(d.n), kg:kgOf(d.l)})),
  ].filter(match).sort((a,b) => (b.fav?1:0)-(a.fav?1:0) || a.kg - b.kg);

  const inStep = step ? S.draft.filter(l => (l[2]||'plat') === S.comCat) : S.draft;
  const stepKg = kgOf(inStep);

  view.innerHTML = `
  ${editing ? `<div class="demo edit">
    Modification d’un repas du ${dLabel(editing.d)}.
    <button id="canceledit">Annuler</button></div><div style="height:12px"></div>`
    : `<button class="backlink" id="sBack">‹ ${step && prevCourse(step.k)
        ? `Retour à ${(WIZ.find(w => w.k === prevCourse(step.k)).label).toLowerCase()}`
        : 'Changer de repas'}</button>`}

  <div class="mealhead">
    <span class="mh">${MEAL[S.meal].l}</span>
    <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)}${draftKg ? ` · ${n2(draftKg)} kg` : ''}</span>
  </div>

  ${step ? `<div class="wizbar">${COURSE_HUB.map(c => `<span class="${
      c.k === S.course ? 'on' : (S.draft.some(l => (l[2]||'plat') === c.k) ? 'done' : '')
      }" data-jump="${c.k}">${c.l}</span>`).join('')}</div>
    <h2 class="sec">${step.q}</h2>` : `<h2 class="sec">Comment le saisir ?</h2>`}

  ${step && QUICK[step.k] ? `
    <div class="drinkgrid">
      ${QUICK[step.k].map(([sl,l]) => `
        <button class="dcard" data-drink="${sl}">
          <span class="dn2">${l}</span>
          <span class="dk">${n0(F.get(sl).t * F.get(sl).p)} g CO₂e</span>
        </button>`).join('')}
    </div>
    <div class="src" style="margin-top:10px">${step.k === 'boisson'
      ? 'Touchez un verre pour l’ajouter, deux fois s’il y en a eu deux. Les volumes se corrigent plus bas.'
      : 'Touchez la tasse prise en fin de repas. Rien de tout cela ? Passez l’étape.'}</div>` : ''}

  <div class="paths">
    <button data-path="types"   aria-pressed="${S.path==='types'}">Plats types</button>
    <button data-path="compose" aria-pressed="${S.path==='compose'}">Composer</button>
  </div>

  ${S.path === 'types' ? `
    <input class="search" id="dq" placeholder="Chercher un plat" value="${esc(S.dishQ)}" style="margin:2px 0 10px">
    <div class="list">
    ${items.length ? items.map(d => `<div class="dish">
      <div class="top">
        <button class="star${d.fav ? ' on' : ''}" data-star="${esc(d.n)}"
          aria-label="${d.fav ? 'Retirer des favoris' : 'Mettre en favori'}" aria-pressed="${d.fav}">
          <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>
        </button>
        <button class="nm" data-dish="${esc(d.n)}" style="text-align:left">${esc(d.n)}${d.std ? '<span class="tag">standard</span>' : ''}</button>
        <span class="kg">${n2(d.kg)}</span>
        <button class="add" data-additem="${esc(d.n)}">Ajouter</button>
      </div>
      ${S.openDish === d.n ? `<div class="comp">${d.l.map(([s,g]) => `${F.get(s).n.toLowerCase()} ${g} g`).join(' · ')}</div>` : ''}
      <div class="bar"><i style="width:${clamp(d.kg/(BUDGET_J*1.5)*100,2,100)}%;background:${d.kg>BUDGET_J?'var(--brick)':'var(--forest-2)'}"></i></div>
    </div>`).join('') + `<div class="count">L’étoile fait remonter un plat en tête de liste.
      Barre pleine = un repas dépasse à lui seul le budget d’une journée.</div>`
    : `<div class="empty">Aucun plat ne correspond${S.dishQ?` à « ${esc(S.dishQ)} »`:''}. Essayez « pâtes » ou « tofu », ou composez librement.</div>`}
  </div>` : ''}

  ${S.path === 'compose' ? `<div class="card">
    <div class="pick">
      <input id="cf" type="text" inputmode="search" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="Tapez les premières lettres" value="${esc(S.pickQ)}">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div class="compose">
      <div class="chint" id="chint">${S.pickSlug
        ? `${esc(F.get(S.pickSlug).n)} · ${n1(F.get(S.pickSlug).t)} kg CO₂e/kg · ${comLabel(S.pickSlug)}`
        : `${DB.foods.length} aliments. Trois lettres suffisent.`}</div>
      <input type="number" id="cq" inputmode="numeric" min="1" step="5" placeholder="g"
             value="${S.pickSlug ? comPortion(S.pickSlug) : ''}">
      <button class="go" id="cadd">Ajouter</button>
    </div>
  </div>` : ''}

  ${inStep.length ? `<div class="card" style="margin-top:12px">
    ${(step ? inStep.map(l => ({l, i:S.draft.indexOf(l)})) : S.draft.map((l,i) => ({l, i})))
      .map(x => `<div class="draft-line">
        <span class="nm">${esc(F.get(x.l[0]).n)}</span>
        <span class="q">${x.l[1]} g</span>
        <span class="kg">${n2(F.get(x.l[0]).t*x.l[1]/1000)}</span>
        <button class="rm" data-rm="${x.i}" aria-label="Retirer">×</button>
      </div>`).join('')}
    <div class="total">
      <div><div class="unit">${step ? step.label : 'Total — ' + MEAL[S.meal].l.toLowerCase()}</div>
        <div class="small mute">${draftKg > BUDGET_J ? 'Ce repas dépasse le budget de la journée.'
          : `${Math.round(draftKg/BUDGET_J*100)} % du budget du jour.`}</div></div>
      <div class="v">${n2(step ? stepKg : draftKg)} <span class="unit">kg</span></div>
    </div>
    ${step && inStep.length >= 2 ? `<button class="btn btn-2" data-savecourse="${S.comCat}"
      style="margin-top:10px">Enregistrer ${step.label.toLowerCase()} dans les plats types</button>` : ''}
  </div>` : ''}

  ${step ? `<div class="actions" style="margin-top:14px">
      <button class="btn btn-1" id="wizNext">${inStep.length
        ? `Valider ${step.label.toLowerCase()} ›`
        : (nextCourse(step.k)
            ? `Passer, pas ${/^[aeéiouh]/i.test(step.label) ? 'd’' : 'de '}${step.label.toLowerCase()} ›`
            : 'Terminer le repas ›')}</button>
    </div>`
   : `<div class="actions" style="margin-top:14px">
      <button class="btn btn-1" id="rec" ${S.draft.length ? '' : 'disabled'}>${
        S.editId ? 'Mettre à jour le repas' : 'Enregistrer le repas'}</button>
      <button class="btn btn-2" id="fav" ${S.draft.length ? '' : 'disabled'}>Garder en favori</button>
    </div>`}`;

  /* ---------------- liaisons ---------------- */
  const sb = $('#sBack');
  if(sb) sb.onclick = () => {
    const pv = step && prevCourse(step.k);
    if(pv) return openCourse(pv);
    S.step = 'meal'; renderSaisie();
  };
  const ce = $('#canceledit');
  if(ce) ce.onclick = () => { S.editId = null; S.draft = []; S.step = 'home'; renderSaisie(); };

  const dqEl = $('#dq');
  if(dqEl) dqEl.oninput = e => { S.dishQ = e.target.value; const p = e.target.selectionStart;
    renderSaisie(); const n = $('#dq'); if(n){ n.focus(); n.setSelectionRange(p,p); } };

  view.querySelectorAll('[data-path]').forEach(b => b.onclick = () => { S.path = b.dataset.path; renderSaisie(); });
  view.querySelectorAll('[data-dish]').forEach(b => b.onclick = () => {
    S.openDish = S.openDish === b.dataset.dish ? null : b.dataset.dish; renderSaisie(); });

  const findItem = n => S.favs.find(f => f.n === n) || DB.dishes.find(d => d.n === n);
  view.querySelectorAll('[data-additem]').forEach(b => b.onclick = () => {
    const d = findItem(b.dataset.additem);
    if(d){ d.l.forEach(l => S.draft.push([l[0], l[1], S.comCat])); renderSaisie(); toast(`${d.n} ajouté`); } });
  view.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    const n = b.dataset.star, fi = S.favs.findIndex(f => f.n === n);
    if(fi >= 0){ S.favs.splice(fi, 1); toast(`${n} retiré des favoris`); }
    else if(S.starred.includes(n)){ S.starred = S.starred.filter(x => x !== n); }
    else { S.starred.push(n); toast(`${n} mis en favori`); }
    save(); renderSaisie(); });
  view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    S.draft.splice(+b.dataset.rm, 1); renderSaisie(); });

  view.querySelectorAll('[data-savecourse]').forEach(b => b.onclick = () => saveCourse(b.dataset.savecourse));

  /* raccourcis de boisson : s'ajoutent au service en cours, sans quitter l'étape */
  view.querySelectorAll('[data-drink]').forEach(b => b.onclick = () => {
    const sl = b.dataset.drink;
    S.draft.push([sl, F.get(sl).p, S.comCat]);
    renderSaisie(); toast(`${F.get(sl).n} ajouté`);
  });

  const wn = $('#wizNext');
  if(wn) wn.onclick = () => validateCourse(S.course);
  /* le fil des services permet de sauter directement de l'un à l'autre */

  bindCompose();

/* ============================ onglet 3 — tracker ============================ */
function agg(){
  const days = {};
  S.hist.forEach(e => {
    const kg = kgOf(e.l);
    days[e.d] = days[e.d] || {tot:0, byMeal:{}};
    days[e.d].tot += kg;
    days[e.d].byMeal[e.m] = (days[e.d].byMeal[e.m] || 0) + kg;
  });
  const keys = Object.keys(days).sort();
  const tot = keys.reduce((a,k) => a + days[k].tot, 0);
  return {days, keys, tot, nd:keys.length, avg: keys.length ? tot/keys.length : 0};
}

/* Réservoir anonyme : ce qui a été saisi avant toute connexion. Le filtre sur
   le format d'identifiant écarte l'ancien jeu de démonstration, dont les ids
   étaient de la forme 2026-07-05dej et non e<timestamp>. */
function anonPayload(){
  try{
    const raw = localStorage.getItem(KEY_ANON);
    if(!raw) return null;
    const o = JSON.parse(raw);
    const h = (o.hist || []).filter(e => /^e\d/.test(e.id || ''));
    const pr = o.prof && Object.keys(o.prof).length ? o.prof : null;
    return (h.length || pr) ? {hist:h, favs:o.favs || [], prof:pr} : null;
  }catch(e){ return null; }
}

function offerImport(){
  const a = anonPayload();
  if(!a || S.hist.length) return;
  if(!a.hist.length && a.prof){   /* rien à reprendre sinon le profil : on le fait sans demander */
    S.prof = a.prof; save(); return;
  }
  openSheet(`
    <div class="unit">Premier accès à ce compte</div>
    <h3>Reprendre vos données ?</h3>
    <p class="small mute">Cet appareil contient ${a.hist.length} repas saisi${a.hist.length>1?'s':''}
      avant la création du compte${a.favs.length ? ` et ${a.favs.length} favori${a.favs.length>1?'s':''}` : ''}.
      Ils rejoindront votre compte et seront disponibles sur vos autres appareils.
      La copie d'origine reste intacte.</p>
    <div class="actions">
      <button class="btn btn-1" id="impok">Reprendre</button>
      <button class="btn btn-2" onclick="closeSheet()">Plus tard</button>
    </div>`);
  const b = $('#impok');
  if(b) b.onclick = async () => {
    a.hist.forEach(e => S.hist.push({...e, c:e.c || CLIENT_ID,
      u:e.u || new Date(e.d + 'T12:00:00Z').toISOString()}));
    a.favs.forEach(f => { if(!S.favs.some(x => x.n === f.n)) S.favs.push(f); });
    if(a.prof && !Object.keys(S.prof).length) S.prof = a.prof;
    save(); closeSheet(); go(S.tab);
    toast(a.hist.length + ' repas repris');
    await syncNow(true); go(S.tab);
  };
}

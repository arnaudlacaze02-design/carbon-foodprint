.wizbar span.done{background:var(--kpi-good); color:var(--accent)}
.wizbar i{font-style:normal; color:var(--line); font-size:11px}
.drinkgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:2px}
.dcard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 8px;
  display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center}
.dcard:active{background:var(--active)}
.dcard .dn2{font-family:var(--serif); font-size:16px}
.dcard .dk{font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.3}
.dcard.done{background:var(--forest); border-color:var(--forest)}
.dcard.done .dn2{color:#fff}
.dcard.done .dk{color:var(--on-topbar-mute)}
/* ---------------- composition par services ---------------- */
.course{border:1.5px dashed var(--line); border-radius:12px; padding:10px 12px 8px; margin-top:10px}
.course.filled{border-color:var(--forest-2)}
.course.target{border-color:var(--forest); background:var(--active)}
.chd{display:flex; align-items:center; gap:8px; margin-bottom:5px}
.chd .ct{flex:1; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--mute)}
.chd .ct b{color:var(--accent); font-weight:400}
.chd .ck{font-family:var(--display); font-weight:800; font-size:14px; font-variant-numeric:tabular-nums}
.chd .plus{width:23px; height:23px; border-radius:50%; background:var(--forest); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:16px; line-height:1; flex:0 0 auto}
.cempty{font-size:11.5px; color:var(--mute); padding:3px 0 4px}
.course .draft-line{padding:7px 0}
.course .draft-line:last-child{border-bottom:0}

/* ---------------- éclair de série et réglages ---------------- */
.streak{display:flex; align-items:center; gap:3px; padding:4px 8px 4px 6px; border-radius:999px;
  background:rgba(255,255,255,.13); flex:0 0 auto; cursor:pointer}
.streak svg{width:13px; height:13px; fill:var(--straw); stroke:none}
.streak b{font-family:var(--display); font-weight:800; font-size:15px; color:#fff; font-variant-numeric:tabular-nums; line-height:1}
.streak.off{opacity:.45}
.streak.off svg{fill:var(--on-topbar-mute)}
.aside2{display:flex; gap:14px; margin-top:12px}
.aside2 div{flex:1}
.aside2 .v{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1}
.aside2 .l{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mute); line-height:1.4; margin-top:4px}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow .l{font-size:14px}
.setrow .l i{font-style:normal; display:block; font-size:11.5px; color:var(--mute); margin-top:2px}
.themeseg{display:flex; background:var(--seg-bg); border-radius:9px; padding:3px; gap:3px; flex:0 0 auto}
.themeseg button{padding:7px 12px; border-radius:7px; font-size:12.5px; color:var(--ink-soft);
  display:flex; align-items:center; gap:5px}
.themeseg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.10)}
.themeseg svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7}
/* Cloche du centre de notifications, dernier bouton du bandeau depuis le retrait
   de l'engrenage. C'est un accès permanent, pas un signal : ce qui alerte est le
   compteur, pas l'icône. */
.bell{background:none; border:0; color:var(--on-topbar-mute); padding:4px;
  display:flex; align-items:center; position:relative}
.bell svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6}
.bell:active{color:var(--on-topbar-strong)}
.bell .cnt{position:absolute; top:-1px; right:-3px; min-width:15px; height:15px;
  border-radius:999px; background:var(--brick); color:#fff; display:none;
  font-family:var(--mono); font-size:9.5px; line-height:15px; text-align:center;
  padding:0 3px; font-weight:600}
.bell[data-n]:not([data-n="0"]) .cnt{display:block}

/* Une ligne du centre. Le liseré de gauche distingue le non-lu du lu sans
   couleur de fond : un fond teinté sur dix lignes ferait un mur. */
.note{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:10px 12px; margin-top:7px; font-family:inherit; color:var(--ink); cursor:pointer}
.note:active{background:var(--active)}
.note[data-lu="0"]{border-left:3px solid var(--brick); padding-left:10px}
.note .em{flex:0 0 auto; font-size:17px; line-height:1.25}
.note .tx{min-width:0; flex:1}
.note .tx b{display:block; font-size:14.5px; font-weight:600; line-height:1.35}
.note .tx span{display:block; font-size:12.5px; color:var(--mute); line-height:1.5; margin-top:1px}
.note .qd{flex:0 0 auto; font-family:var(--mono); font-size:9.5px; color:var(--mute);
  letter-spacing:.04em; padding-top:3px}

.jrow{cursor:pointer}
.jrow:active{background:var(--active)}

/* ---------------- page Profil ----------------
   L'identité en haut, puis les réglages par sections. Le bandeau reprend le
   gabarit d'une carte plutôt que celui d'un en-tête plein : la page vit sous la
   barre de titre de l'app, un second bloc coloré ferait deux en-têtes. */
.pfhead{display:flex; align-items:center; gap:14px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:4px}
.pfhead .who{min-width:0; flex:1}
.pfhead h3{margin:2px 0 3px}
.pfback{background:none; border:0; font-family:var(--mono); font-size:10px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--mute);
  padding:6px 0 8px; display:flex; align-items:center; gap:5px; cursor:pointer}
.pfback:active{color:var(--ink)}
.pfback svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2}

@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* surcharges petits écrans — placées en fin de feuille pour primer dans la cascade */
@media(max-width:359px){
  .wordmark{font-size:15px}
  .wordmark em{font-size:15px}
  .tabbar span:not(.ic){font-size:7.5px}
}
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="brand"><button class="ava" id="topAva" aria-label="Profil et compte">
      <svg viewBox="0 0 100 112" aria-hidden="true">
        <polygon class="hex" points="50,4 92,29 92,79 50,104 8,79 8,29"/>
        <g class="who">
          <circle cx="50" cy="44" r="12.5"/>
          <path d="M27 88c0-12.7 10.3-23 23-23s23 10.3 23 23z"/>
        </g>
      </svg>
    </button><span class="brandmark" aria-hidden="true"></span><span class="wordmark"><span>Carbon</span><span><em>FOOD</em>print</span></span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="streak" id="topStreak" title="Jours consécutifs renseignés">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
        <b>0</b>
      </div>
      <div class="today" id="topToday"></div>
      <button class="bell" id="bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3.5L4.5 16h15L18 12.5V9a6 6 0 0 0-6-6z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
        <i class="cnt">0</i>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="tracker">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 19V9M9.5 19V5M15 19v-7M20.5 19v-4"/><path d="M3 21h18"/></svg></span>
      <span>Tracker</span>

/* ============================ utilitaires ============================ */
const $ = s => document.querySelector(s);
const view = $('#view');
const F = new Map(DB.foods.map(f => [f.s, f]));

/* ---------------- catalogues de marque ----------------
   Certains plats types viennent d'un service d'abonnement : les proposer à
   quelqu'un qui n'y est pas abonné, c'est noyer la recherche sous des noms
   qu'il ne reconnaîtra pas. Le champ `lk` d'un plat nomme la marque qui le
   déverrouille ; sans `lk`, le plat est toujours là.

   Tout passe par `DISHES()` et non par `DB.dishes` : un seul point de filtrage,
   sinon un écran finirait par montrer ce qu'un autre cache. Seule exception
   assumée, le décompte du barème, qui décrit le référentiel entier. */
const MARQUES = [
  {k:'hellofresh', n:'HelloFresh',
   d:'Kits repas livrés, cuisinés chez vous. Mode Frais appliqué.'},
  {k:'jow', n:'Jow',
   d:'Recettes de la planification mensuelle. Catalogue à venir.'},
];
const marqueOn = k => !!(S.marques && S.marques[k]);
const DISHES = () => DB.dishes.filter(d => !d.lk || marqueOn(d.lk));

/* ---------------- allergènes ----------------
   Un index inversé plutôt qu'un champ sur chacune des 259 entrées : une seule
   table à corriger, et un plat hérite des allergènes de ses ingrédients comme il
   hérite de leur empreinte. Ce que la base ne modélise pas — épices détaillées,
   additifs, traces d'atelier — n'est pas détectable : le champ `alx` d'un plat
   porte alors ce que la source déclare en plus, et la fiche dit que la liste
   couvre les ingrédients et non l'étiquette. */
const ALG_N = {"gluten":"Gluten","lait":"Lait","oeuf":"Œuf","poisson":"Poisson","crustaces":"Crustacés","mollusques":"Mollusques","fruitsacoque":"Fruits à coque","arachide":"Arachide","soja":"Soja","sesame":"Sésame","celeri":"Céleri","moutarde":"Moutarde","sulfites":"Sulfites"};
const ALG = {
  arachide: ["cacahuetes"],
  celeri: ["bouilloncube","celeri"],
  crustaces: ["crevettes","crevstjacques"],
  fruitsacoque: ["merveilleux","noisette","noix","pateatartiner","pesto","pignons"],
  gluten: ["avoine","baguette","biere","bierepression","biscuitchoco","biscuitsec","ble","blinis","boulettesvegetales","boulgour","brioche","brownie","burgerpoulet","burgervegetarien","cereales","chaussonauxpommes","cheeseburger","cookie","croissant","eclairchocolat","falafels","feculentmoyen","flanpatissier","galettefromage","galettevegetale","gnocchi","hachevegetal","jalapenofromage","kebab","madeleine","mozzastick","nouillesdeble","nuggetsvegetaux","painauchocolat","painauxraisins","painbagel","paindemie","painsuisse","patefeuilletee","pates","pizza","profiterole","saucesoja","saucissevegetale","semoule","sushis"],
  lait: ["beurre","biscuitchoco","biscuitsec","boucheechocolat","brebis","brioche","brownie","cheddar","cheeseburger","chevre","chocolatpoudre","cookie","creamcheese","creme","croissant","eclairchocolat","emmental","feta","flanpatissier","fromageblanc","fromagebleu","fromagedure","fromagemolle","galettefromage","glace","gruyere","hipro","jalapenofromage","kefir","laitdevache","madeleine","merveilleux","mozarella","mozzarella","mozzastick","painauchocolat","painauxraisins","painsuisse","pateatartiner","patefeuilletee","pizza","profiterole","ricotta","shakerprot","shakerprotlait","yaourt"],
  mollusques: ["huitres","moules","saintjacques"],
  moutarde: ["moutarde"],
  oeuf: ["brownie","eclairchocolat","flanpatissier","gnocchi","madeleine","mayonnaise","merveilleux","oeuf","painsuisse","profiterole","sushis","tarama"],
  poisson: ["cabillaud","dorade","lieu","sardines","saumon","poissonmoyen","saumonfume","sushis","tarama","thon","worcestershire"],
  sesame: ["houmous","moutabal"],
  soja: ["boulettesvegetales","burgervegetarien","galettevegetale","hachevegetal","laitvegetal","nuggetsvegetaux","saucesoja","saucissevegetale","soja","tofu"],
  sulfites: ["biere","bierepression","boeufseche","champagne","charcuterie","cocktail","digestif","merguez","pastrami","saucisse","vin"],
};
/* slug -> liste d'allergenes, construit une fois au chargement */
const ALG_OF = (() => { const m = {};
  for(const a in ALG) for(const s of ALG[a]) (m[s] = m[s] || []).push(a);
  return m; })();
const algOf = lignes => [...new Set(lignes.flatMap(l => ALG_OF[l[0]] || []))].sort();


/* ---------------- recomposition auditable ----------------
   `c` dit de quoi un aliment estimé est fait : une liste de couples
   [ingrédient, coefficient], le coefficient étant le nombre de kilos
   d'ingrédient par kilo de produit fini. Trois cas dans un seul format :

     coefficient  = 1     report pur d'une autre valeur (emmental ← pâte dure)
     coefficient  > 1     perte au rendement (jambon sec ← 1,5 kg de porc frais)
     somme  ≈ 1           recette véritable (gnocchi, houmous, moussaka)

   `t` reste la valeur autoritaire : elle ne se recalcule pas à chaud. Recalculer
   changerait des chiffres en silence, y compris ceux d'un historique déjà
   enregistré. `c` sert à vérifier `t`, pas à le remplacer — c'est ce qui rend la
   méthodologie contrôlable sans la rendre instable.

   `DB.aux` porte les ingrédients cités par les notes mais absents du catalogue :
   huile d'olive, tahiné, nori. Ils ne sont pas proposés à la saisie, ils ne
   servent qu'aux recompositions. */
const TAUX = k => {
  const f = F.get(k);
  if(f) return f.t;
  const a = DB.aux && DB.aux[k];
  return a ? a.t : null;
};

/* Valeur qu'aurait l'aliment si l'on recalculait depuis sa recette. null quand
   l'aliment n'a pas de recette, ou qu'un de ses ingrédients est introuvable. */
function tRecompose(sl){
  const f = F.get(sl);
  if(!f || !f.c) return null;
  let t = 0;
  for(const [k, co] of f.c){
    const v = TAUX(k);
    if(v == null) return null;
    t += co * v;
  }
  return t;
}

/* ---------------- macros ----------------
   `nu` porte [kcal, protéines, lipides, glucides, fibres] pour 100 g, sur la
   MÊME base que le carbone : le poids tel qu'acheté. C'est le seul choix
   cohérent — 100 g de pâtes sèches donnent 355 kcal, les mêmes cuites en
   donneraient 130 pour la même empreinte, parce que la cuisson n'ajoute que de
   l'eau. Les chiffres paraissent donc élevés face à une assiette, et c'est
   normal : ils décrivent ce qui a été acheté, pas ce qui a gonflé.

   `nus` dit d'où vient la valeur, ce qui n'est pas cosmétique — un total dont
   la moitié du poids repose sur des proxys ne vaut pas un total mesuré :
     ciqual   valeur lue dans la table CIQUAL 2025 de l'ANSES, code dans `cq`
     recette  déduite de `c`, quand la recette est compositionnelle
     proxy    empruntée à l'aliment de référence (emmental ← pâte dure)
     pose     posée à la main, quand `c` n'est qu'un artifice carbone
              (la crème est interpolée entre yaourt et mozzarella pour le CO₂ :
               ce mélange ne dit rien de ses lipides) */
const NUKEYS = [['kcal','kcal',0],['prot','protéines',1],['lip','lipides',2],
                ['gluc','glucides',3],['fib','fibres',4]];

/* Macros d'une liste de lignes [slug, grammes]. Renvoie aussi la part du poids
   adossée à une valeur propre : c'est l'indicateur de confiance, et sans lui le
   total se lirait comme une mesure alors qu'il reste une estimation. */
function nuOf(lignes){
  const t = [0,0,0,0,0];
  let poids = 0, direct = 0, sans = 0;
  for(const [sl, g] of lignes){
    const f = F.get(sl);
    poids += g;
    if(!f || !f.nu){ sans += g; continue; }
    if(f.nus === 'ciqual') direct += g;
    for(let i = 0; i < 5; i++) t[i] += f.nu[i] * g / 100;
  }
  return {kcal:t[0], prot:t[1], lip:t[2], gluc:t[3], fib:t[4],
          poids, part: poids ? direct / poids * 100 : 0,
          couvert: poids ? (poids - sans) / poids * 100 : 0};
}

/* ---------------- besoins énergétiques et protéiques ----------------
   Références ANSES 2016 (actualisation des repères du PNNS) : 2 600 kcal/jour
   pour un homme de 18-69 ans, 2 100 pour une femme de 18-59 ans, à un niveau
   d'activité physique (NAP) médian de 1,63. C'est cette valeur de 1,63 qui sert
   de pivot : les trois niveaux proposés sont des NAP rapportés à elle, ce qui
   évite d'inventer des coefficients.

   L'ANSES publie une bande adulte plate jusqu'à 69 ans (hommes) et 59 ans
   (femmes) ; le déclin appliqué au-delà est calé sur la seule valeur publiée
   pour les 65 ans et plus — 1 878 kcal pour une femme, soit 0,894 fois la
   référence. Les paliers intermédiaires en sont interpolés, ce qui est une
   approximation assumée et non une donnée de l'agence.

   Protéines : la référence nutritionnelle de l'ANSES est de 0,83 g par kilo de
   poids corporel et par jour pour un adulte. Les valeurs sportives (1,2 à 2,0)
   viennent de la littérature d'entraînement, pas de l'agence : le curseur reste
   donc ajustable et la borne haute est atteignable.

   Le poids corporel n'est jamais enregistré. Il est saisi au moment du calcul,
   sert à convertir des g/kg en grammes, et disparaît avec la fenêtre. */
const NAP      = {sed:1.45, actif:1.63, sportif:1.85};
const NAP_REF  = 1.63;
const CAL_BASE = {h:2600, f:2100};
const CAL_AGE  = {a18:1.00, a40:0.97, a60:0.92, a75:0.87};
const PROT_GKG = {sed:0.83, actif:1.0, sportif:1.6};
const ACT_LAB  = {sed:'sédentaire', actif:'actif', sportif:'sportif'};

/* Besoin calorique journalier : la valeur déclarée si l'utilisateur la connaît,
   sinon l'estimation ANSES. null quand on ne sait pas encore. */
function besoinCal(){
  const P = S.prof || {};
  if(P.calKnow === 'oui' && P.calVal != null) return P.calVal;
  if(!P.sexe || !P.age) return null;
  const base = CAL_BASE[P.sexe] * (CAL_AGE[P.age] || 1);
  return Math.round(base * (NAP[P.act] || NAP_REF) / NAP_REF / 10) * 10;
}

/* g de protéines par kilo retenu pour le niveau d'activité déclaré. */
const protGkg = () => PROT_GKG[(S.prof || {}).act] || PROT_GKG.actif;

/* Écart relatif entre la valeur retenue et sa recette, en pourcentage. C'est ce
   que la fiche aliment affiche, et ce qu'un contrôle de non-régression compare :
   si une valeur ADEME change, les recompositions qui en dépendent dérivent, et
   cet écart le dit avant que quiconque s'en aperçoive. */

function saisPart(lignes, mois){
  let ok = 0, tot = 0;
  for(const [sl, g] of lignes){

/* Déplacement du seau de données quand l'identité change. Renommer la clé sans
   déplacer son contenu vidait le profil, les favoris et les contacts — seul
   l'historique revenait, parce qu'il est le seul à être synchronisé. */
function rebase(oldUid, newUid){
  if(!oldUid || !newUid || oldUid === newUid) return;
  const from = KEY_ANON + '.' + oldUid, to = KEY_ANON + '.' + newUid;
  try{
    const src = localStorage.getItem(from);
    if(!src) return;
    const dst = localStorage.getItem(to);
    if(!dst){ localStorage.setItem(to, src); return; }
    /* Les deux seaux existent. On complète ce qui manque à destination plutôt
       que d'écraser : rien ne dit lequel est le plus récent. */
    const a = JSON.parse(src), b = JSON.parse(dst);
    const gard = (x, y) => (Array.isArray(y) && y.length) ? y : (Array.isArray(x) ? x : (y || []));
    localStorage.setItem(to, JSON.stringify({
      favs:    gard(a.favs, b.favs),
      hist:    gard(a.hist, b.hist),
      tomb:    gard(a.tomb, b.tomb),
      starred: gard(a.starred, b.starred),
      people:  gard(a.people, b.people),
      stdInit: b.stdInit || a.stdInit,
      lastSync: b.lastSync || a.lastSync,
      prof:    Object.keys(b.prof || {}).length ? b.prof : (a.prof || {}),
    }));
  }catch(e){}
}

/* Rattrapage au démarrage. Si le seau du compte est vide alors qu'un autre
   contient des réponses, on les adopte : c'est ce qui répare les installations
   déjà abîmées par le défaut ci-dessus, sans rien demander à l'utilisateur. */
function recover(){
  if(!SESS) return false;
  if(Object.keys(S.prof).length || S.hist.length || S.favs.length) return false;
  try{
    const prefixe = KEY_ANON + '.';
    for(const k of Object.keys(localStorage)){
      if(!k.startsWith(prefixe) || k === dataKey()) continue;
      const o = JSON.parse(localStorage.getItem(k) || '{}');
      if(Object.keys(o.prof || {}).length || (o.hist || []).length || (o.favs || []).length){
        rebase(k.slice(prefixe.length), SESS.uid);
        load();
        return true;
      }
    }
  }catch(e){}
  return false;
}

/* Les repas antérieurs à la synchro n'ont ni horodatage de modification ni

   leur propre journée : c'est stable d'un appareil à l'autre, alors qu'un
   Date.now() donnerait deux valeurs différentes pour le même repas. */
function stamp(){
  let n = 0;
  S.hist.forEach(e => {
    if(!e.c){ e.c = CLIENT_ID; n++; }
    if(!e.u){ e.u = new Date(e.d + 'T12:00:00Z').toISOString(); n++; }
  });
  if(n) save();
}

    if(!t) return r;
    r = await SB.call('/rest/v1/' + path, {...opts,
      headers:{Authorization:'Bearer ' + t, ...(opts.headers||{})}});
  }
  return r;
};

SB.signOut = () => { SESS = null; SB.keepSess(); SB._uid = null; };

/* Lecture des revendications du jeton, sans en vérifier la signature : on ne
   cherche pas à l'authentifier, seulement à savoir ce que la base va y lire.
   « role » détermine quelles policies s'appliquent, « sub » est ce que
   auth.uid() renverra. Un jeton dont le role n'est pas authenticated, ou dont
   le sub diffère de l'auteur envoyé, explique à lui seul un refus d'écriture
   alors que la lecture paraît passer — car une lecture sans identité renvoie
   zéro ligne, ce qui ressemble à un succès. */
SB.claims = () => {
  try{
    const t = SESS && SESS.access_token;
    if(!t) return null;
    const p = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const j = decodeURIComponent(atob(p).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(j);
  }catch(e){ return null; }
};

/* Identité de référence pour toute écriture. On ne se fie pas à ce que contient
   le stockage local : la base comparera l'auteur envoyé à l'identité du jeton,
   c'est donc celle-ci qu'il faut employer. Vérifiée une fois par session puis
   mise en cache.

   Sans cette précaution, un uid absent ou périmé partait tel quel, « author »
   valait NULL, la comparaison author = auth.uid() devenait fausse et Postgres
   répondait « new row violates row-level security policy » — un message qui
   accuse la policy alors que le fautif est la donnée envoyée. */
SB._uid = null;
SB.uid = async () => {
  if(SB._uid) return SB._uid;
  const srv = await SB.whoami();
  if(srv){
    if(SESS && SESS.uid !== srv){
      const ancien = SESS.uid;
      SESS.uid = srv; SB.keepSess();
      rebase(ancien, srv); load();
    }
    SB._uid = srv; return srv;
  }
  return (SESS && SESS.uid) || null;   /* hors ligne : au mieux ce qu'on a */
};

/* Qui le serveur croit-il que nous sommes ? C'est cette identité, et non celle
   rangée dans le stockage local, que la base compare dans ses policies. Les
   deux peuvent diverger pour une raison bête : un compte supprimé puis recréé
   sous le même pseudo reçoit un nouvel identifiant, alors que la session
   d'avant traîne encore. Toute écriture est alors refusée avec « new row
   violates row-level security policy », sans que rien ne le laisse deviner. */
SB.whoami = async () => {
  const t = await SB.fresh();
  if(!t) return null;
  const r = await SB.call('/auth/v1/user', {headers:{Authorization:'Bearer ' + t}});
  return (r.ok && r.body && r.body.id) ? r.body.id : null;
};

/* Réparation silencieuse au démarrage : on aligne l'identité locale sur celle
   du serveur plutôt que d'attendre qu'une écriture échoue. */
SB.syncIdentity = async () => {
  if(!SESS) return true;
  const id = await SB.whoami();
  if(!id) return true;                 /* hors ligne : on ne touche à rien */
  if(id === SESS.uid) return true;
  console.warn('identité réalignée :', SESS.uid, '→', id);
  const ancien = SESS.uid;
  SESS.uid = id; SB.keepSess();
  rebase(ancien, id);                  /* le stockage est nommé par uid : on déménage */
  load();
  return false;
};

/* ============================ synchronisation ============================
   Fusion par clé (installation, id), arbitrage par horodatage de modification,
   suppressions matérialisées par des pierres tombales. Une union d'ensembles
   ne sait pas distinguer « jamais vu » de « supprimé » : sans ces marques, un
   repas effacé sur un appareil réapparaîtrait depuis l'autre. */
const eKey = e => e.c + '|' + e.id;
const tKey = t => t.c + '|' + t.id;

const rowOf = e => ({user_id:SESS.uid, client_id:e.c, entry_id:e.id, d:e.d, meal:e.m,
  name:e.n, lines:e.l, kg:+kgOf(e.l).toFixed(3), db_version:'ademe-3.2',
  updated_at:e.u, deleted_at:null});

let syncing = false;
async function syncNow(silent){
  if(!SESS || syncing || !SB.ready()) return false;
  syncing = true;
  try{
    /* 1. descendre */
    const got = await SB.rest('entries?select=*');
    if(!got.ok){
      if(!silent) toast(got.status === 0 ? 'Hors ligne, synchro reportée' : 'Synchro impossible');
      return false;
    }
    const tomb = new Map(S.tomb.map(t => [tKey(t), t]));
    (got.body || []).forEach(r => {
      const k = r.client_id + '|' + r.entry_id;
      const loc = S.hist.find(x => eKey(x) === k);
      if(r.deleted_at){
        if(loc) S.hist = S.hist.filter(x => eKey(x) !== k);
        if(!tomb.has(k)){ const t = {c:r.client_id, id:r.entry_id, at:r.deleted_at};
                          S.tomb.push(t); tomb.set(k, t); }
        return;
      }
      /* supprimé ici plus récemment que modifié là-bas : la suppression gagne */
      if(tomb.has(k) && tomb.get(k).at > r.updated_at) return;
      const inc = {id:r.entry_id, c:r.client_id, d:r.d, m:r.meal, n:r.name, l:r.lines, u:r.updated_at};
      if(!loc) S.hist.push(inc);
      else if(r.updated_at > loc.u) Object.assign(loc, inc);
    });

    /* 2. remonter — un seul appel, la clé composite rend le rejeu inoffensif */
    if(S.hist.length){
      const up = await SB.rest('entries?on_conflict=user_id,client_id,entry_id',
        {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
         body: JSON.stringify(S.hist.map(rowOf))});
      if(!up.ok){ if(!silent) toast('Envoi refusé par le serveur'); return false; }
    }

    /* 3. pierres tombales — on marque la ligne existante, on ne la recrée pas :
       les colonnes obligatoires ne sont plus disponibles après suppression */
    for(const t of S.tomb){
      await SB.rest('entries?client_id=eq.' + encodeURIComponent(t.c) +
                    '&entry_id=eq.' + encodeURIComponent(t.id),
        {method:'PATCH', body: JSON.stringify({deleted_at:t.at, updated_at:t.at})});
    }

    S.lastSync = new Date().toISOString();
    save();
    if(!silent) toast('Synchronisé · ' + S.hist.length + ' repas');
    return true;
  } finally { syncing = false; }
}


/* les repas standard n’entrent dans les favoris qu’une fois : s’ils sont supprimés, ils ne
   reviennent pas tout seuls, un bouton permet de les rétablir */
function addStandards(){
  DB.standards.forEach(d => {
    if(!S.favs.some(f => f.n === d.n)) S.favs.push({n:d.n, m:['dej','din'], l:d.l.map(l => [...l]), std:1});
  });
  S.stdInit = true; save();
}

/* ============================ composants ============================ */

/* Un seul interrupteur, interrogé partout. L'app mesure d'abord une empreinte
   carbone ; les macros sont un complément que l'on doit pouvoir éteindre sans
   perdre le reste. Défaut : affichées. */
const nuOn = () => S.nutri !== false;

/* La journée décomposée par repas sur les trois axes, en une seule traversée de
   l'historique. `agg()` ne calcule que le carbone — il alimente les vues de long
   terme, où les macros n'ont pas leur place.

   Le coefficient de préparation ne s'applique qu'au carbone, et c'est voulu : un
   plat surgelé coûte 15 % de plus à produire, il ne contient pas 15 % de
   calories de plus. */
function jourAxes(d){
  const es = S.hist.filter(e => e.d === d);
  const vide = () => { const o = {}; MEALS.forEach(m => o[m.k] = 0); return o; };
  const par = {kg:vide(), kcal:vide(), prot:vide()};
  let kg = 0, kcal = 0, prot = 0;
  es.forEach(e => {
    const k = kgOf(e.l), n = nuOf(e.l);
    par.kg[e.m]   += k;      kg   += k;
    par.kcal[e.m] += n.kcal; kcal += n.kcal;
    par.prot[e.m] += n.prot; prot += n.prot;
  });
  return {es, par, kg, kcal, prot, n:es.length};
}



/* Carte d'axe. Les trois — carbone, calories, protéines — partagent cette forme
   et ne diffèrent que par leurs libellés : factoriser ici évite qu'une correction
   n'en rattrape que deux.

   Le titre et le total occupent le premier plan, la jauge par repas devient le
   fond du bandeau. On n'a pas besoin de lire la barre segment par segment : on a
   besoin de voir le chiffre et, derrière lui, à quelle hauteur du trait de repère
   on se trouve. Les segments gardent les couleurs de repas, et la légende sous le
   bandeau reste la cible de clic — un segment peut ne faire que deux pixels.

   Le dépassement se lit sur la couleur du chiffre (o.couleur) et non plus sur une
   zone hachurée au-delà du repère : à ce corps-là, le chiffre est ce qu'on voit
   d'abord. */
function carteAxeGrande(o){
  const rep = o.repere || 0;
  const scale = (Math.max(rep, o.total) * 1.02) || 1;
  const pc = v => clamp(v / scale * 100, 0, 100).toFixed(2);
  const vus = MEALS.filter(m => (o.par[m.k] || 0) > 0);
  const ax = o.axe || '';
  const segs = vus.map(m =>
    `<i data-gm="${m.k}" data-ax="${ax}" style="width:${pc(o.par[m.k])}%;background:${m.c}"></i>`).join('');
  /* L'étiquette du repère se place à gauche du trait, sauf quand le trait est
     lui-même près du bord gauche : elle serait rognée par overflow:hidden. */
  const tp = clamp(rep / scale * 100, 0, 99);
  const tick = rep > 0
    ? `<span class="tk${tp < 34 ? ' tkr' : ''}" data-label="${o.repLabel} ${o.fmt(rep)}"
         style="left:${tp.toFixed(2)}%"></span>` : '';
  return `<div class="card axeb"${o.premier ? '' : ' style="margin-top:10px"'}>
    <div class="hero">
      <div class="bg">${segs}</div>${tick}
      <div class="fg">
        <div class="ttl">${o.titre}</div>
        <div class="figs"${o.couleur ? ` style="color:${o.couleur}"` : ''}>${o.fmt(o.total)} <small>${o.unite}</small></div>
        <div class="sous">${o.sous}</div>
      </div>
    </div>
    <div class="gauge-legend" style="margin-top:12px">${vus.map(m =>
      `<button data-gm="${m.k}" data-ax="${ax}"><i class="dot" style="background:${m.c}"></i>${
        m.l} ${o.fmt(o.par[m.k])}<span class="ar">\u203a</span></button>`).join('')
      || '<span>Aucune saisie pour l\u2019instant</span>'}
    </div>
    <div class="hr"></div>
    <div class="small">${o.mot}</div>
    ${o.suite || ''}
  </div>`;
}

function gauge(byMeal, total){
  const scale = Math.max(BUDGET_J, total) * 1.02;
  const segs = MEALS.filter(m => byMeal[m.k] > 0)
    .map(m => `<i class="seg" style="width:${(byMeal[m.k]/scale*100).toFixed(2)}%;background:${m.c}"></i>`)
    .join('');
  const ov = Math.max(0, total - BUDGET_J);
  const over = ov > 0
    ? `<span class="over-zone" style="left:${(BUDGET_J/scale*100).toFixed(2)}%;width:${(ov/scale*100).toFixed(2)}%"></span>`
    : '';
  const tick = `<span class="tick" data-label="budget ${n1(BUDGET_J)}" style="left:${clamp(BUDGET_J/scale*100,0,99.4).toFixed(2)}%"></span>`;
  return `<div class="gauge-wrap" style="padding-top:16px">
      <div class="gauge">${segs}${over}</div>${tick}
    </div>
    <div class="gauge-legend">${MEALS.filter(m=>byMeal[m.k]>0)
      .map(m=>`<span><i class="dot" style="background:${m.c}"></i>${m.l} ${n2(byMeal[m.k])}</span>`).join('')
      || '<span>Aucune saisie pour l’instant</span>'}
    </div>`;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove('on'), 2100);
}
/* Normalisation partagée : accents, casse et ligature œ. Elle n'existait qu'en
   local dans le composer, la recherche d'ingrédients d'une recette en a besoin
   aussi. */
const nrmT = t => String(t).toLowerCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').replace(/œ/g, 'oe');

const COEUR = plein => `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"

  fill="${plein ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>`;

/* ============================ onglet — feed ============================
   Une relation se demande, elle ne se décrète pas. Le schéma l'impose autant
   que l'interface : une demande naît en attente, seul le destinataire tranche,
   et le demandeur ne peut pas effacer un refus.

   Recherche exacte seulement, sans annuaire à parcourir : il faut connaître le
   pseudo, comme sur une messagerie. */

let fbusy = false;

async function feedSearch(){
  const q = ($('#fq') ? $('#fq').value : S.fq || '').trim();
  S.fq = q;
  const slug = SB.slugify(q);
  if(slug.length < 2){ S.fres = undefined; return renderFeed(); }
  if(fbusy) return;
  fbusy = true; S.fres = 'cherche'; renderFeed();
  const r = await SB.rest('profiles?select=id,username,username_slug,created_at' +
    '&username_slug=eq.' + encodeURIComponent(slug) + '&limit=1');
  fbusy = false;
  S.fres = !r.ok ? (r.status === 0 ? 'hors-ligne' : 'erreur')
    : (r.body && r.body.length ? r.body[0] : 'aucun');
  renderFeed();
}

/* Un seul aller-retour : l'API rapporte le pseudo des deux parties dans la même
   requête, les clés étrangères visant profiles et non auth.users. */
async function frLoad(silent){
  if(!SESS) return;
  if(!silent) S.fr.state = 'charge';
  const r = await SB.rest('friend_requests?select=requester,addressee,status,created_at,' +
    'dem:profiles!friend_requests_requester_fkey(username,username_slug),' +
    'dst:profiles!friend_requests_addressee_fkey(username,username_slug)' +
    '&order=created_at.desc');
  if(!r.ok){ S.fr.state = r.status === 0 ? 'hors-ligne' : 'erreur'; return renderFeed(); }
  const rows = r.body || [];
  S.fr = {
    in:      rows.filter(x => x.addressee === SESS.uid && x.status === 'pending'),
    out:     rows.filter(x => x.requester === SESS.uid && x.status === 'pending'),
    refuses: rows.filter(x => x.requester === SESS.uid && x.status === 'declined'),
    friends: rows.filter(x => x.status === 'accepted'),
    state:   'ok',
  };
  alerteAmis();
  paintAlertes();
  renderFeed();
}

/* Ce qui réclame une réponse, calculé en un seul endroit. La pastille de la
   barre d'onglets, celles des trois sections du feed et le badge de l'icône
   doivent compter la même chose : trois calculs séparés finiraient par se
   contredire, et un compteur qui ment ne se rattrape pas. */
function attentes(){
  /* Le rappel des repas ne dépend d'aucun compte : il compte même hors ligne
     et sans identité. Il est tenu à part du social parce qu'il ne se répond
     pas sur le feed mais sur la saisie. */
  const repas = soirDu() ? 1 : 0;
  if(!SESS) return {actu:0, defis:0, amis:0, social:0, repas, total:repas};
  const t0 = today();
  const defis = (S.chal || []).filter(ch => ch.ends >= t0 &&
    (ch.parts.find(x => x.member === SESS.uid) || {}).status === 'invited').length;
  const amis = (S.fr.in || []).length;
  const lu = S.notif.luPost;
  const actu = (S.posts || []).filter(x => x.author !== SESS.uid && (!lu || x.created_at > lu)).length;
  const social = actu + defis + amis;
  return {actu, defis, amis, social, repas, total: social + repas};
}

/* ---------------- rappel du soir ----------------
   Une seule source de vérité pour les trois signaux du soir : la notification
   de 21 h et la pastille de l'onglet Saisie. Deux lectures séparées de
   l'historique finiraient par se contredire. */
const SOIR_H = 21;

function repasManquants(){
  const T = today();
  const m = new Set(S.hist.filter(e => e.d === T && e.m !== 'encas').map(e => e.m));
  const out = [];
  if(!m.has('dej')) out.push('déjeuner');
  if(!m.has('din')) out.push('dîner');
  return out;
}

/* Vrai à partir de 21 h tant qu'il manque un repas à la journée en cours. Ne
   demande aucune autorisation : c'est de l'affichage dans l'app, pas une
   notification système. */
const soirDu = () => new Date().getHours() >= SOIR_H && repasManquants().length > 0;

/* Badge de l'icône. Disponible seulement sur une app ajoutée à l'écran
   d'accueil, iOS 16.4 ou plus, notifications autorisées — ailleurs la méthode
   n'existe simplement pas et la détection suffit.

   Il ne peut bouger que pendant que l'app tourne : sans serveur d'envoi, le
   service worker ne se réveille jamais. Mais le dernier chiffre posé survit à
   la fermeture, d'où l'appel au moment où l'app passe en arrière-plan. Le
   compte est donc juste à l'instant où l'on quitte l'app, puis figé jusqu'à la
   prochaine ouverture — c'est une limite, pas un bug. */
async function badgeSync(){
  if(!('setAppBadge' in navigator)) return;
  try{
    const n = S.notif.on ? attentes().total : 0;
    if(n > 0) await navigator.setAppBadge(n);
    else await navigator.clearAppBadge();
  }catch(e){ /* permission retirée côté système : rien à signaler */ }
}

/* Marquer l'Actu comme lue. Le repère est l'horodatage de la publication la
   plus récente qui ne soit pas la mienne : mes propres partages ne peuvent pas
   être « non lus ». */
function actuLue(){
  if(!SESS || !S.posts) return;
  const eux = S.posts.filter(x => x.author !== SESS.uid);
  if(!eux.length || S.notif.luPost === eux[0].created_at) return;
  S.notif.luPost = eux[0].created_at; save();
}

function paintFeedCount(){
  badgeSync();
  const b = document.querySelector('#tabbar .bub');
  if(!b) return;
  const n = attentes().social;
  b.dataset.n = n;
  const c = b.querySelector('.cnt');
  if(c) c.textContent = n > 9 ? '9+' : String(n);
  b.setAttribute('aria-label', n ? `Feed, ${n} demande${n>1?'s':''} en attente` : 'Feed');
}

/* Pastille rouge sur l'onglet Saisie. Suit soirDu() : elle apparaît à 21 h et
   disparaît d'elle-même dès que le déjeuner et le dîner sont entrés. Le bandeau
   qui l'accompagnait a été retiré — la notification système et la pastille de
   l'icône font le même travail sans occuper le haut de l'écran. */
function paintSaisieDot(){
  const b = document.querySelector('#tabbar button[data-tab="saisie"]');
  if(!b) return;
  const on = soirDu();
  b.dataset.dot = on ? '1' : '0';
  b.setAttribute('aria-label', on ? 'Saisie, un repas manque aujourd’hui' : 'Saisie');
}

/* Un seul point d'entrée pour repeindre tous les signaux d'attente. Appelé
   après chaque écriture locale : entrer le dîner doit éteindre la pastille et
   la pastille sans attendre le prochain tour de minuterie. */
function paintAlertes(){
  paintFeedCount();

/* Fiche d'un ami. Trois cas distincts et il faut les distinguer : rien de
   renseigné, partage fermé, ou fiche visible. Les confondre laisserait croire à
   une panne là où il n'y a qu'une pudeur. */
async function tasteSheet(uid, nom){
  openSheet(`<div class="unit">Fiche gourmande</div>
    <h3 style="margin:2px 0 10px">${esc(nom)}</h3>
    <p class="small mute">Chargement…</p>`);
  const r = await SB.rest('tastes?select=gout,plat,dessert,cuisine,regime&user_id=eq.' + uid + '&limit=1');
  const L = {
    gout:['Goût', {sucre:'Plutôt sucré', sale:'Plutôt salé', deux:'Les deux'}],
    cuisine:['Cuisine', {traditionnelle:'Traditionnelle', francaise:'Française',
      mediterraneenne:'Méditerranéenne', italienne:'Italienne', asiatique:'Asiatique'}],
    regime:['Régime', {vegetalien:'Végétalien', vegetarien:'Végétarien',
      flexitarien:'Flexitarien', proteine:'Tout pour la prot', carnivore:'Carnivore'}],
  };
  let corps;
  if(!r.ok){
    corps = `<p class="small mute">${r.status === 0 ? 'Hors ligne.' : 'Lecture impossible.'}</p>`;
  } else if(!r.body || !r.body.length){
    corps = `<p class="small mute">${esc(nom)} n’a pas ouvert sa fiche, ou ne l’a pas remplie.
      C’est un choix, pas une panne.</p>`;
  } else {
    const t = r.body[0];
    const rows = [];
    if(t.gout)    rows.push([L.gout[0], L.gout[1][t.gout]]);
    if(t.plat)    rows.push(['Plat préféré', t.plat]);
    if(t.dessert) rows.push(['Dessert préféré', t.dessert]);
    if(t.cuisine) rows.push([L.cuisine[0], L.cuisine[1][t.cuisine]]);
    if(t.regime)  rows.push([L.regime[0], L.regime[1][t.regime]]);
    corps = rows.length
      ? `<div class="stagelist">${rows.map(([k,v]) =>
          `<span class="unit">${k}</span><span class="small">${esc(String(v))}</span><span></span>`).join('')}</div>`
      : `<p class="small mute">Fiche ouverte mais encore vide.</p>`;
  }
  openSheet(`<div class="unit">Fiche gourmande</div>
    <h3 style="margin:2px 0 10px">${esc(nom)}</h3>
    ${corps}
    <div class="hr"></div>
    <div class="src">Seuls les goûts circulent. Ni objectif, ni estimation, ni repas.</div>
    ${!S.tasteShared ? `<button class="btn btn-2" id="ts_open" style="margin-top:10px">Ouvrir la mienne en retour</button>` : ''}`);
  const b = $('#ts_open');
  if(b) b.onclick = async () => {
    S.tasteShared = true;
    if(await tastePush()){ save(); closeSheet(); toast('Votre fiche est visible de vos amis'); }
    else { S.tasteShared = false; toast('Impossible pour l’instant'); }
  };
}

/* Publier. UNE seule écriture désormais : la visibilité se calcule à la lecture
   à partir de l'amitié, elle ne se matérialise plus en destinataires. L'ancien
   schéma exigeait une seconde écriture dans post_people ; quand elle échouait,
   la publication existait sans que personne ne la voie, et le partage semblait
   « ne pas marcher » alors qu'il avait à moitié réussi. La ligne de rappel est
   conservée en best-effort pour les bases où l'ancienne policy tourne encore :
   son échec n'est plus une panne. */
async function postNew(kind, corps){
  if(!SESS) return {ok:false, msg:'Il faut un compte pour partager'};

  const auteur = await SB.uid();
  if(!auteur) return {ok:false, msg:'Identité indisponible : rechargez l’app ou reconnectez-vous'};

  const post = await SB.rest('posts?select=id', {method:'POST',
    headers:{Prefer:'return=representation'},
    body: JSON.stringify({author:auteur, kind, body:corps})});

  if(!post.ok || !post.body || !post.body.length){
    /* Ne jamais masquer la cause : table absente, jeton périmé, policy et
       contrainte de type donnent le même « ça ne marche pas » et appellent
       quatre remèdes différents. */
    const brut = JSON.stringify(post.body || {});
    console.error('postNew ·', kind, '·', post.status, brut);
    const motif = (post.body && (post.body.message || post.body.hint || post.body.code)) || '';
    if(/PGRST205|schema cache|does not exist/i.test(brut))
      return {ok:false, msg:'Table des publications absente : le schéma social n’est pas installé'};
    if(/check constraint|posts_kind/i.test(brut))
      return {ok:false, msg:'Type de publication refusé : feed_visibility.sql n’a pas été passé'};
    if(post.status === 401) return {ok:false, msg:'Session expirée : rechargez l’app'};
    if(post.status === 403 || /42501|row-level/i.test(brut))
      return {ok:false, msg:'Refusé · ' + (motif ? String(motif).slice(0,90) : 'droits insuffisants')};
    return {ok:false, msg: post.status === 0 ? 'Hors ligne'
      : 'Publication impossible · ' + post.status + (motif ? ' · ' + String(motif).slice(0,70) : '')};
  }

  const id = post.body[0].id;
  const cibles = S.fr.friends.map(x => ({post:id,
    person: x.requester === auteur ? x.addressee : x.requester}));
  if(cibles.length){
    const r = await SB.rest('post_people', {method:'POST',
      headers:{Prefer:'return=minimal'}, body: JSON.stringify(cibles)});
    if(!r.ok) console.warn('post_people ignoré ·', r.status, JSON.stringify(r.body || {}));
  }
  return {ok:true, id, amis:cibles.length};
}

/* Partage d'un badge depuis sa fiche. Ne plus refuser faute d'ami : la

   seule preuve que le geste a abouti. */
async function badgeShare(t){
  if(!SESS) return toast('Il faut un compte pour partager');
  if(S.fr.state !== 'ok') await frLoad(true);

  const r = await postNew('badge', {key:t.s, label:t.n, emoji:t.e});

    : 'Badge publié dans Actu · aucun ami pour l’instant, vous seul le voyez');
  S.fv = 'actu';
  frPosts();
}

/* Adjectifs et mentions de conditionnement qui n'orientent pas le
   rapprochement et le brouillent souvent : « poivron rouge » doit tomber sur
   le poivron, « tomates bien mûres » sur la tomate. */
const RQ_MOTS_VIDES = new Set(['frais','fraiche','fraiches','surgele','surgelee',
  'congele','bio','entier','entiere','demi','petit','petite','petits','petites',
  'gros','grosse','grand','grande','moyen','moyenne','beau','belle','bien','mur',
  'mure','murs','mures','de','d','du','des','la','le','les','un','une','en','a',
  'au','aux','ou','et','pour','environ','facultatif','facultative','optionnel',
  'coupe','coupee','emince','emincee','hache','hachee','rape','rapee','pele',
  'pelee','lave','lavee','egoutte','egouttee','ciselee','cisele','decortique',
  'nature','doux','douce','sec','seche','seches','liquide','poudre','morceau',
  'morceaux','des','tranche','tranches','fine','fines','type','sorte','maison',
  'preferee','prefere','qualite','extra','vierge','fondu','fondue','ramolli',
  'temperature','ambiante','froid','froide','chaud','chaude','cuit','cuite',
  'cru','crue','precuit','nouveau','nouvelle','jeune','vieux','allege','entiers']);

/* Normalisation commune aux deux côtés du rapprochement : sans accents,
   sans parenthèses, sans ponctuation, chaque mot au singulier. Appliquée
   aussi bien à la ligne du site qu'au nom de l'aliment, sinon
   « Champignons de Paris » ne rencontrerait jamais « champignon de Paris ». */
function rqNorm(t){
  return nrmT(t)
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[’']/g, ' ')
    .replace(/[^a-z0-9%\s]/g, ' ')
    .split(/\s+/)
    .filter(Boolean)
    .map(m => m.length > 3 && /[sx]$/.test(m) ? m.slice(0, -1) : m)
    .join(' ')
    .trim();
}

/* Table de synonymes normalisée une fois pour toutes, clés les plus longues
   d'abord : « huile d olive » doit être essayé avant « huile ». */
const RQ_SYN = new Map(Object.entries(RQ_SYN_SRC)
  .map(([k, v]) => [rqNorm(k), v])
  .sort((a, b) => b[0].length - a[0].length));

/* Les unités passent par la même normalisation, sans quoi elles seraient
   cherchées sous une forme que le texte n'a plus : rqNorm ramène « noix » à
   « noi », et une clé écrite « noix » ne serait jamais trouvée. C'est
   exactement le bogue qui faisait d'une noix de beurre trente grammes de
   noix. */
const RQ_UNI = {};
for(const [k, v] of Object.entries(RQ_UNI_SRC)) RQ_UNI[rqNorm(k)] = v;

/* Index des aliments de la base sous forme normalisée. Le nom retenu et, s'il
   existe, celui de l'aliment de report (`xs`) : « Emmental » se trouve ainsi
   aussi par « fromage a pate dure ». */
const RQ_IDX = DB.foods.map(f => ({
  s: f.s, p: f.p,
  n: rqNorm(f.n),
  x: f.xs ? rqNorm(f.xs) : '',
}));

/* Déterminants et mesures vagues en tête de désignation. Retirés avant tout
   rapprochement, mais séparément des adjectifs : « quelques olives noires »
   doit devenir « olives noires » et non « olives », sans quoi la couleur
   disparaîtrait avant même d'avoir servi. */
const RQ_TETE = new Set(['de','d','du','des','la','le','les','l','un','une','quelque',
  'quelques','environ','a','au','aux','petit','petite','gros','grosse','beau','belle',
  'joli','jolie','bon','bonne','plusieurs']);

/* Fractions écrites, décimales à la française, intervalles. Un intervalle
   (« 2 à 3 oignons ») retient la borne basse : minorer une quantité vaut
   mieux que la majorer sans le dire. */
function rqQte(t){
  const s = t.replace(/½/g, ' 1/2 ').replace(/¼/g, ' 1/4 ').replace(/¾/g, ' 3/4 ')
             .replace(/⅓/g, ' 1/3 ').replace(/⅔/g, ' 2/3 ').trim();
  /* La borne haute d'un intervalle est retirée du reste, sinon elle serait
     lue comme un mot de la désignation et brouillerait le rapprochement. */
  const coupe = r => r.replace(/^\s*(?:[aà]|-|ou|\/)\s*\d+(?:[.,]\d+)?/i, '');
  let m = s.match(/^(\d+)[\s.,](\d+)\s*\/\s*(\d+)/);
  if(m) return {q: +m[1] + +m[2] / +m[3], reste: coupe(s.slice(m[0].length))};
  m = s.match(/^(\d+)\s*\/\s*(\d+)/);
  if(m) return {q: +m[1] / +m[2], reste: coupe(s.slice(m[0].length))};
  m = s.match(/^(\d+(?:[.,]\d+)?)/);
  if(m) return {q: parseFloat(m[1].replace(',', '.')), reste: coupe(s.slice(m[0].length))};
  return {q: null, reste: s};
}

/* Découpe d'une ligne en quantité, unité et désignation. L'unité est cherchée
   sur les trois premiers mots qui suivent le nombre, du plus long au plus
   court : « c a soupe » avant « c ». */
function rqTete(s){
  const mots = String(s).split(/\s+/).filter(Boolean);
  while(mots.length > 1 && RQ_TETE.has(mots[0])) mots.shift();
  return mots.join(' ');
}

function rqLigne(brut){
  const t = String(brut).replace(/\s+/g, ' ').trim();
  const {q, reste} = rqQte(t);
  const plein = rqNorm(reste);
  let mots = plein.split(/\s+/).filter(Boolean), uni = null;
  for(let n = Math.min(3, mots.length); n >= 1; n--){
    const cle = mots.slice(0, n).join(' ');
    if(Object.prototype.hasOwnProperty.call(RQ_UNI, cle)){ uni = RQ_UNI[cle]; mots = mots.slice(n); break; }
  }
  /* `plein` garde le mot d'unité en place. Il faut le conserver parce que
     plusieurs mesures françaises sont aussi des découpes : « 1 filet de
     saumon » n'est pas un filet d'huile, « 1 bouquet garni » n'est pas un
     bouquet de persil. Le mot est retiré par défaut, et rendu à la
     désignation quand celle-ci forme une expression connue. */
  return {q, uni, nom: mots.join(' '), plein, brut: t};
}

/* Rapprochement avec la base. Rend le slug, ou null pour un ingrédient
   volontairement ignoré, ou undefined quand rien ne correspond — trois issues
   distinctes, que l'écran de relecture traite différemment.

   Deux formes de la désignation sont essayées dans l'ordre : sans les
   déterminants de tête d'abord, puis sans les adjectifs. La première conserve
   « lait de coco » et « haricot vert » intacts, ce qui compte : la seconde,
   plus agressive, les réduirait à « lait » et « haricot » et les ferait tomber
   sur le lait de vache et les haricots rouges. */
function rqSlug(nom){
  if(!nom) return undefined;

  /* Une masse citée dans la désignation (« 1 pavé de saumon de 150 g ») sert à
     la conversion, pas au rapprochement : elle est écartée ici. */
  let mots = nom.replace(/\b(?:de\s+)?\d+(?:[.,]\d+)?\s*(?:kg|gr|g|cl|ml|dl|l)\b/g, ' ')
                .replace(/\s+/g, ' ').trim().split(/\s+/).filter(Boolean);
  if(!mots.length) mots = nom.split(/\s+/).filter(Boolean);
  mots = rqTete(mots.join(' ')).split(/\s+/).filter(Boolean);

  const large = mots.join(' ');
  const etroit = mots.filter(m => !RQ_MOTS_VIDES.has(m)).join(' ') || large;
  const formes = etroit === large ? [large] : [large, etroit];

  /* Ordre des tentatives, et il compte. Un synonyme exact d'abord : « farine »
     n'a pas d'équivalent dans la base et doit devenir du blé. Puis un nom
     d'aliment franchement reconnu, avant le repli approximatif sur la table de
     synonymes — sans cette précédence, « pain de mie », qui existe dans la
     base, serait intercepté par la clé « pain » et finirait en baguette. */
  for(const f of formes) if(RQ_SYN.has(f)) return RQ_SYN.get(f);

  const note0 = rqNote(formes[0]);
  if(note0.note >= 84) return note0.slug;
  const note1 = formes[1] ? rqNote(formes[1]) : null;
  if(note1 && note1.note >= 84) return note1.slug;

  /* Clés les plus longues d'abord : « huile d olive » avant « huile ». */
  for(const [cle, val] of RQ_SYN){
    if(cle.length < 4) continue;
    for(const f of formes){
      if(f === cle || f.startsWith(cle + ' ') || f.endsWith(' ' + cle)
         || f.includes(' ' + cle + ' ')) return val;
    }
  }

  const best = note1 && note1.note > note0.note ? note1 : note0;
  return best.note >= 60 ? best.slug : undefined;
}

/* Note de ressemblance entre une désignation et le nom des aliments. */
function rqNote(f){
  let meilleur = null, note = 0, lg = 99;
  const jetons = f.split(/\s+/).filter(Boolean);
  for(const x of RQ_IDX){
    /* Le nom de report (`xs`) rapproche aussi — « Emmental » se trouve par
       « fromage à pâte dure » — mais moins bien que le nom propre : sans
       cette pénalité, « bœuf » tomberait sur le steak haché, dont le bœuf
       est justement le report, et « carotte » sur le mix de légumes. */
    for(const [cible, malus] of [[x.n, 0], [x.x, 12]]){
      if(!cible) continue;
      let n = 0;
      if(cible === f) n = 100;
      else if(cible.startsWith(f + ' ')) n = 88;
      else if(f.startsWith(cible + ' ') || f.endsWith(' ' + cible)) n = 84;
      else {
        const jc = cible.split(/\s+/);
        const communs = jetons.filter(m => m.length > 2 && jc.includes(m)).length;
        /* Un seul mot commun ne suffit que s'il ouvre le nom de l'aliment,
           sans quoi « salade de fruits » attraperait « Salade de riz au
           thon ». L'écart de longueur pénalise les plats composés : deux
           mots communs avec « Banger and mash, saucisses et écrasé de
           pommes de terre » ne valent pas deux mots avec « Pomme de terre ». */
        if(communs && (communs > 1 || jetons[0] === jc[0]))
          n = 40 + communs * 12 - Math.min(24, Math.abs(jc.length - jetons.length) * 5);
      }
      n -= malus;
      /* À note égale, le nom le plus court : c'est l'aliment le plus
         générique, donc le moins risqué. */
      if(n > note || (n === note && n > 0 && cible.length < lg)){
        note = n; meilleur = x.s; lg = cible.length;
      }
    }
  }
  return {slug: meilleur, note};
}

/* Conversion en grammes. Sans unité, un nombre compte des pièces et se
   multiplie par le poids de portion déjà présent dans la base : « 2 oignons »
   valent deux fois 50 g. Sans quantité du tout, on renonce plutôt que
   d'inventer : la ligne part en texte libre. */
function rqGrammes(l, slug){
  if(l.q == null) return null;
  const cas = () => RQ_CAS[slug] != null ? RQ_CAS[slug] : 13;
  let g = null;
  if(l.uni === 'cas') g = l.q * cas();
  else if(l.uni === 'cac') g = l.q * cas() / 3;
  else if(typeof l.uni === 'number') g = l.q * l.uni;
  else {
    /* Pas d'unité en tête, mais une masse citée plus loin : « 1 pavé de saumon
       de 150 g » vaut 150 g, pas une portion de saumon par défaut. Le site est
       plus fiable que le poids de portion de la base. */
    const m = l.nom.match(/(\d+(?:[.,]\d+)?)\s*(kg|gr|g|cl|ml|dl|l)\b/);
    if(m && typeof RQ_UNI[m[2]] === 'number'){
      g = l.q * parseFloat(m[1].replace(',', '.')) * RQ_UNI[m[2]];
    } else {
      const f = F.get(slug);
      if(!f) return null;
      g = l.q * f.p;
    }
  }
  g = Math.round(g);
  if(g > 5000) return 5000;
  return g >= 1 ? g : null;
}

/* Passe l'ensemble d'une liste lue. Les doublons sont additionnés plutôt que
   dupliqués : une recette qui cite l'huile deux fois donne une seule ligne. */
function rqMapper(lignes){
  const ing = [], autres = [], rates = [];
  for(const brut of lignes){
    const l = rqLigne(brut);
    let slug = rqSlug(l.nom);
    /* Le mot d'unité rendu à la désignation, mais seulement si l'expression
       entière est une entrée connue : « filet de saumon » oui, « noix de
       beurre » non — celle-ci reste une noix de beurre, soit quinze grammes. */
    if(l.uni != null){
      const cle = rqTete(l.plein);
      if(RQ_SYN.has(cle)){ slug = RQ_SYN.get(cle); l.uni = null; }
    }
    if(slug === null){ autres.push(l.brut); continue; }
    if(slug === undefined){ autres.push(l.brut); rates.push(l.brut); continue; }
    const g = rqGrammes(l, slug);
    if(g == null){ autres.push(l.brut); continue; }
    const dejà = ing.find(x => x[0] === slug);
    if(dejà) dejà[1] = Math.min(5000, dejà[1] + g);
    else ing.push([slug, g]);
  }
  return {ing, autres, rates};
}

/* Appel de l'Edge Function. Le jeton de session est transmis : la fonction est
   déployée avec vérification du JWT, faute de quoi ce serait un proxy HTTP
   ouvert utilisable par n'importe qui. */
async function rqLire(url){
  if(!SB.ready()) return {err:'Serveur non configuré'};
  const tok = await SB.fresh();
  if(!tok) return {err:'Session expirée · reconnecte-toi'};
  const r = await SB.call('/functions/v1/lire-recette', {
    method:'POST',
    headers:{Authorization:'Bearer ' + tok},
    body: JSON.stringify({url}),
  });
  if(r.status === 0) return {err:'Pas de réseau'};
  const b = r.body || {};
  if(!r.ok || !b.ok) return {err: b.error || 'Lecture impossible', sites: b.sites};
  return {rec: b};
}

/* Composition d'une recette. Les ingrédients se choisissent dans la base, pas
   au clavier : la recette devient mesurable à la publication, elle affiche son
   empreinte par personne, et l'enregistrer en plat type ne demande plus aucune
   devinette. Ce qui n'existe pas dans la base — épices, herbes, sel — part dans
   « Autres », en texte libre et hors du calcul. */
function recipeSheet(){
  if(!SESS) return toast('Il faut un compte pour publier');
  S.rq = S.rq || {title:'', pers:2, ing:[], autres:'', prep:'', url:'', q:'',
                  mode:'man', lien:'', lu:null, err:null, occupe:false};
  const q = S.rq;

  /* Relire les champs avant tout re-rendu, sinon ajouter un ingrédient effacerait
     ce qui vient d'être tapé ailleurs. */
  const collecte = () => {
    const v = id => { const el = $(id); return el ? el.value : null; };
    const t = v('#rq_t'); if(t !== null) q.title  = t;
    const a = v('#rq_a'); if(a !== null) q.autres = a;
    const p = v('#rq_p'); if(p !== null) q.prep   = p;
    const u = v('#rq_u'); if(u !== null) q.url    = u;
    const w = v('#rq_w'); if(w !== null) q.lien   = w;
    const n = v('#rq_n'); if(n !== null) q.pers   = Math.max(1, Math.min(30, Math.round(+n) || 1));
  };

  /* Le sélecteur reste affiché dans les deux modes : après une lecture on
     retombe sur la saisie manuelle, qui sert d'écran de relecture, et il faut
     pouvoir repartir sur un autre lien sans fermer la feuille. */
  const onglets = () => `
    <div class="rtabs">
      <button type="button" data-rqm="man" aria-pressed="${q.mode === 'man'}">Saisie manuelle</button>
      <button type="button" data-rqm="url" aria-pressed="${q.mode === 'url'}">Depuis un lien</button>
    </div>`;

  const brancheOnglets = () => {
    $('#sheet').querySelectorAll('[data-rqm]').forEach(b => b.onclick = () => {
      collecte();
      if(q.mode === b.dataset.rqm) return;
      q.mode = b.dataset.rqm; q.err = null;
      peint();
    });
  };

  /* Panneau de lecture. La liste des sites est rappelée sur place : sans elle,
     l'utilisateur colle un lien au hasard et se heurte à un refus qu'il ne
     comprend pas. */
  const peintUrl = () => {
    openSheet(`
      <div class="unit">Idée de recette</div>
      <h3 style="margin:2px 0 10px">D’où vient la recette ?</h3>
      ${onglets()}

      <input class="search" id="rq_w" maxlength="400" inputmode="url" autocapitalize="off"
             autocomplete="off" spellcheck="false" value="${esc(q.lien)}"
             placeholder="https://www.marmiton.org/recettes/…">

      ${q.err ? `<div class="src" style="color:var(--brick); margin:0 0 8px">${esc(q.err)}</div>` : ''}

      <div class="actions" style="margin-top:6px">
        <button class="btn btn-1" id="rq_go2" ${q.occupe ? 'disabled' : ''}>${
          q.occupe ? 'Lecture…' : 'Lire la page'}</button>
        <button class="btn btn-2" id="rq_no">Annuler</button>
      </div>

      <div class="unit" style="margin:14px 0 4px">Sites lus</div>
      <div class="small mute">Marmiton · 750g · CuisineAZ · Cuisine du Journal des Femmes ·
        Ptitchef · Cuisine Actuelle · L’atelier des Chefs · Académie du Goût · Chef Simon ·
        Cookomix · Ricardo · HelloFresh · Allrecipes · BBC Good Food</div>

      <div class="src" style="margin-top:12px">La page est lue côté serveur, puis ses ingrédients
        sont rapprochés de la base. Rien n’est publié : la lecture remplace le brouillon en cours
        et s’ouvre en relecture, quantité par quantité.</div>`);

    const w = $('#rq_w');
    const lance = async () => {
      collecte();
      const lien = (q.lien || '').trim();
      if(lien.length < 8) return toast('Colle d’abord un lien');
      q.err = null; q.occupe = true; peint();

      const {rec, err} = await rqLire(lien);
      q.occupe = false;
      if(err){ q.err = err; return peint(); }

      const m = rqMapper(rec.ing);
      q.title  = (rec.titre || q.title || '').slice(0, 90);
      if(rec.pers) q.pers = rec.pers;
      q.ing    = m.ing;
      q.autres = m.autres.join('\n').slice(0, 600);
      q.prep   = (rec.prep || []).join('\n').slice(0, 2500);
      q.url    = rec.url;
      q.lu     = {site:rec.site, n:m.ing.length, a:m.autres.length,
                  rates:m.rates, pers:rec.pers, via:rec.via};
      q.mode   = 'man';
      peint();
    };
    $('#rq_go2').onclick = lance;
    w.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); lance(); } };
    $('#rq_no').onclick = () => { S.rq = null; closeSheet(); };
    brancheOnglets();
  };

  /* Compte rendu de lecture. Il doit dire ce qui n'a pas été rapproché, et le
     nommer : un total d'empreinte sans cette mention laisserait croire que la
     recette entière a été mesurée. */
  const bandeau = () => {
    const l = q.lu;
    if(!l) return '';
    const r = l.rates.length;
    return `<div style="border:1px solid var(--line); border-radius:10px;
                        padding:10px 11px; margin:0 0 12px">
      <div class="unit">Lu depuis ${esc(l.site)}${l.via === 'microdata' ? ' · sans données structurées' : ''}</div>
      <div class="small mute" style="margin-top:2px">${l.n} ingrédient${l.n > 1 ? 's' : ''}
        rapproché${l.n > 1 ? 's' : ''} de la base${l.a ? ` · ${l.a} en texte libre` : ''}${
        l.pers ? ` · annoncée pour ${l.pers}` : ' · portions non annoncées, à vérifier'}</div>
      ${r ? `<div class="small" style="color:var(--brick); margin-top:4px">Non reconnu${r > 1 ? 's' : ''} :
        ${esc(l.rates.slice(0, 6).join(' · '))}${r > 6 ? ` et ${r - 6} de plus` : ''}</div>` : ''}
      <div class="src" style="margin-top:6px">Les quantités sont converties, pas mesurées :
        relis-les avant de publier. Une cuillerée, une gousse ou une pièce valent une moyenne.</div>
    </div>`;
  };

  const peint = () => {
    if(q.mode === 'url') return peintUrl();
    const kg = kgOf(q.ing), pers = Math.max(1, q.pers);
    openSheet(`
      <div class="unit">Idée de recette</div>
      <h3 style="margin:2px 0 10px">Qu’est-ce qui était bon ?</h3>
      ${onglets()}
      ${bandeau()}

      <input class="search" id="rq_t" maxlength="90" autocomplete="off"
             value="${esc(q.title)}" placeholder="Titre — ex. Dahl de lentilles corail">

      <div class="rqpers">
        <span class="small">Recette pour</span>
        <input id="rq_n" type="number" inputmode="numeric" min="1" max="30" value="${pers}">
        <span class="small">personne${pers > 1 ? 's' : ''}</span>
      </div>

      <div class="unit" style="margin:8px 0 4px">Ingrédients</div>
      <div class="pick srchw${q.q ? ' on' : ''}">
        <input id="rq_q" type="text" inputmode="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" value="${esc(q.q)}" placeholder="Chercher dans la base — ex. lentilles">
        <button class="srchx" id="rq_qx" type="button" aria-label="Effacer">✕</button>
        <div class="sugg" id="rq_sg" hidden></div>
      </div>

      ${q.ing.length ? q.ing.map((l, k) => `<div class="rqline">
          <span class="nm">${esc(F.get(l[0]).n)}</span>
          <input type="number" inputmode="numeric" min="1" max="5000" value="${l[1]}" data-rqg="${k}">
          <span class="kg">${n2(kgOf([l]))}</span>
          <button class="rm" data-rqrm="${k}" aria-label="Retirer">×</button>
        </div>`).join('')
        : `<div class="src">Aucun ingrédient. Cherchez-en un ci-dessus : c’est ce qui rend la recette
            mesurable et enregistrable en plat type.</div>`}

      ${q.ing.length ? `<div class="total">
          <div><div class="unit">Empreinte</div>
            <div class="small mute">${n2(kg)} kg pour ${pers} · quantités totales, non par personne</div></div>
          <div class="v">${n2(kg / pers)}<span style="font-size:14px"> kg/pers</span></div>
        </div>` : ''}

      <div class="unit" style="margin:12px 0 4px">Autres · un par ligne, hors calcul</div>
      <textarea class="search" id="rq_a" rows="2" maxlength="600"
        style="font-family:inherit;resize:vertical"
        placeholder="sel, poivre&#10;quelques feuilles de coriandre">${esc(q.autres)}</textarea>

      <div class="unit" style="margin:4px 0 4px">Préparation · une étape par ligne</div>
      <textarea class="search" id="rq_p" rows="5" maxlength="2500"
        style="font-family:inherit;resize:vertical"
        placeholder="Faire revenir l’oignon cinq minutes.&#10;Ajouter les lentilles et le lait de coco.&#10;Laisser mijoter vingt minutes à couvert.">${esc(q.prep)}</textarea>

      <input class="search" id="rq_u" maxlength="300" inputmode="url" autocapitalize="off"
             value="${esc(q.url)}" placeholder="Lien vers la recette (facultatif)">

      <div class="actions" style="margin-top:6px">
        <button class="btn btn-1" id="rq_go">Publier</button>
        <button class="btn btn-2" id="rq_no">Annuler</button>
      </div>
      <div class="src" style="margin-top:8px">Visible de vos amis, qui pourront l’enregistrer dans leurs
        plats types. Ce qui figure dans « Autres » ne compte pas dans l’empreinte : elle est donc minorante.</div>`);

    brancheOnglets();

    const qi = $('#rq_q'), sg = $('#rq_sg');
    const peintSugg = () => {
      const t = nrmT(qi.value.trim());
      const l = t.length >= 2
        ? DB.foods.filter(f => nrmT(f.n).includes(t) || nrmT(f.g).includes(t)).slice(0, 8) : [];
      sg.innerHTML = l.map(f => `<button type="button" data-radd="${esc(f.s)}">
          <span class="nm">${esc(f.n)}${f.x ? '<span class="tag">estimé</span>' : ''}<i>${esc(f.g)}</i></span>
          <b>${n2(f.t * f.p / 1000)}</b></button>`).join('');
      sg.hidden = !l.length;
      sg.querySelectorAll('[data-radd]').forEach(btn => btn.onclick = () => {
        collecte();
        const sl = btn.dataset.radd;
        if(!q.ing.some(x => x[0] === sl)) q.ing.push([sl, F.get(sl).p]);
        q.q = ''; peint();
      });
    };
    qi.oninput = () => { q.q = qi.value; qi.parentNode.classList.toggle('on', !!qi.value); peintSugg(); };
    $('#rq_qx').onclick = () => { qi.value = ''; q.q = ''; qi.parentNode.classList.remove('on');
                                  sg.hidden = true; sg.innerHTML = ''; qi.focus(); };
    peintSugg();

    $('#sheet').querySelectorAll('[data-rqg]').forEach(el => el.onchange = () => {
      collecte();
      q.ing[+el.dataset.rqg][1] = Math.max(1, Math.min(5000, Math.round(+el.value) || 1));
      peint();
    });
    $('#sheet').querySelectorAll('[data-rqrm]').forEach(btn => btn.onclick = () => {
      collecte(); q.ing.splice(+btn.dataset.rqrm, 1); peint();
    });
    const np = $('#rq_n'); if(np) np.onchange = () => { collecte(); peint(); };

    $('#rq_no').onclick = () => { S.rq = null; closeSheet(); };

    const go = $('#rq_go');
    go.onclick = async () => {
      collecte();
      if((q.title || '').trim().length < 3) return toast('Il faut un titre');
      const decoupe = v => (v || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 40);
      let url = (q.url || '').trim();
      if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;

      go.disabled = true; go.textContent = 'Publication…';
      const r = await postNew('recipe', {
        title: q.title.trim(), pers: q.pers, ing: q.ing.map(l => [l[0], l[1]]),
        autres: decoupe(q.autres), prep: decoupe(q.prep), url: url || null});
      if(!r.ok){ go.disabled = false; go.textContent = 'Publier'; return toast(r.msg); }

      S.rq = null; closeSheet();
      toast(r.amis ? `Recette publiée · visible de ${r.amis} ami${r.amis > 1 ? 's' : ''}`
                   : 'Recette publiée dans Actu');
      S.fv = 'actu';
      frPosts();
    };
  };
  peint();
}

/* Reprendre la recette d'un ami dans ses propres plats types. Un plat type vaut
   pour une portion : les quantités sont donc ramenées à une personne. Aucun
   rapprochement à faire, les ingrédients pointent déjà vers la base. */
function recSave(id){
  const x = (S.posts || []).find(y => y.id === id);
  if(!x) return;
  const b = x.body || {};
  if(!recStruct(b))
    return toast('Recette en texte libre, antérieure aux ingrédients mesurés : rien à convertir');

  const pers = recPers(b);
  const lignes = b.ing.filter(l => F.get(l[0])).map(([s, g]) => [s, Math.max(1, Math.round(g / pers))]);
  if(!lignes.length) return toast('Aucun ingrédient exploitable');
  const autres = recAutres(b);
  const nomDef = (b.title || 'Recette').slice(0, 60);

  openSheet(`
    <div class="unit">Enregistrer en plat type</div>
    <h3 style="margin:2px 0 4px">${esc(nomDef)}</h3>
    <div class="small mute">Recalculé pour une personne, depuis une recette pour ${pers}.</div>
    <div class="hr"></div>
    ${lignes.map(l => `<div class="draft-line">
        <span class="nm">${esc(F.get(l[0]).n)}</span>
        <span class="q">${l[1]} g</span>
        <span class="kg">${n2(kgOf([l]))}</span>
      </div>`).join('')}
    <div class="total">
      <div><div class="unit">Une portion</div>
        <div class="small mute">${lignes.length} ingrédient${lignes.length>1?'s':''}</div></div>
      <div class="v">${n2(kgOf(lignes))}<span style="font-size:14px"> kg</span></div>
    </div>
    ${autres.length ? `<div class="src" style="margin-top:10px">Non repris, faute d’exister dans la base :
      ${autres.map(a => esc(a)).join(' · ')}.</div>` : ''}
    <input class="search" id="rs_n" style="margin-top:12px" maxlength="70" value="${esc(nomDef)}">
    <div class="actions">
      <button class="btn btn-1" id="rs_ok">Ajouter à mes plats types</button>
      <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
    </div>
    <div class="src" style="margin-top:8px">Le plat rejoindra vos favoris, en tête de la liste des plats
      types. C’est une reconstitution de la recette d’un ami, pas une mesure de ce que vous avez mangé.</div>`);

  $('#rs_ok').onclick = () => {
    const nom = ($('#rs_n').value || nomDef).trim().slice(0, 70) || nomDef;

}

async function frSocial(){
  if(!SESS || !SB.ready()) return;
  const [l, c] = await Promise.all([
    SB.rest('post_likes?select=post,member&limit=2000'),
    SB.rest('post_comments?select=id,post,author,body,created_at,' +
            'aut:profiles!post_comments_author_fkey(username)&order=created_at.asc&limit=500')
  ]);

  const absent = r => /PGRST205|schema cache|does not exist/i.test(JSON.stringify(r.body || {}));
  if(!l.ok && absent(l)){
    /* Le dire une fois, pas à chaque sondage de 90 secondes. */
    if(!S.socialWarn){ S.socialWarn = true;
      toast('Likes et commentaires indisponibles : feed_social.sql n’est pas passé'); }
    return;
  }
  const gl = {}, gc = {};
  if(l.ok) (l.body || []).forEach(x => (gl[x.post] = gl[x.post] || []).push(x.member));

  if(c.ok) S.pcom  = gc;
}

const likeList = id => S.plike[id] || [];
const comList  = id => S.pcom[id]  || [];

/* Le cœur doit répondre au doigt, pas au réseau : on bascule l'affichage tout
   de suite et on recale sur le serveur seulement s'il refuse. */
async function postLike(id, apres){
  if(!SESS) return toast('Il faut un compte');
  const liste = likeList(id), mien = liste.includes(SESS.uid);
  S.plike[id] = mien ? liste.filter(x => x !== SESS.uid) : [...liste, SESS.uid];
  if(S.tab === 'feed') renderFeed();
  if(apres) apres();

  const r = mien
    ? await SB.rest(`post_likes?post=eq.${encodeURIComponent(id)}&member=eq.${encodeURIComponent(SESS.uid)}`,
        {method:'DELETE'})
    : await SB.rest('post_likes', {method:'POST', headers:{Prefer:'return=minimal'},
        body: JSON.stringify({post:id, member:SESS.uid})});

  if(!r.ok){
    const brut = JSON.stringify(r.body || {});
    console.warn('like ·', r.status, brut);
    toast(/PGRST205|does not exist/i.test(brut)
      ? 'Likes indisponibles : feed_social.sql n’est pas passé'
      : 'Ce like n’a pas pu être enregistré');
    await frSocial();
    if(S.tab === 'feed') renderFeed();
    if(apres) apres();
  }
}

/* Retrouver un pseudo à partir d'un identifiant. Les likes ne rapportent que
   l'uid : le nom est cherché dans tout ce que l'app a déjà chargé — amitiés,
   publications, commentaires, participants de défis. Faute de mieux, on reste
   vague plutôt que de mentir. */
function nomDe(uid){
  if(!uid) return 'Quelqu’un';
  if(SESS && uid === SESS.uid) return 'Vous';
  for(const x of (S.fr.friends || [])){
    if(x.requester === uid && x.dem && x.dem.username) return x.dem.username;
    if(x.addressee === uid && x.dst && x.dst.username) return x.dst.username;
  }
  const p = (S.posts || []).find(z => z.author === uid);
  if(p && p.aut && p.aut.username) return p.aut.username;
  for(const liste of Object.values(S.pcom || {})){
    const c = (liste || []).find(z => z.author === uid);
    if(c && c.aut && c.aut.username) return c.aut.username;
  }
  for(const ch of (S.chal || [])){
    const q = (ch.parts || []).find(z => z.member === uid);
    if(q && q.who && q.who.username) return q.who.username;
  }
  return 'Un ami';
}

/* Comparaison de deux relevés, avec la même règle partout : le premier passage
   pose le repère sans rien annoncer — sinon l'app notifierait tout l'historique
   le jour de l'installation — et le repère est écrit avant l'envoi, pour ne
   jamais signaler deux fois la même chose. */
function neuf(cles, repere){
  const avant = S.notif[repere];
  S.notif[repere] = cles; save();
  if(!avant) return [];
  const vus = new Set(avant);
  return cles.filter(k => !vus.has(k));
}

/* « X a aimé votre publication ». post_likes ne porte pas d'horodatage
   exploitable ici : on compare des couples publication-personne, ce qui a
   l'avantage de capter aussi un like retiré puis remis. Limité à mes propres
   publications — un like sur le partage d'un tiers ne me concerne pas. */
function alerteLikes(){
  if(!SESS || !S.posts) return;
  /* Les publications et les amitiés se chargent en parallèle : sans la seconde,
     on ne saurait pas nommer qui a aimé et l'on annoncerait « un ami ». Mieux
     vaut attendre le tour suivant. Le repère n'est pas posé, rien n'est perdu.
     Au tout premier chargement on passe outre : il n'y a rien à annoncer, et
     poser le repère tout de suite évite d'annoncer l'historique. */
  if(S.notif.vuLikes && S.fr.state !== 'ok') return;
  const miens = S.posts.filter(p => p.author === SESS.uid).map(p => p.id);
  if(!miens.length) return;
  const cles = [];
  miens.forEach(id => likeList(id).forEach(m => { if(m !== SESS.uid) cles.push(id + '|' + m); }));
  const neufs = neuf(cles, 'vuLikes');
  if(!neufs.length) return;
  const qui = nomDe(neufs[0].split('|')[1]);
  notifMontre(
    neufs.length > 1 ? `${neufs.length} nouveaux j’aime` : `${qui} a aimé votre publication`,
    neufs.length > 1 ? 'Sur vos partages, dans le feed.' : 'Sur votre partage, dans le feed.',
    'like', 'actu');
}

/* « X vous a demandé en ami ». Appelé depuis frLoad, la seule fonction qui
   sache qui a demandé quoi. */
function alerteAmis(){
  if(!SESS) return;
  const recues = S.fr.in || [];
  const neufs = neuf(recues.map(x => x.requester), 'vuAmis')
    .map(id => recues.find(x => x.requester === id)).filter(Boolean);
  if(!neufs.length) return;
  const qui = (neufs[0].dem || {}).username || nomDe(neufs[0].requester);
  notifMontre(
    neufs.length > 1 ? `${neufs.length} demandes d’amis` : `${qui} vous a demandé en ami`,
    'À accepter ou à refuser dans Amis.',
    'amis', 'amis');
}

/* « X vous a invité à rejoindre un défi ». Seules les invitations en attente
   sur un défi non terminé comptent : une invitation à un défi clos n'a plus
   rien à proposer. */
function alerteDefis(){
  if(!SESS) return;
  const t0 = today();
  const invites = (S.chal || []).filter(ch => ch.ends >= t0 &&
    (ch.parts.find(x => x.member === SESS.uid) || {}).status === 'invited');
  const neufs = neuf(invites.map(ch => ch.id), 'vuDefis')
    .map(id => invites.find(ch => ch.id === id)).filter(Boolean);
  if(!neufs.length) return;
  const ch = neufs[0];
  const qui = (ch.aut || {}).username || nomDe(ch.created_by);
  notifMontre(
    neufs.length > 1 ? `${neufs.length} invitations à des défis`
                     : `${qui} vous a invité à rejoindre un défi`,
    neufs.length > 1 ? 'À rejoindre ou à décliner dans Défis.'
                     : '🏁 ' + (ch.label || (CHAL[ch.kind] || {}).l || 'Un défi'),
    'defis', 'defis');
}

/* Nouveauté d'un ami. La comparaison porte sur l'horodatage le plus récent des
   publications qui ne sont pas les miennes ; au tout premier chargement on
   pose simplement le repère, sans rien annoncer — sinon l'app notifierait
   l'historique entier à l'installation. */
function postsAlerte(){
  if(!S.posts || !S.posts.length) return;
  const eux = S.posts.filter(x => x.author !== SESS.uid);
  if(!eux.length) return;
  const dernier = eux[0].created_at;
  const vu = S.notif.lastPost;
  S.notif.lastPost = dernier;
  /* Premier chargement : on part de zéro non-lu plutôt que d'annoncer
     l'historique entier sur l'icône le jour de l'installation. */
  if(S.notif.luPost == null) S.notif.luPost = dernier;
  save();
  badgeSync();
  if(!vu || dernier <= vu) return;
  const neufs = eux.filter(x => x.created_at > vu);
  if(!neufs.length) return;
  const un = neufs[0], b = un.body || {};
  const qui = (un.aut || {}).username || nomDe(un.author);
  const badge = un.kind !== 'recipe';
  notifMontre(
    neufs.length > 1 ? `${neufs.length} nouvelles publications`
      : badge ? `${qui} a partagé un nouveau badge`
              : `${qui} a partagé une idée de recette`,
    neufs.length > 1 ? 'Sur le feed de Carbon FOODprint'
      : badge ? (b.emoji || '🏅') + ' ' + (b.label || 'Un badge')
              : '🍲 ' + (b.title || 'Une idée de recette'),
    'feed', 'actu');
}

:root{

  /* --forest est une couleur de marque : elle sert de FOND, et à ce titre elle
     ne doit pas changer d'un thème à l'autre. Le problème, c'est qu'elle
     servait aussi de couleur de TEXTE à une trentaine d'endroits. En thème
     sombre, #0E4D45 sur une carte #1D2523 donne un contraste de 1,3:1 : le mot
     est là, on ne le lit pas. Sur une carte sélectionnée (#223324) il disparaît
     tout à fait.
     D'où --accent : le même vert en thème clair, un vert lisible en sombre. Le
     fond garde --forest, le texte prend --accent. */

:root[data-theme="dark"]{
  --ink:#E7ECE8; --ink-soft:#AEBCB4; --mute:#7E8F86;
  --paper:#141A18; --card:#1D2523; --line:#313B37; --line-soft:#28312E;
  --field:#232C29; --track:#2C3733; --seg-bg:#262F2C; --active:#232C29;
  --on-forest:#EAF1EC; --on-forest-soft:#C4D4CB; --on-forest-mute:#8FA79B;
  --topbar:#0B3B35; --on-topbar:#EAF1EC; --on-topbar-strong:#fff; --on-topbar-mute:#7FA398;
  --note-bg:#2E2A16; --note-line:#524A26; --note-ink:#D8C88A; --note-line-2:#4A4322;
  --accent:#6FC2A6;
  --kpi-good:#223324;
  --shell:#0A0E0D;
  --tabbar:rgba(20,26,24,.92);
  --card-2-bg:#0B3B35; --card-2-on:#EAF1EC;
  --sheet-scrim:rgba(0,0,0,.58);
  --shadow:0 12px 28px rgba(0,0,0,.5);
  --toast-bg:#2A3532;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--shell); font-family:var(--sans); color:var(--ink);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  /* Supprime le zoom au double-tap et le délai de 300 ms qui l'accompagne,
     sans toucher au pincement : quelqu'un qui a besoin d'agrandir le texte
     peut toujours le faire. */
  touch-action:manipulation;
}
.phone{
  max-width:430px; margin:0 auto; min-height:100vh; background:var(--paper);
  position:relative; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 30px 80px rgba(0,0,0,.45);
}
@media(min-width:900px){
  body{padding:26px 0}
  .phone{min-height:calc(100vh - 52px); border-radius:34px; overflow:hidden}
  .tabbar{bottom:calc(36px + env(safe-area-inset-bottom))}
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 16 px minimum sur tout champ de saisie. En dessous, iOS agrandit la page de
   lui-même à la mise au point du champ, puis ne la remet pas d'aplomb : c'est
   le zoom involontaire le plus fréquent, et il ne se corrige que par la taille
   de police. Rien à voir avec un réglage de viewport. */
input,select,textarea{font-family:inherit; font-size:16px; color:inherit}
:focus-visible{outline:2px solid var(--forest); outline-offset:2px; border-radius:4px}

/* ---------------- topbar ---------------- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--topbar); color:var(--on-topbar);
  padding:12px 18px 11px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{display:flex; align-items:center; gap:7px; min-width:0}
/* Marque de l'app dans le bandeau, entre la pastille de profil et le mot. Même
   masque alpha que la grande version : un seul fichier, qui prend ici la teinte
   paille du « FOOD » du mot juste à côté. Décoratif — d'où aria-hidden et
   l'absence de zone tactile : la pastille reste le seul bouton de ce coin. */
/* Marque de l’app dans le bandeau, entre la pastille de profil et le mot.
   Même traitement que le grand logo de la page saisie : le dessin est blanc sur
   transparent, on le sert donc en masque alpha et non en image. Il n’y a ainsi
   aucun fond — la marque prend la teinte paille du « FOOD » juste à côté et se
   pose directement sur le bandeau. Rapport 142⁄192 du fichier respecté.
   Décoratif, d’où aria-hidden et l’absence de zone tactile : la pastille reste
   le seul bouton de ce coin. Intégré en base64 comme tous les visuels de marque,
   pour ne plus dépendre d’un fichier voisin. */
.brandmark{flex:0 0 auto; width:19px; height:26px; background-color:var(--straw);
  -webkit-mask:var(--m-mark) center/contain no-repeat;
  mask:var(--m-mark) center/contain no-repeat}
.wordmark{display:flex; flex-direction:column; font-family:var(--display); font-weight:800;
  font-size:18px; letter-spacing:-.005em; line-height:1.1; white-space:nowrap}
/* Mascotte. Servie en masque alpha plutôt qu'en image : le dessin étant
   monochrome, tes deux versions ne diffèrent que par la couleur de l'encre et
   du fond. Un seul fichier prend donc la teinte de la surface où il se pose,
   sans jamais laisser voir un rectangle de fond. */

/* Logo complet, posé sur le fond de page : encre verte en thème clair,
   crème en thème sombre. Illisible sous 90 px de large, d'où cette taille. */
/* ---------------- réglette des deux seuils ----------------
   Le cadran dit où l'on en est, la réglette dit par rapport à quoi. Les deux
   repères y sont nommés et chiffrés, ce que des encoches sur un anneau ne
   peuvent pas faire. Un libellé au-dessus, l'autre en dessous : ils ne se
   chevauchent jamais, même quand budget et objectif sont proches. */
.rgl{margin:6px 0 2px}
.rgl .lbl{position:relative; height:15px; font-family:var(--mono); font-size:9px;
  letter-spacing:.04em; color:var(--mute)}
.rgl .lbl b{position:absolute; transform:translateX(-50%); white-space:nowrap; font-weight:400}
.rgl .bar{position:relative; height:12px; border-radius:6px; background:var(--track); overflow:hidden}
.rgl .bar i{position:absolute; inset:0 auto 0 0; border-radius:6px}
.rgl .mk{position:absolute; top:-3px; bottom:-3px; width:2.5px; border-radius:2px; transform:translateX(-50%)}
.rgl .wrap{position:relative}
.rgl .rgll{display:flex; flex-wrap:wrap; gap:4px 13px; margin-top:9px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:var(--mute)}
.rgl .rgll span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.rgl .rgll i{width:2.5px; height:11px; border-radius:2px; flex:0 0 auto}
.rgl .rgll b{font-family:var(--display); font-weight:800; font-size:12px; color:var(--ink);
  font-variant-numeric:tabular-nums}
.rgl .cap{font-family:var(--mono); font-size:9px; color:var(--mute); margin-top:6px; line-height:1.4}

/* ---------------- deux cadrans, jour et semaine ---------------- */
.duo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px}
.dcell{aspect-ratio:1; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  padding:10px 8px; text-align:center; font-family:inherit; color:var(--ink); cursor:pointer}
.dcell:active{background:var(--active)}
.dcell .dt{font-family:var(--display); font-weight:800; font-size:15px;
  letter-spacing:-.005em; text-transform:none; color:var(--ink); margin-bottom:2px}
.dcell .dc{font-family:var(--mono); font-size:8.5px; color:var(--mute); line-height:1.35}
.dnt{width:90px; height:90px; display:block; flex:0 0 auto}
.dnt .dv{font-family:var(--display); font-weight:800; font-size:20px; font-variant-numeric:tabular-nums;
  text-anchor:middle}
.dnt .du{font-family:var(--mono); font-size:6.5px; fill:var(--mute); text-anchor:middle;
  letter-spacing:.06em}
.wdots{display:flex; gap:3px; align-items:center}
.wdots i{width:6px; height:6px; border-radius:50%; background:var(--line); flex:0 0 auto}
.wdots i.on{background:var(--forest)}
/* trois états, et la distinction compte : un jour manqué est un jour qui a
   émis sans être compté, un jour à venir n'est rien du tout */
.wdots i.miss{background:transparent; box-shadow:inset 0 0 0 1.6px var(--brick)}
.wdots i.soon{background:var(--line-soft)}
.wdots i.tdy{outline:1.5px solid var(--straw); outline-offset:1px}

/* ---------------- fête néon d'un défi en cours ----------------
   Seul endroit de l'app à sortir de la charte : un défi qui court doit se voir
   au premier coup d'œil, avant le reste du feed. Palette autonome, indépendante
   du thème clair ou sombre. */
.neon{position:relative; border-radius:16px; padding:13px 14px 12px; margin:2px 0 14px;
  background:linear-gradient(158deg,#08201B 0%,#10362B 55%,#0B2620 100%);
  border:1.5px solid #2BE0A8; overflow:hidden;
  box-shadow:0 0 0 1px rgba(43,224,168,.22), 0 0 20px rgba(43,224,168,.30),
             inset 0 0 26px rgba(43,224,168,.10);
  animation:neonpulse 3.4s ease-in-out infinite}
@keyframes neonpulse{
  0%,100%{box-shadow:0 0 0 1px rgba(43,224,168,.22), 0 0 16px rgba(43,224,168,.24), inset 0 0 22px rgba(43,224,168,.08)}
  50%    {box-shadow:0 0 0 1px rgba(43,224,168,.34), 0 0 30px rgba(43,224,168,.44), inset 0 0 30px rgba(43,224,168,.15)}
}
@media (prefers-reduced-motion:reduce){ .neon{animation:none} }
.neon .tt{font-family:var(--mono); font-size:8.5px; letter-spacing:.18em; text-transform:uppercase;
  color:#2BE0A8; text-shadow:0 0 9px rgba(43,224,168,.85)}
.neon .nh{font-family:var(--display); font-weight:800; font-size:20px; color:#EAFFF7;
  margin:3px 0 1px; line-height:1.15; letter-spacing:-.01em}
.neon .sub{font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; color:#79D3B8}
.neon .foot{font-family:var(--mono); font-size:8.5px; color:#69C4AA; margin-top:10px; line-height:1.45}
.neon .glow{position:absolute; width:130px; height:130px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,rgba(43,224,168,.30),rgba(43,224,168,0) 70%); top:-56px; right:-34px}

/* échelle du classement : un barreau par participant */
.lad{margin-top:11px; display:flex; flex-direction:column; gap:6px}
.lad .rung{display:flex; align-items:center; gap:8px}
.lad .pos{width:17px; text-align:center; font-family:var(--mono); font-size:10.5px; color:#2BE0A8}
.lad .who{flex:0 0 72px; font-size:12px; color:#DFF7EE; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lad .tr{flex:1; height:9px; border-radius:5px; background:rgba(255,255,255,.09); overflow:hidden}
.lad .tr i{display:block; height:100%; border-radius:5px;
  background:linear-gradient(90deg,#1FBF8D,#8CF5CE); box-shadow:0 0 9px rgba(43,224,168,.65)}
.lad .val{font-family:var(--mono); font-size:9.5px; color:#A8E9D3; min-width:46px; text-align:right}
.lad .rung.me .who{color:#FFE98A; font-weight:600}
.lad .rung.me .tr i{background:linear-gradient(90deg,#E8B93A,#FFF0A8); box-shadow:0 0 10px rgba(255,216,77,.7)}
.lad .rung.wait .who,.lad .rung.wait .val{color:#5E9C89}
.lad .rung.wait .tr i{background:rgba(255,255,255,.14); box-shadow:none}

/* champ poids de l'étape protéines */
.qpoids{display:flex; align-items:center; justify-content:space-between; gap:12px;
  border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin:2px 0 12px}
.qpoids label{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mute)}
.qpoids span{font-family:var(--mono); font-size:13px; color:var(--mute); white-space:nowrap}
.qpoids input{width:62px; border:0; border-bottom:1.5px solid var(--forest); background:none;
  font-family:var(--mono); font-size:17px; color:var(--ink); text-align:right; padding:1px 4px;
  -moz-appearance:textfield}
.qpoids input::-webkit-outer-spin-button,.qpoids input::-webkit-inner-spin-button{
  -webkit-appearance:none; margin:0}

/* ---------------- macros ---------------- */
.nutri{display:grid; grid-template-columns:repeat(5,1fr); gap:5px}
.nutri .nc{border:1px solid var(--line); border-radius:8px; padding:7px 4px 6px; text-align:center;
  background:var(--card-bg, transparent); min-width:0}
.nutri .nc b{display:block; font-family:var(--mono); font-size:14px; line-height:1.15;
  font-variant-numeric:tabular-nums; color:var(--ink)}
.nutri .nc span{display:block; font-family:var(--mono); font-size:8px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--mute); margin-top:3px; overflow:hidden; text-overflow:ellipsis}
.nutri .nc i{font-style:normal; opacity:.7}
/* ---------------- prise en main ----------------
   Cinq fiches au premier lancement, puis une page Aide consultable à tout
   moment depuis le profil. Tout est bâti sur les variables de la charte —
   Baloo 2 pour les titres, encre forêt, paille pour l'accent — plutôt que sur
   une palette parallèle : le tutoriel doit ressembler à l'app, pas à un encart
   collé dessus.

   L'ouverture vient du bas comme les autres fenêtres montantes, et le scrim
   reprend celui des feuilles. Sur écran large, la fiche se centre. */
#pm{position:fixed; inset:0; z-index:75; display:none; align-items:flex-end;
  justify-content:center; background:var(--sheet-scrim); backdrop-filter:blur(3px)}
#pm.on{display:flex}
@media(min-width:640px){ #pm{align-items:center; padding:24px} }
#pm .pmcard{background:var(--card); color:var(--ink); width:100%; max-width:420px;
  border-radius:var(--r) var(--r) 0 0; border:1px solid var(--line); border-bottom:0;
  box-shadow:var(--shadow); padding:20px 18px calc(16px + env(safe-area-inset-bottom));
  animation:pmrise .28s cubic-bezier(.2,.8,.2,1); max-height:92vh; overflow-y:auto}
@media(min-width:640px){ #pm .pmcard{border-radius:var(--r); border-bottom:1px solid var(--line)} }
@keyframes pmrise{from{transform:translateY(26px); opacity:0} to{transform:none; opacity:1}}
@media(prefers-reduced-motion:reduce){ #pm .pmcard{animation:none} }
#pm .pmslide{display:none}
#pm .pmslide.on{display:block}
#pm .pmk{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--forest-2); margin-bottom:6px}
#pm h3{font-family:var(--display); font-weight:800; font-size:23px; line-height:1.15;
  letter-spacing:-.01em; margin:0 0 8px}
#pm p{font-size:14px; line-height:1.5; margin:0 0 9px; color:var(--ink)}
#pm .pmvis{background:var(--track); border-radius:11px; padding:14px; margin:12px 0 4px; text-align:center}
#pm .pmvis b{display:block; font-family:var(--display); font-weight:800; font-size:34px;
  line-height:1; color:var(--accent)}
:root[data-theme="dark"] #pm .pmvis b{color:var(--straw)}
#pm .pmvis span{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-soft); display:block; margin-top:6px}
#pm ul{margin:8px 0 0; padding-left:17px}
#pm li{font-size:14px; line-height:1.45; margin-bottom:5px}
#pm .pmact{display:flex; gap:9px; align-items:center; margin-top:16px}
#pm .pmskip{flex:0 0 auto; background:none; border:0; color:var(--mute); font-size:13px;
  padding:11px 4px; font-family:inherit; cursor:pointer}

/* Page Aide : accordéon, un volet ouvert à la fois. */
.pmacc{border-top:1px solid var(--line-soft)}
.pmacc .it{border-bottom:1px solid var(--line-soft)}
.pmacc .hd{width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font-family:var(--display); font-weight:800; font-size:15px; color:var(--ink);
  padding:13px 24px 13px 0; position:relative; line-height:1.25}
.pmacc .hd::after{content:'+'; position:absolute; right:2px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:15px; color:var(--mute)}
.pmacc .it.on .hd::after{content:'\2212'}
.pmacc .bd{display:none; font-size:13.5px; line-height:1.55; color:var(--ink-soft);
  padding:0 2px 14px}
.pmacc .it.on .bd{display:block}

/* Calendrier de retour de saison, douze cases sous la ligne touchée. */
.asplit button.row{width:100%; text-align:left; background:none; border:0; font-family:inherit;
  cursor:pointer; padding:0; color:inherit; -webkit-tap-highlight-color:transparent}
.asplit button.row:active{opacity:.6}
.asplit .nm .ar{float:right; font-family:var(--mono); font-size:13px; color:var(--mute);
  margin-left:8px}
.cal12{margin:-2px 0 12px; padding:10px 11px; background:var(--track); border-radius:9px}
.cal12 .row12{display:grid; grid-template-columns:repeat(12,1fr); gap:3px}
.cal12 .row12 i{font-style:normal; font-family:var(--mono); font-size:9.5px; text-align:center;
  padding:5px 0; border-radius:4px; background:var(--card); color:var(--mute)}
.cal12 .row12 i.on{background:var(--forest); color:#fff; font-weight:600}
.cal12 .row12 i.imp{background:var(--card); color:var(--mute); opacity:.4;
  text-decoration:line-through}
.cal12 .mot{font-family:var(--mono); font-size:9.5px; line-height:1.5; color:var(--ink-soft);
  margin-top:8px}

/* Cadran de saisonnalité. Un anneau plutôt qu'une barre : le chiffre est une
   part d'un tout, pas une progression vers un seuil. */
.saisdial{position:relative; width:170px; margin:18px auto 10px}
.saisdial svg{display:block; width:100%; height:auto}
.saisdial .ctr{position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center}
.saisdial .ctr b{font-family:var(--display); font-weight:800; font-size:36px; line-height:1;
  letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.saisdial .ctr span{font-family:var(--mono); font-size:9px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--mute); margin-top:4px}
.seg button.on{background:var(--card); color:var(--ink); font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ---------------- zone d'import (outil d'auteur) ---------------- */
.impin,.impout{width:100%; font-family:var(--mono); font-size:12px; line-height:1.5;
  padding:11px; border:1px solid var(--line); border-radius:10px; background:var(--field);
  color:var(--ink); resize:vertical; -webkit-appearance:none}
.impout{background:var(--track); font-size:10.5px}
.improw{display:grid; grid-template-columns:1fr 84px; gap:8px; align-items:start;
  padding:8px 0; border-bottom:1px solid var(--line-soft)}
.improw.imphead{font-family:var(--mono); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--mute); border-bottom:1px solid var(--line)}
.improw .impt{font-size:12.5px; min-width:0; line-height:1.35}
.improw .impt select{width:100%; margin-top:4px; font-family:var(--sans); font-size:11.5px;
  padding:5px 6px; border:1px solid var(--line); border-radius:7px; background:var(--card);
  color:var(--ink); max-width:100%}
.improw .impg{font-family:var(--display); font-weight:800; font-size:15px; text-align:right;
  font-variant-numeric:tabular-nums}
.improw .impg i{display:block; font-style:normal; font-family:var(--mono); font-weight:400;
  font-size:9.5px; color:var(--mute); margin-top:2px}
.improw .impg input{width:56px; text-align:right; font-family:var(--mono); font-size:12px;
  padding:3px 5px; border:1px solid var(--brick); border-radius:6px;
  background:var(--field); color:var(--ink)}
.improw.douteux{background:color-mix(in srgb, var(--s4) 10%, transparent)}
.improw.absent{background:color-mix(in srgb, var(--brick) 10%, transparent)}
.improw.ign{opacity:.45}
.impkpi{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 10px}
.impkpi div{background:var(--track); border-radius:10px; padding:10px 8px; text-align:center}
.impkpi b{display:block; font-family:var(--display); font-weight:800; font-size:20px;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.impkpi span{font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mute)}

/* Barre « Chercher une autre boisson ». Dessinée comme un champ de recherche —
   loupe, fond de champ, texte en gris — parce que c'est ce qu'elle ouvre. Ce
   n'est pas un input : rien à saisir avant le dépliage, et un vrai champ ferait
   monter le clavier pour rien. */
.drinkq{display:flex; align-items:center; gap:9px; width:100%; margin-top:10px;
  padding:12px 13px; border:1px solid var(--line); border-radius:11px;
  background:var(--field); color:var(--mute); font-family:inherit; font-size:14px;
  text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent}
.drinkq svg{flex:0 0 auto; width:16px; height:16px; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round}
.drinkq span{flex:1; min-width:0}
.drinkq i{flex:0 0 auto; font-style:normal; font-family:var(--mono); font-size:14px}
.drinkq:active{opacity:.65}
.drinkq.on{border-color:var(--forest); color:var(--ink); background:var(--active)}
@media (max-width:340px){ .nutri{grid-template-columns:repeat(3,1fr)} }
/* Vignettes de macros rendues cliquables dans la fiche repas : elles ouvrent la
   décomposition par aliment de l'axe touché. */
.nutri button.nc{width:100%; font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.nutri button.nc:active{opacity:.6}
.nutri button.nc[aria-pressed="true"]{border-color:var(--forest); background:var(--active)}
.nutri button.nc .ar{display:block; font-family:var(--mono); font-size:9px; color:var(--mute);
  margin-top:2px; text-transform:none; letter-spacing:0}
.nutri button.nc[aria-pressed="true"] .ar{color:var(--accent)}

/* ---------------- cartes calories / protéines ----------------
   Le chiffre passe au premier plan, la jauge par repas derrière lui. La barre
   n'est plus un objet à lire mais un fond qui dit d'un coup d'œil où en est la
   journée : les segments gardent les couleurs de repas, à opacité réduite pour
   que le texte reste lisible dans les deux thèmes. La légende sous le bloc reste
   la cible de clic — un segment peut ne faire que deux pixels de large. */
.axeb{position:relative; overflow:hidden}
.axeb .hero{position:relative; margin:-16px -16px 0; padding:17px 16px 15px; overflow:hidden}
.axeb .hero .bg{position:absolute; inset:0; display:flex; z-index:0; background:var(--track)}
.axeb .hero .bg i{height:100%; opacity:.34}
.axeb .hero .tk{position:absolute; top:0; bottom:0; width:2px; background:var(--ink);
  opacity:.45; z-index:1}
.axeb .hero .tk::after{content:attr(data-label); position:absolute; bottom:4px; right:5px;
  font-family:var(--mono); font-size:9px; letter-spacing:.04em; color:var(--ink);
  opacity:.8; white-space:nowrap}
.axeb .hero .tk.tkr::after{right:auto; left:5px}
.axeb .hero .fg{position:relative; z-index:2}
.axeb .ttl{font-family:var(--display); font-weight:800; font-size:26px; line-height:1.05;
  letter-spacing:-.015em; color:var(--ink)}
.axeb .figs{font-family:var(--display); font-weight:800; font-size:52px; line-height:1;
  letter-spacing:-.03em; font-variant-numeric:tabular-nums; color:var(--ink); margin-top:2px}
.axeb .figs small{font-family:var(--mono); font-weight:400; font-size:13px; letter-spacing:.06em;
  color:var(--ink-soft)}
.axeb .sous{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-soft); margin-top:6px}
@media (max-width:340px){ .axeb .figs{font-size:42px} .axeb .ttl{font-size:22px} }

/* ---------------- décomposition par aliment ---------------- */
.asplit{margin-top:11px}
.asplit .row{display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin-bottom:9px}
.asplit .nm{font-size:13px; min-width:0; line-height:1.3}
.asplit .nm i{font-style:normal; font-family:var(--mono); font-size:10px; color:var(--mute); margin-left:5px}
.asplit .vv{font-family:var(--display); font-weight:800; font-size:14.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.asplit .tr{grid-column:1/-1; height:7px; background:var(--track); border-radius:2px; overflow:hidden}
.asplit .tr i{display:block; height:100%}

/* ---------------- célébration du jour tenu ---------------- */
#spin{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  pointer-events:none}
#spin.on{display:flex; animation:spinfade 2.1s ease forwards}
#spin .m{width:120px; height:162px; background-color:var(--forest);
  -webkit-mask:var(--m-mark) center/contain no-repeat;
  mask:var(--m-mark) center/contain no-repeat;
  animation:spinturn 2.1s cubic-bezier(.28,.9,.24,1) forwards}
:root[data-theme="dark"] #spin .m{background-color:var(--straw)}
/* La carotte est une image en couleurs, pas une silhouette : on remplace le
   masque par un fond, sinon elle ressortirait en vert uni comme le logo.
   Carrée, d'où la hauteur ramenée à la largeur. */
#spin[data-mark="carotte"] .m{width:132px; height:132px; background-color:transparent;
  -webkit-mask:none; mask:none;
  background:var(--b-carotte) center/contain no-repeat}
:root[data-theme="dark"] #spin[data-mark="carotte"] .m{background-color:transparent}
#spin .t{position:absolute; bottom:26%; font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent); text-align:center; padding:0 24px}
:root[data-theme="dark"] #spin .t{color:var(--straw)}
@keyframes spinturn{
  0%{transform:rotate(0deg) scale(.55); opacity:0}
  18%{transform:rotate(140deg) scale(1.06); opacity:1}
  70%{transform:rotate(690deg) scale(1); opacity:1}
  100%{transform:rotate(720deg) scale(.94); opacity:0}
}
@keyframes spinfade{
  0%{background:rgba(0,0,0,0)} 18%{background:rgba(0,0,0,.22)}
  70%{background:rgba(0,0,0,.22)} 100%{background:rgba(0,0,0,0)}
}
/* Respecte le réglage système : deux tours complets peuvent gêner. */
@media (prefers-reduced-motion:reduce){
  #spin .m{animation:none; opacity:1; transform:none}
  #spin.on{animation:spinfade 1.4s ease forwards}
}

/* Logo complet de l’accueil de la saisie : marque et nom sont dans le fichier.
   Servi en masque alpha et non en image, le dessin étant blanc sur transparent :
   il prend ainsi l’encre verte en thème clair et la crème en thème sombre, sans
   jamais laisser voir de rectangle. Rapport 640⁄364 respecté. */
.brandbig{width:158px; height:90px; margin:2px auto 16px; display:block;
  background-color:var(--forest);
  -webkit-mask:var(--m-wide) center/contain no-repeat;
  mask:var(--m-wide) center/contain no-repeat}
:root[data-theme="dark"] .brandbig{background-color:var(--on-topbar)}

/* pastille de profil : hexagone bordé, silhouette grisée par défaut.
   Point d'entrée du compte, et plus tard de l'avatar. */
.ava{background:none; border:0; padding:0; flex:0 0 auto; display:flex; align-items:center;
  width:32px; height:36px; cursor:pointer; -webkit-tap-highlight-color:transparent}
.ava svg{width:32px; height:36px; display:block; overflow:visible}
.ava .hex{fill:rgba(0,0,0,.18); stroke:var(--on-topbar-mute); stroke-width:5; vector-effect:non-scaling-stroke}
.ava .who{fill:var(--on-topbar-mute)}
.ava:active{transform:scale(.94)}
.ava[data-on="1"] .hex{stroke:var(--straw); stroke-width:6.5}
.ava[data-on="1"] .who{fill:var(--on-topbar-strong)}

/* ---------------- questionnaire de profil ---------------- */
/* Témoins d'avancement, en bas de la fenêtre. Des points et non des barres :
   une barre pleine largeur se lit comme une progression continue, alors qu'il
   s'agit d'un nombre fini de questions — et c'est ce nombre qu'on veut voir,
   pour savoir combien il en reste avant de commencer. */
.qdots{display:flex; justify-content:center; align-items:center; gap:7px; margin:18px 0 0;
  flex-wrap:wrap}
.qdots i{width:7px; height:7px; border-radius:50%; background:var(--line); flex:0 0 auto}
.qdots i.on{background:var(--forest-2)}
.qdots i.now{background:var(--straw); transform:scale(1.5)}
.qcount{font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--mute); text-align:center; margin-top:8px}

/* Option en gros : le libellé porte la question, le contexte se lit après. Les
   régimes ont des noms qu'on reconnaît d'un coup d'œil, la nuance qui les
   sépare tient dans la ligne du dessous. */
.qopt.big{align-items:flex-start; padding:14px}
.qopt.big .qn{font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.1}
.qopt.big .qs{font-family:var(--sans); font-size:12.5px; letter-spacing:0; text-transform:none;
  color:var(--ink-soft); line-height:1.4; margin-top:5px}
.qic{flex:0 0 auto; width:38px; height:38px; margin-right:2px}
.qic svg{width:100%; height:100%; fill:none; stroke:var(--accent); stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round}
.qopt[aria-pressed="true"] .qic svg{stroke:var(--forest-2)}
/* Réponse suggérée par les réponses déjà données. Un liseré et une étiquette,
   pas une présélection : suggérer n'est pas répondre à la place. */
.qopt.reco{border-color:var(--forest-2)}
.qtag{display:inline-block; margin-left:7px; padding:2px 6px; border-radius:5px;
  background:var(--kpi-good); color:var(--accent); font-family:var(--mono); font-size:9px;
  letter-spacing:.05em; text-transform:uppercase; vertical-align:middle}
/* Bloc de création de compte, première question du questionnaire. */
.qfield{margin-top:10px}
.qfield > label{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); margin-bottom:5px}
.qmini{display:flex; gap:6px; flex-wrap:wrap}
.qmini button{flex:1 1 0; min-width:74px; padding:10px 8px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); color:var(--ink-soft); font-size:13px}
.qmini button[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.qopt{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:12px 14px; margin-top:7px; font-size:14.5px; color:var(--ink);
  font-family:inherit; cursor:pointer}
.qopt:active{background:var(--active)}
.qopt[aria-pressed="true"]{border-color:var(--forest); background:var(--active)}
.qopt .qn{flex:1; min-width:0}
.qopt .qs{display:block; font-family:var(--mono); font-size:10px; color:var(--mute); margin-top:2px}
.qopt .qk{font-family:var(--mono); font-size:13px; color:var(--accent); opacity:0}
.qopt[aria-pressed="true"] .qk{opacity:1}
.qrange{width:100%; margin:16px 0 4px; -webkit-appearance:none; appearance:none;
  background:transparent; height:26px}
.qrange::-webkit-slider-runnable-track{height:4px; border-radius:2px; background:var(--line)}
.qrange::-moz-range-track{height:4px; border-radius:2px; background:var(--line)}
.qrange::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:22px; height:22px;
  border-radius:50%; background:var(--forest); border:3px solid var(--card); margin-top:-9px;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.qrange::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:var(--forest);
  border:3px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.25)}
.qends{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; color:var(--mute)}
.qbig{font-family:var(--display); font-weight:800; font-size:34px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; text-align:center;
  line-height:1.1; margin:6px 0 0}
.qbig small{font-family:var(--mono); font-size:12px; color:var(--mute)}
.wordmark em{font-style:normal; font-family:var(--display); font-weight:800; font-size:18px;
  letter-spacing:0; color:var(--straw)}
.wordmark .sp{letter-spacing:-.04em}
.today{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--on-topbar-mute); text-align:right}
.today b{display:block; font-family:var(--display); font-weight:800; font-size:17px; color:var(--on-topbar-strong); letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums}

main{flex:1; padding:16px 16px 104px}

/* ---------------- primitives ---------------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card + .card{margin-top:12px}
/* Titres de section et de bloc. Baloo 2 en 800 : la graisse fait le travail que
   faisaient la capitale et l'interlettrage, en restant lisible à 18 px. On garde
   un filet paille plutôt qu'un fond : il marque le début du bloc sans peser. */
h2.sec{
  font-family:var(--display); font-size:19px; font-weight:800; letter-spacing:-.005em;
  text-transform:none; color:var(--ink); margin:24px 0 10px; line-height:1.15;
  display:flex; align-items:center; gap:9px;
}
h2.sec::before{content:''; flex:0 0 auto; width:4px; height:.82em; border-radius:2px;
  background:var(--straw)}
h2.sec:first-child{margin-top:2px}
/* Titre porté par une carte (Carbone, Calories, Semaine du…). Même police, calibre
   réduit : il ne doit pas concurrencer le titre de section au-dessus de lui. */
.bt{font-family:var(--display); font-weight:800; font-size:17px; line-height:1.15;
  letter-spacing:-.005em; color:var(--ink)}
.lede{font-family:var(--serif); font-size:19px; line-height:1.3; margin:0 0 10px}
p{margin:0 0 9px}
.small{font-size:12.5px; color:var(--ink-soft)}
.mute{color:var(--mute)}
.num{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums}
.unit{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--mute)}
.src{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em}
.hr{height:1px; background:var(--line-soft); margin:13px 0}

/* ---------------- gauge : élément signature ---------------- */
.gauge{position:relative; height:22px; background:var(--track); border-radius:3px; overflow:hidden; display:flex}
.gauge .seg{height:100%}
.gauge .over-zone{position:absolute; top:0; bottom:0; z-index:2; opacity:.62;
  background:repeating-linear-gradient(118deg,var(--brick) 0 4px,rgba(163,46,43,0) 4px 9px)}
.gauge-wrap{position:relative}
.tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); z-index:3}
.tick::after{
  content:attr(data-label); position:absolute; top:-15px; right:4px;
  font-family:var(--mono); font-size:9px; letter-spacing:.05em; color:var(--ink); white-space:nowrap;
}
.gauge-legend{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
.gauge-legend span{font-family:var(--mono); font-size:10px; color:var(--ink-soft); display:flex; align-items:center; gap:5px}
/* La légende devient la cible de clic : un segment de jauge peut ne faire que
   deux pixels de large, on ne peut pas demander de le viser. */
.gauge-legend button{font-family:var(--mono); font-size:10px; color:var(--ink-soft);
  display:flex; align-items:center; gap:5px; background:none; border:0; padding:3px 0;
  cursor:pointer; -webkit-tap-highlight-color:transparent}
.gauge-legend button:active{opacity:.5}
.gauge-legend button .ar{opacity:.42; font-size:11px; margin-left:1px}
.gauge .seg[data-gm]{cursor:pointer}

/* ---------------- cases à cocher des marques ---------------- */
.chk{display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  background:none; border:0; padding:9px 0; cursor:pointer; -webkit-tap-highlight-color:transparent}
.chk:active{opacity:.6}
.chk .bx{flex:0 0 auto; width:20px; height:20px; margin-top:1px; border-radius:5px;
  border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:12px; line-height:1; color:transparent}
.chk[aria-checked="true"] .bx{background:var(--forest); border-color:var(--forest); color:#fff}
.chk .tx{min-width:0}
.chk .tx b{display:block; font-size:14px; font-weight:600}
.chk .tx span{display:block; font-family:var(--mono); font-size:10px; color:var(--mute);
  letter-spacing:.02em; margin-top:2px; line-height:1.5}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------------- « tout savoir » ---------------- */
.know{background:var(--forest); color:var(--on-forest); border:0}
.know .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.know .big{font-family:var(--display); font-weight:800; font-size:44px; line-height:1; margin:8px 0 2px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.know .big small{font-size:17px; color:var(--on-forest-mute)}
.know p{color:var(--on-forest-soft); font-size:13px}
.know .split{display:flex; gap:14px; margin-top:14px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.know .split div{flex:1}
.know .split .v{font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.know .split .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--on-forest-mute); line-height:1.4}
.contrib{margin-top:16px; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
.contrib .row{display:grid; grid-template-columns:1fr 42px; gap:8px; align-items:center; margin-bottom:9px}
.contrib .lab{font-size:13px}
.contrib .lab i{font-style:normal; color:var(--on-forest-mute); font-size:11.5px}
.contrib .pct{font-family:var(--display); font-weight:800; font-size:16px; text-align:right; font-variant-numeric:tabular-nums}
.contrib .bar{grid-column:1/-1; height:6px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; margin-top:-4px}
.contrib .bar i{display:block; height:100%; background:var(--straw)}
.know{position:relative}
.expand{position:absolute; top:13px; right:13px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff;
  font-family:var(--serif); font-size:17px; line-height:1; display:flex; align-items:center;
  justify-content:center; padding-bottom:2px}
.know .teaser{color:var(--on-forest-soft); font-size:13px; margin-bottom:0}
.know.open .teaser{margin-bottom:9px}
.know ul{padding-left:18px; margin:0}
.know li{font-size:12.5px; color:var(--on-forest-soft); margin-bottom:7px}
.reco{margin-top:12px}
.rhead{display:flex; align-items:center; gap:12px}
.reco .ri{width:38px; height:38px; border-radius:10px; background:var(--seg-bg); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center}
.reco .ri svg{width:19px; height:19px; stroke:var(--forest); fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.reco .rt{flex:1; min-width:0}
.reco .rn{display:block; font-size:14.5px}
.reco .rd{display:block; font-size:11.5px; color:var(--mute); line-height:1.35; margin-top:2px}
.rbtns{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:12px}
.rbtns a{display:flex; align-items:center; justify-content:center; gap:4px; padding:10px 4px;
  border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
  font-size:13px; text-decoration:none; white-space:nowrap}
.rbtns a:active{background:var(--forest); border-color:var(--forest); color:#fff}
.rbtns a span{font-family:var(--mono); font-size:11px; color:var(--accent)}
.rbtns a:active span{color:#fff}
.disclose{
  margin-top:14px; width:100%; text-align:left; border-top:1px solid rgba(255,255,255,.16); padding-top:11px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--straw);
}
.know .more{display:none; margin-top:11px}
.know.open .more{display:block}
.know .more li{font-size:12.5px; color:var(--on-forest-soft); margin-bottom:7px}
.know .more ul{padding-left:18px; margin:0}

/* ---------------- chips / segmented ---------------- */
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 11px; border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft); white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.seg{display:flex; background:var(--seg-bg); border-radius:10px; padding:3px; gap:3px}
.seg button{
  flex:1; padding:8px 4px; border-radius:8px; font-size:13px; color:var(--ink-soft);
  display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.15;
}
.seg button b{font-weight:600}
.seg button small{font-family:var(--mono); font-size:9px; color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"] small{color:var(--accent)}

/* ---------------- listes ---------------- */
.search{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field);
  font-size:16px; margin:2px 0 10px;
}
.list{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.item{
  display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:11px 13px; width:100%;
  text-align:left; border-bottom:1px solid var(--line-soft); align-items:center;
}
.item:last-child{border-bottom:0}
.item:active{background:var(--active)}
.item .nm{font-size:14.5px; line-height:1.25}
.tag{display:inline-block; font-family:var(--mono); font-size:8.5px; letter-spacing:.06em;
  text-transform:uppercase; background:var(--note-bg); color:var(--note-ink); border:1px solid var(--note-line);
  border-radius:3px; padding:0 4px; vertical-align:1px; margin-left:5px}
.note{background:var(--note-bg); border:1px solid var(--note-line); border-radius:10px; padding:11px 12px;
  font-size:12.5px; color:var(--note-ink); margin-top:12px}
.item .gp{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
.item .fe{font-family:var(--display); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums; text-align:right}
.item .fe small{font-family:var(--mono); font-size:9px; color:var(--mute); display:block; letter-spacing:.04em}
.item .track{grid-column:1/-1; height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:3px}
.item .track i{display:block;height:100%;background:var(--forest-2)}
.empty{padding:26px 16px; text-align:center; color:var(--mute); font-size:13px}
.count{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.06em; padding:9px 13px; background:var(--active); border-top:1px solid var(--line-soft)}

/* ---------------- mon frigo ----------------
   Le sac d'ingrédients est une liste de pastilles pleines, pas des chips de
   filtre : ce sont des choses qu'on a, pas des critères qu'on active. D'où la
   couleur pleine et la croix de retrait sur chacune. */
.fbag{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px}
.fbag .fchip{display:inline-flex; align-items:center; gap:7px; padding:6px 8px 6px 11px;
  border:1px solid var(--forest); background:var(--forest); color:#fff; border-radius:999px; font-size:12.5px}
.fbag .fchip i{font-style:normal; font-family:var(--mono); font-size:13px; line-height:1; opacity:.7}
.fsugg{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:0 0 12px}
.fsugg button{display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
  text-align:left; padding:10px 13px; border-bottom:1px solid var(--line-soft); font-size:13.5px}
.fsugg button:last-child{border-bottom:0}
.fsugg button:active{background:var(--active)}
.fsugg button span{font-family:var(--mono); font-size:9.5px; color:var(--mute); letter-spacing:.04em;
  white-space:nowrap; text-transform:uppercase}
.frow{display:grid; grid-template-columns:1fr auto; gap:3px 10px; padding:11px 13px; width:100%;
  text-align:left; border-bottom:1px solid var(--line-soft); align-items:start}
.frow:last-child{border-bottom:0}
.frow:active{background:var(--active)}
.frow .nm{font-size:14.5px; line-height:1.25}
.frow .fk{font-family:var(--display); font-weight:800; font-size:16px;
  font-variant-numeric:tabular-nums; text-align:right; line-height:1.1}
.frow .fk small{display:block; font-family:var(--mono); font-size:8.5px; color:var(--mute); letter-spacing:.04em}
.frow .fm{grid-column:1/-1; font-family:var(--mono); font-size:10px; color:var(--mute); line-height:1.55}
.frow .fm b{color:var(--accent); font-weight:400}

/* ---------------- saisie ---------------- */
.paths{display:flex; gap:6px; margin:10px 0 12px}
.paths button{
  flex:1; padding:9px 6px; border:1px solid var(--line); border-radius:10px; background:var(--card);
  font-size:12.5px; color:var(--ink-soft);
}
.paths button[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#fff}
.dish{padding:11px 13px; border-bottom:1px solid var(--line-soft)}
.dish:last-child{border-bottom:0}
.dish .top{display:flex; align-items:center; gap:10px}
.dish .nm{flex:1; font-size:14.5px}
.dish .kg{font-family:var(--display); font-weight:800; font-size:17px; font-variant-numeric:tabular-nums}
.dish .add{
  padding:6px 12px; border-radius:999px; background:var(--forest); color:#fff;
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
}
.dish .comp{font-family:var(--mono); font-size:10.5px; color:var(--mute); margin-top:5px; letter-spacing:.01em}
.dish .bar{height:4px; background:var(--track); border-radius:2px; overflow:hidden; margin-top:7px}
.dish .bar i{display:block;height:100%}
.pick{position:relative}
.pick input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field); font-size:16px}
/* Croix d'effacement. Sur mobile, vider un champ demandait une dizaine
   d'appuis sur la touche retour — un geste pour rien, répété tous les jours. */
/* barre d'actions d'une publication */
.pact{display:flex; align-items:center; gap:6px; padding:8px 9px 9px; border-top:1px solid var(--line-soft)}
.pa{display:flex; align-items:center; gap:6px; border:0; background:none; color:var(--mute);
  padding:6px 9px; border-radius:9px; font-size:13px}
.pa b{font-family:var(--mono); font-size:11.5px; font-weight:400}
.pa:active{background:var(--active)}
.pa.on{color:var(--brick)}
.pa.keep{margin-left:auto; color:var(--accent); font-weight:600; font-size:12.5px}

/* fil de commentaires */
.cmt{display:flex; gap:9px; padding:10px 2px; border-bottom:1px solid var(--line-soft)}
.cmt .av{width:26px; height:26px; border-radius:50%; background:var(--seg-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:11.5px; flex:0 0 auto}
.cmt .bd{min-width:0; flex:1}
.cmt .bd b{font-size:13px}
.cmt .bd i{font-style:normal; font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); margin-left:6px}
.cmt .bd p{margin:2px 0 0; font-size:14px; line-height:1.45; word-break:break-word}
.cmt .rm{color:var(--mute); font-family:var(--mono); font-size:15px; padding:0 3px; border:0; background:none}

/* composition d'une recette : une ligne par ingrédient */
.rqline{display:grid; grid-template-columns:1fr 68px auto auto; gap:8px; align-items:center;
  padding:8px 0; border-bottom:1px solid var(--line-soft)}
.rqline .nm{font-size:14px; line-height:1.25}
.rqline input{width:100%; padding:8px; border:1px solid var(--line); border-radius:9px;
  background:var(--field); text-align:right; font-size:15px}
.rqline .kg{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:15px}
.rqline .rm{color:var(--brick); font-family:var(--mono); font-size:16px; padding:0 3px; border:0; background:none}
.rqpers{display:flex; align-items:center; gap:9px; margin:2px 0 10px}
.rqpers input{width:64px; padding:9px; border:1px solid var(--line); border-radius:9px;
  background:var(--field); text-align:center; font-size:16px}

/* ---- publications du feed ---- */
.post{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card); margin-bottom:12px}
.post .ph{display:flex; align-items:center; gap:9px; padding:10px 12px}
.post .av{width:30px; height:30px; border-radius:50%; background:var(--seg-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex:0 0 auto}
.post .pw{min-width:0}
.post .pw b{display:block; font-size:13.5px; line-height:1.2}
.post .pw span{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--mute)}
.post .px{margin-left:auto; border:0; background:none; color:var(--mute); font-size:18px; line-height:1; padding:2px 4px}
.post .stage{display:flex; align-items:center; justify-content:center; padding:24px 16px 20px;
  background:var(--field); border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft)}
.post .stage svg{width:132px; height:132px}
.post .cap{padding:11px 13px 14px}
.post .cap h4{margin:0 0 4px; font-family:var(--display); font-weight:800; font-size:17px;
  letter-spacing:-.012em; line-height:1.2}
.post .cap p{margin:0; font-size:12.5px; line-height:1.45; color:var(--mute)}

/* carte recette : bandeau titré puis les repères, comme une fiche de cuisine */
.rcard{display:block; width:100%; text-align:left; border:0; background:none; padding:0}
.rcard .band{padding:17px 15px 15px; background:linear-gradient(135deg,var(--forest),var(--forest-2)); color:#fff}
.rcard .band .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.72}
.rcard .band h4{margin:6px 0 0; font-family:var(--display); font-weight:800; font-size:20px;
  line-height:1.15; letter-spacing:-.015em; color:#fff}
.rchips{display:flex; flex-wrap:wrap; gap:6px; padding:12px 13px 0}
.rchip{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:999px; padding:3px 9px; color:var(--mute)}
.rmore{padding:10px 13px 14px; font-size:12.5px; color:var(--accent); font-weight:600}

/* fiche recette à deux onglets */
.rtabs{display:flex; gap:3px; background:var(--seg-bg); border-radius:10px; padding:3px; margin:12px 0 14px}
.rtabs button{flex:1; border:0; background:none; border-radius:8px; padding:9px 6px; font-size:13px; color:var(--mute)}
.rtabs button[aria-pressed="true"]{background:var(--card); color:var(--ink); font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ring{list-style:none; padding:0; margin:0}
.ring li{display:flex; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line-soft); font-size:14px}
.ring li::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--forest-2);
  margin-top:6px; flex:0 0 auto}
.rstep{display:flex; gap:11px; padding:12px 2px; border-bottom:1px solid var(--line-soft)}
.rstep .no{width:24px; height:24px; border-radius:50%; background:var(--forest); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex:0 0 auto}
.rstep p{margin:0; font-size:14px; line-height:1.5}
a.lk{color:var(--accent); text-decoration:underline; text-underline-offset:2px; word-break:break-word}

.srchw{position:relative}
.srchw.mb{margin:2px 0 10px}
.srchw > .search{margin:0}
.srchw > input{padding-right:40px}
.srchx{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:25px; height:25px; padding:0; border:0; border-radius:50%;
  background:var(--seg-bg); color:var(--mute);
  font-family:var(--mono); font-size:14px; line-height:1;
  display:none; align-items:center; justify-content:center;
}
.srchw.on > .srchx{display:flex}
.srchx:active{background:var(--active); color:var(--ink)}
.sugg{position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:25; background:var(--card);
  border:1px solid var(--line); border-radius:11px; overflow:hidden auto; max-height:264px;
  box-shadow:var(--shadow)}
.sugg button{display:grid; grid-template-columns:1fr auto; gap:10px; width:100%; text-align:left;
  padding:9px 12px; border-bottom:1px solid var(--line-soft); align-items:center}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus-visible{background:var(--active)}
.sugg .nm{font-size:14px; line-height:1.2}
.sugg i{font-style:normal; display:block; font-family:var(--mono); font-size:9px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); margin-top:1px}
.sugg b{font-family:var(--display); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
.compose{display:grid; grid-template-columns:1fr 74px auto; gap:7px; align-items:center; margin-top:9px}
.chint{font-size:11.5px; color:var(--mute); line-height:1.3}
.compose input[type=number]{width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--field); text-align:right}
.compose .go{padding:10px 13px; border-radius:10px; background:var(--forest); color:#fff; font-size:13px}
.draft-line{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft)}
.draft-line .nm{flex:1; font-size:14px}
.draft-line .q{font-family:var(--mono); font-size:11px; color:var(--mute)}
.draft-line .qin{width:66px; flex:0 0 auto; padding:6px 8px; border:1px solid var(--line);
  border-radius:8px; background:var(--field); font-family:var(--mono); font-size:12px;
  text-align:right; color:var(--ink)}
.draft-line .kg{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:15px}
.draft-line .rm{color:var(--brick); font-family:var(--mono); font-size:16px; padding:0 4px}
.total{display:flex; align-items:baseline; justify-content:space-between; margin-top:12px}
.total .v{font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.actions{display:flex; gap:8px; margin-top:12px}
.btn{flex:1; padding:13px; border-radius:11px; text-align:center; font-size:14px; font-weight:600}
.btn-1{background:var(--forest); color:#fff}
.btn-2{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn[disabled]{opacity:.4}

/* Bandeau de validation d'un service. Il fallait qu'il se distingue des autres
   boutons sans crier : un liseré de paille et une ombre teintée suffisent à le
   faire ressortir, la couleur de fond restant celle de l'app.
   L'accent n'apparaît que lorsqu'il y a réellement quelque chose à valider —
   sur un service vide le bouton dit « Passer », et souligner un geste neutre
   n'aurait fait qu'user l'effet. */
.btn-go{position:relative; background:var(--forest-2);
  box-shadow:inset 0 0 0 1.5px var(--straw), 0 2px 10px rgba(217,192,91,.28)}
.btn-go::after{content:''; position:absolute; left:14px; right:14px; bottom:6px; height:1.5px;
  border-radius:1px; background:var(--straw); opacity:.55}
.btn-go:active{background:var(--forest)}
:root[data-theme="dark"] .btn-go{box-shadow:inset 0 0 0 1.5px var(--straw), 0 2px 12px rgba(217,192,91,.20)}
.toast{
  position:fixed; left:50%; bottom:104px; transform:translate(-50%,14px); z-index:60;
  background:var(--toast-bg); color:#fff; padding:11px 17px; border-radius:999px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------------- tracker ---------------- */
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px}
.kpi .v{font-family:var(--display); font-weight:800; font-size:27px; line-height:1.05; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em}
.kpi .l{font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--mute); margin-top:4px; line-height:1.35}
.kpi.wide{grid-column:1/-1}
/* Une grille de KPI collée à la carte suivante : .card + .card était prévu,
   pas .kpis + .card, et les deux blocs se touchaient bord à bord. */
.kpis + .card, .card + .kpis, .kpis + .kpis{margin-top:12px}
.bars .row{display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin-bottom:11px}
.bars .lab{font-size:13.5px}
.bars .val{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.bars .tr{grid-column:1/-1; height:9px; background:var(--track); border-radius:2px; overflow:hidden}
.bars .tr i{display:block; height:100%}
.days{display:flex; align-items:flex-end; gap:2px; height:78px; margin-top:4px}
.dayscard{background:var(--card)}
.dayscard:active{background:var(--active)}
.budline{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--brick); z-index:2; pointer-events:none}
.dayleg{display:flex; flex-wrap:wrap; gap:9px 12px; margin-top:11px}
.dayleg span{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase}
.dayleg .budkey{width:12px; height:0; border-top:2px dashed var(--brick); display:inline-block}
.wkday{display:grid; grid-template-columns:52px 1fr auto; gap:4px 10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft)}
.wkday:last-child{border-bottom:0}
.wkday .dd{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em; line-height:1.2}
.wkday .dd b{display:block; font-family:var(--serif); font-size:14px; color:var(--ink)}
.wkday .stack2{height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--track)}
.wkday .stack2 i{height:100%}
.wkday .kg2{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.wkhead{display:flex; align-items:baseline; justify-content:space-between; margin:14px 0 4px}
.wkhead .wt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.wkhead .wv{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:14px}
.days .d{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; min-width:0}
.days .d i{display:block; width:100%}
.days .d.empty{background:var(--track); height:2px}
.axis{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--mute); margin-top:5px}
.journal .j{display:grid; grid-template-columns:auto 1fr auto; gap:3px 10px; padding:10px 0; border-bottom:1px solid var(--line-soft); align-items:center}
.journal .j:last-child{border-bottom:0}
.journal .dt{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.04em; text-align:center; line-height:1.2}
.journal .dt b{display:block; font-family:var(--serif); font-size:15px; color:var(--ink)}
.journal .nm{font-size:14px}
.journal .nm i{font-style:normal; display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute)}
.journal .kg{font-family:var(--display); font-weight:800; font-size:16px; font-variant-numeric:tabular-nums}
svg.spark{width:100%; height:96px; display:block; overflow:visible}
.demo{display:flex; align-items:center; gap:10px; background:var(--note-bg); border:1px solid var(--note-line-2); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--note-ink)}
.demo.edit{background:var(--kpi-good); border-color:var(--forest-2); color:var(--accent)}
.demo.edit button{color:var(--accent)}
.demo button{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--note-ink); text-decoration:underline; white-space:nowrap}

/* ---------------- sheet ---------------- */
.scrim{position:fixed; inset:0; background:var(--sheet-scrim); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:50%; bottom:0; width:100%; max-width:430px; transform:translate(-50%,102%);
  background:var(--paper); z-index:50; border-radius:20px 20px 0 0; padding:18px 18px 30px;
  transition:transform .26s cubic-bezier(.32,.72,0,1); max-height:82vh; overflow-y:auto;
}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-family:var(--display); font-size:23px; margin:2px 0 2px; font-weight:800;
  letter-spacing:-.01em; line-height:1.15}
.sheet .grab{width:38px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 12px}
.stack{display:flex; height:26px; border-radius:3px; overflow:hidden; margin:12px 0 9px}
.stack i{height:100%}
.stagelist{display:grid; grid-template-columns:auto 1fr auto; gap:6px 9px; align-items:center; font-size:12.5px}
.stagelist .sv{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; text-align:right}
.months{display:flex; gap:3px; margin-top:4px}
.months i{flex:1; height:18px; border-radius:2px; background:var(--seg-bg); font-family:var(--mono); font-size:8px; color:var(--mute); display:flex; align-items:center; justify-content:center; font-style:normal}
.months i.on{background:var(--forest); color:#fff}

/* ---------------- tabbar ---------------- */
.tabbar{
  /* fixée au cadre, pas au flux : elle ne bouge plus d'un pixel au défilement */
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom));
  width:calc(min(430px, 100%) - 20px);
  z-index:30; display:flex; gap:2px;
  padding:7px 6px; border-radius:26px; border:1px solid var(--line);
  background:var(--tabbar); backdrop-filter:blur(16px); box-shadow:var(--shadow);
}
.tabbar button{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:2px 0; color:var(--mute);
}
.tabbar .ic{
  display:flex; align-items:center; justify-content:center; width:100%; max-width:54px; height:29px;
  border-radius:999px; transition:background .18s ease;
}
.tabbar svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7}
.tabbar span:not(.ic){font-family:var(--mono); font-size:8px; letter-spacing:.03em; text-transform:uppercase;
  overflow:hidden; text-overflow:ellipsis; max-width:100%; white-space:nowrap}
/* Bulle centrale. Elle déborde du haut de la barre, d'où le retrait négatif :
   la barre n'a pas d'overflow caché, sinon il faudrait le lever. */
.tabbar .bub{flex:0 0 auto; width:56px; margin-top:-19px; justify-content:flex-start; gap:5px}
.tabbar .bub .ic{width:46px; height:46px; max-width:46px; background:var(--forest);
  border:3px solid var(--tabbar); box-shadow:var(--shadow)}
.tabbar .bub .ic svg{stroke:#fff; width:23px; height:23px; stroke-width:1.8}
.tabbar .bub:active .ic{background:var(--forest-2)}
/* Feed courant : la bulle est verte en permanence, seul le cerne peut dire
   qu'on y est. La bordure de 3 px passait pour un liseré de barre — elle est
   élargie et doublée d'un halo, de façon à se lire comme une sélection et non
   comme un contour. */
.tabbar .bub[aria-current="page"]{color:var(--accent)}
.tabbar .bub[aria-current="page"] .ic{background:var(--forest);
  border-color:var(--straw); border-width:3.5px;
  box-shadow:var(--shadow), 0 0 0 1.5px rgba(217,192,91,.45)}
/* Compteur de demandes reçues. Pas de notification possible sans Web Push :
   ce point rouge est le seul signal dont on dispose sans quitter l'app. */
.tabbar .bub{position:relative}
.tabbar .bub .cnt{position:absolute; top:-2px; right:2px; min-width:17px; height:17px;
  padding:0 4px; box-sizing:border-box; border-radius:9px; background:var(--brick);
  color:#fff; font-family:var(--mono); font-size:10px; line-height:17px; text-align:center;
  border:2px solid var(--tabbar); display:none}
.tabbar .bub[data-n]:not([data-n="0"]) .cnt{display:block}

/* Pastille simple, sans chiffre : le rappel du soir n'a rien à compter, il est
   là ou il n'est pas. Posée sur l'onglet Saisie, qui est l'endroit où aller. */
.tabbar button{position:relative}
.tabbar button .dot{position:absolute; top:1px; right:calc(50% - 15px); width:9px; height:9px;
  border-radius:50%; background:var(--brick); border:2px solid var(--tabbar); display:none}
.tabbar button[data-dot="1"] .dot{display:block}

/* Un seul langage pour les cinq onglets : la pastille de l'onglet courant prend
   l'encre verte et se cerne de paille, comme la bulle du Feed. Le fond seul ne
   suffisait pas — sur la barre claire, une pastille verte sans cerne se lisait
   comme une icône coloriée plutôt que comme la page où l'on est. */
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] .ic{background:var(--forest);
  box-shadow:0 0 0 2px var(--straw)}
.tabbar button[aria-current="page"] .ic svg{stroke:#fff}
.tabbar button:active .ic{background:var(--seg-bg)}
.tabbar button[aria-current="page"]:active .ic{background:var(--forest)}
/* ---------------- carte de score (Trophées) ---------------- */
.rank{background:var(--card-2-bg); color:var(--card-2-on); border:0; position:relative}
.rank .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--straw)}
.detaillink{font-family:var(--serif); font-style:italic; font-size:11px; letter-spacing:0;
  text-transform:none; color:var(--straw); margin-left:8px; text-decoration:underline;
  text-underline-offset:2px; vertical-align:baseline}
.rank .pts{font-family:var(--display); font-weight:800; font-size:46px; line-height:1; margin:6px 0 0; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.rank .pts small{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--on-forest-mute); text-transform:uppercase}
.rank .name{font-family:var(--display); font-weight:800; font-size:20px; margin-top:9px;
  letter-spacing:-.01em}
.rank .prog{height:7px; background:rgba(255,255,255,.16); border-radius:2px; overflow:hidden; margin:9px 0 6px}
.rank .prog i{display:block; height:100%; background:var(--straw)}
.rank .next{font-family:var(--mono); font-size:10px; color:var(--on-forest-mute); letter-spacing:.04em}
.rank .aside{display:flex; gap:14px; border-top:1px solid rgba(255,255,255,.16); margin-top:14px; padding-top:12px}
.rank .aside div{flex:1}
.rank .aside .v{font-family:var(--display); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums}
.rank .aside .l{font-family:var(--mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--on-forest-mute); line-height:1.4}
.qmark{position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35); color:#fff; font-family:var(--serif); font-size:14px;
  display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.08)}

/* ---------------- barème ---------------- */
.chal{display:grid; grid-template-columns:24px 1fr auto; gap:3px 9px; align-items:baseline; padding:12px 13px;
  border-bottom:1px solid var(--line-soft)}
.chal:last-of-type{border-bottom:0}
.chal .st{font-family:var(--mono); font-size:14px; text-align:center; line-height:1.2}
.chal .st.on{color:var(--accent)}
.chal .st.off{color:var(--line)}
.chal .nm{font-size:14.5px}
.chal .pt{font-family:var(--display); font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; white-space:nowrap}
.chal .rule{grid-column:2/-1; font-size:11.5px; color:var(--mute); line-height:1.35}
.chal .got{grid-column:2/-1; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--forest-2); margin-top:3px}

/* ---------------- semaine en cours ---------------- */
.wnow{display:grid; grid-template-columns:1fr auto; gap:4px 10px}
.wnow .l{font-size:13.5px}
.wnow .v{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:15px; text-align:right}
.wnow .tr{grid-column:1/-1; height:8px; background:var(--track); border-radius:2px; overflow:hidden; margin-bottom:6px}
.wnow .tr i{display:block; height:100%}

/* ---------------- trophées ---------------- */
.bgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px 6px; margin-top:2px}
.badge{display:flex; flex-direction:column; align-items:center; text-align:center; padding:4px 2px; cursor:pointer}
.badge svg{width:100%; height:auto; max-width:86px; display:block}
.badge .be{font-size:13px; line-height:1; margin-bottom:-4px}
.badge .bt{font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-soft); margin-top:8px; line-height:1.3; overflow-wrap:anywhere}
.badge .bp{font-family:var(--display); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; margin-top:2px}
.badge .bp s{text-decoration:none; color:var(--mute)}
.badge.locked .bt,.badge.locked .bp{color:var(--mute)}
.bfamttl{font-size:15px; margin-bottom:1px}
.bfamsub{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); margin-bottom:11px}
.seemore{width:100%; margin-top:14px; padding:11px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--accent); font-size:13px}
.trodet{display:flex; align-items:baseline; gap:9px; margin:12px 0 2px}
.trodet .tn{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.01em}
.trodet .te{font-size:20px}

/* ---------------- conseil contextuel (Tracker) ---------------- */
.tip{display:flex; gap:10px; align-items:flex-start; background:var(--kpi-good);
  border:1px solid var(--forest-2); border-radius:10px; padding:11px 12px; margin-top:12px}
.tip.warn{background:var(--note-bg); border-color:var(--note-line-2)}
/* Conseil cliquable : il ouvre la fiche du plat nommé. On ne le signale pas par
   une couleur — le bandeau en a déjà une qui porte du sens — mais par un chevron
   et le curseur. `button` plutôt que `div` pour le clavier et les lecteurs
   d'écran, avec le style du bandeau conservé à l'identique. */
button.tip{width:100%; text-align:left; font:inherit; cursor:pointer;
  -webkit-appearance:none; appearance:none}
button.tip:active{transform:scale(.995)}
.tip .go{margin-left:auto; align-self:center; font-family:var(--mono); font-size:15px;
  color:var(--mute); flex:0 0 auto; padding-left:4px}
.tip.good{background:var(--kpi-good); border-color:var(--forest)}
.tip.bad{background:var(--note-bg); border-color:var(--brick)}
.tip.bad .ic{color:var(--brick)}
.tip.good .ic{color:var(--accent)}
.tip .ic{font-family:var(--mono); font-size:13px; line-height:1.3}
.tip .tx{font-size:12.5px; line-height:1.45; color:var(--ink)}
.tip .tx b{font-weight:600}

/* ---------------- date de saisie ---------------- */
.daterow{display:flex; gap:7px; align-items:center; margin-bottom:2px}
.daterow input[type=date]{flex:1; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:var(--field); font-size:14px; color:var(--ink); min-width:0}
.daterow button{padding:10px 12px; border-radius:10px; background:var(--seg-bg); color:var(--ink-soft);
  font-size:12.5px; white-space:nowrap}
.daterow button[aria-pressed="true"]{background:var(--forest); color:#fff}
.pastwarn{font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--note-ink); background:var(--note-bg); border:1px solid var(--note-line);
  border-radius:7px; padding:5px 9px; margin-top:7px; display:inline-block}
.backlink{font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--accent); margin-bottom:8px; display:block}

/* ---------------- calendrier ---------------- */
.calnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
.calnav .m{font-family:var(--serif); font-size:16px}
.calnav button{width:30px; height:30px; border-radius:8px; background:var(--seg-bg); color:var(--ink);
  font-size:15px; display:flex; align-items:center; justify-content:center}
.calnav button[disabled]{opacity:.3}
.calhead,.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.calhead span{font-family:var(--mono); font-size:8.5px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); text-align:center; padding-bottom:3px}
.cell{border-radius:9px; background:var(--track); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; padding:6px 0 5px; min-height:44px}
.cell.void{background:none}
.cell.today{outline:1.5px solid var(--forest); outline-offset:-1.5px}
.cell .dn{font-family:var(--display); font-weight:800; font-size:12.5px; font-variant-numeric:tabular-nums; line-height:1}
.dots{display:flex; gap:4px}
.dots i{width:7px; height:7px; border-radius:50%; box-sizing:border-box;
  border:1.4px solid var(--line); display:block}
.dots i.on{border-width:0}
.calwrap.mini{max-width:284px; margin:0 auto}
.calwrap.mini .cell{min-height:0; aspect-ratio:1; gap:2px; padding:0; border-radius:7px}
.calwrap.mini .cell .dn{font-size:10px}
.calwrap.mini .dots i{width:5px; height:5px; border-width:1.2px}
.calwrap.mini .calhead span{font-size:7.5px; padding-bottom:2px}
.calmini{text-align:left; cursor:pointer}
.calmini:active{background:var(--active)}
.mininav{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px}
.mininav span{font-family:var(--serif); font-size:15px}
.mininav .op{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.callegend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px}
.callegend span{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.03em; text-transform:uppercase; color:var(--ink-soft)}

/* ---------------- trois dernières semaines ---------------- */
.daysgrid{position:relative}
.budline{position:absolute; left:0; right:0; height:0; border-top:1px dashed var(--brick); z-index:2; pointer-events:none}
.dayleg{display:flex; flex-wrap:wrap; gap:9px 12px; margin-top:11px}
.dayleg span{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase}
.dayleg .budkey{width:12px; height:0; border-top:2px dashed var(--brick); display:inline-block}
.dayscard{background:var(--card)}
.dayscard:active{background:var(--active)}
.wkday{display:grid; grid-template-columns:52px 1fr auto; gap:4px 10px; align-items:center; padding:8px 0;
  border-bottom:1px solid var(--line-soft)}
.wkday:last-child{border-bottom:0}
.wkday .dd{font-family:var(--mono); font-size:10px; color:var(--mute); letter-spacing:.02em; line-height:1.2}
.wkday .dd b{display:block; font-family:var(--serif); font-size:14px; color:var(--ink)}
.wkday .stack2{height:14px; border-radius:3px; overflow:hidden; display:flex; background:var(--track)}
.wkday .stack2 i{height:100%}
.wkday .kg2{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; text-align:right}
.wkhead{display:flex; align-items:baseline; justify-content:space-between; margin:14px 0 4px}
.wkhead .wt{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)}
.wkhead .wv{font-family:var(--display); font-weight:800; font-variant-numeric:tabular-nums; font-size:14px}

/* ---------------- saisie : accueil et blocs repas ---------------- */
.homegrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:4px}
.hcard{aspect-ratio:1; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  padding:14px 12px; text-align:center}
.hcard:active{background:var(--active)}
.hcard .hi{width:44px; height:44px; border-radius:50%; background:var(--forest);
  display:flex; align-items:center; justify-content:center}
.hcard .hi svg{width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.hcard .ht{font-family:var(--display); font-weight:800; font-size:18px; line-height:1.15;
  letter-spacing:-.01em}
.hcard .hs{font-family:var(--mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.35; overflow-wrap:anywhere; max-width:100%}
.mealblocks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.mblock{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:15px 12px;
  display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center}
.mblock .ml{font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-.01em;
  line-height:1.1}
.mblock .mv{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--mute)}
.mblock[aria-pressed="true"]{background:var(--forest); border-color:var(--forest)}
.mblock[aria-pressed="true"] .ml{color:#fff}
.mblock[aria-pressed="true"] .mv{color:var(--on-topbar-mute)}
.star{flex:0 0 auto; padding:2px; margin-right:2px; display:flex; align-items:center}
.star svg{width:17px; height:17px; fill:none; stroke:var(--mute); stroke-width:1.6; stroke-linejoin:round}
.star.on svg{fill:var(--straw); stroke:var(--straw)}

/* ---------------- carrefour des services ---------------- */
.hubgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:2px}
.hub{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 13px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; min-height:78px}
.hub:active{background:var(--active)}
.hub .hn{font-family:var(--serif); font-size:17px}
.hub .hn i{font-style:normal; color:var(--accent); font-size:14px}
.hub .hd{font-family:var(--mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute); line-height:1.35}
.hub.on{border-color:var(--forest-2); background:var(--kpi-good)}
.hub.next{border-color:var(--forest); border-width:1.5px}
.hub.next .hd{color:var(--accent)}
.wizbar span[data-jump]{cursor:pointer}

/* ---------------- provenance du repas ----------------
   Trois cartes pleine largeur et non trois carrés : ce qui décide du choix,
   c'est la phrase d'explication, et elle ne tient pas dans un carré. */
.modegrid{display:grid; gap:9px; margin-top:2px}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px;
  display:grid; grid-template-columns:1fr auto; gap:3px 10px; text-align:left; align-items:baseline}
.mcard:active{background:var(--active)}
.mcard .mct{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.012em;
  line-height:1.1}
.mcard .mck{font-family:var(--display); font-weight:800; font-size:14px; color:var(--mute);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.mcard .mcs{grid-column:1/-1; font-size:12px; color:var(--ink-soft); line-height:1.45}
.mcard.on{border-color:var(--forest-2); background:var(--kpi-good);
  box-shadow:inset 0 0 0 1px var(--forest-2)}
/* Choisi, donc éteint. Pas d'opacité globale : elle écraserait le contraste du
   texte qu'on vient tout juste de rendre lisible en thème sombre. On éteint
   plutôt chaque couleur à la main, en gardant l'accent sur la coche. */
.mcard[disabled]{background:var(--active); border-color:var(--line); box-shadow:none; cursor:default}
.mcard[disabled] .mct{color:var(--mute)}
.mcard[disabled] .mcs{color:var(--mute)}
.mcard[disabled] .mck{color:var(--accent)}
.mcard[disabled]:active{background:var(--active)}
/* Compteur des cartes du sas : c'est un nombre, il prend la face des nombres. */
.mcard .mcn{font-family:var(--display); font-weight:800; font-size:14px; color:var(--accent);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.mcard.on .mct{color:var(--accent)}
.mcard.on .mck{color:var(--accent)}
.modeline{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:9px 12px; margin:8px 0 2px; border:1px solid var(--line); border-radius:10px;
  background:var(--card); font-size:12.5px; text-align:left}
.modeline b{font-weight:600}
.modeline i{font-style:normal; font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--accent); flex:0 0 auto}

/* ---------------- composeur standard ---------------- */
.stdgrp{margin-top:15px}
.stdgrp > .unit{display:block; margin-bottom:6px}
/* ---------------- parcours guidé ---------------- */
.mealhead{display:flex; align-items:baseline; gap:9px; margin:2px 0 4px}
.mealhead .mh{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:-.01em}
.mealhead .md{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mute)}
.wizbar{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin:8px 0 2px}
.wizbar span{font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--mute); padding:4px 8px; border-radius:999px; background:var(--seg-bg)}
.wizbar span.on{background:var(--forest); color:#fff}

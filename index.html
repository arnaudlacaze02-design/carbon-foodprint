  $('#pd_new').onclick = () => { S.pdjNew = true; S.path = null; S.dishQ = ''; renderSaisie(); };
}


/* ==================== provenance du repas ====================
   La provenance était un sélecteur posé au milieu de l'écran de saisie, au même
   rang qu'un choix de plat. Elle n'est pourtant pas du même ordre : elle vaut
   pour le repas entier, elle multiplie chaque ligne, et l'oublier sous-estime
   silencieusement — la pire des deux erreurs. Elle devient une page à elle
   seule, entre le choix du repas et celui du plat.

   `S.modeFrom` retient d'où l'on vient : la page sert autant au parcours
   initial qu'à une correction en cours de saisie, et dans le second cas il faut
   revenir exactement là où on était, pas repartir au début. */
function gotoMode(){
  S.modeFrom = {step:S.step, course:S.course, platVue:S.platVue};
  S.step = 'mode'; renderSaisie();
}
/* Le mode vaut désormais pour le repas entier. setMode() ne touchait que les
   lignes du service courant, ce qui laissait une boisson en « frais » et un
   plat en « resto » dans le même dîner au restaurant. */
function setMealMode(m){
  S.mode = m;
  S.draft.forEach(l => l[3] = m);
  save();
}
function modeSuite(){
  const f = S.modeFrom; S.modeFrom = null;
  if(f && f.step && f.step !== 'mode'){
    S.step = f.step; S.course = f.course; S.platVue = f.platVue || 'grille';
    return renderSaisie();
  }
  if(S.meal === 'dej' || S.meal === 'din') return openCourse('boisson');
  S.comCat = 'plat'; S.path = null; S.dishQ = ''; S.step = 'saisie';
  renderSaisie();
}
function renderMode(D, isToday){
  view.innerHTML = `
    <button class="backlink" id="sBack">‹ Changer de repas</button>
    <div class="mealhead">
      <span class="mh">${MEAL[S.meal].l}</span>
      <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)}</span>
    </div>
    <h2 class="sec">D’où vient ce repas ?</h2>
    <div class="modegrid">
      ${Object.entries(MODE).map(([k, v]) => {
        /* Le mode en cours est grisé et désactivé. Le recliquer ne ferait rien
           d'autre que refermer la page, ce qui ressemble à une annulation alors
           que c'est une confirmation — deux gestes indiscernables pour deux
           intentions opposées. Pour repartir sans changer, il y a le lien de
           retour, qui dit ce qu'il fait. */
        const sel = S.mode === k;
        const coef = v.k === 1 ? 'référence' : '+' + Math.round((v.k - 1) * 100) + ' %';
        return `
        <button class="mcard${sel ? ' on' : ''}" data-pmode="${k}"${
          sel ? ' disabled aria-disabled="true"' : ''}>
          <span class="mct">${esc(v.l)}</span>
          <span class="mck">${sel ? '✓ choisi · ' + coef : coef}</span>
          <span class="mcs">${esc(v.s)}</span>
        </button>`; }).join('')}
    </div>
    <div class="src" style="margin-top:14px">Le coefficient s’applique à tout ce que vous saisirez
      pour ce repas. Il reste modifiable ensuite, depuis la ligne en haut de l’écran de saisie.</div>`;
  $('#sBack').onclick = () => {
    if(S.modeFrom){ const f = S.modeFrom; S.modeFrom = null;
      S.step = f.step; S.course = f.course; S.platVue = f.platVue || 'grille';
      return renderSaisie(); }
    S.step = 'meal'; renderSaisie();
  };
  view.querySelectorAll('[data-pmode]').forEach(b => b.onclick = () => {
    setMealMode(b.dataset.pmode); modeSuite();
  });
}
/* Rappel de la méthode de saisie choisie, sur le même modèle que la provenance.
   La barre segmentée « Plats types | Composer » restait affichée en permanence
   au-dessus du panneau, à répéter un choix déjà fait ; une ligne suffit à le
   rappeler et à revenir dessus, et l'écran s'allège d'une rangée de boutons. */
/* Nom du bloc de favoris selon le service, et sa tournure en complément de
   lieu. « Mes entrées » se comprend seul ; « ce que vous mettez le plus souvent
   en entrée » demande la préposition, qui n'est pas la même partout. */
const SERV_MIENS = {entree:'Mes entrées', plat:'Mes plats', dessert:'Mes desserts',
                    boisson:'Mes boissons', cafethe:'Mes cafés'};
const SERV_LA    = {entree:'en entrée', plat:'dans le plat', dessert:'en dessert',
                    boisson:'en boisson', cafethe:'au café'};

function voieLine(isPlat){
  const l = S.path === 'compose'  ? 'Composer'
          : S.path === 'favoris'  ? (SERV_MIENS[S.comCat] || 'Mes habitudes')
          : S.path === 'recettes' ? 'Mes recettes'
          : isPlat ? 'Plat standard' : 'Plats types';
  return `<button class="modeline" id="voieEdit" style="margin-top:2px">
    <span><b>${l}</b></span><i>changer</i></button>`;
}

/* Rappel discret de la provenance, en tête des écrans de saisie. Il remplace le
   sélecteur à trois boutons : le choix est fait, il n'a plus à occuper la
   moitié de l'écran, mais il doit rester lisible et rattrapable. */
function modeLine(){
  const m = MODE[S.mode];
  return `<button class="modeline" id="modeEdit">
    <span><b>${m ? esc(m.l) : 'Provenance à choisir'}</b>${
      m && m.k !== 1 ? ` · +${Math.round((m.k - 1) * 100)} %` : ''}</span>
    <i>modifier</i></button>`;
}

/* ==================== voie « Standard » ====================
   Elle remplace « Plats types » pour le seul plat principal. Trois questions —
   quelle protéine, quel féculent, quel légume — et la taille de l'assiette.
   Rien n'est présélectionné : une assiette proposée d'office finirait
   enregistrée telle quelle par distraction, et c'est exactement le genre de
   chiffre faux qu'on ne repère jamais après coup.

   Les choix sont volontairement courts. Une liste de vingt viandes redemande le
   travail qu'on prétendait éviter : qui sait que c'était du veau et pas du bœuf
   passe par « Composer », où toute la base est accessible. */
const STD_PROT = ['vianderouge','viandeblanche','poissonmoyen','crevettes'];
const STD_FEC  = ['riz','pates','pommedeterre','ble','feculentmoyen'];
const STD_LEG  = ['legumesaison','courgette','brocoli','haricotvert','carotte','epinard','poivron',
                  'aubergine','tomate','chou','poireau','courge','petitpois','choufleur','laitue',
                  'champignondeparis'];
const stdListe = arr => arr.filter(s => F.has(s));
/* Libellés courts pour les pastilles. Le nom de la base porte sa précision —
   « Pâtes (sèches) » dit sur quel poids porte le facteur — mais sur une
   pastille il déborde et fait défiler la rangée pour rien. La précision reste
   une ligne plus bas, dans l'aperçu, où le nom complet est affiché. */
const STD_LAB = {
  vianderouge:'Viande rouge', viandeblanche:'Viande blanche', poissonmoyen:'Poisson',
  feculentmoyen:'Féculent', pates:'Pâtes', pommedeterre:'Pomme de terre',
  haricotvert:'Haricot vert', legumesaison:'Légumes de saison',
  champignondeparis:'Champignons', choufleur:'Chou-fleur',
};
const stdLab = s => STD_LAB[s] || F.get(s).n;
/* La taille large majore d'un tiers la portion de référence de chaque aliment.
   Les grammages ne sont pas posés ici : chaque entrée porte déjà sa portion
   dans la base (`p`), et en poser d'autres ferait vivre un second référentiel
   qui divergerait au premier ajout. */
const STD_K = {normal:1, large:1.35};
const stdG = (slug, taille) => Math.max(5, Math.round(F.get(slug).p * STD_K[taille] / 5) * 5);
function stdLignes(){
  return [S.stdP, S.stdF, S.stdL]
    .filter(s => s && F.has(s))
    .map(s => [s, stdG(s, S.stdSize), 'plat', S.mode]);
}

function stdPanel(){
  const P = stdListe(STD_PROT), Fe = stdListe(STD_FEC), L = stdListe(STD_LEG);
  const lignes = stdLignes();
  const kg = kgOf(lignes), g = gOf(lignes);

  /* « Sans » est une pastille comme une autre : des pâtes aux légumes n'ont pas
     de protéine nommée, et forcer un choix ferait inventer une viande. */
  const rangee = (titre, arr, sel, cle) => `
    <div class="stdgrp">
      <div class="unit">${titre}</div>
      <div class="chips">
        <button class="chip" aria-pressed="${!sel}" data-std="${cle}" data-slug="">Sans</button>
        ${arr.map(s => `<button class="chip" aria-pressed="${sel === s}" data-std="${cle}"
          data-slug="${s}">${esc(stdLab(s))}</button>`).join('')}
      </div>
    </div>`;

  return `
    ${rangee('Protéine', P, S.stdP, 'stdP')}
    ${rangee('Féculent', Fe, S.stdF, 'stdF')}
    ${rangee('Légume', L, S.stdL, 'stdL')}
    <div class="stdgrp">
      <div class="unit">Taille de l’assiette</div>
      <div class="seg">
        <button data-stdsize="normal" aria-pressed="${S.stdSize === 'normal'}"><b>Normale</b></button>
        <button data-stdsize="large" aria-pressed="${S.stdSize === 'large'}"><b>Large</b><small>+35 %</small></button>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      ${lignes.length ? lignes.map(l => `<div class="draft-line">
        <span class="nm">${esc(F.get(l[0]).n)}</span>
        <span class="q">${l[1]} g</span>
        <span class="kg">${n2(kgOf([l]))}</span>
      </div>`).join('') : `<div class="cempty">Choisissez au moins un élément.</div>`}
      <div class="total">
        <div><div class="unit">Ce plat</div>
          <div class="small mute">${g} g${lignes.length
            ? ` · ${Math.round(kg / BUDGET_J * 100)} % du budget du jour` : ''}</div></div>
        <div class="v">${n2(kg)} <span class="unit">kg</span></div>
      </div>
      <button class="btn btn-1" id="std_ok" style="margin-top:12px" ${
        lignes.length ? '' : 'disabled'}>Ajouter au plat</button>
    </div>
    <div class="src" style="margin-top:8px">Viande rouge, viande blanche, poisson et féculent sont des
      moyennes de la base : leur composition et leur écart sont détaillés dans la bibliothèque.
      Les grammages restent modifiables après ajout.</div>`;
}

/* ==================== voie « Composer » ====================
   Une seule barre pour tout : les plats types et les aliments bruts. Les
   séparer obligeait à deviner, avant de taper, dans laquelle des deux listes se
   trouvait « lentilles » — et la réponse était : les deux. */
const favMealsOf = f => Array.isArray(f.m) ? f.m : [f.m || 'dej'];

/* Une ligne de résultat, plat type ou aliment brut : même gabarit, une
   étiquette pour dire lequel. Les distinguer par la mise en page ferait croire
   à deux listes, or c'en est une seule, classée. */
function ligneRes(x){
  const kg = x.kg, nom = x.nom;
  const bar = `<div class="bar"><i style="width:${clamp(kg/(BUDGET_J*1.5)*100, 2, 100)}%;background:${
    kg > BUDGET_J ? 'var(--brick)' : 'var(--forest-2)'}"></i></div>`;
  if(x.t === 'aliment') return `<div class="dish">
      <div class="top">
        <button class="nm" data-foodinfo="${esc(x.f.s)}" style="text-align:left">${esc(nom)}<span
          class="tag">aliment</span></button>
        <span class="kg">${n2(kg)}</span>
        <button class="add" data-foodadd="${esc(x.f.s)}">Ajouter</button>
      </div>${bar}</div>`;
  const d = x.d;
  return `<div class="dish">
      <div class="top">
        <button class="star${d.fav ? ' on' : ''}" data-star="${esc(nom)}" aria-pressed="${!!d.fav}"
          aria-label="${d.fav ? 'Retirer des favoris' : 'Mettre en favori'}">
          <svg viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/></svg>
        </button>
        <button class="nm" data-dish="${esc(nom)}" style="text-align:left">${esc(nom)}<span
          class="tag">${d.custom ? 'à moi' : 'plat'}</span></button>
        <span class="kg">${n2(kg)}</span>
        <button class="add" data-additem="${esc(nom)}">Ajouter</button>
      </div>
      ${S.openDish === nom ? `<div class="comp">${d.l.map(([s, g]) =>
        `${F.get(s).n.toLowerCase()} ${g} g`).join(' · ')}</div>` : ''}${bar}</div>`;
}

function composePanel(res){
  const nPlats = res.filter(x => x.t === 'plat').length;
  const nAlim  = res.length - nPlats;
  return `
    <div class="srchw mb${S.dishQ ? ' on' : ''}">
      <input class="search" id="dq" type="search" placeholder="Chercher un aliment ou un plat"
             autocorrect="on" autocapitalize="sentences" spellcheck="true" value="${esc(S.dishQ)}">
      <button class="srchx" id="dqx" type="button" aria-label="Effacer la recherche">✕</button>
    </div>
    ${S.dishQ ? `<div class="list">
      ${res.length ? res.map(ligneRes).join('') +
        `<div class="count">${nAlim} aliment${nAlim > 1 ? 's' : ''} · ${nPlats} plat${
          nPlats > 1 ? 's' : ''} · classés du plus proche de « ${esc(S.dishQ.trim())} » au plus
          lointain, les plats qui en contiennent seulement venant en dernier</div>`
      : `<div class="empty">Rien ne correspond à « ${esc(S.dishQ.trim())} ». Essayez « pâtes »,
          « poulet », « lentilles ».</div>`}
    </div>` : `<div class="src" style="margin:-2px 0 4px">Tapez deux lettres : la recherche couvre
        les ${DB.foods.length} aliments et les ${DISHES().length} plats types de la base, d’un
        seul tenant.</div>`}`;
}

/* ---- Mes entrées / Mes plats / Mes desserts ----
   Deux listes, et elles ne disent pas la même chose. La première vient de
   l'historique : ce sont les aliments réellement saisis dans ce service, du
   plus fréquent au moins fréquent, avec la portion médiane des fois
   précédentes plutôt qu'une portion de référence — quelqu'un qui met toujours
   40 g de fromage en entrée n'a pas à recorriger 60 g à chaque fois.
   La seconde, ce sont les plats mis en étoile : un choix explicite, qui ne
   dépend d'aucune statistique. */
function favorisPanel(hab, etoiles){
  return `
    ${hab.length ? `<div class="list">
      ${hab.map(x => `<div class="dish">
        <div class="top">
          <button class="nm" data-foodinfo="${esc(x.s)}" style="text-align:left">${
            esc(F.get(x.s).n)}<span class="tag">${x.n}×</span></button>
          <span class="kg">${n2(kgOf([[x.s, x.g]]))}</span>
          <button class="add" data-habadd="${esc(x.s)}" data-habg="${x.g}">Ajouter</button>
        </div>
        <div class="bar"><i style="width:${clamp(kgOf([[x.s, x.g]])/(BUDGET_J*1.5)*100, 2, 100)}%;background:${
          kgOf([[x.s, x.g]]) > BUDGET_J ? 'var(--brick)' : 'var(--forest-2)'}"></i></div>
      </div>`).join('')}
      <div class="count">Vos ${hab.length} habitude${hab.length > 1 ? 's' : ''} pour ce service,
        de la plus fréquente à la moins fréquente · « Ajouter » pose votre portion habituelle,
        pas la portion de référence</div>
    </div>` : ''}

    ${etoiles.length ? `<h2 class="sec" style="margin-top:${hab.length ? 18 : 4}px">Mes plats en étoile</h2>
      <div class="list">
        ${etoiles.map(d => ligneRes({t:'plat', d, nom:d.n, kg:d.kg, fav:true})).join('')}
        <div class="count">${etoiles.length} plat${etoiles.length > 1 ? 's' : ''} mis en étoile
          · l’étoile se retire d’un second appui</div>
      </div>` : ''}`;
}

function recettesPanel(mes){
  return `<div class="list">
    ${mes.map(f => ligneRes({t:'plat', d:f, nom:f.n, kg:f.kg, fav:true})).join('')}
    <div class="count">${mes.length} recette${mes.length > 1 ? 's' : ''} enregistrée${
      mes.length > 1 ? 's' : ''} · composées ici, ou reprises d’un ami depuis le fil</div>
  </div>`;
}

function renderSaisie(){
  topbar();
  /* Un brouillon vide s'écrit aussi : c'est ce qui purge la reprise dès qu'un
     repas est enregistré, sans avoir à l'effacer explicitement quelque part. */
  navSave();
  if(!S.entryDate) S.entryDate = today();
  const D = S.entryDate, isToday = D === today();
  const editing = S.editId && S.hist.find(x => x.id === S.editId);
  const hasCourses = S.meal === 'dej' || S.meal === 'din';

  const dayHist = S.hist.filter(e => e.d === D);
  const byMeal = {}; MEALS.forEach(m => byMeal[m.k] = 0);
  dayHist.forEach(e => byMeal[e.m] += kgOf(e.l));
  const dayTot = Object.values(byMeal).reduce((a,b) => a+b, 0);
  const draftKg = kgOf(S.draft);

  /* ================= 1. accueil : deux fenêtres carrées ================= */
  if(S.step === 'home' && !editing){
    view.innerHTML = `
      <i class="brandbig" role="img" aria-label="Carbon FOODprint"></i>
      <div class="homegrid">
        <button class="hcard" id="hNew">
          <span class="hi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="ht">Nouveau repas</span>
          <span class="hs">Petit-déj · déj · en-cas · dîner</span>
        </button>
        <button class="hcard" id="hEdit">
          <span class="hi"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg></span>
          <span class="ht">Modifier un repas</span>
          <span class="hs">${S.hist.length} repas enregistré${S.hist.length>1?'s':''}</span>
        </button>
      </div>`;
    $('#hNew').onclick = () => { S.step = 'meal'; S.draft = []; S.wiz = null; renderSaisie(); };
    $('#hEdit').onclick = editSheet;
    return;
  }

  /* ================= 2. choix du repas ================= */
  if(S.step === 'meal' && !editing){
    view.innerHTML = `
      <button class="backlink" id="sBack">‹ Retour</button>
      <div class="daterow">
        <input type="date" id="edate" value="${D}" max="${today()}">
        <button id="dToday" aria-pressed="${isToday}">Aujourd’hui</button>
        <button id="dYest" aria-pressed="${D === yesterday()}">Hier</button>
      </div>
      ${!isToday ? `<div class="pastwarn">Saisie antidatée · ${dLabel(D)}</div>` : ''}
      <h2 class="sec">Quel repas ?</h2>
      <div class="mealblocks">${MEAL_ORDER.map(k => { const m = MEAL[k]; return `
        <button class="mblock" data-meal="${k}">
          <span class="ml">${m.l}</span>
          <span class="mv">${m.s}</span>
        </button>`; }).join('')}</div>
      <div class="src" style="margin-top:14px">Déjeuner et dîner se composent service par service,
        dans l’ordre : boisson, entrée, plat, dessert, café ou thé.
        Petit-déjeuner et en-cas vont droit à la saisie.</div>`;
    bindDateRow();
    $('#sBack').onclick = () => { S.step = 'home'; renderSaisie(); };
    view.querySelectorAll('[data-meal]').forEach(b => b.onclick = () => {
      S.meal = b.dataset.meal;
      S.mode = null;                     /* un nouveau repas redemande le mode */
      S.pdjNew = false; S.pdjSave = false; S.pdjEdit = false;
      S.platLarge = false; S.modeFrom = null;
      /* La provenance s'intercale ici, avant toute saisie : elle vaut pour le
         repas entier et elle change le coefficient de chaque ligne. */
      S.step = 'mode';
      renderSaisie();
    });
    return;
  }

  /* ================= 2 bis. provenance du repas ================= */
  if(S.step === 'mode' && !editing) return renderMode(D, isToday);

  /* ================= 3. carrefour des services ================= */
  if(hasCourses && !editing && S.step === 'hub') return renderHub(D, isToday, draftKg);
  if(hasCourses && !editing && S.step === 'finish') return renderFinish(D, isToday, draftKg);

  /* ================= 3 bis. petit-déjeuner : habitude ou nouveauté =================
     Ne s'interpose que si la saisie est vide : couper une composition en cours
     pour poser une question serait pire que de ne rien demander. */
  if(S.meal === 'pdj' && !editing && !S.draft.length && !S.pdjNew && !S.pdjEdit && pdjHab())
    return renderPdjChoix(D, isToday);

  /* ================= 4. saisie d'un service, ou saisie libre ================= */
  const step = hasCourses && !editing && S.step === 'course'
    ? WIZ.find(w => w.k === S.course) : null;
  if(step) S.comCat = step.k;
  /* « Standard » n'existe que pour le plat, « Plats types » que pour le reste :
     une voie affichée sans panneau derrière donnerait un écran vide. */
  const isPlat = !!step && step.k === 'plat';
  /* Le plat démarre sans voie choisie : `S.path` vaut null et l'écran ne montre
     que la question. Les autres services n'ont pas ce sas — leur liste de plats
     types est la réponse la plus courante, l'afficher d'emblée fait gagner un
     geste. Le plat, lui, se saisit de deux façons vraiment différentes, et
     ouvrir d'office sur l'une d'elles revient à choisir à la place de l'autre. */
  /* 'types' est une voie disparue : les brouillons repris d'une version
     précédente peuvent encore la porter, ils retombent sur la question. */
  if(S.path === 'types') S.path = null;
  if(!isPlat && S.path === 'std') S.path = null;

  /* liste unifiée : compositions personnelles puis plats types, favoris en tête */
  const nrm = nrmQ;
  /* Plat mis en attente par la fiche recette du Tracker : il devient la
     recherche courante à la première ouverture du composeur, puis s'efface.
     Passer par un porte-plat plutôt que par S.dishQ directement, parce que
     openCourse() et le choix du repas remettent S.dishQ à vide en chemin. */
  if(S.recPend){ S.dishQ = S.recPend; S.recPend = null; }
  const dq = nrm(S.dishQ.trim());
  const favMeals = f => Array.isArray(f.m) ? f.m : [f.m || 'dej'];
  const match = d => !dq || nrm(d.n).includes(dq) || d.l.some(([sl]) => nrm(F.get(sl).n).includes(dq));

  /* Pertinence d'un nom face à la recherche. Chercher « tomate » ramenait
     d'abord les quarante plats qui en contiennent une, et l'aliment Tomate
     arrivait bon dernier — la réponse la plus évidente était la plus loin.

     Cinq rangs, du plus précis au plus lâche : nom exact, nom qui commence par,
     mot qui commence par, nom qui contient, et enfin trouvé sans que le mot
     figure dans le nom — par un ingrédient ou par un rayon. Ce dernier rang est
     celui des plats bolognaise pour « tomate » : légitime, mais après. */
  const echap = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const rang = nom => {
    if(!dq) return 4;
    const n = nrm(nom);
    if(n === dq) return 0;
    if(n.startsWith(dq)) return 1;
    if(new RegExp('[ ,(\'’\\-/]' + echap(dq)).test(n)) return 2;
    if(n.includes(dq)) return 3;
    return 9;
  };
  /* desserts et boissons vivent dans la catégorie « en-cas » : sans cela, le service Dessert
     d'un déjeuner n'afficherait que des plats principaux. */
  const listMeals = step && (step.k === 'boisson' || step.k === 'cafethe') ? ['encas']
    : step && step.k === 'dessert' ? ['encas', S.meal] : [S.meal];
  const items = [
    ...S.favs.map((f,i) => ({...f, i, fav:true, custom:true, kg:kgOf(f.l)}))
      .filter(f => favMeals(f).some(m => listMeals.includes(m))),
    ...DISHES().filter(d => d.m.some(m => listMeals.includes(m)))
      .map(d => ({...d, fav:S.starred.includes(d.n), kg:kgOf(d.l)})),
  ].filter(match).sort((a,b) => (b.fav?1:0)-(a.fav?1:0) || a.kg - b.kg);

  /* Recherche unifiée : la barre « Chercher un plat » interroge aussi les
     aliments bruts du composer. Chercher « avocat » et ne rien trouver parce
     qu'aucun plat type ne s'appelle ainsi, alors que l'aliment existe deux
     écrans plus loin, était une impasse sans raison. */
  const foodHits = dq.length >= 2
    ? DB.foods.filter(f => nrm(f.n).includes(dq) || nrm(f.g).includes(dq)).slice(0, 40)
    : [];

  /* Résultats fondus en une seule liste et classés par pertinence. Les
     séparer en deux blocs — les plats, puis les aliments — obligeait à
     parcourir tout le premier avant d'atteindre le second, quel que soit le
     rapport de chacun avec ce qui était tapé. */
  const resultats = dq ? [
    ...items.map(d => ({t:'plat', d, nom:d.n, kg:d.kg, fav:d.fav, custom:d.custom})),
    ...foodHits.map(f => ({t:'aliment', f, nom:f.n, kg:kgOf([[f.s, comPortion(f.s)]])})),
  ].map(x => ({...x, r:rang(x.nom)}))
   .sort((a, b) => a.r - b.r
                || (b.fav?1:0) - (a.fav?1:0)
                || a.nom.length - b.nom.length
                || a.kg - b.kg)
   .slice(0, 60) : [];

  /* Ce que l'utilisateur met habituellement dans ce service, tiré de son
     historique. Les plats types de la base n'ont pas d'étiquette entrée /
     plat / dessert — rien ne permet donc de dire d'un plat de la base qu'il
     est une entrée. L'historique, lui, le sait : chaque ligne enregistrée
     porte son service. « Mes entrées » est donc ce qui a été saisi en entrée,
     classé par fréquence, avec la portion médiane des fois précédentes. */
  const habituels = (() => {
    const c = new Map();
    S.hist.forEach(e => (e.l || []).forEach(l => {
      if((l[2] || 'plat') !== S.comCat || !F.has(l[0])) return;
      const o = c.get(l[0]) || {n:0, g:[], d:''};
      o.n++; o.g.push(l[1]);
      if(e.d > o.d) o.d = e.d;
      c.set(l[0], o);
    }));
    return [...c.entries()].map(([s, o]) => {
      const t = o.g.slice().sort((x, y) => x - y);
      return {s, n:o.n, g:t[t.length >> 1], d:o.d};
    /* À fréquence égale, le plus récent d'abord. L'ordre alphabétique, qui
       tenait lieu de départage, plaçait le fromage d'il y a trois mois devant
       la tomate d'hier au seul motif que F précède T. */
    }).sort((a, b) => b.n - a.n || (a.d < b.d ? 1 : a.d > b.d ? -1 : 0)
                   || F.get(a.s).n.localeCompare(F.get(b.s).n, 'fr'))
      .slice(0, 30);
  })();
  /* Les plats de la base mis en étoile, pour ce repas. Sans filtre de service :
     l'étoile ne dit pas à quel moment du repas le plat se mange. */
  const etoiles = DISHES().filter(d => S.starred.includes(d.n)
      && d.m.some(m => listMeals.includes(m)))
    .map(d => ({...d, fav:true, kg:kgOf(d.l)}))
    .sort((a, b) => a.kg - b.kg);
  /* Les six standards posés d'office au premier lancement ne sont pas des
     recettes de l'utilisateur : la voie Standard les remplace. */
  const mesRecettes = S.favs.map((f, i) => ({...f, i, custom:true, kg:kgOf(f.l)}))
    .filter(f => !f.std && favMeals(f).some(m => listMeals.includes(m)))
    .sort((a, b) => a.kg - b.kg);

  /* Un bloc vidé entre-temps — un favori retiré, une recette supprimée —
     renvoie à la question plutôt qu'à un panneau blanc. Ce contrôle doit venir
     ici et pas plus haut : les trois listes sont des const, les lire avant leur
     déclaration lève une ReferenceError au lieu de valoir undefined. */
  if(S.path === 'favoris'  && !habituels.length && !etoiles.length) S.path = null;
  if(S.path === 'recettes' && !mesRecettes.length) S.path = null;
  const platChoix = !S.path;

  const inStep = step ? S.draft.filter(l => (l[2]||'plat') === S.comCat) : S.draft;
  const stepKg = kgOf(inStep);

  view.innerHTML = `
  ${editing ? `<div class="demo edit">
    Modification d’un repas du ${dLabel(editing.d)}.
    <button id="canceledit">Annuler</button></div><div style="height:12px"></div>`
    : `<button class="backlink" id="sBack">‹ ${step && prevCourse(step.k)
        ? `Retour à ${(WIZ.find(w => w.k === prevCourse(step.k)).label).toLowerCase()}`
        : 'Changer la provenance'}</button>`}

  <div class="mealhead">
    <span class="mh">${MEAL[S.meal].l}</span>
    <span class="md">${isToday ? 'aujourd’hui' : dLabel(D)}${draftKg ? ` · ${n2(draftKg)} kg` : ''}</span>
  </div>

  ${step ? `<div class="wizbar">${COURSE_HUB.map(c => `<span class="${
      c.k === S.course ? 'on' : (S.draft.some(l => (l[2]||'plat') === c.k) ? 'done' : '')
      }" data-jump="${c.k}">${c.l}</span>`).join('')}</div>
    <div class="actions" style="margin:10px 0 2px">
      <button class="btn btn-1${inStep.length ? ' btn-go' : ''}" id="wizNext">${inStep.length
        ? `Valider ${step.label.toLowerCase()} ›`
        : (nextCourse(step.k)
            ? `Passer, pas ${/^[aeéiouh]/i.test(step.label) ? 'd’' : 'de '}${step.label.toLowerCase()} ›`
            : 'Terminer le repas ›')}</button>
    </div>
    <h2 class="sec">${platChoix ? 'Comment le saisir ?' : step.q}</h2>`
   : `<h2 class="sec">Comment le saisir ?</h2>`}

  ${step && QUICK[step.k] ? `
    <div class="drinkgrid">
      ${QUICK[step.k].map(([sl,l]) => `
        <button class="dcard" data-drink="${sl}">
          <span class="dn2">${l}</span>
          <span class="dk">${n0(F.get(sl).t * F.get(sl).p)} g CO₂e</span>
        </button>`).join('')}
    </div>
    <button class="drinkq${S.drinkMore ? ' on' : ''}" id="drinkMore" type="button"
      aria-expanded="${S.drinkMore}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>${S.drinkMore ? 'Refermer' : 'Chercher une autre boisson'}</span>
      <i aria-hidden="true">${S.drinkMore ? '\u2212' : '+'}</i>
    </button>
    ${S.drinkMore && (QUICK_PLUS[step.k] || []).length ? `
      <div class="drinkgrid" style="margin-top:10px">
        ${QUICK_PLUS[step.k].map(([sl,l]) => `
          <button class="dcard" data-drink="${sl}">
            <span class="dn2">${l}</span>
            <span class="dk">${n0(F.get(sl).t * F.get(sl).p)} g CO₂e</span>
          </button>`).join('')}
      </div>` : ''}
    <div class="src" style="margin-top:10px">${step.k === 'boisson'
      ? 'Touchez un verre pour l’ajouter, deux fois s’il y en a eu deux. Les volumes se corrigent plus bas. La barre ouvre les boissons protéinées et fermentées, puis toute la base.'
      : 'Touchez la tasse prise en fin de repas. La barre ouvre la recherche. Rien de tout cela ? Passez l’étape.'}</div>` : ''}

  ${step && QUICK[step.k] && !S.drinkMore ? '' : modeLine() + (!S.mode ? '' : (platChoix ? `
  <div class="modegrid" style="margin-top:12px">
    ${isPlat ? `
    <button class="mcard" data-path="std">
      <span class="mct">Standard</span>
      <span class="mcn">3 choix</span>
      <span class="mcs">Une protéine, un féculent, un légume, et la taille de l’assiette.
        Le plus rapide, et suffisant pour la plupart des repas de tous les jours.</span>
    </button>` : ''}
    <button class="mcard" data-path="compose">
      <span class="mct">Composer</span>
      <span class="mcn">${DB.foods.length + DISHES().length}</span>
      <span class="mcs">Une seule barre pour tout : les aliments bruts avec leurs grammes,
        et les plats types de la base. Le plus juste quand on sait ce qu’il y avait dedans.</span>
    </button>
    <button class="mcard" data-path="favoris"${
      habituels.length + etoiles.length ? '' : ' disabled aria-disabled="true"'}>
      <span class="mct">${SERV_MIENS[S.comCat] || 'Mes habitudes'}</span>
      <span class="mcn">${habituels.length + etoiles.length || '—'}</span>
      <span class="mcs">${habituels.length + etoiles.length
        ? `Ce que vous mettez le plus souvent ${SERV_LA[S.comCat] || 'ici'}, et vos plats en étoile.`
        : `Rien encore. Ce bloc se remplit tout seul à mesure que vous saisissez ${
            SERV_LA[S.comCat] || 'ce service'}.`}</span>
    </button>
    <button class="mcard" data-path="recettes"${
      mesRecettes.length ? '' : ' disabled aria-disabled="true"'}>
      <span class="mct">Mes recettes</span>
      <span class="mcn">${mesRecettes.length || '—'}</span>
      <span class="mcs">${mesRecettes.length
        ? 'Les plats que vous avez composés vous-même, et ceux repris d’un ami.'
        : 'Rien encore. Composez un plat puis enregistrez-le pour le retrouver ici.'}</span>
    </button>
  </div>` : `${voieLine(isPlat)}

  ${S.path === 'std' ? stdPanel() : ''}

  /* Le panneau « Plats types », deux listes empilées — les plats puis les
     aliments — a disparu avec la carte qui y menait. Ses deux listes sont
     désormais fondues et classées par pertinence dans le composeur, et ses
     plats en étoile ont rejoint le bloc des favoris. Trois endroits pour
     chercher la même chose, c'était deux de trop. */
  ${S.path === 'compose'  ? composePanel(resultats) : ''}
  ${S.path === 'favoris'  ? favorisPanel(habituels, etoiles) : ''}
  ${S.path === 'recettes' ? recettesPanel(mesRecettes) : ''}
`))}

  ${inStep.length ? `<div class="card" style="margin-top:12px">
    ${(step ? inStep.map(l => ({l, i:S.draft.indexOf(l)})) : S.draft.map((l,i) => ({l, i})))
      .map(x => `<div class="draft-line">
        <span class="nm">${esc(F.get(x.l[0]).n)}</span>
        <input class="qin" type="number" inputmode="numeric" min="1" step="5"
               data-qi="${x.i}" value="${x.l[1]}" aria-label="Grammes">
        <span class="kg">${n2(kgOf([x.l]))}</span>
        <button class="rm" data-rm="${x.i}" aria-label="Retirer">×</button>
      </div>`).join('')}
    <div class="total">
      <div><div class="unit">${step ? step.label : 'Total — ' + MEAL[S.meal].l.toLowerCase()}</div>
        <div class="small mute">${draftKg > BUDGET_J ? 'Ce repas dépasse le budget de la journée.'
          : `${Math.round(draftKg/BUDGET_J*100)} % du budget du jour.`}</div></div>
      <div class="v">${n2(step ? stepKg : draftKg)} <span class="unit">kg</span></div>
    </div>
    ${step && !QUICK[step.k] && inStep.length >= 2 ? `<button class="btn btn-2" data-savecourse="${S.comCat}"
      style="margin-top:10px">Enregistrer ${step.label.toLowerCase()} dans les plats types</button>` : ''}
  </div>` : ''}

  ${S.meal === 'pdj' && !editing && !S.pdjEdit && !pdjHab() ? `<div class="card" style="margin-top:12px">
      <p class="lede">Un petit-déjeuner habituel ?</p>
      <p class="small">Le matin se répète plus que le reste. Enregistrez celui-ci comme habitude et
        demain il suffira d’un geste.</p>
      <button class="btn ${S.pdjSave ? 'btn-1' : 'btn-2'}" id="pd_mark" aria-pressed="${!!S.pdjSave}"
        style="margin-top:4px">${S.pdjSave
          ? '✓ Ce petit-déjeuner deviendra mon habitude'
          : 'Enregistrer comme petit-déjeuner habituel'}</button>
    </div>` : ''}

  ${step ? ''
   : S.pdjEdit
     ? `<div class="actions" style="margin-top:14px">
        <button class="btn btn-1" id="pd_upd" ${S.draft.length ? '' : 'disabled'}>Enregistrer l’habitude</button>
        <button class="btn btn-2" id="pd_cancel">Annuler</button>
      </div>
      <div class="src" style="margin-top:8px">Aucun repas ne sera enregistré : vous modifiez seulement
        votre petit-déjeuner habituel.</div>`
     : `<div class="actions" style="margin-top:14px">
      <button class="btn btn-1" id="rec" ${S.draft.length ? '' : 'disabled'}>${
        S.editId ? 'Mettre à jour le repas'
        : S.pdjSave ? 'Enregistrer le repas et mon habitude'
        : 'Enregistrer le repas'}</button>
      <button class="btn btn-2" id="fav" ${S.draft.length ? '' : 'disabled'}>Garder en favori</button>
    </div>
    ${S.meal === 'pdj' && !editing && S.draft.length && pdjHab() && !pdjSame() && !S.pdjSave
      ? `<button class="btn btn-2" id="pd_repl" style="margin-top:8px">Enregistrer et remplacer mon habitude</button>`
      : ''}`}`;

  /* ---------------- liaisons ---------------- */
  const sb = $('#sBack');
  if(sb) sb.onclick = () => {
    const pv = step && prevCourse(step.k);
    if(pv) return openCourse(pv);
    /* Pas de service précédent : on remonte à la provenance, qui est l'écran
       d'avant depuis qu'elle a sa page. */
    S.step = 'mode'; renderSaisie();
  };
  const ce = $('#canceledit');
  if(ce) ce.onclick = () => { S.editId = null; S.draft = []; S.step = 'home'; renderSaisie(); };

  const pm = $('#pd_mark');
  if(pm) pm.onclick = () => { S.pdjSave = !S.pdjSave; renderSaisie(); };
  const pr = $('#pd_repl');
  if(pr) pr.onclick = () => { S.pdjSave = true; commitMeal(); };
  const pu = $('#pd_upd');
  if(pu) pu.onclick = () => {
    if(!S.draft.length) return toast('Rien à enregistrer');
    pdjHabSet(S.draft, S.mode);
    S.draft = []; S.pdjEdit = false; S.pdjNew = false; S.step = 'home'; renderSaisie();
    toast('Petit-déjeuner habituel mis à jour');
  };
  const pc = $('#pd_cancel');
  if(pc) pc.onclick = () => {
    S.draft = []; S.pdjEdit = false; S.pdjNew = false; S.step = 'home'; renderSaisie();
  };

  const dqEl = $('#dq');
  if(dqEl) dqEl.oninput = e => { S.dishQ = e.target.value; const p = e.target.selectionStart;
    renderSaisie(); const n = $('#dq'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const dqx = $('#dqx');
  if(dqx) dqx.onclick = () => { S.dishQ = ''; renderSaisie(); const n = $('#dq'); if(n) n.focus(); };

  /* La ligne de provenance remplace l'ancien sélecteur `[data-mode]` : elle
     renvoie à la page dédiée, qui saura revenir ici grâce à S.modeFrom. */
  const meEd = $('#modeEdit'); if(meEd) meEd.onclick = gotoMode;
  const voEd = $('#voieEdit');
  if(voEd) voEd.onclick = () => { S.path = null; S.dishQ = ''; renderSaisie(); };
  view.querySelectorAll('[data-path]').forEach(b => b.onclick = () => { S.path = b.dataset.path; renderSaisie(); });
  view.querySelectorAll('[data-dish]').forEach(b => b.onclick = () => {
    S.openDish = S.openDish === b.dataset.dish ? null : b.dataset.dish; renderSaisie(); });

  /* Volontairement sur le catalogue entier : un repas enregistré du temps où la
     marque était cochée doit rester relisible après décochage. */
  const findItem = n => S.favs.find(f => f.n === n) || DB.dishes.find(d => d.n === n);
  view.querySelectorAll('[data-additem]').forEach(b => b.onclick = () => {
    const d = findItem(b.dataset.additem);
    if(d){ modeAuto(d); d.l.forEach(l => S.draft.push([l[0], l[1], S.comCat, S.mode]));
           /* Un plat type porte ses propres grammages : la taille demandée au
              composeur standard ne le concerne pas et ne doit pas court-circuiter
              le garde-fou de portion. */
           S.platLarge = false;
           renderSaisie(); toast(`${d.n} ajouté`); } });
  view.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    const n = b.dataset.star, fi = S.favs.findIndex(f => f.n === n);
    if(fi >= 0){ S.favs.splice(fi, 1); toast(`${n} retiré des favoris`); }
    else if(S.starred.includes(n)){ S.starred = S.starred.filter(x => x !== n); }
    else { S.starred.push(n); toast(`${n} mis en favori`); }
    save(); renderSaisie(); });
  view.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    S.draft.splice(+b.dataset.rm, 1); renderSaisie(); });

  /* comPortion() et non la portion brute : une tomate ajoutée en entrée pèse
     55 % d'une portion de plat, et en dessert 60 %. C'est ce que faisait
     l'ancien widget d'autocomplétion ; le perdre en changeant de barre de
     recherche aurait gonflé toutes les entrées d'un coup, sans rien dire. */
  /* Une habitude s'ajoute avec SA portion, celle qu'on a l'habitude d'y
     mettre, et non la portion de référence de l'aliment. */
  view.querySelectorAll('[data-habadd]').forEach(b => b.onclick = () => {
    const sl = b.dataset.habadd, g = Math.max(1, +b.dataset.habg || 0);
    if(!F.has(sl) || !g) return;
    S.draft.push([sl, g, S.comCat, S.mode]);
    S.platLarge = false;
    renderSaisie(); toast(`${F.get(sl).n} ajouté`);
  });
  view.querySelectorAll('[data-foodadd]').forEach(b => b.onclick = () => {
    const sl = b.dataset.foodadd;
    if(!F.has(sl)) return;
    S.draft.push([sl, comPortion(sl), S.comCat, S.mode]);
    S.platLarge = false;
    renderSaisie(); toast(`${F.get(sl).n} ajouté`);
  });
  view.querySelectorAll('[data-foodinfo]').forEach(b => b.onclick = () => foodSheet(b.dataset.foodinfo));

  view.querySelectorAll('[data-savecourse]').forEach(b => b.onclick = () => saveCourse(b.dataset.savecourse));

  /* Poids modifiables : on écrit au changement et non à chaque frappe, sinon un
     champ vidé pour être retapé vaudrait zéro le temps d'une frappe. */
  view.querySelectorAll('[data-qi]').forEach(inp => inp.onchange = () => {
    const i = +inp.dataset.qi, v = Math.max(1, Math.round(+inp.value || 0));
    if(!S.draft[i]) return;
    S.draft[i][1] = v; renderSaisie();
  });

  /* Voie Standard */
  view.querySelectorAll('[data-std]').forEach(b => b.onclick = () => {
    S[b.dataset.std] = b.dataset.slug || null; renderSaisie(); });
  view.querySelectorAll('[data-stdsize]').forEach(b => b.onclick = () => {
    S.stdSize = b.dataset.stdsize; renderSaisie(); });
  const stdOk = $('#std_ok');
  if(stdOk && !stdOk.disabled) stdOk.onclick = () => {
    const lg = stdLignes();
    lg.forEach(l => S.draft.push([...l]));
    /* La taille vient d'être demandée : le garde-fou de portion ne la
       redemandera pas à la validation. */
    S.platLarge = S.stdSize === 'large';
    S.stdP = null; S.stdF = null; S.stdL = null;
    renderSaisie(); toast('Plat standard ajouté');
  };

  /* « Autre » : la grille de raccourcis ne peut pas tout contenir, et allonger la
     liste indéfiniment la rendrait illisible. Le bouton déplie sous elle la
     recherche complète — plats types et aliments — sans quitter l'étape. */
  const dm = $('#drinkMore');
  if(dm) dm.onclick = () => {
    S.drinkMore = !S.drinkMore;
    /* Le dépliage donne accès à la recherche, qui exige un mode de préparation :
       sans lui, modeLine() n'affiche pas de libellé et le coefficient vaut 1 par
       défaut sans que rien ne le dise. On préselectionne donc le mode neutre.
       Les clés de MODE sont frais / surgele / resto — pas 'maison', qui n'est
       que le libellé affiché de 'frais'. */
    if(S.drinkMore && !S.mode) S.mode = 'frais';
    renderSaisie();
    if(S.drinkMore){ const n = $('#dq'); if(n) n.focus(); }
  };

  /* raccourcis de boisson : s'ajoutent au service en cours, sans quitter l'étape */
  view.querySelectorAll('[data-drink]').forEach(b => b.onclick = () => {
    const sl = b.dataset.drink;
    S.draft.push([sl, F.get(sl).p, S.comCat, S.mode]);
    renderSaisie(); toast(`${F.get(sl).n} ajouté`);
  });

  const wn = $('#wizNext');
  if(wn) wn.onclick = () => validateCourse(S.course);
  /* le fil des services permet de sauter directement de l'un à l'autre */
  view.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => openCourse(b.dataset.jump));


  const rec = $('#rec');
  if(rec && !rec.disabled) rec.onclick = commitMeal;
  const fv = $('#fav');
  if(fv && !fv.disabled) fv.onclick = () => openSheet(`
      <h3>Garder en favori</h3>
      <p class="small mute">Ce repas réapparaîtra dans la liste, étoilé et en tête.</p>
      <input class="search" id="favname" value="${esc(MEAL[S.meal].l)} type" style="margin-top:6px">
      <div class="actions">
        <button class="btn btn-1" id="favok">Enregistrer</button>
        <button class="btn btn-2" onclick="closeSheet()">Annuler</button>
      </div>`) || setTimeout(() => {
        $('#favok').onclick = () => {

/* ============================ onglet 3 — tracker ============================ */
function agg(){
  const days = {};
  S.hist.forEach(e => {
    const kg = kgOf(e.l);
    days[e.d] = days[e.d] || {tot:0, byMeal:{}};
    days[e.d].tot += kg;
    days[e.d].byMeal[e.m] = (days[e.d].byMeal[e.m] || 0) + kg;
  });
  const keys = Object.keys(days).sort();
  const tot = keys.reduce((a,k) => a + days[k].tot, 0);
  return {days, keys, tot, nd:keys.length, avg: keys.length ? tot/keys.length : 0};
}

/* Réservoir anonyme : ce qui a été saisi avant toute connexion. Le filtre sur
   le format d'identifiant écarte l'ancien jeu de démonstration, dont les ids
   étaient de la forme 2026-07-05dej et non e<timestamp>. */
function anonPayload(){
  try{
    const raw = localStorage.getItem(KEY_ANON);
    if(!raw) return null;
    const o = JSON.parse(raw);
    const h = (o.hist || []).filter(e => /^e\d/.test(e.id || ''));
    const pr = o.prof && Object.keys(o.prof).length ? o.prof : null;
    return (h.length || pr) ? {hist:h, favs:o.favs || [], prof:pr} : null;
  }catch(e){ return null; }
}

function offerImport(){
  const a = anonPayload();
  if(!a || S.hist.length) return;
  if(!a.hist.length && a.prof){   /* rien à reprendre sinon le profil : on le fait sans demander */
    S.prof = a.prof; save(); return;
  }
  openSheet(`
    <div class="unit">Premier accès à ce compte</div>
    <h3>Reprendre vos données ?</h3>
    <p class="small mute">Cet appareil contient ${a.hist.length} repas saisi${a.hist.length>1?'s':''}
      avant la création du compte${a.favs.length ? ` et ${a.favs.length} favori${a.favs.length>1?'s':''}` : ''}.
      Ils rejoindront votre compte et seront disponibles sur vos autres appareils.
      La copie d'origine reste intacte.</p>
    <div class="actions">
      <button class="btn btn-1" id="impok">Reprendre</button>
      <button class="btn btn-2" onclick="closeSheet()">Plus tard</button>
    </div>`);

const profSteps = () => PROFQ.filter(q => !q.only || q.only(S.prof));

function profDefault(q){
  if(q.k === 'objKg'){
    /* Le régime prime sur l'historique. Quelqu'un qui vient de déclarer manger
       végétarien n'a pas à se voir proposer une cible calculée sur trois jours
       de saisie qui n'ont peut-être rien de représentatifs. */
    const g = regG();
    if(g) return g.obj;
    const a = agg();
    if(a.nd >= 3) return Math.min(2500, Math.max(700, Math.round(a.avg * 365 * 0.8 / 50) * 50));
    return PROF_ANCRE[S.prof.situe] ? Math.max(700, PROF_ANCRE[S.prof.situe] - 400) : 1600;
  }
  if(q.k === 'calVal' || q.k === 'objCal'){
    /* Le curseur part du besoin estimé, jamais de zéro : une cible calorique
       proposée à 1 200 par défaut serait une suggestion de restriction. */
    const b = besoinCal();
    return b != null ? b : (S.prof.sexe === 'f' ? 2100 : 2600);
  }
  if(q.k === 'objVege'){
    const g = regG();
    return g ? g.vege : 3;
  }
  return null;
}

   interrompre. Hors ligne, elle repartira au prochain enregistrement. */

}

  if(!SESS || !SB.ready()) return;
  const r = await SB.rest('tastes?select=shared&user_id=eq.' + SESS.uid + '&limit=1');
  if(r.ok && r.body && r.body.length) S.tasteShared = !!r.body[0].shared;

    if(p.length < 3) return toast('Pseudo : trois caractères au moins');
    if(m.length < 8) return toast('Mot de passe : huit caractères au moins');
    g.disabled = true; g.textContent = 'Création…';
    const r = await SB.fn('signup', {pseudo:p, password:m});
    if(!r.ok){
      g.disabled = false; g.textContent = 'Créer mon compte';
      const e = (r.body || {}).error;
      return toast(e === 'pseudo_pris' ? 'Ce pseudo est déjà pris'
        : e === 'mot_de_passe_court' ? 'Mot de passe : 8 caractères minimum'
        : e === 'pseudo_invalide' ? 'Pseudo trop court ou invalide'
        : r.status === 0 ? 'Hors ligne : continuez sans compte, vous pourrez en créer un plus tard'
        : 'Création impossible');
    }
    /* Sexe et âge ont été saisis avant que le compte existe : ils vivent dans
       le stockage anonyme. load() bascule sur le stockage du compte, qui est
       vide — il faut donc les reporter après, sans quoi ils disparaissent au
       moment même où l'utilisateur vient de les donner. */
    const sexe = S.prof.sexe, age = S.prof.age;
    const code = r.body.recovery_code;
    const si = await SB.signIn(p, m);
    if(!si.ok){ return toast('Compte créé, mais connexion impossible'); }
    load();
    if(sexe) S.prof.sexe = sexe;
    if(age)  S.prof.age  = age;
    save();
    showRecoveryCode(code, 'Compte créé', () => profQuiz(i + 1));
  };
}

function profQuiz(i){
  const steps = profSteps();
  if(i < 0) return profileSheet();
  if(i >= steps.length){
    S.prof.done = true; S.prof.onb = true; save();
    return profileSheet();
  }
  const q = steps[i], cur = S.prof[q.k];
  const restant = steps.length - i - 1;
  const bar = steps.map((_, j) =>
    `<i class="${j < i ? 'on' : j === i ? 'now' : ''}"></i>`).join('');

  let corps = '';
  if(q.compte){
    corps = compteCorps();
  } else if(q.opts){
    /* Réponse suggérée par le régime déjà déclaré. Elle est signalée, jamais
       cochée : présélectionner reviendrait à enregistrer une réponse que
       personne n'a donnée, sur la seule question dont l'app veut comparer
       l'écart avec la mesure. */
    const reco = q.conseil && regG() ? regG()[q.conseil] : null;
    corps = q.opts.map(([v, lab, sub, ic]) => `
      <button class="qopt${q.big ? ' big' : ''}${v === reco ? ' reco' : ''}"
              data-v="${v}" aria-pressed="${cur === v}">
        ${q.ic && ic && QIC[ic] ? `<span class="qic">${QIC[ic]}</span>` : ''}
        <span class="qn">${lab}${v === reco ? '<span class="qtag">conseillé</span>' : ''}${
          sub ? `<span class="qs">${sub}</span>` : ''}</span>
        <span class="qk">✓</span>
      </button>`).join('');
  } else if(q.txt){
    corps = `<input class="search" id="q_txt" placeholder="${q.txt}" maxlength="40"
               value="${esc(cur || '')}" style="margin-top:4px">`;
  } else if(q.range){
    const val = cur != null ? cur : profDefault(q);
    corps = `
      <div class="qbig" id="q_out"></div>
      <input class="qrange" type="range" id="q_rng"
             min="${q.range.min}" max="${q.range.max}" step="${q.range.step}" value="${val}">
      <div class="qends"><span id="q_lo"></span><span id="q_hi"></span></div>
      <div class="src" id="q_hint" style="margin-top:10px"></div>`;
  } else if(q.prot){
    /* Trois temps plutôt qu'un écran chargé. Le poids d'abord, parce que sans
       lui rien ne peut s'afficher en grammes. Puis la valeur conseillée pour
       l'activité déclarée, avec son total : c'est la réponse pour la plupart
       des gens, et elle se valide sans rien toucher. Le curseur en g/kg n'entre
       en scène que si on demande à ajuster — le sortir d'emblée invite à
       bricoler un chiffre qu'on n'a pas de raison de connaître mieux que
       l'ANSES. */
    const gkg = protGkg2();
    corps = protPoids
      ? `<div class="qbig" id="q_out"></div>
         ${protAjuste
           ? `<input class="qrange" type="range" id="q_rng" min="0.6" max="2.2" step="0.05" value="${gkg}">
              <div class="qends"><span id="q_lo">0,6 g/kg</span><span id="q_hi">2,2 g/kg</span></div>`
           : `<button class="backlink" id="q_adj" style="margin-top:6px">Ajuster la quantité par kilo ›</button>`}
         <div class="src" id="q_hint" style="margin-top:10px"></div>
         <button class="backlink" id="q_repoids" style="margin-top:8px">‹ Corriger le poids (${
           n1(protPoids)} kg)</button>`
      : `<div class="qfield">
           <label for="q_poids">Votre poids corporel</label>
           <span style="display:flex;align-items:center;gap:8px">
             <input class="search" id="q_poids" type="number" inputmode="decimal" min="30" max="250"
                    step="0.5" placeholder="70" style="margin:0"> <b>kg</b></span>
         </div>
         <div class="src" style="margin-top:10px">Il sert à convertir des grammes par kilo en
           grammes par jour, le temps de cet écran. Il n’est ni enregistré, ni synchronisé.</div>`;
  }

  /* Le bouton d'action porte le libellé de ce qu'il fait vraiment : sur l'écran
     de compte il crée le compte, ailleurs il enregistre et avance. */
  const actions = q.compte
    ? `<button class="btn btn-1" id="q_signup">Créer mon compte</button>
       <button class="btn btn-2" id="q_skip">Continuer sans compte</button>`
    : `${q.opts ? '' : `<button class="btn btn-1" id="q_next"${
        q.prot && !protPoids ? '' : ''}>${i === steps.length - 1 ? 'Terminer' : 'Suivant ›'}</button>`}
       <button class="btn btn-2" id="q_skip">${cur != null && cur !== '' ? 'Garder, suivant' : 'Passer'}</button>`;

  openSheet(`
    <div class="unit">${SESS ? 'Profil' : 'Bienvenue'}</div>
    <h3 style="margin:2px 0 ${q.note ? '6' : '10'}px">${q.q}</h3>
    ${q.note ? `<p class="small mute" style="margin-bottom:10px">${q.note}</p>` : ''}
    ${corps}
    <div class="actions" style="margin-top:14px">${actions}</div>
    <button class="backlink" id="q_back" style="margin-top:6px">${
      i === 0 ? '‹ Retour au profil' : '‹ Question précédente'}</button>
    <div class="qdots">${bar}</div>
    <div class="qcount">${restant
      ? `question ${i + 1} sur ${steps.length} · ${restant} restante${restant > 1 ? 's' : ''}`
      : `dernière question`}</div>`);

  if(q.compte) bindCompte(i);

  /* choix : sélectionne et avance, un seul geste par question */
  $('#sheet').querySelectorAll('.qopt').forEach(b => b.onclick = () => {
    profSave(q.k, b.dataset.v);
    profQuiz(i + 1);
  });

  const tx = $('#q_txt');
  if(tx){
    const go = () => { profSave(q.k, tx.value.trim()); profQuiz(i + 1); };
    $('#q_next').onclick = go;
    tx.onkeydown = e => { if(e.key === 'Enter') go(); };
  }

  const pd = $('#q_poids');
  const rg = $('#q_rng');
  if(q.prot && !protPoids){
    /* Premier temps : le poids seul. */
    const go = () => {
      const kg = pd && pd.value ? +pd.value : null;
      if(!kg || kg < 30 || kg > 250) return toast('Indiquez un poids entre 30 et 250 kg');
      protPoids = kg; protAjuste = false; profQuiz(i);
    };
    $('#q_next').onclick = go;
    if(pd) pd.onkeydown = e => { if(e.key === 'Enter') go(); };
  } else if(q.prot){
    /* Le total ne s'affiche que si le poids est renseigné : afficher « 0 g »
       laisserait croire à une cible, alors qu'il manque une donnée. */
    const paint = () => {
      const gkg = rg ? +rg.value : protGkg2();
      const tot = Math.round(protPoids * gkg);
      $('#q_out').innerHTML = `${tot} <small>g de protéines / jour</small>`;
      const rec = protGkg(), act = ACT_LAB[(S.prof || {}).act] || 'actif';
      $('#q_hint').innerHTML =
        `${n1(gkg)} g/kg × ${n1(protPoids)} kg. La référence de l’ANSES pour un adulte est de `
        + `0,83 g/kg ; pour un profil ${act} cette app propose ${n1(rec)} g/kg`
        + (gkg > 2.0 ? '. Au-delà de 2 g/kg, la littérature d’entraînement ne montre plus de bénéfice.' : '.')
        + ' Le poids saisi n’est pas enregistré.';
    };
    if(rg) rg.oninput = paint;
    paint();
    const aj = $('#q_adj');
    if(aj) aj.onclick = () => { protAjuste = true; profQuiz(i); };
    const rp = $('#q_repoids');
    if(rp) rp.onclick = () => { protPoids = null; protAjuste = false; profQuiz(i); };
    $('#q_next').onclick = () => {
      const gkg = rg ? +rg.value : protGkg2();
      profSave('objProtGkg', gkg);
      profSave(q.k, Math.round(protPoids * gkg));
      protPoids = null; protAjuste = false;   /* ne survivent pas à l'étape */
      profQuiz(i + 1);
    };
  } else if(rg){
    const paint = () => {
      const v = +rg.value;
      if(q.k === 'calVal' || q.k === 'objCal'){
        const b = besoinCal();
        $('#q_out').innerHTML = `${n0(v)} <small>kcal / jour</small>`;
        $('#q_lo').textContent = '1 200';
        $('#q_hi').textContent = '4 000';
        const est = q.k === 'objCal' && b != null && S.prof.calKnow === 'non';
        $('#q_hint').innerHTML = q.k === 'calVal'
          ? 'Votre valeur est reprise telle quelle, sans correction. Les trois questions suivantes ne seront pas posées.'
          : (b != null
              ? `Votre besoin ${est ? 'estimé' : 'déclaré'} est de ${n0(b)} kcal/jour`
                + (v < b * 0.85 ? '. Cette cible est nettement en dessous : un écart durable de cette ampleur relève d’un suivi médical, pas d’une app.'
                   : v > b * 1.15 ? '. Cette cible est nettement au-dessus.' : '.')
              : 'Référence ANSES : 2 600 kcal/jour pour un homme de 18 à 69 ans, 2 100 pour une femme de 18 à 59 ans, à activité médiane.');
      } else if(q.k === 'objKg'){
        const f = DB.facts;
        $('#q_out').innerHTML = `${n0(v)} <small>kg CO₂e / an</small>`;
        $('#q_lo').textContent = 'budget 700';
        $('#q_hi').textContent = 'moyenne FR ' + n0(f.foodAbs);
        const dur = /carnivore|proteine/.test(S.prof.regime || '') && v < 1200;
        const g = regG();
        $('#q_hint').innerHTML = dur
          ? 'Cible exigeante pour le régime déclaré : sous 1 200 kg, un apport animal à chaque repas ne rentre arithmétiquement pas.'
          : g
            ? `Pour le régime que vous venez de déclarer — ${REG_LAB[S.prof.regime]} — une cible de `
              + `${g.objTxt} est cohérente. La moyenne française est de 2 000 kg, le budget soutenable de 700 kg.`
            : 'La moyenne française pour l’alimentation est de 2 000 kg, le budget soutenable de 700 kg.';
      } else {
        const g = regG();
        $('#q_out').innerHTML = `${v} <small>repas végé / semaine</small>`;
        $('#q_lo').textContent = '0';
        $('#q_hi').textContent = '14 · tous';
        $('#q_hint').innerHTML = (v === 0
          ? 'Aucun repas végé visé.'
          : `Soit ${(v / 14 * 100).toFixed(0)} % de vos repas, sur deux repas par jour.`)
          + (g ? ` Pour un profil ${REG_LAB[S.prof.regime]}, ${g.vege} repas végé par semaine est`
                 + ` un rythme tenable.` : '');
      }
    };
    rg.oninput = paint; paint();
    $('#q_next').onclick = () => { profSave(q.k, +rg.value); profQuiz(i + 1); };
  }

  $('#q_skip').onclick = () => profQuiz(i + 1);
  $('#q_back').onclick = () => profQuiz(i - 1);
}

/* Part du profil réellement remplie. L'écran de compte compte pour ses deux
   données exploitables — sexe et âge — et non pour le compte lui-même : on peut
   se servir de l'app sans compte, ce n'est pas un trou dans le profil.
   Le dénominateur suit les questions réellement posées : quelqu'un qui répond
   « pas d'objectifs » n'a pas à rester bloqué à 70 % pour des questions que
   sa propre réponse a fait disparaître. */
function profPct(){
  const st = profSteps().filter(q => !q.compte);
  const champs = ['sexe', 'age', ...st.map(q => q.k)];
  const n = champs.filter(k => { const v = S.prof[k]; return v != null && v !== ''; }).length;
  return champs.length ? Math.round(n / champs.length * 100) : 100;
}

/* Première question encore sans réponse, pour reprendre là où ça s'est arrêté
   plutôt que de tout refaire depuis le début. */
function profTrou(){
  if(!S.prof.sexe || !S.prof.age) return 0;
  const steps = profSteps();
  const j = steps.findIndex(q => !q.compte && (S.prof[q.k] == null || S.prof[q.k] === ''));
  return j < 0 ? 0 : j;
}

/* Rappel pour les comptes existants dont le profil est resté à moitié rempli.
   Il ne prétend pas que des fonctions sont verrouillées — elles ne le sont
   pas — mais dit lesquelles restent éteintes faute de données : promettre un
   déverrouillage que l'app ne peut pas tenir se retournerait au premier clic. */
function profRappel(){
  const p = profPct();
  if(S.prof.noAsk || p >= 100 || !S.hist.length) return '';
  return `
    <div class="tip warn" style="margin-top:14px">
      <span class="ic">!</span>
      <div style="min-width:0">
        <b>Votre profil est rempli à ${p} %.</b>
        <div class="small" style="margin-top:3px">Le suivi des calories et des protéines, la cible
          annuelle et l’écart avec votre estimation ont besoin des réponses manquantes pour
          s’afficher. Il reste quelques questions.</div>
        <div class="actions" style="margin-top:10px">
          <button class="btn btn-1" id="pr_go">Compléter mon profil</button>
          <button class="btn btn-2" id="pr_no">Non, ne plus me demander</button>
        </div>
      </div>
    </div>`;
}

function bindRappel(){
  const g = $('#pr_go'); if(g) g.onclick = () => profQuiz(profTrou());
  const n = $('#pr_no');
  if(n) n.onclick = () => { S.prof.noAsk = true; save(); renderTracker(); toast('Entendu'); };
}

/* Libellés courts des régimes, partagés par le questionnaire et le résumé. */
const REG_LAB = {vegetalien:'végétalien', vegetarien:'végétarien', flexitarien:'flexitarien',
                 proteine:'tout pour la prot', carnivore:'carnivore'};

/* résumé du profil, affiché dans la fenêtre de la pastille */
function profRows(){
  const L = {
    gout:{t:'Goût', v:{sucre:'Sucré', sale:'Salé', deux:'Les deux'}},
    cuisine:{t:'Cuisine', v:{traditionnelle:'Traditionnelle', francaise:'Française',
      mediterraneenne:'Méditerranéenne', italienne:'Italienne', asiatique:'Asiatique'}},
    regime:{t:'Régime', v:{vegetalien:'Végétalien', vegetarien:'Végétarien',
      flexitarien:'Flexitarien', proteine:'Tout pour la prot', carnivore:'Carnivore'}},
  };
  const r = [];
  if(S.prof.gout) r.push([L.gout.t, L.gout.v[S.prof.gout]]);
  if(S.prof.plat) r.push(['Plat', S.prof.plat]);
  if(S.prof.dessert) r.push(['Dessert', S.prof.dessert]);
  if(S.prof.cuisine) r.push([L.cuisine.t, L.cuisine.v[S.prof.cuisine]]);
  if(S.prof.regime) r.push([L.regime.t, L.regime.v[S.prof.regime]]);
  if(S.prof.situe) r.push(['Estimation', {dessus:'Au-dessus de la moyenne',
    moyenne:'Dans la moyenne', dessous:'Sous la moyenne',
    budget:'Dans le budget'}[S.prof.situe] + ' · ' + n0(PROF_ANCRE[S.prof.situe]) + ' kg']);
  if(S.prof.objKg != null) r.push(['Cible', n0(S.prof.objKg) + ' kg / an']);
  if(S.prof.objVege != null) r.push(['Végétal', S.prof.objVege + ' repas / sem.']);
  const bc = besoinCal();
  if(bc != null) r.push(['Besoin', n0(bc) + ' kcal / j'
    + (S.prof.calKnow === 'non' ? ' (estimé)' : '')]);
  if(S.prof.act) r.push(['Activité', ACT_LAB[S.prof.act]]);
  if(S.prof.objCal != null) r.push(['Cible calorique', n0(S.prof.objCal) + ' kcal / j']);
  if(S.prof.objProt != null) r.push(['Cible protéines', n0(S.prof.objProt) + ' g / j'
    + (S.prof.objProtGkg != null ? ` (${n1(S.prof.objProtGkg)} g/kg)` : '')]);
  return r;
}

/* L'écart entre l'estimation et la mesure : la seule chose que ce
   questionnaire produit d'analytique. Affiché seulement quand il y a de quoi
   mesurer — une semaine de saisies. */
function profEcart(){
  if(!S.prof.situe) return '';
  const a = agg();
  const dit = PROF_ANCRE[S.prof.situe];
  if(a.nd < 7) return `<div class="src" style="margin-top:8px">Vous vous estimiez
    « ${{dessus:'au-dessus de la moyenne', moyenne:'dans la moyenne', dessous:'sous la moyenne',
        budget:'dans le budget'}[S.prof.situe]} ». Encore ${7 - a.nd} jour(s)
    de saisie et l’app pourra confronter cette estimation à la mesure.</div>`;
  const vrai = a.avg * 365, d = vrai - dit;
  return `<div class="hr"></div>
    <div class="stagelist">
      <span class="unit">Estimé</span><span class="small">${n0(dit)} kg / an</span><span></span>
      <span class="unit">Mesuré</span><span class="small">${n0(vrai)} kg / an sur ${a.nd} jours</span><span></span>
    </div>
    <div class="src" style="margin-top:8px">${Math.abs(d) < 200
      ? 'Estimation juste, à moins de 200 kg près.'
      : d < 0 ? `Vous mangez ${n0(-d)} kg de moins que vous ne le pensiez.`
              : `Vous mangez ${n0(d)} kg de plus que vous ne le pensiez.`}</div>`;
}

/* Fenêtre de profil : unique point d'entrée du compte. Elle remplace la carte
   qui vivait dans le Tracker — deux portes vers la même chose se contredisent
   tôt ou tard. */
/* ==================== page Profil ====================
   C'était une fenêtre montante, c'est devenu un écran. La raison est simple :
   le contenu avait dépassé ce qu'une feuille peut porter — profil, objectifs,
   habitude du matin, affichage, notifications, catalogues, compte. Une feuille
   qu'on fait défiler sur trois écrans n'est plus une feuille, c'est une page
   qui s'excuse d'en être une. Les fenêtres restent pour ce qui est court et
   modal : le questionnaire, le diagnostic, la déconnexion.

   L'entrée se fait par l'hexagone du header, pas par la barre d'onglets : le
   profil se consulte de temps en temps, les cinq onglets sont les gestes
   quotidiens et leur place est comptée.

   `profileSheet()` reste sous ce nom et redirige ici. Une quinzaine d'endroits
   l'appellent pour se repeindre après un changement d'état — bascule des
   données nutritionnelles, ajout d'un catalogue, abonnement au push — et les
   renommer tous n'apporterait rien qu'un risque d'en oublier un. */

/* D'où l'on vient, pour le lien de retour. Volontairement hors de S : ce n'est
   pas un état à conserver d'une session à l'autre, seulement le souvenir du
   dernier onglet de cette visite. */
let pfFrom = 'tracker';

/* Les blocs du profil ont été écrits pour une feuille, où chacun s'ouvrait sur
   un filet de séparation. Dans une page à cartes ce filet tombe en haut d'une
   carte et se lit comme un soulignement de titre. On le retire ici plutôt que
   d'ajouter un paramètre à cinq fonctions. */
const sansFilet = h => String(h).replace(/^\s*<div class="hr"><\/div>/, '');

/* Apparence. Même segment que la fenêtre de réglages de l'engrenage — c'est
   délibérément le même contrôle à deux endroits : l'engrenage est l'accès
   rapide, le profil est l'endroit où l'on s'attend à trouver ses préférences. */
function themeBlock(){
  const opts = [
    ['light','Clair','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>'],
    ['dark','Sombre','<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>'],
    ['system','Auto','<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>']
  ];
  return `
    <div class="setrow" style="padding-top:0">
      <div class="l">Apparence<i>« Auto » suit le réglage de l’iPhone.</i></div>
      <div class="themeseg" id="tseg2">
        ${opts.map(([k,l,ic]) => `<button data-theme-opt="${k}" aria-pressed="${themeMode===k}">${ic}${l}</button>`).join('')}
      </div>
    </div>`;
}

/* Accès au centre de notifications, avec son compte de non-lues. La liste elle
   même reste une feuille : on la parcourt, on tape une ligne, elle s'efface —
   c'est exactement l'usage d'une fenêtre montante. */
function notesRow(){
  const n = notesNonLus();
  return `
    <div class="total" style="margin-top:0">
      <div style="min-width:0"><div class="unit">Centre de notifications</div>
        <div class="small mute">${!SESS
          ? 'Il faut un compte : les notifications sont rattachées à une identité.'
          : n ? `${n} non lue${n > 1 ? 's' : ''} · rappel du soir, j’aime, amis, défis, badges.`
              : 'Tout est lu. Rappel du soir, j’aime, demandes d’amis, défis et badges.'}</div></div>
      ${n ? `<div class="v" style="font-size:19px;color:var(--brick)">${n > 9 ? '9+' : n}</div>` : ''}
    </div>
    <button class="btn btn-2" id="pf_notes" style="margin-top:8px">Voir mes notifications</button>`;
}

function renderProfil(){
  const hex = `<svg viewBox="0 0 100 112" style="width:62px;height:70px;overflow:visible" aria-hidden="true">
      <polygon points="50,4 92,29 92,79 50,104 8,79 8,29"
        fill="var(--active)" stroke="${SESS ? 'var(--straw)' : 'var(--line)'}" stroke-width="3"/>
      <g fill="${SESS ? 'var(--forest)' : 'var(--line)'}">
        <circle cx="50" cy="44" r="12.5"/>
        <path d="M27 88c0-12.7 10.3-23 23-23s23 10.3 23 23z"/>
      </g>

/* ==================== diagnostic serveur ====================
   Chaque dépendance testée séparément, avec son code HTTP. Le but est de
   distinguer une table absente d'un refus de droits et d'une panne réseau :
   ces trois pannes donnent le même symptôme côté utilisateur — « ça ne marche
   pas » — et des remèdes entièrement différents. */
async function diagSheet(){
  openSheet(`<div class="unit">Diagnostic</div>
    <h3 style="margin:2px 0 10px">Vérification en cours…</h3>
    <p class="small mute">Une ligne par dépendance.</p>`);

  const tests = [
    ['Profils',        'profiles?select=id&limit=1'],
    ['Repas',          'entries?select=entry_id&limit=1'],
    ['Demandes d’ami', 'friend_requests?select=status&limit=1'],
    ['Amitiés',        'my_friends?select=friend'],
    ['Fiches goûts',   'tastes?select=shared&limit=1'],
    ['Publications',   'posts?select=id&limit=1'],
    ['Destinataires',  'post_people?select=post&limit=1'],
    ['Communautés',    'communities?select=id&limit=1'],
  ];
  const out = [];
  for(const [nom, req] of tests){
    const r = await SB.rest(req);
    const txt = JSON.stringify(r.body || {});
    let verdict, ton;
    if(r.status === 0){ verdict = 'hors ligne'; ton = 'var(--mute)'; }
    else if(/PGRST205|schema cache/i.test(txt)){ verdict = 'TABLE ABSENTE'; ton = 'var(--brick)'; }
    else if(r.status === 401 || r.status === 403 || /42501|permission denied/.test(txt)){
      verdict = 'accès refusé (' + r.status + ')'; ton = 'var(--brick)'; }
    else if(r.ok){ verdict = 'ok · ' + (Array.isArray(r.body) ? r.body.length + ' ligne(s)' : 'ok');
                   ton = 'var(--forest)'; }
    else { verdict = 'erreur ' + r.status; ton = 'var(--brick)'; }
    out.push([nom, verdict, ton]);
  }

  const manquantes = out.filter(x => x[1] === 'TABLE ABSENTE').map(x => x[0]);

  /* Identité : la comparaison qui explique la plupart des refus d'écriture. */
  let ident = 'pas de session', tonId = 'var(--mute)';
  if(SESS){
    const srv = await SB.whoami();
    if(!srv){ ident = 'serveur injoignable'; tonId = 'var(--mute)'; }
    else if(srv === SESS.uid){ ident = 'concordante'; tonId = 'var(--forest)'; }
    else { ident = 'DIVERGENTE'; tonId = 'var(--brick)'; }
  }
  out.push(['Identité locale / serveur', ident, tonId]);
  out.push(['Auteur envoyé', (SESS && SESS.uid) ? String(SESS.uid).slice(0,18) + '…' : 'VIDE',
            (SESS && SESS.uid) ? 'var(--forest)' : 'var(--brick)']);

  /* Ce que la base lira dans le jeton : la comparaison décisive. */
  const cl = SB.claims();
  if(SESS && !cl) out.push(['Jeton', 'illisible', 'var(--brick)']);
  else if(cl){
    out.push(['Jeton · role', String(cl.role || 'absent'),
              cl.role === 'authenticated' ? 'var(--forest)' : 'var(--brick)']);
    out.push(['Jeton · sub', cl.sub ? String(cl.sub).slice(0,18) + '…' : 'ABSENT',
              (cl.sub && SESS && cl.sub === SESS.uid) ? 'var(--forest)' : 'var(--brick)']);
    const exp = cl.exp ? new Date(cl.exp * 1000) : null;
    out.push(['Jeton · expiration', exp
      ? (exp > new Date()
          ? 'valide jusqu’à ' + exp.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})
          : 'EXPIRÉ à ' + exp.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))
      : 'inconnue', (exp && exp > new Date()) ? 'var(--forest)' : 'var(--brick)']);
  }

  /* Test d'écriture réel : les lectures ci-dessus ne prouvent rien sur les
     droits d'écriture, qui sont précisément ce qui bloque le partage. On insère
     une publication sonde, puis on la retire. */
  let ecriture = 'non testée', tonEcr = 'var(--mute)';
  if(SESS){
    const auteur = await SB.uid();
    const w = await SB.rest('posts?select=id', {method:'POST',
      headers:{Prefer:'return=representation'},
      body: JSON.stringify({author:auteur, kind:'badge', body:{key:'__sonde__', label:'Test'}})});
    if(w.ok && w.body && w.body.length){
      ecriture = 'ok'; tonEcr = 'var(--forest)';
      await SB.rest('posts?id=eq.' + w.body[0].id, {method:'DELETE'});
    } else {
      const m = (w.body && (w.body.message || w.body.code)) || '';
      ecriture = w.status === 0 ? 'hors ligne'
        : /PGRST205|schema cache/i.test(JSON.stringify(w.body||{})) ? 'TABLE ABSENTE'
        : (w.status + (m ? ' · ' + String(m).slice(0,54) : ''));
      tonEcr = 'var(--brick)';
    }
  }
  out.push(['Écrire une publication', ecriture, tonEcr]);

  const nAmis = S.fr.friends.length;
  const acquis = TROPHIES.filter((t,i) => troValue(t, scoring()) >= t.need).length;

  openSheet(`
    <div class="unit">Diagnostic</div>
    <h3 style="margin:2px 0 10px">${manquantes.length ? 'Schéma incomplet' : 'Serveur conforme'}</h3>
    <div class="stagelist">
      <span class="unit">Version</span><span class="small">${BUILD}</span><span></span>
      <span class="unit">Session</span><span class="small">${SESS ? esc(SESS.username) : 'déconnecté'}</span><span></span>
      <span class="unit">Amis acceptés</span><span class="small">${nAmis}</span><span></span>
      <span class="unit">Badges acquis</span><span class="small">${acquis}</span><span></span>
    </div>
    <div class="hr"></div>
    <div class="stagelist">
      ${out.map(([n,v,c]) => `<span class="unit">${n}</span>
        <span class="small" style="color:${c}">${v}</span><span></span>`).join('')}
    </div>
    <div class="hr"></div>
    <div class="small">${(() => {
        const c = SB.claims();
        if(SESS && c && c.role !== 'authenticated')
          return `<b>Le jeton porte le rôle « ${esc(String(c.role))} » et non « authenticated ».</b>
            Aucune policy ne s’applique donc à vos écritures, d’où le refus, tandis que les lectures
            renvoient zéro ligne sans erreur apparente. Déconnectez-vous et reconnectez-vous ; si cela
            persiste, le jeton n’est pas celui qu’attend le projet.`;
        if(SESS && c && !c.sub)
          return `<b>Le jeton ne contient aucun identifiant (« sub »).</b> La base ne peut donc pas
            savoir qui écrit, et toute insertion contrôlée sur l’auteur échoue.`;
        if(SESS && c && SESS.uid && c.sub !== SESS.uid)
          return `<b>Le jeton désigne ${esc(String(c.sub).slice(0,12))}… alors que l’app envoie
            ${esc(String(SESS.uid).slice(0,12))}…</b> C’est cet écart que la policy refuse.
            Reconnectez-vous pour les réaligner.`;
        return '';
      })() ||
      (manquantes.length
        ? `Il manque ${manquantes.length} table${manquantes.length>1?'s':''} : <b>${manquantes.join(', ')}</b>.
           Le partage de badge a besoin de <b>Publications</b> et <b>Destinataires</b>, créées par
           <b>social_schema.sql</b>. Passez ce fichier dans Supabase, puis relancez ce diagnostic.`
        : !SESS ? `Aucune session : connectez-vous depuis votre profil.`
        : ident === 'DIVERGENTE' ? `<b>L’identité locale ne correspond plus à celle du serveur.</b>
           Toute écriture sera refusée avec « new row violates row-level security policy », puisque la
           base compare l’auteur envoyé à l’identité du jeton. Déconnectez-vous puis reconnectez-vous
           depuis votre profil : le simple redémarrage de l’app la réaligne aussi.`
        : ecriture !== 'ok' && ecriture !== 'non testée' ? `Les lectures passent mais <b>l’écriture est refusée</b> :
           <i>${esc(String(ecriture))}</i>. C’est ce qui bloque le partage — la cause est côté droits
           ou policy sur la table des publications, pas côté application.`
        : nAmis === 0 ? `L’écriture fonctionne, mais aucune amitié <b>acceptée</b>. Un badge est adressé
           nominativement : sans destinataire, personne ne le verrait. Une demande en attente ne compte pas.`
        : acquis === 0 ? `Tout fonctionne, mais aucun badge acquis pour l’instant — le bouton de partage
           n’apparaît que sur un badge obtenu.`
        : `Rien ne s’oppose au partage : l’écriture d’essai a réussi et a été effacée.`)}</div>
    <button class="btn btn-2" id="dg_again" style="margin-top:12px">Relancer</button>`);
  const b = $('#dg_again');
  if(b) b.onclick = diagSheet;
}

    sy.disabled = true; sy.textContent = 'Synchro…';
    await syncNow(false); closeSheet(); go(S.tab);
  };

  const inb = $('#ac_in');
  if(inb) inb.onclick = async () => {
    const p = ($('#ac_p').value || '').trim(), m = $('#ac_m').value || '';
    if(!p || !m) return toast('Pseudo et mot de passe');
    inb.disabled = true; inb.textContent = 'Connexion…';
    const r = await SB.signIn(p, m);
    if(!r.ok){
      inb.disabled = false; inb.textContent = 'Se connecter';
      return toast(r.status === 0 ? 'Hors ligne' : 'Pseudo ou mot de passe incorrect');
    }
    load(); go(S.tab);
    const a = anonPayload();
    if(!S.hist.length && a) offerImport();
    await syncNow(true); go(S.tab);
  };
  const up = $('#ac_up');
  if(up) up.onclick = () => {
    const p = ($('#ac_p').value || '').trim(), m = $('#ac_m').value || '';
    if(SB.slugify(p).length < 2) return toast('Pseudo trop court');
    if(m.length < 8) return toast('Mot de passe : 8 caractères minimum');
    signupSheet(p, m);
  };
  const lost = $('#ac_lost');
  if(lost) lost.onclick = () => recoverSheet(($('#ac_p').value || '').trim());
}

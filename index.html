function badgeSrc(nom){ return (nom && BADGE_IMG[nom]) || null; }

/* L'animation de célébration VegeWeek affiche la carotte en fond CSS. Plutôt que
   d'écrire son data URI une seconde fois dans la feuille de styles, on alimente
   --b-carotte depuis cette table : une seule copie du fichier dans la page. */
try{ document.documentElement.style.setProperty('--b-carotte',
       `url(${BADGE_IMG['b-carotte.webp']})`); }catch(e){}

function medal(t, done, i){
  const p = PAL[t.pal], got = done >= t.need, pct = Math.min(1, done / t.need);
  const R = 40, C = 2 * Math.PI * R;
  const img = badgeSrc(t.img);

  /* Badge illustré : le dessin est posé dans un disque teinté de sa palette et
     cerclé comme les autres médailles. Un fond clair plutôt qu'un dégradé —
     ces illustrations sont un trait sombre sur crème, un fond saturé les
     mangerait. Verrouillé, le disque est gris et le dessin éteint, entouré de
     l'anneau de progression : voir ce qu'on n'a pas encore vaut mieux qu'une
     silhouette anonyme. */
  if(img){
    const cid = 'bc' + String(i).replace(/[^\w-]/g, '');
    return `<svg viewBox="0 0 88 88" aria-hidden="true">
      <defs><clipPath id="${cid}"><circle cx="44" cy="44" r="${got ? 36 : 31}"/></clipPath></defs>
      ${got
        ? `<circle cx="44" cy="44" r="36" fill="${p.rim}" opacity=".6"/>`
        : `<circle cx="44" cy="44" r="${R}" fill="none" stroke="var(--track)" stroke-width="6"/>
           <circle cx="44" cy="44" r="${R}" fill="none" stroke="${p.rim}" stroke-width="6" stroke-linecap="round"
             stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 44 44)" opacity=".85"/>
           <circle cx="44" cy="44" r="31" fill="var(--track)"/>`}
      <g clip-path="url(#${cid})">
        <image href="${img}" x="${got ? 9 : 14}" y="${got ? 9 : 14}"
          width="${got ? 70 : 60}" height="${got ? 70 : 60}" preserveAspectRatio="xMidYMid meet"
          ${got ? '' : 'opacity=".32" style="filter:grayscale(1)"'}/>
      </g>
      ${got ? `<circle cx="44" cy="44" r="36" fill="none" stroke="${p.jonc}" stroke-width="2.2" opacity=".85"/>
        <circle cx="44" cy="44" r="31.5" fill="none" stroke="${p.jonc}" stroke-width="1" opacity=".4"/>` : ''}
    </svg>`;
  }

  if(got) return `<svg viewBox="0 0 88 88" aria-hidden="true">
    <defs><linearGradient id="mg${i}" x1=".08" y1="0" x2=".92" y2="1">
      ${p.g.map(([o,c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}
    </linearGradient></defs>
    <circle cx="44" cy="44" r="36" fill="url(#mg${i})"/>
    <circle cx="44" cy="44" r="36" fill="none" stroke="#000" stroke-width="1.4" opacity=".32"/>
    <circle cx="44" cy="44" r="36" fill="none" stroke="${p.rim}" stroke-width="3.4"
      stroke-dasharray="2.6 4.4" opacity=".55"/>
    <circle cx="44" cy="44" r="27.5" fill="none" stroke="${p.jonc}" stroke-width="1.1" opacity=".75"/>
    ${tribar(p.eng)}
  </svg>`;
  return `<svg viewBox="0 0 88 88" aria-hidden="true">
    <circle cx="44" cy="44" r="${R}" fill="none" stroke="var(--track)" stroke-width="6"/>
    <circle cx="44" cy="44" r="${R}" fill="none" stroke="${p.rim}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 44 44)" opacity=".85"/>
    <circle cx="44" cy="44" r="31" fill="var(--track)"/>
    <g style="color:var(--mute)">${tribar(new Array(6).fill('currentColor'), LOCK_OP)}</g>
  </svg>`;
}

function troSheet(i){
  const sc = scoring(), t = TROPHIES[i], v = troValue(t, sc), got = v >= t.need;
  const fmt = x => t.u === 'kg' ? (x >= 1000 ? n2(x/1000) + ' t' : n0(x) + ' kg') : n0(x);
  openSheet(`
    <div class="unit">${got ? 'Trophée obtenu' : 'Trophée à venir'}</div>
    <div class="trodet">${badgeSrc(t.img) ? '' : `<span class="te">${t.e}</span>`}<span class="tn">${esc(t.n)}</span></div>
    <div class="small mute">Seuil : ${fmt(t.need)}${t.u !== 'kg' ? ' ' + uLabel(t.u, t.need) : ' de CO₂e évités'}</div>
    <div style="margin-top:14px">${medal(t, v, 'sh')}</div>
    <div class="hr"></div>
    <p class="small">${esc(t.d)}</p>
    <div class="hr"></div>
    <div class="wnow">
      <div class="l">Votre compteur</div><div class="v">${fmt(v)}</div>
      <div class="tr"><i style="width:${Math.min(100, v/t.need*100).toFixed(0)}%;background:${PAL[t.pal].jonc}"></i></div>
      <div class="l small mute" style="grid-column:1/-1">${got ? 'Acquis.'
        : `Il reste ${fmt(Math.max(0, t.need - v))} pour l’obtenir.`}</div>
    </div>
    ${got && SB.ready() ? `<button class="btn btn-2" id="tro_share" style="margin-top:12px">${
      SESS ? 'Partager sur le feed' : 'Partager — il faut un compte'}</button>
      <div class="src" style="margin-top:8px">Envoyé à vos amis. Le badge et son nom, rien d’autre :
        ni vos repas, ni vos chiffres.</div>` : ''}`);
  $('#sheet').querySelector('svg').style.maxWidth = '96px';
  const sh = $('#tro_share');
  if(sh) sh.onclick = () => SESS ? badgeShare(t) : profileSheet();
}

function badgeBlock(sc){
  const list = S.troAll ? TROPHIES : TROPHIES.slice(0, 3);
  const fmt = (x,u) => u === 'kg' ? (x >= 1000 ? n1(x/1000) + ' t' : n0(x)) : n0(x);
  return `<div class="bfamttl">${n1(sc.saved)} kg CO₂e évités</div>
    <div class="bfamsub">${TROPHIES.filter(t => troValue(t, sc) >= t.need).length} trophée${
      TROPHIES.filter(t => troValue(t, sc) >= t.need).length > 1 ? 's' : ''} sur ${TROPHIES.length}</div>
    <div class="bgrid">
      ${list.map((t,i) => { const v = troValue(t, sc), got = v >= t.need;
        return `<button class="badge${got ? '' : ' locked'}" data-tro="${i}">
          ${medal(t, v, i)}
          <div class="be">${badgeSrc(t.img) ? '' : t.e}</div>
          <div class="bt">${t.s}</div>
          <div class="bp">${fmt(v, t.u)} <s>/</s> ${fmt(t.need, t.u)}</div>
        </button>`; }).join('')}
    </div>
    <button class="seemore" id="troMore">${S.troAll
      ? 'Réduire' : `Voir les ${TROPHIES.length - 3} trophées suivants ›`}</button>`;
}

function pointsSheet(){
  const sc = scoring();
  const evs = [...sc.ev].sort((a,b) => b.d.localeCompare(a.d) || b.p - a.p).slice(0, 40);
  openSheet(`
    <div class="unit">Derniers points</div>
    <h3>${n0(sc.total)} points au total</h3>
    <div class="small mute" style="margin-bottom:4px">${sc.ev.length} validation${sc.ev.length>1?'s':''}
      depuis le début, les 40 dernières ci-dessous.</div>
    <div class="hr"></div>
    <div class="journal">
      ${evs.length ? evs.map(e => `<div class="j">
        <div class="dt"><b>${new Date(e.d+'T12:00').getDate()}</b>${new Date(e.d+'T12:00').toLocaleDateString('fr-FR',{month:'short'})}</div>
        <div class="nm">${esc(e.t)}<i>${esc(e.n || '—')}</i></div>
        <div class="kg">+${e.p}</div>
      </div>`).join('') : `<div class="empty">Aucun point pour l’instant. Un déjeuner végétarien en rapporte cinq.</div>`}
    </div>`);
}

function rulesSheet(){
  const sc = scoring();
  openSheet(`
    <div class="unit">Comment ça marche</div>
    <h3>La règle du jeu</h3>
    <p class="small">Les points d’un repas sont acquis à la saisie. Les bonus de journée, de semaine et de
    mois ne se déclenchent qu’à la clôture de la période : le score ne peut donc jamais reculer parce que
    vous avez enregistré un repas de plus.</p>
    <div class="hr"></div>
    <p class="small">Chaque palier vaut au moins le double de la somme de ce qu’il contient : une journée
    sans viande rapporte 25 points avec ses repas, une semaine sans viande 100 de plus. Aucun point n’est
    jamais retiré, et une série interrompue laisse sa meilleure valeur affichée.</p>
    <div class="src" style="margin-top:12px">Référence des kg évités : le repas moyen français à ${n2(REF)} kg CO₂e,
    calculé sur les plats types du référentiel pondérés par leur fréquence. Budget retenu :
    ${n0(DB.facts.budget)} kg CO₂e par an, soit ${n2(BUDGET_J)} kg par jour.</div>
    <div class="hr"></div>
    <div class="unit" style="margin-bottom:8px">Le barème</div>
    <div class="list">
      ${CHALS.map(c => { const n = sc.count(c.t); return `
        <div class="chal">
          <div class="st ${n?'on':'off'}">${n?'●':'○'}</div>
          <div class="nm">${c.t}</div>
          <div class="pt">${c.p} <span class="unit">pts</span></div>
          <div class="rule">${c.r}</div>
          ${n ? `<div class="got">Validé ${n} fois · ${n0(n*c.p)} points</div>` : ''}
        </div>`; }).join('')}
      <div class="count">Les points récompensent la régularité, pas le carbone : un même geste peut valider
        plusieurs épreuves. La colonne carbone reste le tracker.</div>
    </div>`);
}

function renderJeux(){
  topbar();
  const sc = scoring();
  const ri = RANKS.reduce((a,r,i) => sc.total >= r[0] ? i : a, 0);
  const next = RANKS[ri+1];
  const prog = next ? (sc.total - RANKS[ri][0]) / (next[0] - RANKS[ri][0]) : 1;

  view.innerHTML = `
  <div class="card rank">
    <button id="rulesBtn" class="qmark" aria-label="Règle du jeu et barème">?</button>
    <div class="kicker">Score<button id="ptsDetail" class="detaillink">Détail</button></div>
    <div class="pts">${n0(sc.total)} <small>points</small></div>
    <div class="name">${RANKS[ri][1]}</div>
    <div class="prog"><i style="width:${(prog*100).toFixed(1)}%"></i></div>
    <div class="next">${next ? `${n0(next[0]-sc.total)} points avant « ${next[1]} »`
      : 'Dernier palier atteint.'}</div>
    <div class="aside">
      <div><div class="v">${n1(sc.saved)} kg</div><div class="l">CO₂e évités par vos<br>repas végétariens</div></div>
      <div><div class="v">${sc.cur} j</div><div class="l">Série en cours<br>sans viande rouge</div></div>
      <div><div class="v">${sc.best} j</div><div class="l">Meilleure série<br>à ce jour</div></div>
    </div>
  </div>

  <h2 class="sec">Trophées</h2>
  <div class="card">
    ${badgeBlock(sc)}
    <div class="src" style="margin-top:13px">Journées réussies sur journées nécessaires. Une journée
      ne compte que si le déjeuner et le dîner y sont tous deux enregistrés.</div>
  </div>

  `;

  $('#ptsDetail').onclick = pointsSheet;
  $('#rulesBtn').onclick = rulesSheet;
  $('#troMore').onclick = () => { S.troAll = !S.troAll; renderJeux(); };
  view.querySelectorAll('[data-tro]').forEach(b => b.onclick = () => troSheet(+b.dataset.tro));
}

/* ==================== zone d'import de recettes ====================
   Outil d'auteur, pas fonction d'application. Il ne stocke rien : il rend le
   bloc JSON à coller dans DB.dishes. Une recette destinée au moteur de conseil
   doit vivre dans la base livrée, pas dans le localStorage d'un appareil —
   sinon elle ne serait proposée qu'à celui qui l'a saisie.

   Réservé à l'auteur : on n'y entre que par le fragment #import, et rien dans
   l'interface n'y mène. Pas de secret cryptographique là-dedans, juste une porte
   que personne n'ouvre par hasard.

   Le rendement attendu n'est pas la perfection du parseur : c'est de ramener une
   recette de dix lignes à trois corrections manuelles. D'où le sélecteur par
   ligne — la validation visuelle reste la dernière étape, comme partout. */

/* Unités vers grammes. Les volumes passent par une densité : 125 ml d'huile ne
   pèsent pas 125 g, et sur un poste qui fait 15 % de l'empreinte l'écart compte. */
const IMP_DENS = {huileolive:0.91, matieregrasse:0.91, laitdevache:1.03, creme:1.0, vin:0.99};
const IMP_UNIT = {
  g:1, gr:1, gramme:1, grammes:1, kg:1000, ml:1, cl:10, l:1000, litre:1000,
  'cuillere a soupe':15, 'cuilleres a soupe':15, 'c a s':15, 'cas':15, 'cuillere a cafe':5,
  'cuilleres a cafe':5, 'c a c':5, 'cac':5, gousse:5, gousses:5, pincee:1, pincees:1,
  branche:5, branches:5, brin:2, brins:2, feuille:1, feuilles:1,
};

/* Table inverse, construite une fois : synonyme normalisé -> slug. */
const IMP_MAP = (() => {
  const m = new Map();
  DB.foods.forEach(f => m.set(nrmQ(f.n), f.s));          /* le nom exact d'abord */
  for(const [slug, mots] of Object.entries(IMP_SYN))
    mots.forEach(w => m.set(nrmQ(w), slug));
  return m;
})();

/* Résolution d'un libellé de recette vers un aliment de la base.
   Trois passes, de la plus sûre à la plus permissive : correspondance exacte,
   puis synonyme contenu dans le libellé, puis recouvrement de mots avec le nom
   de l'aliment. La confiance renvoyée sert à colorer la ligne : l'auteur relit
   en priorité ce qui est douteux, au lieu de tout relire. */
function impResolve(brut){
  const q = nrmQ(brut);
  if(!q) return {slug:null, sur:0};
  if(IMP_MAP.has(q)) return {slug:IMP_MAP.get(q), sur:2};

  /* synonyme le plus long contenu dans le libellé — « tomate cerise » doit
     gagner sur « tomate », sinon la spécificité est perdue */
  let best = null, len = 0;
  for(const [mot, slug] of IMP_MAP)
    if(mot.length > 2 && mot.length > len && q.includes(mot)){ best = slug; len = mot.length; }
  if(best) return {slug:best, sur:2};

  /* recouvrement de mots avec les noms de la base */
  const toks = q.split(/[^a-z0-9]+/).filter(t => t.length > 3);
  let cand = null, score = 0;
  DB.foods.forEach(f => {
    const n = nrmQ(f.n).split(/[^a-z0-9]+/);
    const s = toks.filter(t => n.some(x => x.startsWith(t) || t.startsWith(x))).length;
    if(s > score){ score = s; cand = f.s; }
  });
  return score ? {slug:cand, sur:1} : {slug:null, sur:0};
}

/* Découpe d'une ligne d'ingrédient en quantité, unité et libellé. Les sites
   écrivent « 1 bloc de 200 g de fromage feta » : on retient le dernier nombre
   suivi d'une unité de masse ou de volume, et non le premier, qui compte des
   emballages. */
function impLigne(txt){
  const t = txt.replace(/^[\s\-–—•*\[\]x✓]+/, '').trim();
  if(!t) return null;
  const unites = Object.keys(IMP_UNIT).sort((a,b) => b.length - a.length)
    .map(u => u.replace(/ /g, '\\s*')).join('|');

  /* Les quantités se lisent sur le texte entier, parenthèses comprises : les
     sites y mettent aussi bien une conversion inutile — « (4 tasses) » — que le
     poids réel — « 1 pâte feuilletée (250 g) ». Retirer les parenthèses avant de
     chercher perdait le second cas. On retient la dernière quantité munie d'une
     unité connue, ce qui écarte les comptages d'emballage placés en tête. */
  const re = new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(' + unites + ')\\b', 'gi');
  let m, last = null;
  while((m = re.exec(nrmQ(t))) !== null) last = m;

  let q = null, unite = null;
  if(last){ q = parseFloat(last[1].replace(',', '.')); unite = last[2].replace(/\s+/g, ' ').trim(); }
  else {
    const n = nrmQ(t).match(/^(\d+(?:[.,]\d+)?)\s/);
    if(n) q = parseFloat(n[1].replace(',', '.'));       /* « 3 gousses d'ail » sans unité */
  }

  /* Le libellé, lui, se lit sans les parenthèses. On garde « de » : la moitié
     des synonymes en contiennent, et le supprimer faisait tomber « lait de
     coco » sur le lait de vache — une erreur muette et lourde, le coco pesant
     un tiers du lait de vache au kilo. */
  const brut = t.replace(/\(.*?\)/g, ' ')
    .replace(/\d+(?:[.,]\d+)?/g, ' ')
    .replace(new RegExp('\\b(' + unites + ')\\b', 'gi'), ' ')
    .replace(/^\s*(bloc|boite|boîte|sachet|paquet|pot|barquette)\b/gi, ' ')
    .replace(/['’]/g, ' ').replace(/\s+/g, ' ').trim();
  return {txt:t, q, unite, brut};
}

/* Analyse complète d'un collage. */
function impParse(src){
  const lignes = src.split('\n').map(l => l.trim());
  const meta = {nom:'', cuisine:'', portions:1, services:['dej','din']};
  const ing = [];
  lignes.forEach((l, i) => {
    if(!l) return;
    const mm = l.match(/^(nom|cuisine|portions?|services?)\s*:\s*(.+)$/i);
    if(mm){
      const k = nrmQ(mm[1]), v = mm[2].trim();
      if(k === 'nom') meta.nom = v;
      else if(k === 'cuisine') meta.cuisine = nrmQ(v);
      else if(k.startsWith('portion')) meta.portions = Math.max(1, parseFloat(v) || 1);
      else if(k.startsWith('service'))
        meta.services = v.split(/[,;/]/).map(x => nrmQ(x).slice(0,3))
          .map(x => x === 'mid' ? 'dej' : x === 'soi' ? 'din' : x)
          .filter(x => ['pdj','dej','din','enc'].includes(x))
          .map(x => x === 'enc' ? 'encas' : x);
      return;
    }
    if(/^-{3,}$/.test(l)) return;
    if(!meta.nom && !ing.length && !/\d/.test(l)){ meta.nom = l; return; }
    const p = impLigne(l);
    if(p) ing.push(p);
  });

  ing.forEach((x,i) => {
    const r = impResolve(x.brut);
    x.slug = r.slug; x.sur = r.sur;
    /* une correction de l'auteur prime sur la devinette du parseur */
    if(IMP_OVR[i] !== undefined){ x.slug = IMP_OVR[i] || null; x.sur = x.slug ? 2 : 0; }
    if(IMP_SYN.__ignore.some(w => nrmQ(x.brut) === nrmQ(w) || nrmQ(x.brut).includes(nrmQ(w)))
       && (!x.slug || x.sur < 2)) { x.slug = '__ignore'; x.sur = 2; }
    /* grammes par personne */
    const k = x.unite ? IMP_UNIT[x.unite] : null;
    const d = IMP_DENS[x.slug] || 1;
    let g = null;
    if(x.q != null && k) g = x.q * k * (['ml','cl','l','litre'].includes(x.unite) ? d : 1);
    else if(x.q != null && !x.unite && x.slug && F.has(x.slug)) g = x.q * F.get(x.slug).p;
    x.g = g != null ? Math.round(g / meta.portions) : null;
    if(IMP_G[i] != null) x.g = IMP_G[i];
  });
  return {meta, ing};
}

/* ---- interface ---- */
let IMP_SRC = '';

function impSheet(){
  const P = IMP_SRC.trim() ? impParse(IMP_SRC) : null;
  let corps = '';

  if(P){
    const ok = P.ing.filter(x => x.slug && x.slug !== '__ignore' && x.g);
    const tot = ok.reduce((a,x) => a + F.get(x.slug).t * x.g / 1000, 0);
    const poids = ok.reduce((a,x) => a + x.g, 0);
    const veg = !ok.some(x => NONVEG.has(x.slug));
    /* Même règle que la fenêtre de saisonnalité : on passe par saisOf() plutôt
       que de relire m directement, sinon l'import dirait « hors saison » d'un
       oignon de conservation et « de saison » d'une banane. */

    const hors = ok.filter(x => saisOf(x.slug, mois) === false).map(x => F.get(x.slug).n);
    const opts = s => DB.foods.map(f =>
      `<option value="${f.s}"${f.s === s ? ' selected' : ''}>${esc(f.n)}</option>`).join('');

            <select data-imp="${i}">
              <option value="">— non trouvé —</option>
              <option value="__ignore"${x.slug === '__ignore' ? ' selected' : ''}>· ignorer (herbe, épice) ·</option>

        <div><b>${n0(poids)}</b><span>g / pers</span></div>
        <div><b>${n0(tot / BUDGET_J * 100)} %</b><span>du budget</span></div>
      </div>
      <div class="src">${veg ? 'Végétarien.' : '<b>Non végétarien</b> — contient un ingrédient d’origine animale carnée.'}
        ${hors.length ? ` Hors saison ce mois-ci : ${esc(hors.join(', '))}.` : ' Tous les végétaux sont de saison.'}
        ${tot <= 0.7 ? ' Sous 0,7 kg : utilisable même en fin de journée chargée.'

        <button class="btn btn-2" id="impclear">Vider</button>

      ${P.ing.some(x => !x.slug) ? `<div class="src" style="margin-top:10px">
        Les lignes en rouge n’ont pas été reconnues. Choisis l’aliment dans la liste, ou ignore-la.
        Si l’ingrédient n’existe pas dans la base, dis-le-moi et je crée l’entrée avec sa valeur
        dérivée et sa note de méthode.</div>` : ''}`;
  }

  openSheet(`
    <div class="unit">Outil d’auteur</div>
    <h3>Importer une recette</h3>
    <p class="small mute">Colle le bloc d’ingrédients. Première ligne = le nom.
      Lignes facultatives <code>cuisine:</code>, <code>portions:</code>, <code>services:</code>.
      Rien n’est enregistré : l’outil rend le JSON à coller dans le fichier.</p>
    <textarea class="impin" id="impsrc" rows="7" placeholder="Pâtes à la feta et aux tomates cerises
cuisine: italienne
portions: 3
services: midi, soir

/* ==================== fruits et légumes de saison ====================
   Le périmètre est annoncé par le titre de la fenêtre : on ne mesure que les
   fruits et légumes. Un plat qui n'en contient aucun n'entre pas dans le calcul
   plutôt que d'y entrer à zéro — sinon l'indicateur mesurerait la part de
   légumes et non la saisonnalité, et les deux ne se lisent pas pareil.

   Trois valeurs explicites priment sur le calendrier :
     sais 0 — jamais de saison. Produits importés : on s'en tient au local, donc
              une mangue reste hors saison même disponible douze mois sur douze.
     sais 1 — toujours. Les mix « de saison », saisonniers par construction.
     sais 2 — neutre, hors numérateur et hors dénominateur. Produits locaux mais
              disponibles toute l'année (champignon de Paris, cresson) ou
              transformés (compote, olives) : ils ne portent aucune information
              de saison, et les forcer dans un camp fausserait le pourcentage.
   Tous les autres croisent leur calendrier m avec le mois du repas : le calendrier
   est le référentiel, et on s'y tient. Un agrume importé compte donc de saison
   dans sa fenêtre — une orange en février — parce que c'est ce que dit le
   référentiel, et parce que son coût de transport est déjà porté par son facteur
   d'émission ADEME, mesuré ailleurs dans l'app. Saisonnalité et carbone sont deux
   indicateurs distincts, chacun avec sa source ; les mélanger reviendrait à
   compter deux fois la même chose.

   sais n'intervient donc que là où le calendrier ne peut pas répondre : absent,
   ou couvrant les douze mois — un produit disponible en permanence ne porte
   aucun signal de saison, il faut trancher explicitement. C'est le cas des six
   exotiques, et à l'inverse des légumes de conservation, récoltés en été puis
   stockés sans serre ni transport lointain, dont le calendrier ne décrit que la
   récolte alors que la disponibilité locale, elle, est continue.

   Le mois retenu est celui de la date du repas, jamais la date du jour : une
   courgette mangée en juillet était de saison, et le rester quand on relit son
   bilan en décembre. Sans cela le cumul « depuis toujours » dériverait tous les
   mois sans qu'aucun comportement ait changé. */
function saisOf(slug, mois){
  const f = F.get(slug);
  if(!f || f.g !== 'Fruits & légumes') return null;
  if(f.sais === 2) return null;
  if(f.sais === 0) return false;
  if(f.sais === 1) return true;
  return f.m ? f.m.includes(mois) : null;
}

const SAIS_PER = [['tout','Depuis toujours'], ['mois','30 derniers jours'], ['sem','7 derniers jours']];

function saisStats(per){
  const bornes = {tout:null, mois:30, sem:7};
  const n = bornes[per];
  const depuis = n ? iso(new Date(Date.now() - n * 864e5)) : null;
  let ok = 0, tot = 0, jours = new Set();
  const contre = new Map();               /* ce qui tire le score vers le bas */
  S.hist.forEach(e => {
    if(depuis && e.d < depuis) return;
    const mois = new Date(e.d + 'T12:00:00').getMonth();
    e.l.forEach(([sl, g]) => {
      const v = saisOf(sl, mois);
      if(v === null) return;
      tot += g;
      if(v) ok += g;
      else contre.set(sl, (contre.get(sl) || 0) + g);
      jours.add(e.d);
    });
  });
  return {pc: tot ? ok / tot * 100 : null, ok, tot, jours:jours.size,
          contre:[...contre.entries()].sort((a,b) => b[1] - a[1]).slice(0, 5)};
}

let saisPer = 'tout', saisCal = null;

/* Calendrier d'un aliment, douze cases. Répond à la seule question qu'on se pose
   devant un « hors saison » : quand est-ce que j'en remange ? Les trois cas
   explicites ont chacun leur lecture — un importé n'a pas de mois de retour, et
   le dire vaut mieux que d'afficher douze cases éteintes sans explication. */
const MOIS12 = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const MOISN  = ['janvier','février','mars','avril','mai','juin','juillet','août',
                'septembre','octobre','novembre','décembre'];

function cal12(slug){
  const f = F.get(slug);
  const imp = f.sais === 0;
  const cases = MOIS12.map((l, i) => {
    const on = imp ? false : f.sais === 1 ? true : !!(f.m && f.m.includes(i));
    return `<i class="${on ? 'on' : imp ? 'imp' : ''}" title="${MOISN[i]}">${l}</i>`;
  }).join('');
  let mot;
  if(imp) mot = `Importé : pas de saison locale. Son empreinte est de ${n2(f.t)} kg par kilo.`;
  else if(f.sais === 1) mot = 'Disponible toute l’année en local, récolté puis conservé.';
  else if(!f.m) mot = 'Pas de calendrier renseigné.';
  else {
    const ms = f.m.map(i => MOISN[i]);
    mot = ms.length >= 11 ? 'Presque toute l’année.'
        : `De saison en ${ms.length > 3
            ? ms[0] + ' → ' + ms[ms.length-1] + ' (' + ms.length + ' mois)'
            : ms.join(', ')}. Empreinte ${n2(f.t)} kg par kilo.`;
  }
  return `<div class="cal12"><div class="row12">${cases}</div>
    <div class="mot">${mot}</div></div>`;
}

/* Phrase sur les fruits importés. Elle ne dit pas « limitez » : sur cette base,
   ce serait faux pour cinq des six. La banane pèse 0,909 kg par kilo, moins que
   des pâtes sèches à 1,98 ; le bœuf est trente et une fois plus lourd qu'elle.
   Écrire « limitez la banane » dans une app dont toute l'autorité vient des
   facteurs ADEME reviendrait à contredire ses propres chiffres au premier écran
   où l'on quitte le calcul pour le conseil.

   On ne parle pas non plus de bio : sur le carbone, l'effet n'est pas établi et
   dépend de la culture — rendements plus faibles, donc plus de surface au kilo.
   Ni d'équitable, qui est un axe social légitime mais que cette app ne mesure
   pas ; l'introduire ici laisserait croire qu'il est compté dans le chiffre.

   Ce que la base dit, en revanche, et qui est le fait le plus actionnable
   qu'elle contienne sur les imports : le mode de transport. La même mangue pèse
   seize fois plus par avion que par bateau. C'est ça qu'il faut dire. */
/* Articles des six importés. Six entrées valent mieux qu'une heuristique de
   genre qui se tromperait sur « ananas » ou « avocat ». */
const IMP_ART = {banane:'la ', mangue:'la ', manguebateau:'la ', avocat:"l’",
                 ananas:"l’", fruitdelapassion:'le '};

function saisImporte(contre){
  const imp = contre.filter(([sl]) => F.get(sl).sais === 0);
  const bref = sl => F.get(sl).n.replace(/ \(.*\)/, '');
  const art  = sl => (IMP_ART[sl] || 'le ') + bref(sl).toLowerCase();
  /* Minuscule après le premier : ce sont des noms communs au fil d'une phrase. */
  const noms = imp.map(([sl], i) => i === 0 ? bref(sl) : bref(sl).toLowerCase());
  const liste = noms.length > 1
    ? noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1] : noms[0];
  const tete = `${liste} ${noms.length > 1 ? 'comptent' : 'compte'} hors saison parce qu’on
    s’en tient au local.`;
  const seul = imp.length === 1;
  const rap = n0(F.get('mangue').t / F.get('manguebateau').t);

  /* Le plus lourd de ceux réellement mangés décide du propos. Rassurer sur le
     poids quand la seule ligne présente est une mangue par avion à 11,66 kg
     serait faux : c'est le cas où il faut au contraire pointer le transport. */
  const [plsl] = imp.reduce((a, b) => F.get(b[0]).t > F.get(a[0]).t ? b : a);
  const pl = F.get(plsl);

  if(pl.t > 5) return `${tete} ${seul ? 'Et c’est justement' : `Et ${art(plsl)}, c’est`}
    le cas où ça compte vraiment : ${n2(pl.t)} kg par kilo, ${rap} fois la même mangue
    arrivée par bateau. Sur les fruits lointains le mode de transport pèse plus que la
    distance, c’est le seul arbitrage qui change l’ordre de grandeur.`;

  /* Le plus léger de ceux mangés porte la nuance, pour qu'elle parle de son
     assiette et non d'un fruit qu'il n'a pas pris. */
  const [lgsl] = imp.reduce((a, b) => F.get(b[0]).t < F.get(a[0]).t ? b : a);
  const lg = F.get(lgsl);
  return `${tete} Hors saison ne veut pas dire lourd pour autant :
    ${art(lgsl)} pèse ${n2(lg.t)} kg par kilo, moins
    que des pâtes sèches, et ${n0(F.get('boeuf').t / lg.t)} fois moins que du bœuf. Sur les
    fruits lointains, ce qui compte est le mode de transport plus que la distance : par bateau
    l’empreinte reste modeste, par avion elle peut être multipliée par ${rap}.`;
}

/* série de jours consécutifs renseignés. La journée en cours ne casse pas la série
   tant qu'elle n'est pas terminée : on repart d'hier si rien n'est encore saisi. */
function logStreak(){
  const has = new Set(S.hist.map(e => e.d));
  const d = new Date();
  if(!has.has(iso(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while(has.has(iso(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* meilleure série de jours consécutifs renseignés, recalculée depuis l'historique :
   pas de record stocké, donc rien à corrompre ni à migrer */
function bestLogStreak(){
  const days = [...new Set(S.hist.map(e => e.d))].sort();
  let best = 0, run = 0, prev = null;
  days.forEach(d => {
    run = (prev && (new Date(d) - new Date(prev)) / 864e5 === 1) ? run + 1 : 1;
    best = Math.max(best, run); prev = d;
  });
  return best;
}

/* ==================== Web Push ====================
   Ce qui distingue ce module du reste : il est le seul capable de faire
   apparaître quelque chose alors que l'app est fermée. Tout le reste — pastille
   d'onglet, badge d'icône posé depuis la page — ne vit que pendant que l'app
   tourne.

   Conditions cumulatives, aucune facultative : app ajoutée à l'écran d'accueil
   (iOS n'expose ni Push ni Badging dans un onglet Safari), iOS 16.4 ou plus,
   notifications autorisées, clé VAPID renseignée, et un compte — l'abonnement
   est rattaché à un utilisateur.

   Chaque échec est silencieux et sans conséquence : l'app continue de
   fonctionner avec ses signaux internes. */

const pushDispo = () => 'serviceWorker' in navigator && 'PushManager' in window &&
                        typeof Notification !== 'undefined';

/* Écran d'accueil ou onglet ? Sur iOS c'est la question qui décide de tout, et
   `navigator.standalone` est la seule réponse fiable ; le display-mode couvre
   les autres plateformes. */
const enStandalone = () => navigator.standalone === true ||
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

/* La clé VAPID voyage en base64url ; subscribe() veut des octets. */
function vapidOctets(b64){
  const p = '='.repeat((4 - b64.length % 4) % 4);
  const brut = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...brut].map(c => c.charCodeAt(0)));
}

/* Abonnement, ou renouvellement de l'enregistrement s'il existe déjà. Appelée
   au lancement et à chaque activation des rappels : elle doit donc être
   idempotente, d'où l'upsert sur l'endpoint. Renvoie true si le serveur nous
   tient pour joignable. */
async function pushArm(silencieux){
  if(!pushDispo() || !vapidPret() || !SESS || !SB.ready()) return false;
  if(Notification.permission !== 'granted') return false;
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        /* Obligatoire, et pas seulement par principe : sans cette promesse
           qu'aucun push ne sera silencieux, Safari refuse l'abonnement. */
        userVisibleOnly: true,
        applicationServerKey: vapidOctets(VAPID_PUB),
      });
    }
    const j = sub.toJSON();
    if(!j.endpoint || !j.keys || !j.keys.p256dh) return false;
    const r = await SB.rest('push_subscriptions?on_conflict=endpoint', {method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({
        endpoint: j.endpoint, user_id: SESS.uid,
        p256dh: j.keys.p256dh, auth: j.keys.auth,
        tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Paris'),
        ua: (navigator.userAgent || '').slice(0, 200),
      })});
    if(!r.ok){
      const brut = JSON.stringify(r.body || {});
      console.warn('abonnement push ·', r.status, brut);
      if(!silencieux) toast(/PGRST205|does not exist/i.test(brut)
        ? 'Rappels du soir indisponibles : push_soir.sql n’est pas passé'
        : 'Abonnement refusé par le serveur · ' + r.status);
      S.notif.pushOn = false; save();
      return false;
    }
    S.notif.pushOn = true; save();
    return true;
  }catch(e){
    console.warn('push ·', e);
    S.notif.pushOn = false; save();
    return false;
  }
}

/* Désabonnement. On retire la ligne d'abord : mieux vaut un abonnement
   fantôme côté navigateur qu'une ligne qui continue de recevoir des envois
   après que l'utilisateur a coupé les rappels. */
async function pushDisarm(){
  S.notif.pushOn = false; save();
  if(!pushDispo()) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const ep = sub.endpoint;
    if(SESS && SB.ready()){
      await SB.rest('push_subscriptions?endpoint=eq.' + encodeURIComponent(ep),
        {method:'DELETE'});
    }
    await sub.unsubscribe();
  }catch(e){ console.warn('désabonnement ·', e); }
}

/* Ce qu'il faut dire à l'utilisateur, sans mentir sur ce qui marche. L'ordre
   des tests est celui des causes : la plus bloquante d'abord. */
function pushEtat(){
  if(!pushDispo())        return {k:'non', t:'Non gérés par ce navigateur.'};
  if(!enStandalone())     return {k:'onglet', t:'Il faut ajouter l’app à l’écran d’accueil : iOS n’autorise ni notification ni pastille d’icône depuis un onglet Safari.'};
  if(!vapidPret())        return {k:'sanscle', t:'Pas encore configuré côté serveur (clé VAPID absente).'};
  if(!SESS)               return {k:'sanscompte', t:'Il faut un compte : l’abonnement y est rattaché.'};
  if(Notification.permission === 'denied')
                          return {k:'refus', t:'Refusées au niveau du téléphone.'};
  if(!S.notif.on)         return {k:'off', t:'Coupés.'};
  return S.notif.pushOn
    ? {k:'on',      t:'Actifs. Rappel de 21 h, j’aime, demandes d’amis, partages et invitations arrivent même app fermée.'}
    : {k:'attente', t:'Autorisés, mais l’abonnement n’a pas encore été accepté par le serveur.'};
}

/* ==================== rappels ====================
   Une limite à dire franchement plutôt qu'à laisser découvrir : sans serveur
   de push, rien ne peut être délivré téléphone verrouillé et app fermée. Ce
   module arme des minuteries tant que la page vit, et rattrape au lancement ce
   qui a été manqué dans la journée, avec une péremption — un « aujourd'hui
   sera peut-être le jour » reçu à 23 h ne veut plus rien dire. Sur un usage où
   l'app est ouverte au moins une fois par jour, cela suffit. Pour une vraie
   notification à 9 h 30 sans ouvrir l'app, il faudra une Edge Function
   planifiée et une paire de clés VAPID. */

const RAPPELS = [
  {k:'matin', deb: 9*60 + 30, fin: 14*60,      f: () => rappelMatin()},
  {k:'soir',  deb: 21*60,     fin: 23*60 + 59, f: () => rappelSoir()},
];

const notifPret = () => typeof Notification !== 'undefined' && Notification.permission === 'granted';

/* `vue` ne sert qu'au clic : une demande d'ami doit ouvrir la section Amis, pas
   l'Actu. Elle est passée au service worker, qui la renvoie à la page. */
async function notifMontre(titre, corps, tag, vue){
  if(!S.notif.on || !notifPret()) return false;
  const social = tag === 'feed' || tag === 'amis' || tag === 'defis' || tag === 'like';
  const dest = tag === 'badge' ? 'jeux' : social ? 'feed' : 'saisie';
  const opts = {body:corps, tag, icon:'./icon-192.png', badge:'./icon-192.png',
                data:{tab: dest, vue: vue || 'actu'}};
  try{
    /* Passer par le service worker : c'est la seule voie qui fonctionne en PWA
       installée sur iOS, et la seule qui survive à la fermeture de l'onglet. */
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ await reg.showNotification(titre, opts); return true; }
    new Notification(titre, opts);
    return true;
  }catch(e){ console.warn('notification refusée :', e); return false; }
}

/* ---------------- proposition à la première ouverture ----------------
   Posée une seule fois, jamais reposée : `demande` retient la réponse, et un
   refus est un refus. C'est aussi pourquoi la question passe par une fenêtre et
   non par un appel direct à requestPermission() — iOS n'accepte cet appel que
   depuis un geste de l'utilisateur, et Safari ne redonne jamais l'invite système
   une fois qu'elle a été refusée. Demander deux fois n'est pas seulement
   impoli : techniquement, ça ne marche pas.

   La fenêtre dit où revenir sur son choix, faute de quoi un « Non » cliqué trop
   vite serait vécu comme définitif. */
function notifDemande(){
  if(typeof Notification === 'undefined') return;      /* rien à proposer */
  if(S.notif.demande) return;                          /* déjà répondu */
  if(S.notif.on) return;                               /* déjà actifs */
  if(Notification.permission !== 'default') return;    /* déjà accordé ou refusé au niveau du téléphone */

  const repondre = v => { S.notif.demande = v; save(); closeSheet(); };

  openSheet(`
    <div class="gp" style="font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--mute)">Rappels</div>
    <h3>Activer les rappels&nbsp;?</h3>
    <p class="small" style="line-height:1.7">Deux notifications par jour au plus : un mot le matin,
      et un rappel à 21 h les soirs où le déjeuner ou le dîner manque encore. S’y ajoutent les
      j’aime, les demandes d’amis et les invitations à des défis, si vous avez un compte.</p>
    <p class="small mute" style="line-height:1.7">Vous pourrez revenir sur ce choix à tout moment
      dans l’onglet Profil, à la ligne Rappels.</p>
    <div class="actions" style="margin-top:12px">
      <button class="btn btn-1" id="nd_oui">Oui, activer</button>
      <button class="btn btn-2" id="nd_non">Non merci</button>
    </div>`);

  /* Le clic est le geste sur lequel Safari autorise l'invite système : la
     demande doit partir de ce gestionnaire, sans await intermédiaire avant
     l'appel, sinon le geste est perdu. */
  $('#nd_oui').onclick = () => { repondre('oui'); notifBascule(); };
  $('#nd_non').onclick = () => { repondre('non'); toast('Rappels désactivés · modifiable dans Profil'); };
}

/* Repeindre le profil s'il est à l'écran, et rien d'autre sinon. La nuance
   compte : cette fonction est aussi appelée par la fenêtre de première
   ouverture, et un « Oui, activer » qui projetterait sur la page Profil serait
   une porte dérobée vers un écran qu'on n'a pas demandé. */
const pfRepeint = () => { if(S.tab === 'profil') renderProfil(); };

async function notifBascule(){
  if(S.notif.on){
    S.notif.on = false; save();
    await pushDisarm();
    badgeSync(); pfRepeint(); return toast('Rappels coupés');
  }
  if(typeof Notification === 'undefined') return toast('Ce navigateur ne gère pas les notifications');
  if(Notification.permission === 'denied')
    return toast('Refusées au niveau du téléphone : à réactiver dans ses réglages');
  const r = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if(r !== 'granted') return toast('Sans autorisation, pas de rappel');
  S.notif.on = true; save(); badgeSync(); pfRepeint();
  /* L'abonnement au push est tenté ici, une fois l'autorisation obtenue : c'est
     le seul moment où Safari accepte subscribe(). Un échec ne remet pas les
     rappels en cause, il retire seulement la livraison app fermée — le panneau
     le dira. */
  pushArm().then(ok => { pfRepeint(); if(ok) toast('Rappel du soir armé, même app fermée'); });
  notifMontre('Rappels activés', 'Le matin, le soir si la journée est incomplète, et ce que font vos amis.', 'test');
}

/* Matin : le premier badge encore à portée, du plus facile au plus exigeant.
   Les trois acquis, on cesse de répéter et on parle de la série. */
function rappelMatin(){
  const sc = scoring();
  const cible = vegMealCount() === 0     ? 'votre premier repas végétarien'
              : vegDayCount(sc) === 0    ? 'votre première journée sans viande'
              : budgetDayCount(sc) === 0 ? 'votre premier jour dans le budget 2050'
              : null;
  if(cible) return {t:'Aujourd’hui sera peut-être le jour', b:'de ' + cible + '.'};
  const st = logStreak();
  return {t:'Nouvelle journée', b: st
    ? `${st} jour${st > 1 ? 's' : ''} d’affilée. Déjeuner et dîner saisis, et la série tient.`
    : 'Déjeuner et dîner saisis, et la journée comptera.'};
}

/* Soir : ne rappeler que ce qui manque réellement. Une journée complète n'a
   pas besoin qu'on lui écrive. */
function rappelSoir(){
  const T = today();
  const m = new Set(S.hist.filter(e => e.d === T && e.m !== 'encas').map(e => e.m));
  if(m.has('dej') && m.has('din')) return null;
  const manque = !m.has('dej') && !m.has('din') ? 'le déjeuner et le dîner'
               : !m.has('dej') ? 'le déjeuner' : 'le dîner';
  const st = logStreak();
  return {t: 'N’oubliez pas de rentrer vos repas', b: st
    ? `Il manque ${manque}. ${st} jour${st > 1 ? 's' : ''} d’affilée — la série tient encore.`
    : `Il manque ${manque} pour que la journée compte.`};
}

function notifTick(){
  if(!S.notif.on || !notifPret()) return;
  const T = today(), now = new Date();
  const mn = now.getHours() * 60 + now.getMinutes();
  RAPPELS.forEach(r => {
    if(S.notif.vu[r.k] === T || mn < r.deb) return;
    S.notif.vu[r.k] = T; save();          /* marqué d'abord : jamais deux fois */
    if(mn > r.fin) return;                /* trop tard, le message n'a plus de sens */
    const msg = r.f();
    if(msg) notifMontre(msg.t, msg.b, r.k);
  });
}

/* ==================== centre de notifications ====================
   Ce qui manquait jusqu'ici : une trace de ce qui a été envoyé. Une
   notification système est fugace — elle s'efface d'un balayage, et rien ne
   permettait ensuite de savoir si elle était partie. D'où deux effets : on
   perd l'information, et on ne peut pas distinguer « le serveur n'a rien
   envoyé » de « l'appareil ne l'a pas affiché ».

   La liste vient du serveur, pas du client. Les cinq déclencheurs Postgres
   écrivent déjà la notification au moment où l'évènement a lieu : la même
   écriture alimente le push et cette liste. Si une ligne est là sans que le
   téléphone ait sonné, la panne est côté appareil. Si la ligne manque, elle est
   côté serveur. Le centre est donc autant un outil de diagnostic qu'un confort.

   Le rappel de 21 h est écrit par l'Edge Function, les badges obtenus par
   l'app elle-même — c'est le seul évènement que le serveur ne peut pas voir,
   les trophées étant calculés localement à partir de l'historique.

   Sans compte, rien à afficher : la table est indexée sur l'identité. C'est
   dit dans la feuille plutôt que laissé à deviner. */

const NOTE_EM = {soir:'🍽️', like:'❤️', amis:'👋', amis_ok:'🤝',
                 partage:'🏅', recette:'🍲', defis:'🏁', badge:'🎖️'};

/* Depuis quand. Les heures pour aujourd'hui, le jour au-delà : une liste où
   tout est « il y a 3 jours » ne se relit pas. */
function noteQuand(iso){
  const d = new Date(iso), now = new Date();
  const min = Math.round((now - d) / 60000);
  if(min < 1) return 'à l’instant';
  if(min < 60) return min + ' min';
  const j = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if(j === 0) return d.toTimeString().slice(0, 5);
  if(j === 1) return 'hier';
  if(j < 7) return j + ' j';
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}

const notesNonLus = () => (S.notes || []).filter(x => !x.lu_at).length;

/* Compteur de la cloche. Tenu à part de `attentes()` : celui-ci compte des
   évènements reçus, l'autre des choses à faire. Une invitation à un défi non
   répondue reste en attente longtemps après que sa notification a été lue. */
function paintBell(){
  const b = document.getElementById('bell');
  if(!b) return;
  const n = notesNonLus();
  b.dataset.n = n;
  const c = b.querySelector('.cnt');
  if(c) c.textContent = n > 9 ? '9+' : String(n);
  b.setAttribute('aria-label', n ? `Notifications, ${n} non lue${n > 1 ? 's' : ''}` : 'Notifications');
}

/* Les soixante dernières, tous types confondus. Pas de pagination : au-delà
   d'une soixantaine on ne relit plus, on cherche — et chercher dans ses
   notifications n'est pas un besoin réel. */
async function notesLoad(silencieux){
  if(!SESS || !SB.ready()) return;
  const r = await SB.rest('notifications?select=id,typ,titre,corps,tab,vue,lu_at,created_at' +
    '&order=created_at.desc&limit=60');
  if(!r.ok){
    /* Table absente : notifications.sql n'a pas été passé. Le dire une fois,
       pas à chaque tour de veille. */
    if(!silencieux) toast(/PGRST205|does not exist/i.test(JSON.stringify(r.body || {}))
      ? 'Centre de notifications indisponible : notifications.sql n’est pas passé'
      : 'Notifications indisponibles · ' + r.status);
    return;
  }
  S.notes = r.body || [];
  paintBell();
}

/* Écrire une notification pour soi-même. Sert aux badges, seul évènement que
   le serveur ne voit pas. `cle` rend l'écriture idempotente : un badge obtenu
   ne se ré-annonce pas au repas suivant, même si l'app est relancée. */
async function notesAdd(typ, titre, corps, tab, vue, cle){
  if(!SESS || !SB.ready()) return;
  const r = await SB.rest('notifications?on_conflict=user_id,typ,cle', {method:'POST',
    headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
    body: JSON.stringify({user_id:SESS.uid, typ, titre, corps: corps || '',
                          tab: tab || 'jeux', vue: vue || 'actu', cle: cle || null})});
  if(!r.ok) console.warn('notesAdd ·', r.status, JSON.stringify(r.body || {}));
}

/* Tout marquer comme lu, en une requête. Le repère est côté serveur et non en
   local : lire sur le téléphone doit éteindre le compteur sur le navigateur. */
async function notesLu(){
  if(!SESS || !SB.ready() || !notesNonLus()) return;
  const r = await SB.rest('notifications?user_id=eq.' + SESS.uid + '&lu_at=is.null',
    {method:'PATCH', headers:{Prefer:'return=minimal'},
     body: JSON.stringify({lu_at: new Date().toISOString()})});
  if(!r.ok) return;
  (S.notes || []).forEach(x => { if(!x.lu_at) x.lu_at = new Date().toISOString(); });
  paintBell();
  if(typeof navigator.clearAppBadge === 'function') navigator.clearAppBadge().catch(() => {});
}

        style="margin-top:10px">Tout marquer comme lu</button>` : ''}

/* Badges obtenus. Les trophées ne sont pas stockés : ils se recalculent depuis
   l'historique à chaque affichage. Pour annoncer un nouveau badge il faut donc
   garder la liste de ceux déjà acquis, et la comparer après chaque saisie.

   Au tout premier passage on pose le repère sans rien annoncer — sinon l'app
   notifierait les vingt-sept badges d'un coup le jour de l'installation, ou au
   premier lancement après cette mise à jour. */
function troWatch(){
  let sc;
  try{ sc = scoring(); }catch(e){ return; }
  const acquis = TROPHIES.filter(t => troValue(t, sc) >= t.need).map(t => t.s);
  const avant = S.notif.vuTro;
  S.notif.vuTro = acquis; save();
  if(!avant) return;                          /* premier passage : repère seul */
  const vus = new Set(avant);
  const neufs = acquis.filter(s => !vus.has(s));
  if(!neufs.length) return;
  const t = TROPHIES.find(x => x.s === neufs[0]);
  if(!t) return;
  const titre = neufs.length > 1
    ? `${neufs.length} nouveaux badges`
    : 'Vous avez obtenu un nouveau badge';
  const corps = neufs.length > 1
    ? neufs.slice(0, 3).join(' · ')
    : `${t.e} ${t.n}`;
  notifMontre(titre, corps, 'badge', 'actu');
  notesAdd('badge', titre, corps, 'jeux', 'actu', neufs.join('+'));
  notesLoad(true);
}

/* Ouverture sur le feed, sans condition. C'était jusqu'ici « le feed si un
   compte est ouvert, la saisie sinon » : bien intentionné, mais l'app s'ouvrait
   à deux endroits différents selon un état que l'utilisateur ne voit pas, et
   personne ne peut prendre une habitude sur une porte qui change. Le feed sans
   compte n'est d'ailleurs pas une porte fermée — il présente ce que le compte
   apporte et propose de l'ouvrir, ce qui est un meilleur premier écran qu'un
   formulaire de saisie sans contexte. Seule exception, en dessous : une saisie
   laissée en cours, qui reprend là où elle s'est arrêtée. */
/* Reprise d'une saisie interrompue. On ne rejoue le contexte que s'il reste un
   repas en cours de composition et qu'il est récent : au-delà de six heures,
   reprendre un brouillon oublié serait plus déroutant que de repartir à zéro.
   Hors de ce cas précis, l'ouverture par défaut est conservée telle quelle. */
function reprise(){
  const n = navRead();
  if(!n || !Array.isArray(n.draft) || !n.draft.length) return false;
  if(!n.at || Date.now() - n.at > 6 * 3600 * 1000) return false;
  S.draft = n.draft;
  S.meal = n.meal || 'dej'; S.path = n.path || 'types';
  S.step = n.step || 'saisie'; S.comCat = n.comCat || 'plat';
  S.mode = n.mode || null; S.course = n.course || null;
  S.entryDate = n.entryDate || today(); S.editId = n.editId || null;
  S.wiz = n.wiz || null; S.dishQ = n.dishQ || '';
  S.pdjNew = !!n.pdjNew; S.pdjSave = !!n.pdjSave; S.pdjEdit = !!n.pdjEdit;
  S.platLarge = !!n.platLarge; S.modeFrom = null;
  S.tab = 'saisie';
  return true;
}
/* Reprise d'une valeur écrite par la version précédente, sous l'ancienne clé
   horodatée du compte. Sans ça, le passage à cette version repartirait une
   dernière fois sur le feed. */
if(!localStorage.getItem(KEY_ANON + '.tab')){
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.endsWith('.tab')){
        const v = JSON.parse(localStorage.getItem(k) || 'null');
        if(v && v.t){ localStorage.setItem(KEY_ANON + '.tab', v.t); break; }
      }
    }
  }catch(e){}
}
const repris = reprise();
if(!repris) S.tab = tabRead() || 'feed';
go(S.tab);
/* Premier lancement : les cinq fiches, une seule fois. On laisse la première
   peinture se faire avant d'ouvrir, sinon la fenêtre s'anime sur un écran vide. */

/* Toute première ouverture, sans compte et sans rien de saisi : le
   questionnaire s'ouvre de lui-même. Il commence par la création du compte,
   qui est le bon moment pour la poser — avant qu'un historique existe, donc
   sans reprise à négocier, et avant que l'app ait servi à quoi que ce soit,
   donc sans interrompre personne.

   `onb` marque le passage, indépendamment des réponses : quelqu'un qui ferme
   la fenêtre sans répondre a fait un choix, et le lui redemander à chaque
   lancement serait le harceler. Il reste le bandeau du Tracker, qui n'apparaît
   qu'une fois des repas saisis, et le bouton du profil.

   Les fiches de présentation cèdent le passage : deux fenêtres qui s'ouvrent
   coup sur coup au tout premier lancement, c'en est une de trop. */
const premiereFois = !SESS && !S.prof.onb && !S.hist.length
                     && !Object.keys(S.prof).length && !repris;
if(premiereFois){
  S.prof.onb = true; save();
  setTimeout(() => profQuiz(0), 500);
} else if(!S.pmVu) setTimeout(pmOpen, 420);
/* Zone d'import : porte d'auteur. Aucun élément d'interface n'y mène, on n'y
   entre que par le fragment. On l'efface de l'URL aussitôt pour qu'un partage de
   lien ne la transmette pas. */
function impPorte(){
  if(location.hash.replace('#','').toLowerCase() !== 'import') return;
  history.replaceState(null, '', location.pathname + location.search);
  setTimeout(impSheet, 200);
}
impPorte();
window.addEventListener('hashchange', impPorte);
if(repris) toast('Repas en cours de saisie retrouvé');
if(rattrape) toast('Profil et favoris récupérés');
if(SESS && SB.ready()){
  SB.syncIdentity().then(ok => {
    if(!ok) toast('Session réalignée sur le serveur');
    if(recover()){ go(S.tab); toast('Profil et favoris récupérés'); }
    tastePull(); frLoad(true); frPosts(); chalLoad(true); notesLoad(true);
  });
}
/* Repère des badges posé au lancement, avant toute saisie : sans lui, la
   première saisie après cette mise à jour annoncerait tout l'historique. */
troWatch();

/* Réenregistrement de l'abonnement push à chaque lancement. Le service de push
   peut avoir renouvelé l'endpoint de son côté sans que l'évènement
   pushsubscriptionchange nous parvienne — Safari ne le déclenche pas de façon
   fiable. Un upsert par lancement est le filet le plus simple et le plus sûr :
   silencieux, et sans effet si rien n'a changé. */
if(S.notif.on) pushArm(true);

/* Minuteries. Une passe par minute pour les rappels horaires, une toutes les
   90 s pour les publications — et rien du tout quand l'écran est éteint ou
   l'app en arrière-plan, où ces requêtes ne serviraient personne. */
notifTick();
/* La passe d'une minute sert aussi à faire basculer les signaux du soir : à
   21 h pile, la pastille doit apparaître sans qu'on ait à toucher l'écran. */
setInterval(() => { notifTick(); paintAlertes(); }, 60000);
/* Veille de fond. Les publications sont relues à chaque tour ; les demandes
   d'amis et les invitations à des défis un tour sur trois — elles arrivent
   moins souvent et coûtent quatre requêtes de plus. */
let veille = 0;
setInterval(() => {
  if(document.visibilityState !== 'visible' || !SESS || !SB.ready()) return;
  frPosts();
  notesLoad(true);
  if(++veille % 3 === 0){ frLoad(true); chalLoad(true); }
}, 90000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible'){ badgeSync(); return; }
  notifTick();
  paintAlertes();
  if(SESS && SB.ready()){ frPosts(); frLoad(true); chalLoad(true); notesLoad(true); }
});
/* Dernière occasion d'écrire le chiffre avant que la page ne soit gelée :
   c'est celui-là qui restera sur l'icône. */
window.addEventListener('pagehide', badgeSync);
paintAlertes();
/* synchro d'ouverture, discrète : un échec hors ligne ne doit rien signaler */
if(SESS) syncNow(true).then(ok => { if(ok && S.tab === 'tracker') renderTracker(); });

/* La proposition de rappels attend que le premier écran soit posé : surgir
   pendant le rendu initial donnerait l'impression d'une alerte, pas d'une
   question. Une seconde et demie suffit à faire la différence. */
setTimeout(notifDemande, 1500);
</script>
<div id="pm" aria-hidden="true"></div>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  /* le worker dit sur quel onglet se poser quand on a cliqué une notification */
  navigator.serviceWorker.addEventListener('message', e => {
    if(!e.data) return;
    if(e.data.cfp === 'ouvrir' && typeof go === 'function'){
      if(e.data.tab === 'feed') S.fv = e.data.vue || 'actu';
      go(e.data.tab);
    }
    /* Le service de push a changé l'endpoint : on renvoie le nouveau. */
    if(e.data.cfp === 'reabonner' && typeof pushArm === 'function') pushArm(true);
  });
}
</script>
</body>
